icity; C — unrelated goods have zero cross elasticity; D — inferiority is shown by income elasticity, not cross elasticity.<\/p>","tag":""},{"id":"5.4.10","q":"<p>The law of supply states that, other things remaining the same,<\/p>","o":["quantity supplied rises as price falls","supply rises when costs rise","price falls as supply falls","quantity supplied rises as price rises"],"a":3,"s":"<p>Higher prices make production more profitable, so firms offer more for sale.<br>Other options: A — this reverses the law of supply; B — higher costs reduce supply; C — describes a market outcome wrongly.<\/p>","tag":""},{"id":"5.4.11","q":"<p>Demand is Qd = 100 − 2P and supply is Qs = 20 + 2P. The equilibrium price and quantity are<\/p>","o":["P = 30, Q = 40","P = 20, Q = 40","P = 40, Q = 20","P = 20, Q = 60"],"a":3,"s":"<p>Set 100 − 2P = 20 + 2P, so 4P = 80, P = 20. Q = 100 − 40 = 60.<br>Other options: A — at P = 30 supply is 80 and demand is 40, a surplus; B — the quantity is wrong: 100 − 40 = 60; C — at P = 40 demand is 20 and supply is 100.<\/p>","tag":""},{"id":"5.4.12","q":"<p>A legally fixed maximum price (price ceiling) set below the equilibrium price will lead to<\/p>","o":["a surplus","a shortage","no effect on the market","a rise in the market price"],"a":1,"s":"<p>At the lower price quantity demanded exceeds quantity supplied, so there is excess demand (often with queues or black markets).<br>Other options: A — a surplus results from a price floor above equilibrium; C — a ceiling below equilibrium is binding; D — the law prevents price from rising.<\/p>","tag":""},{"id":"5.4.13","q":"<p>Total utility from consuming 1, 2 and 3 units of a good is 20, 35 and 45 utils respectively. The marginal utility of the third unit is<\/p>","o":["15 utils","45 utils","10 utils","35 utils"],"a":2,"s":"<p>MU3 = TU3 − TU2 = 45 − 35 = 10 utils, showing diminishing marginal utility.<br>Other options: A — this is the marginal utility of the second unit; B — this is total utility; D — this is total utility from two units.<\/p>","tag":""},{"id":"5.4.14","q":"<p>A consumer is in equilibrium buying goods X and Y. The marginal utility of X is 40 and its price is Rs 10. If the price of Y is Rs 5, the marginal utility of Y must be<\/p>","o":["40","80","8","20"],"a":3,"s":"<p>Equilibrium: MUx/Px = MUy/Py, so 40/10 = MUy/5, giving MUy = 20.<br>Other options: A — ignores the different prices; B — multiplies by the price ratio the wrong way; C — divides 40 by 5 instead of applying the equimarginal rule.<\/p>","tag":""},{"id":"5.4.15","q":"<p>The slope of an indifference curve measures the<\/p>","o":["marginal rate of technical substitution","marginal rate of substitution","price ratio of the two goods","marginal utility of money"],"a":1,"s":"<p>MRSxy is the amount of Y a consumer will give up for one more unit of X while staying equally satisfied.<br>Other options: A — this is the slope of an isoquant in production; C — this is the slope of the budget line; D — not shown by an indifference curve.<\/p>","tag":""},{"id":"5.4.16","q":"<p>Indifference curves are normally convex to the origin because of<\/p>","o":["a diminishing marginal rate of substitution","an increasing marginal rate of substitution","constant marginal utility","the law of supply"],"a":0,"s":"<p>As a consumer gets more X, he is willing to give up less and less Y for each extra unit, so the curve flattens.<br>Other options: B — this would make the curves concave; C — this does not explain the shape; D — supply is unrelated to consumer preferences.<\/p>","tag":""},{"id":"5.4.17","q":"<p>A firm's total fixed cost is Rs 1,000. At an output of 50 units its total variable cost is Rs 1,500. Its average total cost at 50 units is<\/p>","o":["Rs 30","Rs 50","Rs 20","Rs 2,500"],"a":1,"s":"<p>TC = 1,000 + 1,500 = 2,500. ATC = 2,500/50 = Rs 50.<br>Other options: A — this is average variable cost; C — this is average fixed cost; D — this is total cost, not average.<\/p>","tag":""},{"id":"5.4.18","q":"<p>Total cost is Rs 500 at 10 units of output and Rs 540 at 11 units. The marginal cost of the 11th unit is<\/p>","o":["Rs 40","Rs 49.09","Rs 50","Rs 540"],"a":0,"s":"<p>MC = TC11 − TC10 = 540 − 500 = Rs 40.<br>Other options: B — this is average total cost at 11 units; C — this is average total cost at 10 units; D — this is total cost.<\/p>","tag":""},{"id":"5.4.19","q":"<p>The marginal cost curve cuts the average total cost curve<\/p>","o":["at the maximum point of the average total cost curve","where average total cost is rising fastest","at the minimum point of the average total cost curve","at the minimum point of the marginal cost curve"],"a":2,"s":"<p>When MC < ATC, ATC falls; when MC > ATC, ATC rises; so MC = ATC where ATC is at its minimum.<br>Other options: A — the U-shaped ATC has no maximum in the relevant range; B — MC cuts ATC where ATC is flat; D — MC reaches its minimum before it cuts ATC.<\/p>","tag":""},{"id":"5.4.20","q":"<p>In the short run, a perfectly competitive firm should shut down if the market price falls below<\/p>","o":["minimum average total cost","average fixed cost","marginal revenue","minimum average variable cost"],"a":3,"s":"<p>If price < min AVC, producing adds to losses; shutting down limits the loss to fixed cost.<br>Other options: A — below min ATC the firm makes a loss but may still cover variable cost; B — fixed costs are paid whether or not the firm produces; C — under perfect competition price equals marginal revenue.<\/p>","tag":""},{"id":"5.4.21","q":"<p>Under perfect competition, the demand curve facing an individual firm is<\/p>","o":["perfectly elastic (horizontal)","perfectly inelastic (vertical)","downward sloping","upward sloping"],"a":0,"s":"<p>Each firm is a price taker: it can sell any quantity at the market price, so P = AR = MR.<br>Other options: B — the firm cannot sell any quantity at any price; C — this is the market demand curve or a firm with market power; D — demand curves do not slope upward for a price taker.<\/p>","tag":""},{"id":"5.4.22","q":"<p>A firm maximises profit at the output where<\/p>","o":["total revenue is maximum","average cost is minimum","price equals average variable cost","marginal revenue equals marginal cost, with marginal cost rising"],"a":3,"s":"<p>Profit rises while MR > MC and falls once MC > MR, so profit peaks where MR = MC (second-order condition: MC rising).<br>Other options: A — maximising revenue ignores costs; B — minimum AC is the efficient scale, not the profit-maximising output in general; C — this is the shut-down point.<\/p>","tag":""},{"id":"5.4.23","q":"<p>A monopolist faces the linear demand curve P = 100 − 2Q. Its marginal revenue function is<\/p>","o":["MR = 100 − 2Q","MR = 100 − 4Q","MR = 50 − Q","MR = 100 − Q"],"a":1,"s":"<p>TR = PQ = 100Q − 2Q². MR = dTR/dQ = 100 − 4Q. For linear demand, MR has the same intercept and twice the slope.<br>Other options: A — this is the demand (average revenue) curve; C — this halves the whole demand function; D — halves the slope instead of doubling it.<\/p>","tag":""},{"id":"5.4.24","q":"<p>A monopolist faces demand P = 100 − 2Q and has a constant marginal cost of Rs 20. Its profit-maximising output and price are<\/p>","o":["Q = 40, P = 20","Q = 20, P = 60","Q = 20, P = 20","Q = 25, P = 50"],"a":1,"s":"<p>MR = 100 − 4Q = 20, so Q = 20. Price from demand: P = 100 − 40 = Rs 60.<br>Other options: A — this is the competitive outcome where P = MC; C — the monopolist charges the price on the demand curve, not MC; D — this is the revenue-maximising output where MR = 0.<\/p>","tag":""},{"id":"5.4.25","q":"<p>The kinked demand curve model, which explains why prices tend to be rigid in an oligopoly, is associated with<\/p>","o":["Augustin Cournot","Joan Robinson","Edward Chamberlin","Paul Sweezy"],"a":3,"s":"<p>Sweezy (1939): rivals follow a price cut but not a price rise, giving a kink in demand and a gap in MR, so price stays stable.<br>Other options: A — Cournot's duopoly model has firms choosing quantities; B — known for imperfect competition and price discrimination; C — known for monopolistic competition.<\/p>","tag":""},{"id":"5.4.26","q":"<p>A market with many sellers offering differentiated products and free entry and exit is called<\/p>","o":["perfect competition","monopolistic competition","oligopoly","monopoly"],"a":1,"s":"<p>Examples are restaurants, salons and clothing brands: each has a little price-setting power from differentiation.<br>Other options: A — products are identical under perfect competition; C — an oligopoly has few sellers; D — a monopoly has a single seller.<\/p>","tag":""},{"id":"5.4.27","q":"<p>A cinema charges students a lower ticket price than other adults for the same show. This is<\/p>","o":["first-degree price discrimination","third-degree price discrimination","second-degree price discrimination","predatory pricing"],"a":1,"s":"<p>Third-degree discrimination charges different prices to different identifiable groups with different elasticities.<br>Other options: A — first-degree charges each buyer his or her maximum willingness to pay; C — second-degree varies price with quantity bought; D — predatory pricing aims to drive rivals out of the market.<\/p>","tag":""},{"id":"5.4.28","q":"<p>When a firm doubles all its inputs, output triples. The firm is experiencing<\/p>","o":["constant returns to scale","decreasing returns to scale","increasing returns to scale","diminishing returns to a factor"],"a":2,"s":"<p>Output rises more than in proportion to inputs, so returns to scale are increasing.<br>Other options: A — output would exactly double; B — output would less than double; D — this concerns varying one input with others fixed.<\/p>","tag":""},{"id":"5.4.29","q":"<p>Under the law of variable proportions, a rational producer will operate in<\/p>","o":["Stage II, where average and marginal products are falling but marginal product is positive","Stage I, where average product is rising","Stage III, where marginal product is negative","the point where total product is falling"],"a":0,"s":"<p>Stage II runs from maximum AP to the point where MP = 0, the only economically rational zone.<br>Other options: B — the fixed factor is under-used, so expanding output pays; C — adding variable input reduces total output; D — total product falls only in Stage III.<\/p>","tag":""},{"id":"5.4.30","q":"<p>A point lying inside a country's production possibility curve indicates<\/p>","o":["an output level that cannot be reached with current resources","full employment with efficient production","unemployment or inefficient use of resources","economic growth"],"a":2,"s":"<p>More of one good could be produced without giving up any of the other, so resources are idle or misused.<br>Other options: A — this describes a point outside the curve; B — this is a point on the curve; D — growth shifts the whole curve outward.<\/p>","tag":""}]},{"k":"5.5","t":"Macroeconomics, Money and Banking","items":[{"id":"5.5.1","q":"<p>An economy's GDP is Rs 5,000 billion. Factor income received from abroad is Rs 300 billion and factor income paid abroad is Rs 500 billion. Its GNP is<\/p>","o":["Rs 5,200 billion","Rs 4,800 billion","Rs 5,800 billion","Rs 4,500 billion"],"a":1,"s":"<p>GNP = GDP + net factor income from abroad = 5,000 + (300 − 500) = Rs 4,800 billion.<br>Other options: A — treats net factor income from abroad as +200 instead of −200; C — adds both flows; D — subtracts the income paid abroad but forgets to add the income received.<\/p>","tag":""},{"id":"5.5.2","q":"<p>Consumption is 600, investment 200, government purchases 150, exports 100 and imports 180 (all in Rs billion). GDP by the expenditure method is<\/p>","o":["870","1,230","950","1,050"],"a":0,"s":"<p>GDP = C + I + G + (X − M) = 600 + 200 + 150 + (100 − 180) = 870.<br>Other options: B — adds imports instead of subtracting them; C — ignores exports and imports; D — adds exports but forgets to subtract imports.<\/p>","tag":""},{"id":"5.5.3","q":"<p>In the strict sense, national income refers to<\/p>","o":["gross domestic product at market prices","net national product at factor cost","gross national product at market prices","net domestic product at market prices"],"a":1,"s":"<p>National income = NNP at factor cost = GNP at market prices − depreciation − net indirect taxes.<br>Other options: A — includes depreciation, net indirect taxes and excludes net factor income from abroad; C — includes depreciation and net indirect taxes; D — includes net indirect taxes and excludes net factor income from abroad.<\/p>","tag":""},{"id":"5.5.4","q":"<p>Nominal GDP is Rs 1,200 billion and real GDP (at base-year prices) is Rs 1,000 billion. The GDP deflator is<\/p>","o":["83.3","20","1.2","120"],"a":3,"s":"<p>GDP deflator = Nominal GDP/Real GDP × 100 = 1,200/1,000 × 100 = 120.<br>Other options: A — the ratio is inverted; B — this is the percentage rise in prices, not the index; C — omits the multiplication by 100.<\/p>","tag":""},{"id":"5.5.5","q":"<p>Nominal GDP grows by 12 per cent in a year and the GDP deflator rises by 5 per cent. The real GDP growth rate is about<\/p>","o":["17.6 per cent","2.4 per cent","12 per cent","6.7 per cent"],"a":3,"s":"<p>Real growth = 1.12/1.05 − 1 = 0.0667, about 6.7 per cent (the rough rule 12 − 5 gives 7 per cent).<br>Other options: A — multiplies the growth factors instead of dividing; B — divides 12 by 5; C — this is nominal growth, which includes price rises.<\/p>","tag":""},{"id":"5.5.6","q":"<p>The consumer price index rises from 150 to 162 over a year. The inflation rate is<\/p>","o":["8 per cent","12 per cent","7.4 per cent","62 per cent"],"a":0,"s":"<p>Inflation = (162 − 150)/150 × 100 = 8 per cent.<br>Other options: B — this is the change in index points, not the percentage; C — divides by the new index 162 instead of the old 150; D — reads the index above 100 as inflation.<\/p>","tag":""},{"id":"5.5.7","q":"<p>A sharp rise in world oil prices raises firms' production costs and pushes up the general price level. This is<\/p>","o":["demand-pull inflation","cost-push inflation","deflation","disinflation"],"a":1,"s":"<p>Cost-push (supply-shock) inflation comes from higher input costs that shift aggregate supply to the left.<br>Other options: A — demand-pull arises from excess aggregate demand; C — deflation is a falling price level; D — disinflation is a fall in the rate of inflation.<\/p>","tag":""},{"id":"5.5.8","q":"<p>A situation of high inflation combined with high unemployment and stagnant output is called<\/p>","o":["hyperinflation","deflation","recession","stagflation"],"a":3,"s":"<p>Stagflation (stagnation + inflation) was seen in many economies after the 1970s oil shocks.<br>Other options: A — extremely rapid inflation, not necessarily with stagnation; B — a falling price level; C — a fall in output, which need not come with high inflation.<\/p>","tag":""},{"id":"5.5.9","q":"<p>The Phillips curve shows a short-run<\/p>","o":["inverse relationship between inflation and unemployment","direct relationship between inflation and unemployment","inverse relationship between interest rates and investment","direct relationship between tax rates and tax revenue"],"a":0,"s":"<p>A. W. Phillips (1958) found lower unemployment was associated with faster wage (and price) inflation.<br>Other options: B — the original curve slopes downward; C — this is the investment demand curve; D — relates to the Laffer curve, which is not linear either.<\/p>","tag":""},{"id":"5.5.10","q":"<p>Which of the following is an instrument of fiscal policy?<\/p>","o":["A change in the cash reserve ratio","Open market operations","A change in income tax rates","A change in the bank rate"],"a":2,"s":"<p>Fiscal policy uses government taxation, spending and borrowing; monetary policy is run by the central bank.<br>Other options: A — a monetary policy tool of the central bank; B — a monetary policy tool; D — a monetary policy tool.<\/p>","tag":""},{"id":"5.5.11","q":"<p>An expansionary fiscal policy during a recession would involve<\/p>","o":["raising taxes and cutting spending","raising the cash reserve ratio","selling government securities in the open market","increasing government spending or cutting taxes"],"a":3,"s":"<p>Higher spending or lower taxes raise aggregate demand and output.<br>Other options: A — this is contractionary fiscal policy; B — a contractionary monetary measure; C — a contractionary monetary measure.<\/p>","tag":""},{"id":"5.5.12","q":"<p>A government's fiscal deficit is Rs 400 billion and its interest payments are Rs 120 billion. Its primary deficit is<\/p>","o":["Rs 280 billion","Rs 520 billion","Rs 400 billion","Rs 120 billion"],"a":0,"s":"<p>Primary deficit = Fiscal deficit − Interest payments = 400 − 120 = Rs 280 billion.<br>Other options: B — adds interest instead of subtracting; C — this is the fiscal deficit; D — this is the interest payment.<\/p>","tag":""},{"id":"5.5.13","q":"<p>In a simple Keynesian model, the marginal propensity to consume is 0.75. An increase in investment of Rs 100 crore raises national income by<\/p>","o":["Rs 400 crore","Rs 75 crore","Rs 133 crore","Rs 300 crore"],"a":0,"s":"<p>Multiplier = 1/(1 − MPC) = 1/0.25 = 4. ΔY = 4 × 100 = Rs 400 crore.<br>Other options: B — multiplies by the MPC instead of using the multiplier; C — divides by the MPC instead of by the MPS; D — uses MPC/(1 − MPC) = 3 instead of 1/(1 − MPC) = 4.<\/p>","tag":""},{"id":"5.5.14","q":"<p>With a required reserve ratio of 5 per cent and no leakages, the simple money (deposit) multiplier is<\/p>","o":["5","20","0.05","95"],"a":1,"s":"<p>Simple money multiplier = 1/r = 1/0.05 = 20.<br>Other options: A — uses the ratio itself; C — this is the reserve ratio as a decimal; D — uses the non-reserve share in per cent.<\/p>","tag":""},{"id":"5.5.15","q":"<p>Nepal Rastra Bank, the central bank of Nepal, was established in<\/p>","o":["1937 (1994 BS)","1951 (2007 BS)","1956 (2013 BS)","1966 (2022 BS)"],"a":2,"s":"<p>NRB was set up on 26 April 1956 (14 Baisakh 2013 BS) under the Nepal Rastra Bank Act, 2012 BS. It now works under the NRB Act, 2058 BS.<br>Other options: A — the year Nepal Bank Limited, the first commercial bank, was set up; B — the year democracy was established, not NRB; D — the year Rastriya Banijya Bank was established.<\/p>","tag":""},{"id":"5.5.16","q":"<p>To absorb excess liquidity from the banking system, Nepal Rastra Bank would most likely<\/p>","o":["lower the cash reserve ratio","buy treasury bills in the open market","reduce the standing liquidity facility rate","raise the cash reserve ratio (CRR)"],"a":3,"s":"<p>A higher CRR forces banks and financial institutions to keep more deposits as cash reserves with NRB, leaving less to lend.<br>Other options: A — this releases more funds for lending; B — purchases inject liquidity; C — makes central bank borrowing cheaper, which eases liquidity.<\/p>","tag":""},{"id":"5.5.17","q":"<p>An outright sale of treasury bills by the central bank in the open market<\/p>","o":["reduces liquidity in the banking system","increases liquidity in the banking system","has no effect on bank reserves","increases the money supply"],"a":0,"s":"<p>Banks pay NRB for the bills out of their reserves, so loanable funds and the money supply fall.<br>Other options: B — this is the effect of an outright purchase; C — buyers pay with reserves, so reserves fall; D — it contracts the money supply.<\/p>","tag":""},{"id":"5.5.18","q":"<p>When Nepal Rastra Bank conducts a reverse repo auction, it<\/p>","o":["injects liquidity into banks and financial institutions","absorbs liquidity from banks and financial institutions","sets the cash reserve ratio","lends to the government"],"a":1,"s":"<p>In NRB's usage, a reverse repo means NRB sells securities with an agreement to buy them back, taking funds out of the system temporarily. A repo does the opposite.<br>Other options: A — this is done through a repo; C — the CRR is a separate requirement; D — reverse repos are conducted with BFIs, not the government.<\/p>","tag":""},{"id":"5.5.19","q":"<p>In Nepal Rastra Bank's interest rate corridor, the upper bound is set by the rate on the<\/p>","o":["standing deposit facility","cash reserve ratio","standing liquidity facility","statutory liquidity ratio"],"a":2,"s":"<p>Banks can always borrow from NRB at the SLF (bank) rate, so interbank rates should not rise above it, while the standing deposit facility rate puts a floor under them. The policy rate sits within the corridor.<br>Other options: A — this rate forms the lower bound; B — the CRR is a reserve requirement, not an interest rate; D — the SLR is a liquidity requirement, not an interest rate.<\/p>","tag":""},{"id":"5.5.20","q":"<p>The statutory liquidity ratio (SLR) requires banks and financial institutions to hold<\/p>","o":["a minimum proportion of their deposits as cash balances with the central bank only","a fixed proportion of their loans in agriculture","capital equal to a fixed share of risk-weighted assets","a minimum proportion of their deposits in liquid assets such as government securities and cash"],"a":3,"s":"<p>SLR covers a wider set of liquid assets than CRR, including government securities.<br>Other options: A — this is the cash reserve ratio; B — this is a directed (priority sector) lending requirement; C — this is the capital adequacy ratio.<\/p>","tag":""},{"id":"5.5.21","q":"<p>The bank rate is the rate at which<\/p>","o":["commercial banks lend to their best customers","banks lend to each other overnight","the central bank lends to commercial banks","the government borrows from the public"],"a":2,"s":"<p>In NRB's framework the bank rate is applied to its standing liquidity facility and forms the ceiling of the corridor.<br>Other options: A — this is the prime or base lending rate; B — this is the interbank rate; D — this is the yield on government securities.<\/p>","tag":""},{"id":"5.5.22","q":"<p>Which of the following is a qualitative (selective) credit control instrument?<\/p>","o":["Moral suasion","Cash reserve ratio","Open market operations","Bank rate"],"a":0,"s":"<p>Selective controls (moral suasion, margin requirements, credit ceilings for sectors) direct the use of credit rather than its total amount.<br>Other options: B — a quantitative (general) instrument; C — a quantitative (general) instrument; D — a quantitative (general) instrument.<\/p>","tag":""},{"id":"5.5.23","q":"<p>Narrow money (M1) consists of<\/p>","o":["currency held by the public plus demand and time deposits","currency in circulation plus banks' reserves","only coins and notes issued by the central bank","currency held by the public plus demand deposits"],"a":3,"s":"<p>M1 = currency with the public + demand deposits. M2 = M1 + time deposits.<br>Other options: A — this is broad money (M2); B — this is reserve money (base money); C — this leaves out demand deposits.<\/p>","tag":""},{"id":"5.5.24","q":"<p>In Nepal's balance of payments, workers' remittances sent home by Nepalis working abroad are recorded in the<\/p>","o":["capital account","financial account","current account (as secondary income or current transfers)","errors and omissions"],"a":2,"s":"<p>Under the IMF's BPM6, personal transfers (remittances) are part of secondary income in the current account. They largely offset Nepal's large trade deficit.<br>Other options: A — the capital account records capital transfers and non-produced assets; B — the financial account records investment and loan flows; D — remittances are measured, not left as a residual.<\/p>","tag":""},{"id":"5.5.25","q":"<p>Foreign direct investment flowing into a country is recorded in the balance of payments under the<\/p>","o":["current account","trade balance","financial account","capital account"],"a":2,"s":"<p>Direct investment, portfolio investment, other investment and reserve assets are financial account items.<br>Other options: A — the current account records goods, services, income and current transfers; B — the trade balance covers merchandise only; D — covers capital transfers, not investment flows.<\/p>","tag":""},{"id":"5.5.26","q":"<p>Under the fixed exchange rate arrangement that Nepal has kept with India since 1993, 100 Indian rupees are equal to about<\/p>","o":["100 Nepali rupees","160 Nepali rupees","150 Nepali rupees","165 Nepali rupees"],"a":1,"s":"<p>NRB pegs the Nepali rupee to the Indian rupee at INR 1 = NPR 1.60 (with a small buying-selling spread), so INR 100 ≈ NPR 160.<br>Other options: A — the two currencies are not at par; C — not the peg rate; D — not the peg rate.<\/p>","tag":""},{"id":"5.5.27","q":"<p>Nepal's fiscal year runs from<\/p>","o":["Baisakh 1 to the end of Chaitra (mid-April to mid-April)","Shrawan 1 to the end of Asar (mid-July to mid-July)","1 January to 31 December","1 April to 31 March"],"a":1,"s":"<p>The government budget and national accounts of Nepal use a fiscal year starting on 1 Shrawan.<br>Other options: A — this is the Bikram Sambat calendar year, not the fiscal year; C — this is the Gregorian calendar year; D — this is India's fiscal year.<\/p>","tag":""},{"id":"5.5.28","q":"<p>A country's balance of trade in goods is −1,200, net services +50, net primary income +30 and net secondary income (mainly remittances) +1,000 (all in Rs billion). Its current account balance is<\/p>","o":["−120","−1,200","−170","−1,120"],"a":0,"s":"<p>Current account = −1,200 + 50 + 30 + 1,000 = −120.<br>Other options: B — this is only the trade balance; C — leaves out net services; D — leaves out secondary income (remittances).<\/p>","tag":""},{"id":"5.5.29","q":"<p>Using Fisher's equation of exchange MV = PT, if M = 500, V = 4 and T = 1,000, the price level P is<\/p>","o":["0.5","2","4","2,000"],"a":1,"s":"<p>P = MV/T = (500 × 4)/1,000 = 2.<br>Other options: A — ignores velocity and divides M by T; C — this is the velocity of money, not the price level; D — this is MV, the total spending.<\/p>","tag":""},{"id":"5.5.30","q":"<p>Which of the following is NOT one of Keynes's motives for holding money (liquidity preference)?<\/p>","o":["Transactions motive","Precautionary motive","Investment motive","Speculative motive"],"a":2,"s":"<p>Keynes named the transactions, precautionary and speculative motives in The General Theory (1936).<br>Other options: A — one of Keynes's three motives; B — one of Keynes's three motives; D — one of Keynes's three motives.<\/p>","tag":""}]},{"k":"5.6","t":"Business Environment, Entrepreneurship, HRM and Organisational Behaviour","items":[{"id":"5.6.1","q":"<p>In PESTLE analysis of the business environment, the letters stand for<\/p>","o":["Political, Economic, Strategic, Technical, Legal, Ethical","Political, Economic, Social, Technological, Legal, Environmental","Price, Earnings, Sales, Tax, Labour, Equity","Political, Ecological, Social, Trade, Legal, Economic"],"a":1,"s":"<p>PESTLE extends PEST analysis of the macro environment with legal and environmental factors.<br>Other options: A — strategic, technical and ethical are not the PESTLE factors; C — these are financial terms, not environmental factors; D — T is technological, and ecological and economic would duplicate letters.<\/p>","tag":""},{"id":"5.6.2","q":"<p>Which of the following is part of a firm's micro (task) environment?<\/p>","o":["Suppliers","The national inflation rate","Demographic trends","Government trade policy"],"a":0,"s":"<p>The micro environment consists of actors close to the firm: suppliers, customers, intermediaries, competitors and publics.<br>Other options: B — part of the macro (economic) environment; C — part of the macro (social) environment; D — part of the macro (political-legal) environment.<\/p>","tag":""},{"id":"5.6.3","q":"<p>Which of the following is NOT one of Porter's five competitive forces?<\/p>","o":["Threat of new entrants","Political stability of the country","Bargaining power of suppliers","Threat of substitute products"],"a":1,"s":"<p>Porter's five forces: rivalry among existing firms, threat of new entrants, threat of substitutes, and the bargaining power of buyers and of suppliers.<br>Other options: A — one of the five forces; C — one of the five forces; D — one of the five forces.<\/p>","tag":""},{"id":"5.6.4","q":"<p>Transferring the ownership or management of a public enterprise to the private sector is called<\/p>","o":["nationalisation","liberalisation","privatisation","globalisation"],"a":2,"s":"<p>Privatisation, liberalisation and globalisation were the three pillars of the economic reforms Nepal began in the early 1990s.<br>Other options: A — the opposite: transfer from private to public ownership; B — liberalisation removes controls and licensing, not ownership; D — globalisation integrates the national economy with the world economy.<\/p>","tag":""},{"id":"5.6.5","q":"<p>Companies in Nepal are incorporated and governed under the<\/p>","o":["Companies Act, 2063 BS (2006)","Labour Act, 2074 BS (2017)","Banks and Financial Institutions Act, 2073 BS (2017)","Contract Act, 2056 BS (2000)"],"a":0,"s":"<p>The Companies Act, 2063 BS, administered by the Office of the Company Registrar, covers incorporation, share capital, directors, meetings and winding up.<br>Other options: B — governs employment relations, not company incorporation; C — governs licensed banks and financial institutions; D — governed contracts in general, not company incorporation.<\/p>","tag":""},{"id":"5.6.6","q":"<p>A major feature of a sole proprietorship is<\/p>","o":["limited liability of the owner","unlimited liability of the owner","perpetual succession","separate legal entity from the owner"],"a":1,"s":"<p>The sole trader's personal property can be used to pay business debts.<br>Other options: A — a feature of companies, not of sole traders; C — a feature of companies; D — a sole proprietorship has no separate legal personality.<\/p>","tag":""},{"id":"5.6.7","q":"<p>'Perpetual succession' as a feature of a joint stock company means that<\/p>","o":["the company's existence is not affected by the death, insolvency or exit of its members","the company must make profits every year","shares can never be transferred","management is passed from father to son"],"a":0,"s":"<p>A company is an artificial person created by law; members may come and go but the company continues until it is wound up.<br>Other options: B — profitability is not part of perpetual succession; C — shares of a public company are freely transferable; D — this describes a family business, not perpetual succession.<\/p>","tag":""},{"id":"5.6.8","q":"<p>Who described the entrepreneur as an innovator and used the term 'creative destruction'?<\/p>","o":["Richard Cantillon","David McClelland","Joseph Schumpeter","Peter Drucker"],"a":2,"s":"<p>Schumpeter saw entrepreneurs introducing new products, methods, markets, sources of supply and organisation, which destroy old structures.<br>Other options: A — an early economist who introduced the term entrepreneur as a risk-bearer; B — known for the need for achievement theory; D — wrote Innovation and Entrepreneurship but did not coin creative destruction.<\/p>","tag":""},{"id":"5.6.9","q":"<p>According to David McClelland, a strong desire to excel, take moderate risks and get feedback on performance reflects a high need for<\/p>","o":["affiliation","power","security","achievement"],"a":3,"s":"<p>McClelland linked high need for achievement (nAch) with entrepreneurial behaviour.<br>Other options: A — the need for friendly relationships; B — the need to influence or control others; C — not one of McClelland's three needs.<\/p>","tag":""},{"id":"5.6.10","q":"<p>An employee who behaves like an entrepreneur within an existing organisation, developing new products or ventures, is called an<\/p>","o":["entrepreneur","intrapreneur","ultrapreneur","arbitrageur"],"a":1,"s":"<p>Intrapreneurship (a term popularised by Gifford Pinchot) is corporate entrepreneurship by employees.<br>Other options: A — an entrepreneur starts his or her own independent venture; C — not a standard term for this; D — a trader who profits from price differences.<\/p>","tag":""},{"id":"5.6.11","q":"<p>Equity finance provided to young, high-growth businesses in exchange for an ownership stake, usually with active involvement, is called<\/p>","o":["trade credit","debenture finance","venture capital","overdraft"],"a":2,"s":"<p>Venture capitalists accept high risk for potential high returns, usually exiting through a sale or public issue.<br>Other options: A — short-term credit from suppliers; B — borrowed capital with fixed interest; D — a short-term bank borrowing facility.<\/p>","tag":""},{"id":"5.6.12","q":"<p>Which section of a business plan summarises the whole plan, is usually written last but placed first?<\/p>","o":["Market analysis","Financial plan","Operations plan","Executive summary"],"a":3,"s":"<p>Investors often read the executive summary first to decide whether to read the rest.<br>Other options: A — covers industry, customers and competitors in detail; B — covers projections, funding and break-even; C — covers production and day-to-day running.<\/p>","tag":""},{"id":"5.6.13","q":"<p>At the base of Carroll's pyramid of corporate social responsibility lie the firm's<\/p>","o":["economic responsibilities","philanthropic responsibilities","ethical responsibilities","legal responsibilities"],"a":0,"s":"<p>Carroll (1991): economic (be profitable), legal (obey the law), ethical (be fair) and philanthropic (be a good corporate citizen).<br>Other options: B — these are at the top of the pyramid; C — these are the third level; D — these are the second level.<\/p>","tag":""},{"id":"5.6.14","q":"<p>A written statement of the minimum qualifications, skills, experience and personal qualities needed to do a job is the<\/p>","o":["job description","job evaluation","job enlargement","job specification"],"a":3,"s":"<p>Job analysis yields two documents: the job description (about the job) and the job specification (about the person).<br>Other options: A — describes the duties, responsibilities and conditions of the job itself; B — determines the relative worth of jobs for pay purposes; C — adds more tasks of a similar level to a job.<\/p>","tag":""},{"id":"5.6.15","q":"<p>Selection is often called a 'negative' process because<\/p>","o":["it attracts as many applicants as possible","it reduces the salary of selected candidates","it rejects more applicants than it accepts","it is carried out only after employees leave"],"a":2,"s":"<p>Recruitment creates a pool of applicants; selection screens most of them out to pick the most suitable.<br>Other options: A — this describes recruitment, a positive process; B — selection does not set pay cuts; D — selection is not tied to exits.<\/p>","tag":""},{"id":"5.6.16","q":"<p>Which of the following is an internal source of recruitment?<\/p>","o":["Campus recruitment","Promotion","Employment agencies","Newspaper advertisements"],"a":1,"s":"<p>Internal sources include promotions, transfers and re-employment of former staff.<br>Other options: A — an external source; C — an external source; D — an external source.<\/p>","tag":""},{"id":"5.6.17","q":"<p>Which of the following is an on-the-job training method?<\/p>","o":["Lectures","Case studies","Job rotation","Role playing"],"a":2,"s":"<p>On-the-job methods (job rotation, coaching, apprenticeship, understudy) train employees while they do actual work.<br>Other options: A — an off-the-job method; B — an off-the-job method; D — an off-the-job method.<\/p>","tag":""},{"id":"5.6.18","q":"<p>A performance appraisal that collects feedback from an employee's superiors, peers, subordinates and customers is called<\/p>","o":["management by objectives","the graphic rating scale","forced distribution","360-degree feedback"],"a":3,"s":"<p>360-degree appraisal gathers views from all around the employee, not just from the boss.<br>Other options: A — appraises against jointly set goals; B — a single rater scores listed traits; C — places employees into fixed percentage categories.<\/p>","tag":""},{"id":"5.6.19","q":"<p>A manager rates an employee highly on every criterion because the employee is very punctual. This rating error is the<\/p>","o":["central tendency error","halo effect","leniency error","recency effect"],"a":1,"s":"<p>In the halo effect one strong trait colours the rater's judgement of all other traits.<br>Other options: A — rating everyone near the middle of the scale; C — rating everyone too generously; D — giving too much weight to recent events.<\/p>","tag":""},{"id":"5.6.20","q":"<p>Which of the following is NOT one of the 'Big Five' personality traits?<\/p>","o":["Self-monitoring","Conscientiousness","Agreeableness","Openness to experience"],"a":0,"s":"<p>The Big Five are openness, conscientiousness, extraversion, agreeableness and neuroticism (emotional stability). Self-monitoring is a separate trait.<br>Other options: B — one of the Big Five; C — one of the Big Five; D — one of the Big Five.<\/p>","tag":""},{"id":"5.6.21","q":"<p>In Tuckman's model of group development, which stage comes immediately after 'storming'?<\/p>","o":["Norming","Forming","Performing","Adjourning"],"a":0,"s":"<p>Forming → storming → norming → performing → adjourning.<br>Other options: B — the first stage, before storming; C — comes after norming; D — the final stage.<\/p>","tag":""},{"id":"5.6.22","q":"<p>When judging other people's behaviour, the tendency to underestimate external (situational) factors and overestimate internal (personal) factors is called the<\/p>","o":["self-serving bias","stereotyping","selective perception","fundamental attribution error"],"a":3,"s":"<p>Example: blaming a late colleague's laziness rather than the traffic jam.<br>Other options: A — attributing one's own successes to oneself and failures to outside factors; B — judging a person by the group he or she belongs to; C — seeing only what fits one's interests or background.<\/p>","tag":""},{"id":"5.6.23","q":"<p>In the Thomas-Kilmann model, which conflict-handling mode is high in both assertiveness and cooperativeness?<\/p>","o":["Competing","Accommodating","Collaborating","Compromising"],"a":2,"s":"<p>Collaborating seeks a win-win solution that fully satisfies both parties.<br>Other options: A — high assertiveness, low cooperativeness; B — low assertiveness, high cooperativeness; D — moderate on both.<\/p>","tag":""},{"id":"5.6.24","q":"<p>Kurt Lewin's three-step model of planned change consists of<\/p>","o":["forming, storming, norming","planning, organising, controlling","unfreezing, changing (moving), refreezing","diagnosis, intervention, evaluation"],"a":2,"s":"<p>Lewin: unfreeze the old behaviour, move to the new state, then refreeze it so it lasts.<br>Other options: A — these are Tuckman's group development stages; B — these are management functions; D — these are general organisation development steps, not Lewin's model.<\/p>","tag":""},{"id":"5.6.25","q":"<p>According to Edgar Schein, the deepest level of organisational culture consists of<\/p>","o":["basic underlying assumptions","artefacts","espoused values","organisation charts"],"a":0,"s":"<p>Basic assumptions are taken-for-granted beliefs that are often unconscious but drive behaviour.<br>Other options: B — the visible surface level, such as dress, office layout and rituals; C — the stated strategies, goals and philosophies at the middle level; D — a formal structure, not a level of culture.<\/p>","tag":""},{"id":"5.6.26","q":"<p>Giving a worker more responsibility for planning and controlling his or her own work (vertical loading) is called<\/p>","o":["job enlargement","job rotation","job simplification","job enrichment"],"a":3,"s":"<p>Job enrichment, based on Herzberg's motivators, deepens the job with autonomy and responsibility.<br>Other options: A — adds more tasks at the same level (horizontal loading); B — moves the worker between different jobs; C — breaks the job into smaller, simpler tasks.<\/p>","tag":""},{"id":"5.6.27","q":"<p>Which of the following is NOT one of the five core job dimensions in Hackman and Oldham's job characteristics model?<\/p>","o":["Pay level","Skill variety","Task significance","Autonomy"],"a":0,"s":"<p>The five core dimensions are skill variety, task identity, task significance, autonomy and feedback.<br>Other options: B — a core job dimension; C — a core job dimension; D — a core job dimension.<\/p>","tag":""},{"id":"5.6.28","q":"<p>The theory that employees compare their own input-output ratio with that of others, and are motivated to remove any perceived unfairness, is<\/p>","o":["Vroom's expectancy theory","J. Stacy Adams's equity theory","Locke's goal-setting theory","Skinner's reinforcement theory"],"a":1,"s":"<p>Adams (1963): perceived under-reward or over-reward creates tension that people try to reduce.<br>Other options: A — explains motivation through expectancy, instrumentality and valence; C — says specific, difficult goals raise performance; D — explains behaviour through its consequences.<\/p>","tag":""},{"id":"5.6.29","q":"<p>Which Act, which replaced the Labour Act of 2048 BS, now governs employment relations in Nepal?<\/p>","o":["Companies Act, 2063 BS (2006)","Labour Act, 2074 BS (2017)","Industrial Enterprises Act, 2076 BS (2020)","Foreign Investment and Technology Transfer Act, 2075 BS (2019)"],"a":1,"s":"<p>The Labour Act, 2074 BS (authenticated in September 2017) repealed the Labour Act, 2048 BS and covers almost all employers.<br>Other options: A — governs company incorporation and management; C — governs the establishment and facilities of industries; D — governs foreign investment and technology transfer.<\/p>","tag":""},{"id":"5.6.30","q":"<p>Negotiation between an employer and a trade union representing workers on wages and conditions of work is called<\/p>","o":["grievance handling","arbitration","participative management","collective bargaining"],"a":3,"s":"<p>Collective bargaining produces a collective agreement binding on both sides.<br>Other options: A — deals with an individual employee's complaint; B — a neutral third party decides the dispute; C — involves employees in management decisions generally.<\/p>","tag":""}]}]}],"mock":[{"m":1,"secs":[{"t":"Section 1 · Verbal Ability (20)","items":[{"id":"M1.1.1","q":"<p>Choose the word closest in meaning to DILIGENT.<\/p>","o":["lazy","clever","obedient","hard-working"],"a":3,"s":"<p>A diligent person works carefully and steadily, i.e. is hard-working.<br>Other options: A — the opposite; B — cleverness is ability, not effort; C — obedience is following orders, not effort.<\/p>","tag":"1.1 Vocabulary: Synonyms, Antonyms and Word Usage"},{"id":"M1.1.2","q":"<p>Choose the word most nearly opposite in meaning to REDUNDANT.<\/p>","o":["superfluous","repetitive","necessary","lengthy"],"a":2,"s":"<p>Redundant means no longer needed or more than needed; the opposite is necessary.<br>Other options: A — a synonym of redundant; B — close in meaning (redundant wording is repetitive); D — describes size, not need.<\/p>","tag":"1.1 Vocabulary: Synonyms, Antonyms and Word Usage"},{"id":"M1.1.3","q":"<p>Choose the word closest in meaning to ALLEVIATE.<\/p>","o":["aggravate","postpone","explain","relieve"],"a":3,"s":"<p>To alleviate pain or a problem is to make it less severe, i.e. to relieve it.<br>Other options: A — means to make worse, the opposite; B — means to delay; C — unrelated.<\/p>","tag":"1.1 Vocabulary: Synonyms, Antonyms and Word Usage"},{"id":"M1.1.4","q":"<p>Choose the correct word to fill the blank: \"The weather office warned that a severe storm was ___.\"<\/p>","o":["eminent","imminent","immanent","eminence"],"a":1,"s":"<p>Imminent means about to happen, which fits a storm that is coming.<br>Other options: A — eminent means famous or distinguished; C — immanent means existing within something; D — a noun meaning fame or high rank.<\/p>","tag":"1.1 Vocabulary: Synonyms, Antonyms and Word Usage"},{"id":"M1.1.5","q":"<p>Choose the word that best completes the sentence: \"The minister's speech was so ___ that even his own supporters found it hard to stay awake.\"<\/p>","o":["tedious","riveting","concise","inspiring"],"a":0,"s":"<p>Supporters struggling to stay awake shows the speech was dull and long, i.e. tedious.<br>Other options: B — riveting means gripping, the opposite; C — a short speech would not send people to sleep; D — an inspiring speech keeps people attentive.<\/p>","tag":"1.2 Sentence Completion and Fill in the Blanks"},{"id":"M1.1.6","q":"<p>Choose the word that best completes the sentence: \"Although the start-up had very little capital, its founders were ___ about its prospects.\"<\/p>","o":["sanguine","pessimistic","indifferent","ignorant"],"a":0,"s":"<p>\"Although\" signals a contrast with the lack of capital, so the founders were hopeful: sanguine means optimistic.<br>Other options: B — pessimism would agree with, not contrast with, the lack of capital; C — indifference gives no contrast; D — ignorant does not fit \"about its prospects\" in this sense.<\/p>","tag":"1.2 Sentence Completion and Fill in the Blanks"},{"id":"M1.1.7","q":"<p>Fill in the blank: \"Neither of the two candidates ___ suitable for the post.\"<\/p>","o":["are","were","is","have been"],"a":2,"s":"<p>\"Neither of the two\" is singular and the sentence is in the present, so the verb is \"is\".<br>Other options: A — plural verb with a singular subject; B — plural and past; D — plural verb.<\/p>","tag":"1.2 Sentence Completion and Fill in the Blanks"},{"id":"M1.1.8","q":"<p>Which part of the sentence contains an error? \"The number of students / who passed the exam / have increased this year.\"<\/p>","o":["The number of students","who passed the exam","have increased this year","No error"],"a":2,"s":"<p>The subject is \"the number\" (singular), so the verb must be \"has increased\".<br>Other options: A — \"the number of\" is correct; B — correct relative clause; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: Error Spotting and Sentence Correction"},{"id":"M1.1.9","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["He did not knew the answer.","Each of the players were given a medal.","She is good at mathematics and enjoys solving puzzles.","I am living here since 2010."],"a":2,"s":"<p>Option C is correct: \"good at\" is the right idiom and \"enjoys\" is followed by a gerund (\"solving\").<br>Other options: A — after \"did not\" the base form \"know\" is needed; B — \"each\" takes a singular verb: \"was given\"; D — with \"since\" the present perfect continuous is needed: \"I have been living here\".<\/p>","tag":"1.3 Grammar: Error Spotting and Sentence Correction"},{"id":"M1.1.10","q":"<p>Which part of the sentence contains an error? \"The manager, along with his staff, / were present / at the annual meeting.\"<\/p>","o":["The manager, along with his staff,","were present","at the annual meeting","No error"],"a":1,"s":"<p>A phrase with \"along with\" does not change the subject; \"the manager\" is singular, so \"was present\".<br>Other options: A — correctly punctuated subject; C — correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: Error Spotting and Sentence Correction"},{"p":"<p><b>Passage 1<\/b><br>Shoppers often assume that more choice is always better. A store that stocks forty kinds of jam, the reasoning goes, must serve its customers better than one that stocks six. Yet a growing body of research in consumer psychology suggests that, beyond a certain point, extra options can reduce both sales and satisfaction. Faced with too many alternatives, people find it harder to compare them, worry more about making the wrong choice, and sometimes put off deciding altogether. Even those who do buy are more likely to wonder afterwards whether another option would have been better, so their pleasure in the purchase is reduced. This does not mean that choice is bad. People clearly value having some say over what they buy, and a market with a single product would satisfy few. The lesson for businesses is subtler: offering a carefully selected range, and helping customers compare it, may do more for sales than simply piling more products on the shelf.<\/p>"},{"id":"M1.1.11","q":"<p>(Passage 1) Which statement best expresses the main idea of the passage?<\/p>","o":["Stores should stock only one version of each product.","Beyond a point, more choice can reduce sales and satisfaction, so a well-chosen range may serve customers better.","Customers always prefer the store with the largest number of products.","Jam is the product most affected by too much choice."],"a":1,"s":"<p>The passage argues that too many options can backfire and recommends a carefully selected range.<br>Other options: A — the passage says a single product \"would satisfy few\"; C — this is the assumption the passage challenges; D — jam is only an example.<\/p>","tag":"1.4 Reading Comprehension"},{"id":"M1.1.12","q":"<p>(Passage 1) Which of the following is NOT mentioned as an effect of too many options?<\/p>","o":["People find it harder to compare the alternatives.","People worry more about making the wrong choice.","People sometimes put off deciding.","Stores are forced to charge higher prices."],"a":3,"s":"<p>Prices are never mentioned; the other three effects are listed in the fourth sentence.<br>Other options: A, B and C — all are stated in the passage.<\/p>","tag":"1.4 Reading Comprehension"},{"id":"M1.1.13","q":"<p>(Passage 1) The author's attitude towards consumer choice is best described as<\/p>","o":["completely hostile","indifferent","wholly enthusiastic","balanced: people value some choice, but too much of it can backfire"],"a":3,"s":"<p>The author says \"This does not mean that choice is bad\" while warning that excess choice reduces satisfaction: a balanced view.<br>Other options: A — the author accepts that people value choice; B — the author clearly takes a position; C — the author warns against too much choice.<\/p>","tag":"1.4 Reading Comprehension"},{"id":"M1.1.14","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. He therefore installed a simple drip irrigation system that delivered water directly to the roots.<br>Q. Every dry season, Hari's vegetable farm suffered from a shortage of water.<br>R. Within two seasons, his yield had doubled while his water use had fallen.<br>S. An agricultural officer told him that most of the water he poured on his fields was evaporating.<\/p>","o":["QSPR","QPSR","SQPR","QSRP"],"a":0,"s":"<p>Q introduces the problem, S gives the diagnosis, P (\"therefore\") gives the response, and R the result: QSPR.<br>Other options: B — \"therefore\" in P needs the officer's advice (S) before it; C — S refers to \"him\" before Hari is introduced; D — the result (R) cannot come before the action (P).<\/p>","tag":"1.5 Para Jumbles and Sentence Arrangement"},{"id":"M1.1.15","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. It responded by developing a low-sugar fruit drink.<br>Q. The test results showed strong demand, and the national launch was a success.<br>R. The firm then tested the drink in two cities before launching it nationally.<br>S. A beverage company noticed that young customers were buying fewer sugary drinks.<\/p>","o":["SRPQ","SPQR","PSRQ","SPRQ"],"a":3,"s":"<p>S sets the scene, P (\"It responded\") follows, R (\"then tested\") comes next, and Q reports the outcome: SPRQ.<br>Other options: A — the drink must be developed (P) before it is tested (R); B — the test results (Q) cannot come before the test (R); C — \"It\" in P has no antecedent at the start.<\/p>","tag":"1.5 Para Jumbles and Sentence Arrangement"},{"id":"M1.1.16","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Inflation erodes the purchasing power of money.<br>P. For example, if prices rise by 10 per cent, Rs 1,000 buys only what about Rs 909 bought a year earlier.<br>Q. Lenders therefore ask for an interest rate higher than the inflation they expect.<br>R. Otherwise, the money repaid to them would buy less than the money they lent.<\/p>","o":["QRP","PQR","PRQ","RPQ"],"a":1,"s":"<p>P illustrates S1, Q draws the consequence for lenders (\"therefore\"), and R explains Q (\"Otherwise\"): PQR.<br>Other options: A — the example (P) belongs right after the general statement; C — \"Otherwise\" in R needs Q before it; D — R makes no sense directly after S1.<\/p>","tag":"1.5 Para Jumbles and Sentence Arrangement"},{"id":"M1.1.17","q":"<p>Choose the correct meaning of the idiom \"to hit the nail on the head\".<\/p>","o":["to describe exactly what is causing a situation or problem","to hurt someone badly","to work as a carpenter","to make a careless mistake"],"a":0,"s":"<p>To hit the nail on the head is to say something exactly right about a situation.<br>Other options: B and C — literal readings of the words; D — nearly the opposite.<\/p>","tag":"1.6 Idioms, Phrases, One-word Substitution and Verbal Analogies"},{"id":"M1.1.18","q":"<p>Choose the one word for: \"A person who spends money extravagantly and wastefully.\"<\/p>","o":["miser","spendthrift","philanthropist","ascetic"],"a":1,"s":"<p>A spendthrift wastes money.<br>Other options: A — a miser hoards money, the opposite; C — a philanthropist gives money to good causes; D — an ascetic gives up comforts.<\/p>","tag":"1.6 Idioms, Phrases, One-word Substitution and Verbal Analogies"},{"id":"M1.1.19","q":"<p>Choose the one word for: \"Government by a small group of powerful people.\"<\/p>","o":["monarchy","anarchy","oligarchy","theocracy"],"a":2,"s":"<p>Oligarchy is rule by a few.<br>Other options: A — rule by one king or queen; B — absence of government; D — rule by religious leaders.<\/p>","tag":"1.6 Idioms, Phrases, One-word Substitution and Verbal Analogies"},{"id":"M1.1.20","q":"<p>Choose the word that completes the analogy. Numismatics : Coins :: Philately : ?<\/p>","o":["Stamps","Letters","Maps","Paintings"],"a":0,"s":"<p>Numismatics is the study and collection of coins; philately is the study and collection of stamps.<br>Other options: B — letters carry stamps but are not the subject; C — map-making is cartography; D — paintings are not the subject of philately.<\/p>","tag":"1.6 Idioms, Phrases, One-word Substitution and Verbal Analogies"}]},{"t":"Section 2 · Quantitative Techniques (20)","items":[{"id":"M1.2.1","q":"<p>What is the least number that must be added to 1056 to make it exactly divisible by 23?<\/p>","o":["2","3","21","18"],"a":0,"s":"<p>1056 ÷ 23 = 45 remainder 21, so 23 × 46 = 1058 and 1058 − 1056 = 2.<br>Other options: B — an arithmetic slip; C — 21 is the remainder (the number to subtract); D — no basis.<\/p>","tag":"2.1 Number System, HCF/LCM, Simplification, Surds and Indices"},{"id":"M1.2.2","q":"<p>Simplify: (0.4 × 0.04 × 0.004) ÷ (0.2 × 0.02 × 0.002)<\/p>","o":["0.8","8","80","0.08"],"a":1,"s":"<p>Each factor in the numerator is twice the matching factor in the denominator, so the value is 2 × 2 × 2 = 8.<br>Other options: A, C and D — decimal-point errors.<\/p>","tag":"2.1 Number System, HCF/LCM, Simplification, Surds and Indices"},{"id":"M1.2.3","q":"<p>What is the value of 125^(2/3) + 16^(3/4)?<\/p>","o":["31","41","33","23"],"a":2,"s":"<p>125^(2/3) = 5² = 25 and 16^(3/4) = 2³ = 8; 25 + 8 = 33.<br>Other options: A — uses 16^(3/4) = 6; B — uses 16^(3/4) = 16; D — uses 125^(2/3) = 15.<\/p>","tag":"2.1 Number System, HCF/LCM, Simplification, Surds and Indices"},{"id":"M1.2.4","q":"<p>A man buys a radio for Rs 2,400 and sells it at a loss of 15%. What is the selling price?<\/p>","o":["Rs 2,760","Rs 2,100","Rs 2,360","Rs 2,040"],"a":3,"s":"<p>SP = 2,400 × 0.85 = Rs 2,040.<br>Other options: A — adds 15% (a gain); B — subtracts Rs 300 (12.5%); C — subtracts only Rs 40.<\/p>","tag":"2.2 Percentage, Profit and Loss, Discount, Simple and Compound Interest"},{"id":"M1.2.5","q":"<p>The compound interest on a sum for 2 years at 10% per annum (compounded annually) is Rs 1,050. What is the simple interest on the same sum at the same rate for the same time?<\/p>","o":["Rs 1,100","Rs 950","Rs 1,000","Rs 1,025"],"a":2,"s":"<p>CI for 2 years = P(1.1² − 1) = 0.21P = 1,050, so P = 5,000. SI = 5,000 × 10% × 2 = Rs 1,000.<br>Other options: A — adds the difference instead of subtracting; B — no basis; D — no basis.<\/p>","tag":"2.2 Percentage, Profit and Loss, Discount, Simple and Compound Interest"},{"id":"M1.2.6","q":"<p>A fruit seller buys oranges at 4 for Rs 30 and sells them at 3 for Rs 27. What is his profit percentage?<\/p>","o":["15%","20%","25%","16 2/3%"],"a":1,"s":"<p>CP per orange = 30/4 = Rs 7.50; SP per orange = 27/3 = Rs 9. Profit = 1.50/7.50 = 20%.<br>Other options: A — no basis; C — no basis; D — profit as a percentage of SP (1.5/9).<\/p>","tag":"2.2 Percentage, Profit and Loss, Discount, Simple and Compound Interest"},{"id":"M1.2.7","q":"<p>Two numbers are in the ratio 3 : 5. If 9 is subtracted from each, the ratio becomes 12 : 23. What is the smaller number?<\/p>","o":["33","55","27","45"],"a":0,"s":"<p>(3x − 9)/(5x − 9) = 12/23 gives 69x − 207 = 60x − 108, so x = 11. Smaller number = 33.<br>Other options: B — the larger number; C and D — do not satisfy the ratio.<\/p>","tag":"2.3 Ratio and Proportion, Averages, Mixtures and Alligation, Partnership, Ages"},{"id":"M1.2.8","q":"<p>The average age of a family of 5 members is 24 years. The youngest member is 8 years old. What was the average age of the family just before the youngest member was born?<\/p>","o":["16 years","22 years","20 years","18 years"],"a":2,"s":"<p>Total age now = 120. The other four total 120 − 8 = 112 now; 8 years ago they totalled 112 − 32 = 80. Average of 4 = 20 years.<br>Other options: A — divides 80 by 5; B — no basis; D — no basis.<\/p>","tag":"2.3 Ratio and Proportion, Averages, Mixtures and Alligation, Partnership, Ages"},{"id":"M1.2.9","q":"<p>In what ratio must water be mixed with milk costing Rs 60 per litre to get a mixture worth Rs 50 per litre?<\/p>","o":["1 : 6","5 : 1","1 : 4","1 : 5"],"a":3,"s":"<p>Water costs Rs 0. By alligation, water : milk = (60 − 50) : (50 − 0) = 10 : 50 = 1 : 5.<br>Other options: A — no basis; B — the ratio reversed; C — no basis.<\/p>","tag":"2.3 Ratio and Proportion, Averages, Mixtures and Alligation, Partnership, Ages"},{"id":"M1.2.10","q":"<p>A can finish a piece of work in 18 days. He works on it for 6 days, and B finishes the rest in 8 days. In how many days could B alone finish the whole work?<\/p>","o":["10 days","12 days","16 days","24 days"],"a":1,"s":"<p>A does 6/18 = 1/3 of the work; B does the remaining 2/3 in 8 days, so B alone needs 8 ÷ 2/3 = 12 days.<br>Other options: A — no basis; C — doubles 8 days; D — treats 8 days as one-third of the work.<\/p>","tag":"2.4 Time and Work, Pipes and Cisterns, Time-Speed-Distance, Boats and Trains"},{"id":"M1.2.11","q":"<p>A train running at 90 km/h overtakes a man walking at 6 km/h in the same direction in 15 seconds. What is the length of the train?<\/p>","o":["375 m","350 m","400 m","325 m"],"a":1,"s":"<p>Relative speed = 84 km/h = 84 × 5/18 = 70/3 m/s. Length = 70/3 × 15 = 350 m.<br>Other options: A — uses 90 km/h (ignores the man); C — uses 96 km/h (opposite direction); D — no basis.<\/p>","tag":"2.4 Time and Work, Pipes and Cisterns, Time-Speed-Distance, Boats and Trains"},{"id":"M1.2.12","q":"<p>A man rows 24 km downstream in 2 hours and 16 km upstream in 2 hours. What is his speed in still water?<\/p>","o":["10 km/h","2 km/h","12 km/h","8 km/h"],"a":0,"s":"<p>Downstream speed = 12 km/h, upstream speed = 8 km/h. Speed in still water = (12 + 8)/2 = 10 km/h.<br>Other options: B — the speed of the stream; C — the downstream speed; D — the upstream speed.<\/p>","tag":"2.4 Time and Work, Pipes and Cisterns, Time-Speed-Distance, Boats and Trains"},{"id":"M1.2.13","q":"<p>If 3x + 4y = 24 and 2x − y = 5, what is the value of x + y?<\/p>","o":["5","6","8","7"],"a":3,"s":"<p>From the second equation y = 2x − 5. Then 3x + 8x − 20 = 24, so x = 4 and y = 3; x + y = 7.<br>Other options: A, B and C — come from arithmetic slips in substitution.<\/p>","tag":"2.5 Algebra, Geometry and Mensuration"},{"id":"M1.2.14","q":"<p>How many terms of the arithmetic progression 5, 9, 13, … must be added to get a sum of 230?<\/p>","o":["8","12","10","9"],"a":2,"s":"<p>S = n/2 [10 + 4(n − 1)] = n(2n + 3) = 230, so 2n² + 3n − 230 = 0 and n = 10 (the other root is negative).<br>Other options: A, B and D — give sums of 152, 324 and 189.<\/p>","tag":"2.5 Algebra, Geometry and Mensuration"},{"id":"M1.2.15","q":"<p>If log x + log 5 = 2 (logarithms to base 10), what is x?<\/p>","o":["20","95","40","10"],"a":0,"s":"<p>log (5x) = 2, so 5x = 100 and x = 20.<br>Other options: B — treats it as x + 5 = 100; C — no basis; D — treats log x = 1.<\/p>","tag":"2.5 Algebra, Geometry and Mensuration"},{"id":"M1.2.16","q":"<p>The sum of the interior angles of a polygon is 1440°. How many sides does it have?<\/p>","o":["8","9","12","10"],"a":3,"s":"<p>(n − 2) × 180° = 1440°, so n − 2 = 8 and n = 10.<br>Other options: A — forgets to add 2; B and C — give 1260° and 1800°.<\/p>","tag":"2.5 Algebra, Geometry and Mensuration"},{"id":"M1.2.17","q":"<p>A cylindrical tank has a diameter of 14 m and a depth of 5 m. How many kilolitres of water can it hold? (Take π = 22/7; 1 m³ = 1 kilolitre.)<\/p>","o":["3,080","1,540","154","770"],"a":3,"s":"<p>Radius = 7 m. Volume = 22/7 × 7 × 7 × 5 = 770 m³ = 770 kilolitres.<br>Other options: A — uses the diameter as radius; B — doubles the volume; C — gives only the base area.<\/p>","tag":"2.5 Algebra, Geometry and Mensuration"},{"id":"M1.2.18","q":"<p>The table shows a company's expenditure in 2024 (Rs lakh). What percentage of the total expenditure was spent on advertising?<\/p><div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Salaries<\/th><th>Raw materials<\/th><th>Transport<\/th><th>Advertising<\/th><th>Others<\/th><\/tr><\/thead><tbody><tr><td>Expenditure<\/td><td>240<\/td><td>360<\/td><td>90<\/td><td>60<\/td><td>150<\/td><\/tr><\/tbody><\/table><\/div>","o":["6 2/3%","6%","10%","7 1/2%"],"a":0,"s":"<p>Total = 240 + 360 + 90 + 60 + 150 = 900. Advertising share = 60/900 × 100 = 6 2/3%.<br>Other options: B — divides by 1,000; C — divides by 600 instead of 900; D — divides by 800.<\/p>","tag":"2.6 Data Interpretation, Sets, Permutations and Combinations, Probability and Statistics"},{"id":"M1.2.19","q":"<p>A committee of 4 is to be chosen from 6 men and 4 women. In how many ways can this be done if the committee must contain exactly 2 women?<\/p>","o":["210","90","60","120"],"a":1,"s":"<p>Choose 2 women from 4 (6 ways) and 2 men from 6 (15 ways): 6 × 15 = 90.<br>Other options: A — C(10,4), no restriction; C — 15 × 4; D — no basis.<\/p>","tag":"2.6 Data Interpretation, Sets, Permutations and Combinations, Probability and Statistics"},{"id":"M1.2.20","q":"<p>A bag contains 4 red, 5 green and 6 blue balls. One ball is drawn at random. What is the probability that it is NOT green?<\/p>","o":["1/3","2/5","2/3","3/5"],"a":2,"s":"<p>Non-green balls = 4 + 6 = 10 out of 15; probability = 10/15 = 2/3.<br>Other options: A — the probability that it IS green; B — probability of blue; D — no basis.<\/p>","tag":"2.6 Data Interpretation, Sets, Permutations and Combinations, Probability and Statistics"}]},{"t":"Section 3 · Logical Reasoning (20)","items":[{"id":"M1.3.1","q":"<p>Find the next term: 1, 4, 13, 40, 121, ?<\/p>","o":["364","361","243","365"],"a":0,"s":"<p>Each term is 3 × previous + 1: 121 × 3 + 1 = 364.<br>Other options: B — 19², no link; C — 3⁵; D — off by one.<\/p>","tag":"3.1 Number and Letter Series, Analogy and Odd One Out"},{"id":"M1.3.2","q":"<p>Find the next letter: B, F, J, N, R, ?<\/p>","o":["U","W","V","T"],"a":2,"s":"<p>The letters advance by 4 each time: R + 4 = V.<br>Other options: A — advances by 3; B — advances by 5; D — advances by 2.<\/p>","tag":"3.1 Number and Letter Series, Analogy and Odd One Out"},{"id":"M1.3.3","q":"<p>Which one is the odd one out: Copper, Iron, Zinc, Bronze?<\/p>","o":["Copper","Iron","Zinc","Bronze"],"a":3,"s":"<p>Bronze is an alloy (mainly copper and tin); the others are pure metallic elements.<br>Other options: A, B and C — all are elements.<\/p>","tag":"3.1 Number and Letter Series, Analogy and Odd One Out"},{"id":"M1.3.4","q":"<p>4 : 17 :: 7 : ?<\/p>","o":["49","50","51","48"],"a":1,"s":"<p>4² + 1 = 17, so 7² + 1 = 50.<br>Other options: A — forgets the +1; C — adds 2; D — subtracts 1.<\/p>","tag":"3.1 Number and Letter Series, Analogy and Odd One Out"},{"id":"M1.3.5","q":"<p>If CASH is coded as DCVL, how is BANK coded in the same language?<\/p>","o":["CCQO","CBOL","CCPO","DCQO"],"a":0,"s":"<p>The letters are moved forward by 1, 2, 3 and 4 places: B+1 = C, A+2 = C, N+3 = Q, K+4 = O → CCQO.<br>Other options: B — moves every letter by 1; C — moves N by 2; D — moves B by 2.<\/p>","tag":"3.2 Coding-Decoding"},{"id":"M1.3.6","q":"<p>In a code language, \"mo ka ri\" means \"save more money\", \"ka lu ti\" means \"earn more income\" and \"ri pa lu\" means \"money and income\". Which code means \"save\"?<\/p>","o":["ka","ri","lu","mo"],"a":3,"s":"<p>Statements 1 and 2 share \"more\" and \"ka\"; statements 1 and 3 share \"money\" and \"ri\". The remaining word in statement 1, \"save\", is \"mo\".<br>Other options: A — means \"more\"; B — means \"money\"; C — means \"income\".<\/p>","tag":"3.2 Coding-Decoding"},{"id":"M1.3.7","q":"<p>If each letter is replaced by its position in the alphabet, FACE is written as 6135. How is BEAD written?<\/p>","o":["2541","2514","2415","5214"],"a":1,"s":"<p>B = 2, E = 5, A = 1, D = 4 → 2514.<br>Other options: A — swaps A and D; C — swaps E and D; D — swaps B and E.<\/p>","tag":"3.2 Coding-Decoding"},{"id":"M1.3.8","q":"<p>A is the sister of B. B is the son of C. C is the daughter of D. How is A related to D?<\/p>","o":["Daughter","Granddaughter","Niece","Sister"],"a":1,"s":"<p>A is a child of C (being B's sister), and C is D's daughter, so A is D's granddaughter.<br>Other options: A — skips a generation; C — a niece is a sibling's daughter; D — wrong generation.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"id":"M1.3.9","q":"<p>Raj is the husband of Gopal's father's sister. How is Raj related to Gopal?<\/p>","o":["Brother-in-law","Cousin","Uncle","Father-in-law"],"a":2,"s":"<p>Gopal's father's sister is his aunt; her husband is his uncle.<br>Other options: A — that would be a sister's husband; B — Raj's children would be Gopal's cousins; D — that would be a spouse's father.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"id":"M1.3.10","q":"<p>Starting from his home, Bikash cycles 8 km south, turns left and cycles 6 km, then turns left again and cycles 16 km. How far is he from home, and in which direction?<\/p>","o":["10 km north-east","10 km south-east","14 km north-east","8 km north"],"a":0,"s":"<p>Left from south is east (6 km); left from east is north (16 km). Net: 6 km east and 8 km north, distance √(36 + 64) = 10 km, north-east of home.<br>Other options: B — wrong direction (he ends north of home); C — adds 6 + 8; D — ignores the eastward leg.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"id":"M1.3.11","q":"<p>A man is facing west. He turns 90° clockwise twice and then 45° anticlockwise. Which direction is he facing now?<\/p>","o":["North-west","South-east","North-east","South-west"],"a":2,"s":"<p>West → (90° clockwise) north → (90° clockwise) east → (45° anticlockwise) north-east.<br>Other options: A, B and D — each results from turning the wrong way at one of the steps.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"p":"<p><b>Puzzle 1<\/b><br>Five people, Anil, Binod, Chandra, Dipa and Elina, live on the five floors of a building, one on each floor (floor 1 is the lowest, floor 5 the top). Chandra lives on the top floor. Anil lives immediately below Dipa. Binod lives immediately above Dipa. Elina lives on a floor below Anil.<\/p>"},{"id":"M1.3.12","q":"<p>(Puzzle 1) Who lives on floor 2?<\/p>","o":["Elina","Dipa","Binod","Anil"],"a":3,"s":"<p>Chandra is on 5, so Binod ≤ 4, Dipa ≤ 3, Anil ≤ 2, and Elina is below Anil, so Elina = 1, Anil = 2, Dipa = 3, Binod = 4, Chandra = 5.<br>Other options: A — floor 1; B — floor 3; C — floor 4.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M1.3.13","q":"<p>(Puzzle 1) Who lives immediately above Binod?<\/p>","o":["Dipa","Chandra","Anil","Elina"],"a":1,"s":"<p>Binod is on floor 4, so the person on floor 5, Chandra, is immediately above him.<br>Other options: A — Dipa is immediately below Binod; C and D — live on floors 2 and 1.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M1.3.14","q":"<p>(Puzzle 1) How many people live between Elina and Binod?<\/p>","o":["1","3","0","2"],"a":3,"s":"<p>Elina is on floor 1 and Binod on floor 4; Anil (2) and Dipa (3) live between them: 2 people.<br>Other options: A, B and C — miscount the floors.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M1.3.15","q":"<p>(Puzzle 1) Which of the following statements is true?<\/p>","o":["Dipa lives on floor 4.","Elina lives immediately below Binod.","Anil lives on floor 1.","Dipa lives between Anil and Binod."],"a":3,"s":"<p>Anil (2), Dipa (3), Binod (4): Dipa lives between them.<br>Other options: A — Dipa is on floor 3; B — Dipa lives immediately below Binod; C — Anil is on floor 2.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M1.3.16","q":"<p>Statements: All pens are tools. No tool is a toy.<br>Conclusions: I. No pen is a toy. II. Some tools are pens.<\/p>","o":["Only I follows","Only II follows","Both I and II follow","Neither I nor II follows"],"a":2,"s":"<p>Pens lie wholly inside tools, and tools share nothing with toys, so no pen is a toy (I). \"All pens are tools\" converts to \"Some tools are pens\" (II).<br>Other options: A and B — each misses one valid conclusion; D — both follow.<\/p>","tag":"3.5 Syllogisms, Statement and Conclusion, Statement and Assumption"},{"id":"M1.3.17","q":"<p>Statements: Some cups are plates. Some plates are bowls.<br>Conclusions: I. Some cups are bowls. II. No cup is a bowl.<\/p>","o":["Only I follows","Only II follows","Either I or II follows","Neither I nor II follows"],"a":2,"s":"<p>Neither conclusion follows definitely, but between them they cover every possibility (\"some\" and \"none\" form a complementary pair), so either I or II must be true.<br>Other options: A and B — neither conclusion is definite on its own; D — ignores the complementary pair.<\/p>","tag":"3.5 Syllogisms, Statement and Conclusion, Statement and Assumption"},{"id":"M1.3.18","q":"<p>Statement: The city's water board has announced that, during the dry season, tap water will be supplied only on alternate days.<br>Assumptions: I. The water available in the dry season is not enough for a daily supply to everyone. II. Residents will stop using water altogether on the days without supply.<\/p>","o":["Only I is implicit","Only II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":0,"s":"<p>Rationing supply makes sense only if water is short (I). The board does not assume people will use no water at all on off days; they are expected to store it (II is not implicit).<br>Other options: B and C — II is unreasonable; D — I is implicit.<\/p>","tag":"3.5 Syllogisms, Statement and Conclusion, Statement and Assumption"},{"id":"M1.3.19","q":"<p>In a town, every shop that sells medicines must, by law, have a licensed pharmacist. Shop X does not have a licensed pharmacist. Which of the following must be true?<\/p>","o":["Shop X sells medicines illegally.","If Shop X obeys the law, it does not sell medicines.","Every shop that has a licensed pharmacist sells medicines.","Shop X will soon hire a licensed pharmacist."],"a":1,"s":"<p>The rule says medicine-selling requires a pharmacist; a law-abiding shop without one therefore cannot be selling medicines.<br>Other options: A — Shop X may not sell medicines at all; C — reverses the rule; D — the future is not implied.<\/p>","tag":"3.6 Critical Reasoning, Data Sufficiency, Clocks and Calendars"},{"id":"M1.3.20","q":"<p>At what time between 2 and 3 o'clock are the hands of a clock first at right angles?<\/p>","o":["27 3/11 minutes past 2","30 minutes past 2","25 5/11 minutes past 2","21 9/11 minutes past 2"],"a":0,"s":"<p>At 2:00 the hour hand is 60° ahead. The minute hand gains 5.5° per minute, so it is 90° ahead when 5.5m − 60 = 90, i.e. m = 300/11 = 27 3/11.<br>Other options: B — ignores the movement of the hour hand; C — no basis; D — that is when the minute hand is 60° ahead.<\/p>","tag":"3.6 Critical Reasoning, Data Sufficiency, Clocks and Calendars"}]},{"t":"Section 4 · General Knowledge (20)","items":[{"id":"M1.4.1","q":"<p>Lumbini, the birthplace of the Buddha, was inscribed on UNESCO's World Heritage List in<\/p>","o":["1979","2001","1997","1984"],"a":2,"s":"<p>Lumbini was inscribed as a World Heritage Site in 1997.<br>Other options: A — the year the Kathmandu Valley and Sagarmatha National Park were inscribed; B — no Nepali inscription that year; D — the year Chitwan National Park was inscribed.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M1.4.2","q":"<p>The Nepal–China (Tibet) war of 1791–92 was ended by the<\/p>","o":["Treaty of Betrawati","Treaty of Sugauli","Treaty of Thapathali","Treaty of Kerung"],"a":0,"s":"<p>The Betrawati Treaty of 1792 ended the war with Qing China and Tibet.<br>Other options: B — ended the Anglo-Nepal War (1816); C — ended the Nepal–Tibet war of 1855–56; D — the 1789 settlement with Tibet that preceded the 1791 war.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M1.4.3","q":"<p>Nepal's first legal code, the Muluki Ain, was promulgated in 1854 under<\/p>","o":["Chandra Shumsher","Bhimsen Thapa","King Rajendra","Jung Bahadur Rana"],"a":3,"s":"<p>The Muluki Ain of 1854 (1910 BS) was issued during the rule of Prime Minister Jung Bahadur Rana.<br>Other options: A — Rana Prime Minister in the early 20th century; B — Mukhtiyar until 1837; C — king before the Rana period.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M1.4.4","q":"<p>During which festival is the Living Goddess Kumari taken around Kathmandu in a chariot procession?<\/p>","o":["Bisket Jatra","Gai Jatra","Indra Jatra","Rato Machhindranath Jatra"],"a":2,"s":"<p>The Kumari chariot procession is the highlight of Indra Jatra in Kathmandu.<br>Other options: A — a Bhaktapur new-year festival; B — a festival in memory of the dead, with cow processions; D — the chariot festival of Lalitpur.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M1.4.5","q":"<p>The Pashupatinath temple stands on the banks of which river?<\/p>","o":["Bagmati","Bishnumati","Manohara","Trishuli"],"a":0,"s":"<p>Pashupatinath lies on the banks of the Bagmati river in Kathmandu.<br>Other options: B — flows through western Kathmandu; C — a tributary in the eastern valley; D — a river outside the valley.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M1.4.6","q":"<p>Tilicho Lake, one of the highest lakes of its size in the world, lies in which district?<\/p>","o":["Mustang","Dolpa","Mugu","Manang"],"a":3,"s":"<p>Tilicho Lake (about 4,919 m) is in Manang district, in the Annapurna region.<br>Other options: A — neighbouring district to the west; B — home of Phoksundo Lake; C — home of Rara Lake.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M1.4.7","q":"<p>Koshi Tappu Wildlife Reserve is especially known for protecting Nepal's last population of<\/p>","o":["one-horned rhinoceros","wild water buffalo (arna)","swamp deer","gharial"],"a":1,"s":"<p>Koshi Tappu was set up to protect the wild water buffalo (arna).<br>Other options: A — mainly in Chitwan and Bardia; C — best known in Shuklaphanta; D — a river crocodile protected mainly in Chitwan's rivers.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M1.4.8","q":"<p>The Mahendra (East–West) Highway runs across the Terai from the Mechi river in the east to which river in the west?<\/p>","o":["Karnali","Mahakali","Rapti","Babai"],"a":1,"s":"<p>The highway runs from Mechi (Kakarbhitta) in the east to Mahakali in the far west.<br>Other options: A, C and D — rivers the highway crosses, not its western end.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M1.4.9","q":"<p>Which is the largest national park of Nepal by area?<\/p>","o":["Chitwan National Park","Sagarmatha National Park","Langtang National Park","Shey Phoksundo National Park"],"a":3,"s":"<p>Shey Phoksundo National Park (about 3,555 km², in Dolpa and Mugu) is the largest national park.<br>Other options: A, B and C — all smaller.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M1.4.10","q":"<p>Article 4 of the Constitution of Nepal describes the State of Nepal. Which of the following words is NOT part of that description?<\/p>","o":["secular","inclusive","socialism-oriented","constitutional monarchical"],"a":3,"s":"<p>Article 4 describes Nepal as an independent, indivisible, sovereign, secular, inclusive, democratic, socialism-oriented, federal democratic republican state. Monarchy was abolished in 2008.<br>Other options: A, B and C — all appear in Article 4.<\/p>","tag":"4.3 Constitution of Nepal 2072, Polity and Governance"},{"id":"M1.4.11","q":"<p>The method of drawing the national flag of Nepal is set out in which Schedule of the Constitution?<\/p>","o":["Schedule 1","Schedule 5","Schedule 9","Schedule 4"],"a":0,"s":"<p>Schedule 1 gives the method of drawing the national flag.<br>Other options: B — lists federal powers; C — lists concurrent powers of the federation, province and local level; D — lists the provinces and their districts.<\/p>","tag":"4.3 Constitution of Nepal 2072, Polity and Governance"},{"id":"M1.4.12","q":"<p>Under the Constitution of Nepal, a person may be elected President at most<\/p>","o":["once","twice","three times","any number of times"],"a":1,"s":"<p>A person who has been elected President twice is not eligible to stand again (term of five years each).<br>Other options: A, C and D — do not match the two-term limit.<\/p>","tag":"4.3 Constitution of Nepal 2072, Polity and Governance"},{"id":"M1.4.13","q":"<p>Rastriya Banijya Bank, Nepal's largest fully government-owned commercial bank, was established in<\/p>","o":["1937","1956","1966","1984"],"a":2,"s":"<p>Rastriya Banijya Bank was established in 1966 (2022 BS).<br>Other options: A — Nepal Bank Limited; B — Nepal Rastra Bank; D — the first joint-venture bank.<\/p>","tag":"4.4 Economy of Nepal, Development and National Organisations"},{"id":"M1.4.14","q":"<p>Nepal's annual Economic Survey, released just before the federal budget, is published by the<\/p>","o":["Ministry of Finance","Nepal Rastra Bank","National Statistics Office","National Planning Commission"],"a":0,"s":"<p>The Economic Survey is prepared and published by the Ministry of Finance.<br>Other options: B — publishes monetary policy and macroeconomic reports; C — conducts the census and surveys; D — prepares periodic plans.<\/p>","tag":"4.4 Economy of Nepal, Development and National Organisations"},{"id":"M1.4.15","q":"<p>The headquarters of OPEC (Organization of the Petroleum Exporting Countries) is in<\/p>","o":["Riyadh","Geneva","Vienna","Doha"],"a":2,"s":"<p>OPEC's headquarters has been in Vienna, Austria, since 1965.<br>Other options: A — capital of Saudi Arabia, a member but not the seat; B — seat of the WTO and many UN agencies; D — capital of Qatar.<\/p>","tag":"4.5 World: International Organisations, World Geography and Notable Firsts"},{"id":"M1.4.16","q":"<p>Which strait separates Asia from North America?<\/p>","o":["Strait of Gibraltar","Strait of Malacca","Palk Strait","Bering Strait"],"a":3,"s":"<p>The Bering Strait lies between Russia (Asia) and Alaska (North America).<br>Other options
