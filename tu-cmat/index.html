rom.<\/p>","tag":"3.1 Number and Letter Series, Analogy and Odd One Out"},{"id":"M3.3.5","q":"<p>If the letters are numbered in reverse (A = 26, B = 25, …, Z = 1), how is TEA written?<\/p>","o":["20-5-1","7-22-26","6-22-26","7-21-26"],"a":1,"s":"<p>In reverse numbering a letter's value is 27 − its normal position: T = 27 − 20 = 7, E = 22, A = 26.<br>Other options: A — normal positions; C — subtracts from 26 for T; D — subtracts from 26 for E.<\/p>","tag":"3.2 Coding-Decoding"},{"id":"M3.3.6","q":"<p>If CLOUD is coded as DMPVE and RAIN as SBJO, which word is coded as TOPX?<\/p>","o":["SNOW","UPQY","SLOW","STOW"],"a":0,"s":"<p>Each letter is moved one place forward, so to decode move each letter one place back: T→S, O→N, P→O, X→W, giving SNOW.<br>Other options: B — encodes TOPX again instead of decoding; C and D — do not match letter by letter.<\/p>","tag":"3.2 Coding-Decoding"},{"id":"M3.3.7","q":"<p>If 2 # 3 = 25 and 4 # 1 = 25, what is 3 # 5?<\/p>","o":["34","64","15","16"],"a":1,"s":"<p>a # b = (a + b)²: (2 + 3)² = 25 and (4 + 1)² = 25, so 3 # 5 = 8² = 64.<br>Other options: A — a² + b²; C — a × b; D — no basis.<\/p>","tag":"3.2 Coding-Decoding"},{"id":"M3.3.8","q":"<p>Pointing to a man, Gita says, \"His only brother is the father of my daughter's father.\" How is the man related to Gita's husband?<\/p>","o":["Father-in-law","Uncle","Brother-in-law","Grandfather"],"a":1,"s":"<p>Gita's daughter's father is Gita's husband. His father is the man's only brother, so the man is the husband's father's brother: his uncle.<br>Other options: A — that would be the husband's father himself; C — no; D — wrong generation.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"id":"M3.3.9","q":"<p>M is the mother of N. N is the brother of O. O is the father of P. How is M related to P?<\/p>","o":["Mother","Aunt","Grandmother","Sister"],"a":2,"s":"<p>M is the mother of N and O (siblings); O is P's father, so M is P's grandmother.<br>Other options: A — skips a generation; B — would be O's sister; D — wrong generation.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"id":"M3.3.10","q":"<p>A man walks 5 km east, turns right and walks 12 km, then turns right again and walks 10 km. How far is he from his starting point, and in which direction?<\/p>","o":["13 km south-east","17 km south-west","12 km south","13 km south-west"],"a":3,"s":"<p>Right from east is south (12 km); right from south is west (10 km). Net: 5 km west and 12 km south. Distance = √(25 + 144) = 13 km, towards the south-west.<br>Other options: A — wrong side (he ends west of the start); B — adds 5 + 12; C — ignores the westward displacement.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"id":"M3.3.11","q":"<p>Hari is facing north-east. He turns 180° and then 90° clockwise. Which direction is he facing now?<\/p>","o":["North-west","South-east","North-east","South-west"],"a":0,"s":"<p>North-east turned 180° is south-west; 90° clockwise from south-west is north-west.<br>Other options: B — turns 90° anticlockwise at the end; C — ignores both turns; D — ignores the last turn.<\/p>","tag":"3.3 Blood Relations and Direction Sense"},{"p":"<p><b>Puzzle 1<\/b><br>Five departments, Finance, HR, IT, Marketing and Sales, each hold one meeting on a different day from Monday to Friday of the same week. The HR meeting is on Wednesday. The Finance meeting is on the day immediately before the IT meeting. The Marketing meeting is neither on Monday nor on Friday. The Sales meeting is on a day after the HR meeting.<\/p>"},{"id":"M3.3.12","q":"<p>(Puzzle 1) Which meeting is held on Thursday?<\/p>","o":["HR","Sales","Marketing","IT"],"a":2,"s":"<p>Marketing must be on Tuesday or Thursday. If Tuesday, Finance–IT must be Thursday–Friday, leaving Monday for Sales, which is before HR, so this fails. Hence Marketing = Thursday, Finance = Monday, IT = Tuesday, Sales = Friday.<br>Other options: A — Wednesday; B — Friday; D — Tuesday.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M3.3.13","q":"<p>(Puzzle 1) Which meeting is held on Monday?<\/p>","o":["IT","Finance","Sales","HR"],"a":1,"s":"<p>Order: Monday Finance, Tuesday IT, Wednesday HR, Thursday Marketing, Friday Sales.<br>Other options: A — Tuesday; C — Friday; D — Wednesday.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M3.3.14","q":"<p>(Puzzle 1) How many meetings are held between the IT meeting and the Sales meeting?<\/p>","o":["1","3","0","2"],"a":3,"s":"<p>IT is on Tuesday and Sales on Friday; HR (Wednesday) and Marketing (Thursday) fall between them: 2 meetings.<br>Other options: A, B and C — miscount the days.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M3.3.15","q":"<p>(Puzzle 1) On which day is the IT meeting held?<\/p>","o":["Tuesday","Monday","Thursday","Friday"],"a":0,"s":"<p>Finance is on Monday, so IT, the next day, is on Tuesday.<br>Other options: B — Finance; C — Marketing; D — Sales.<\/p>","tag":"3.4 Seating Arrangement, Ordering and Ranking, and Puzzles"},{"id":"M3.3.16","q":"<p>Statements: All birds can fly. Some penguins are birds.<br>Conclusions: I. Some penguins can fly. II. All penguins can fly.<br>(Accept the statements as true even if they differ from known facts.)<\/p>","o":["Only I follows","Only II follows","Both I and II follow","Neither I nor II follows"],"a":0,"s":"<p>The penguins that are birds can fly, so some penguins can fly (I). Nothing is said about penguins that are not birds, so II does not follow.<br>Other options: B and C — II goes beyond the statements; D — I follows.<\/p>","tag":"3.5 Syllogisms, Statement and Conclusion, Statement and Assumption"},{"id":"M3.3.17","q":"<p>Statement: \"Book your tickets early to avoid the last-minute rush,\" advises an airline.<br>Assumptions: I. Many people book tickets close to the date of travel. II. People generally prefer to avoid a rush.<\/p>","o":["Only I is implicit","Only II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":2,"s":"<p>A \"last-minute rush\" exists only if many people book late (I), and the advice works only if people want to avoid the rush (II).<br>Other options: A and B — each misses one assumption; D — both are implicit.<\/p>","tag":"3.5 Syllogisms, Statement and Conclusion, Statement and Assumption"},{"id":"M3.3.18","q":"<p>Statements: All A are B. All B are C. No C is D.<br>Conclusions: I. No A is D. II. Some C are A.<\/p>","o":["Only I follows","Only II follows","Both I and II follow","Neither I nor II follows"],"a":2,"s":"<p>All A are B and all B are C, so all A are C; since no C is D, no A is D (I). \"All A are C\" converts to \"Some C are A\" (II).<br>Other options: A and B — each misses one valid conclusion; D — both follow.<\/p>","tag":"3.5 Syllogisms, Statement and Conclusion, Statement and Assumption"},{"id":"M3.3.19","q":"<p>A town council claims that installing street lights on its main road reduced night-time accidents there by 40%. Which of the following, if true, most strengthens the claim?<\/p>","o":["The town's population grew during the same period.","Daytime accidents on the main road also fell by 40%.","The council spent more on the lights than it had planned.","On similar roads in the town where no lights were installed, night-time accidents did not change over the same period."],"a":3,"s":"<p>If comparable roads without lights saw no fall, the fall on the main road is more likely due to the lights.<br>Other options: A — irrelevant or slightly weakening; B — suggests some other cause reduced all accidents, which weakens the claim; C — cost is irrelevant.<\/p>","tag":"3.6 Critical Reasoning, Data Sufficiency, Clocks and Calendars"},{"id":"M3.3.20","q":"<p>If the day before yesterday was Thursday, what day will it be the day after tomorrow?<\/p>","o":["Sunday","Tuesday","Saturday","Monday"],"a":3,"s":"<p>The day before yesterday was Thursday, so today is Saturday. The day after tomorrow is Monday.<br>Other options: A — tomorrow; B — three days ahead; C — today.<\/p>","tag":"3.6 Critical Reasoning, Data Sufficiency, Clocks and Calendars"}]},{"t":"Section 4 · General Knowledge (20)","items":[{"id":"M3.4.1","q":"<p>Tribhuvan University, Nepal's first university, was established in<\/p>","o":["1918","1959","1985","1951"],"a":1,"s":"<p>Tribhuvan University was established in 1959 (2016 BS).<br>Other options: A — Tri-Chandra College; C — no link; D — year of the end of Rana rule.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M3.4.2","q":"<p>The People's Movement II (Jana Andolan II), which restored the dissolved House of Representatives, took place in<\/p>","o":["2006","1990","2008","1979"],"a":0,"s":"<p>The 19-day People's Movement of April 2006 forced the king to restore the House of Representatives.<br>Other options: B — the first People's Movement; C — declaration of the republic; D — student movement leading to the 1980 referendum.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M3.4.3","q":"<p>According to traditional chronicles, who was the first king of the Kirat dynasty in the Kathmandu Valley?<\/p>","o":["Manadeva","Amshuverma","Yalamber","Jayasthiti Malla"],"a":2,"s":"<p>Yalamber is traditionally named as the first Kirat king.<br>Other options: A and B — Licchavi kings; D — a Malla king.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M3.4.4","q":"<p>The stone Krishna Mandir in Patan Durbar Square, built in the shikhara style in 1637, was built by<\/p>","o":["Pratap Malla","Bhupatindra Malla","Jaya Prakash Malla","Siddhi Narasimha Malla"],"a":3,"s":"<p>King Siddhi Narasimha Malla of Patan built the Krishna Mandir in 1637.<br>Other options: A — king of Kantipur (Kathmandu); B — king of Bhaktapur; C — the last Malla king of Kathmandu.<\/p>","tag":"4.1 History and Culture of Nepal"},{"id":"M3.4.5","q":"<p>The Narayani river is formed by the meeting of the Kali Gandaki and which other river?<\/p>","o":["Trishuli","Seti","Marsyangdi","Budhi Gandaki"],"a":0,"s":"<p>The Kali Gandaki and the Trishuli meet at Devghat to form the Narayani.<br>Other options: B, C and D — other rivers of the Gandaki system, not the pair whose meeting forms the Narayani.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M3.4.6","q":"<p>Which is the highest hill on the rim of the Kathmandu Valley?<\/p>","o":["Shivapuri","Phulchoki","Chandragiri","Nagarjun"],"a":1,"s":"<p>Phulchoki (about 2,782 m), in the south-east, is the highest point on the valley rim.<br>Other options: A, C and D — lower hills on the rim.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M3.4.7","q":"<p>Which national park was inscribed as a natural World Heritage Site by UNESCO in 1979?<\/p>","o":["Chitwan National Park","Langtang National Park","Sagarmatha National Park","Bardia National Park"],"a":2,"s":"<p>Sagarmatha National Park was inscribed in 1979.<br>Other options: A — inscribed in 1984; B and D — not World Heritage Sites.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M3.4.8","q":"<p>How many districts does Nepal have?<\/p>","o":["75","72","78","77"],"a":3,"s":"<p>Nepal has 77 districts after Nawalparasi and Rukum were each divided between two provinces in 2015.<br>Other options: A — the number before the 2015 restructuring; B and C — no basis.<\/p>","tag":"4.2 Geography and Environment of Nepal"},{"id":"M3.4.9","q":"<p>According to Article 6 of the Constitution of Nepal, the languages of the nation are<\/p>","o":["Nepali only","Nepali and Maithili","Nepali, Maithili and Bhojpuri","all the mother tongues spoken in Nepal"],"a":3,"s":"<p>Article 6 states that all mother tongues spoken in Nepal are languages of the nation. (Article 7 makes Nepali in Devanagari the official language.)<br>Other options: A — confuses the language of the nation with the official language; B and C — no basis.<\/p>","tag":"4.3 Constitution of Nepal 2072, Polity and Governance"},{"id":"M3.4.10","q":"<p>The Constitutional Bench of the Supreme Court of Nepal is headed by the<\/p>","o":["Chief Justice","senior-most justice after the Chief Justice","President","Minister for Law and Justice"],"a":0,"s":"<p>Under the Constitution, the Constitutional Bench consists of the Chief Justice and four other judges, with the Chief Justice presiding.<br>Other options: B, C and D — do not head the bench.<\/p>","tag":"4.3 Constitution of Nepal 2072, Polity and Governance"},{"id":"M3.4.11","q":"<p>Which Article of the Constitution of Nepal guarantees the right against untouchability and discrimination?<\/p>","o":["Article 16","Article 24","Article 30","Article 18"],"a":1,"s":"<p>Article 24 provides the right against untouchability and discrimination.<br>Other options: A — right to live with dignity; C — right to a clean environment; D — right to equality.<\/p>","tag":"4.3 Constitution of Nepal 2072, Polity and Governance"},{"id":"M3.4.12","q":"<p>The Constitution of Nepal envisages a 'three-pillar' economy. The three pillars are the<\/p>","o":["public, private and cooperative sectors","agriculture, industry and service sectors","federal, provincial and local governments","trade, tourism and remittance sectors"],"a":0,"s":"<p>The economic objective in the Constitution is to build the economy through the public, private and cooperative sectors.<br>Other options: B — sectors of production; C — the three levels of government; D — not the constitutional pillars.<\/p>","tag":"4.4 Economy of Nepal, Development and National Organisations"},{"id":"M3.4.13","q":"<p>Which agency publishes Nepal's official national accounts (GDP estimates)?<\/p>","o":["Nepal Rastra Bank","Ministry of Finance","National Statistics Office","National Planning Commission"],"a":2,"s":"<p>National accounts are compiled and published by the National Statistics Office (formerly the Central Bureau of Statistics).<br>Other options: A — publishes monetary and banking statistics; B — publishes the Economic Survey, using NSO's figures; D — prepares periodic plans.<\/p>","tag":"4.4 Economy of Nepal, Development and National Organisations"},{"id":"M3.4.14","q":"<p>The headquarters of the World Health Organization (WHO) is in<\/p>","o":["New York","Geneva","Paris","Vienna"],"a":1,"s":"<p>WHO is headquartered in Geneva, Switzerland.<br>Other options: A — UN headquarters; C — UNESCO; D — OPEC and IAEA.<\/p>","tag":"4.5 World: International Organisations, World Geography and Notable Firsts"},{"id":"M3.4.15","q":"<p>Which is the longest river in Asia?<\/p>","o":["Ganga","Mekong","Yangtze","Indus"],"a":2,"s":"<p>The Yangtze (about 6,300 km) in China is Asia's longest river.<br>Other options: A, B and D — shorter rivers.<\/p>","tag":"4.5 World: International Organisations, World Geography and Notable Firsts"},{"id":"M3.4.16","q":"<p>The Suez Canal connects the<\/p>","o":["Atlantic Ocean and Pacific Ocean","Black Sea and Caspian Sea","Arabian Sea and Bay of Bengal","Mediterranean Sea and Red Sea"],"a":3,"s":"<p>The Suez Canal in Egypt links the Mediterranean Sea with the Red Sea.<br>Other options: A — the Panama Canal; B and C — not connected by a canal.<\/p>","tag":"4.5 World: International Organisations, World Geography and Notable Firsts"},{"id":"M3.4.17","q":"<p>Which was the first country to give women the right to vote in national elections, in 1893?<\/p>","o":["New Zealand","United Kingdom","United States","Australia"],"a":0,"s":"<p>New Zealand granted women the vote in 1893.<br>Other options: B, C and D — did so later.<\/p>","tag":"4.5 World: International Organisations, World Geography and Notable Firsts"},{"id":"M3.4.18","q":"<p>Who is known as the 'father of the computer' for designing the Analytical Engine?<\/p>","o":["Alan Turing","Charles Babbage","Blaise Pascal","John von Neumann"],"a":1,"s":"<p>Charles Babbage designed the Analytical Engine in the 19th century.<br>Other options: A — pioneer of computing theory; C — built an early mechanical calculator; D — proposed the stored-program architecture.<\/p>","tag":"4.6 Science and Technology, Sports, Awards and Books"},{"id":"M3.4.19","q":"<p>Which substances are mainly responsible for the depletion of the ozone layer?<\/p>","o":["Carbon dioxide","Methane","Chlorofluorocarbons (CFCs)","Nitrogen"],"a":2,"s":"<p>CFCs release chlorine in the stratosphere, which destroys ozone; they are controlled by the Montreal Protocol.<br>Other options: A and B — greenhouse gases linked to warming, not mainly to ozone loss; D — the main inert gas of the atmosphere.<\/p>","tag":"4.6 Science and Technology, Sports, Awards and Books"},{"id":"M3.4.20","q":"<p>Which team won the first ICC Men's Cricket World Cup in 1975?<\/p>","o":["Australia","England","India","West Indies"],"a":3,"s":"<p>West Indies beat Australia in the 1975 final at Lord's.<br>Other options: A — runner-up in 1975; B — host; C — first won in 1983.<\/p>","tag":"4.6 Science and Technology, Sports, Awards and Books"}]},{"t":"Section 5 · Business and Economics (20)","items":[{"id":"M3.5.1","q":"<p>Planning premises are<\/p>","o":["the objectives of the organisation","assumptions about the future environment on which plans are based","the policies of the organisation","budgets expressed in numbers for each department over the coming year"],"a":1,"s":"<p>Premises are the forecasts and assumptions (about demand, prices, policy, etc.) within which plans are made.<br>Other options: A, C and D — types of plans, not premises.<\/p>","tag":"5.1 Principles of Management"},{"id":"M3.5.2","q":"<p>An informal organisation<\/p>","o":["is shown on the organisation chart","is created deliberately by management","is based on written rules and procedures laid down by top management for every position","arises from personal and social relations among members"],"a":3,"s":"<p>Informal organisation grows spontaneously from friendships and social interaction.<br>Other options: A, B and C — features of the formal organisation.<\/p>","tag":"5.1 Principles of Management"},{"id":"M3.5.3","q":"<p>In management, 'authority' means<\/p>","o":["the right to give orders and expect them to be obeyed","the obligation of a subordinate to perform the duties assigned by a superior","answerability for results","influence that comes only from expertise"],"a":0,"s":"<p>Fayol defined authority as the right to give orders and the power to exact obedience.<br>Other options: B — responsibility; C — accountability; D — expert power, a form of influence rather than formal authority.<\/p>","tag":"5.1 Principles of Management"},{"id":"M3.5.4","q":"<p>Which control technique compares actual results with figures planned in money terms for each department?<\/p>","o":["Gantt chart","PERT","Budgetary control","Comprehensive management audit"],"a":2,"s":"<p>Budgetary control compares actual performance with budgets and investigates variances.<br>Other options: A and B — scheduling tools; D — an appraisal of the management process as a whole.<\/p>","tag":"5.1 Principles of Management"},{"id":"M3.5.5","q":"<p>Which of the following is best described as a 'specialty product'?<\/p>","o":["Bread","A designer luxury watch","Life insurance","Salt"],"a":1,"s":"<p>Specialty products have unique features or brand identity for which buyers make a special effort.<br>Other options: A and D — convenience products; C — usually classed as an unsought product.<\/p>","tag":"5.2 Marketing"},{"id":"M3.5.6","q":"<p>A 'pull' promotion strategy means<\/p>","o":["pushing the product through intermediaries using trade promotions","selling only online","promoting to final consumers so that they ask intermediaries for the product","cutting prices below cost"],"a":2,"s":"<p>In a pull strategy, advertising and consumer promotion create demand that \"pulls\" the product through the channel.<br>Other options: A — push strategy; B and D — not promotion strategies.<\/p>","tag":"5.2 Marketing"},{"id":"M3.5.7","q":"<p>Packaging and labelling decisions belong mainly to which element of the marketing mix?<\/p>","o":["Product","Price","Place","Promotion"],"a":0,"s":"<p>Packaging and labelling are part of product decisions.<br>Other options: B, C and D — other elements of the mix (packaging can support promotion, but it is classed under product).<\/p>","tag":"5.2 Marketing"},{"id":"M3.5.8","q":"<p>Goods worth Rs 20,000 are purchased on credit. What is the effect on the accounting equation?<\/p>","o":["Assets and capital both increase by Rs 20,000","Assets decrease and liabilities increase by Rs 20,000","There is no effect","Assets and liabilities both increase by Rs 20,000"],"a":3,"s":"<p>Stock (an asset) rises by Rs 20,000 and creditors (a liability) rise by Rs 20,000.<br>Other options: A — capital is unaffected; B — assets increase, not decrease; C — both sides change.<\/p>","tag":"5.3 Accounting and Finance Basics"},{"id":"M3.5.9","q":"<p>A firm's credit sales are Rs 6,00,000 and its average debtors are Rs 1,00,000. Taking a 360-day year, what is the average collection period?<\/p>","o":["60 days","6 days","36 days","90 days"],"a":0,"s":"<p>Debtors turnover = 6,00,000 ÷ 1,00,000 = 6 times. Collection period = 360 ÷ 6 = 60 days.<br>Other options: B — the turnover ratio, not days; C and D — no basis.<\/p>","tag":"5.3 Accounting and Finance Basics"},{"id":"M3.5.10","q":"<p>Which financial statement shows inflows and outflows of cash classified into operating, investing and financing activities?<\/p>","o":["Income statement","Cash flow statement","Balance sheet","Statement of retained earnings"],"a":1,"s":"<p>The cash flow statement classifies cash flows into operating, investing and financing activities.<br>Other options: A — shows revenue, expenses and profit; C — shows financial position at a date; D — shows changes in retained profits.<\/p>","tag":"5.3 Accounting and Finance Basics"},{"id":"M3.5.11","q":"<p>Rs 1,000 is deposited at the end of each year for 3 years at 10% per annum compound interest. What is the amount at the end of the third year?<\/p>","o":["Rs 3,300","Rs 3,000","Rs 3,310","Rs 3,641"],"a":2,"s":"<p>FV = 1,000 × 1.1² + 1,000 × 1.1 + 1,000 = 1,210 + 1,100 + 1,000 = Rs 3,310.<br>Other options: A — simple interest on part of the deposits; B — ignores interest; D — treats deposits as made at the start of each year (annuity due).<\/p>","tag":"5.3 Accounting and Finance Basics"},{"id":"M3.5.12","q":"<p>A market with only one buyer is called<\/p>","o":["monopoly","oligopoly","duopoly","monopsony"],"a":3,"s":"<p>Monopsony means a single buyer.<br>Other options: A — single seller; B — few sellers; C — two sellers.<\/p>","tag":"5.4 Microeconomics"},{"id":"M3.5.13","q":"<p>Opportunity cost is<\/p>","o":["the money paid for a good","the value of the next best alternative given up","the cost of all inputs used","the additional cost of producing one more unit of output"],"a":1,"s":"<p>Opportunity cost is the benefit forgone from the next best alternative.<br>Other options: A — the price or explicit cost; C — total cost; D — marginal cost.<\/p>","tag":"5.4 Microeconomics"},{"id":"M3.5.14","q":"<p>Along a straight-line downward-sloping demand curve, total revenue is maximum where the price elasticity of demand is<\/p>","o":["0","infinite","1 (unit elastic)","greater than 1"],"a":2,"s":"<p>TR rises with a price cut while demand is elastic and falls when it is inelastic, so it peaks where elasticity = 1 (MR = 0).<br>Other options: A and B — the ends of the line; D — the upper part, where TR is still rising as price falls.<\/p>","tag":"5.4 Microeconomics"},{"id":"M3.5.15","q":"<p>Which of the following is NOT a function of a commercial bank?<\/p>","o":["Issuing currency notes","Accepting deposits from the public","Giving loans","Remitting funds"],"a":0,"s":"<p>Only the central bank (Nepal Rastra Bank) issues currency notes.<br>Other options: B, C and D — normal functions of commercial banks.<\/p>","tag":"5.5 Macroeconomics, Money and Banking"},{"id":"M3.5.16","q":"<p>A situation in which prices rise extremely fast, for example doubling within a few months, is called<\/p>","o":["creeping inflation","stagflation","deflation","hyperinflation"],"a":3,"s":"<p>Hyperinflation is very rapid, out-of-control inflation.<br>Other options: A — slow, mild inflation; B — inflation with stagnation and unemployment; C — falling prices.<\/p>","tag":"5.5 Macroeconomics, Money and Banking"},{"id":"M3.5.17","q":"<p>'The General Theory of Employment, Interest and Money' (1936), the founding work of modern macroeconomics, was written by<\/p>","o":["Adam Smith","J. M. Keynes","Milton Friedman","Alfred Marshall"],"a":1,"s":"<p>John Maynard Keynes wrote The General Theory in 1936.<br>Other options: A — The Wealth of Nations (1776); C — leading monetarist; D — Principles of Economics (1890).<\/p>","tag":"5.5 Macroeconomics, Money and Banking"},{"id":"M3.5.18","q":"<p>The process of introducing a newly appointed employee to the organisation, its people and its rules is called<\/p>","o":["recruitment","selection","induction (orientation)","placement"],"a":2,"s":"<p>Induction familiarises new employees with the organisation.<br>Other options: A — attracting applicants; B — choosing among applicants; D — assigning the selected person to a job.<\/p>","tag":"5.6 Business Environment, Entrepreneurship, HRM and Organisational Behaviour"},{"id":"M3.5.19","q":"<p>A company that has its headquarters in one country and operates production or service facilities in several other countries is a<\/p>","o":["sole proprietorship","cooperative","state-owned public enterprise","multinational corporation"],"a":3,"s":"<p>This is the definition of a multinational corporation (MNC).<br>Other options: A — owned by one person; B — owned by members for mutual benefit; C — owned by the government.<\/p>","tag":"5.6 Business Environment, Entrepreneurship, HRM and Organisational Behaviour"},{"id":"M3.5.20","q":"<p>'Whistle-blowing' in business ethics refers to<\/p>","o":["an employee reporting wrongdoing in the organisation to people who can act on it","a manager announcing the end of a shift","a firm advertising aggressively","a union calling a strike"],"a":0,"s":"<p>A whistle-blower exposes illegal or unethical practices within an organisation.<br>Other options: B — a literal reading; C and D — unrelated.<\/p>","tag":"5.6 Business Environment, Entrepreneurship, HRM and Organisational Behaviour"}]}]}]};
const B = DATA.bank, L = 'ABCDE';
const store = {
  get(k){ try{ const v = localStorage.getItem(B.key+':'+k); return v===null?null:+v }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(B.key+':'+k, v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(B.key+':'+k) }catch(e){} }
};
const mem = {};
const pick = id => (id in mem) ? mem[id] : store.get(id);
const $ = s => document.querySelector(s);
const qsOf = items => items.filter(x => x.id);

const sel = $('#set');
const og1 = document.createElement('optgroup'); og1.label = 'Chapters';
DATA.ch.forEach(c => og1.append(new Option(`Chapter ${c.n} · ${c.t} (${c.subs.reduce((a,b)=>a+qsOf(b.items).length,0)})`, 'ch'+c.n)));
const og2 = document.createElement('optgroup'); og2.label = `Mock exams (${B.mockInfo})`;
DATA.mock.forEach(m => og2.append(new Option(`Mock exam ${m.m}`, 'mock'+m.m)));
sel.append(og1, og2);

let cur = null;
function route(){
  const h = location.hash.slice(1);
  let m = h.match(/^ch(\d+)-(\d)$/), k = h.match(/^mock(\d)$/);
  if (k && DATA.mock[k[1]-1]) return show('mock', +k[1]);
  if (!m || !DATA.ch[m[1]-1] || !DATA.ch[m[1]-1].subs[m[2]-1]) m = [0, 1, 1];
  show('ch', +m[1], +m[2]);
}
function go(h){ if (location.hash !== '#'+h) location.hash = h; else route(); }
sel.onchange = () => go(sel.value.startsWith('ch') ? sel.value+'-1' : sel.value);
window.addEventListener('hashchange', route);

function render(list, items, num){
  const out = [];
  items.forEach(x => {
    if ('p' in x) { const d = document.createElement('div'); d.className = 'passage'; d.innerHTML = x.p; list.append(d); return; }
    out.push(x); list.append(card(x, num ? 'Q'+num() : 'Q'+x.id));
  });
  return out;
}
function show(kind, n, s){
  const list = $('#list'), subs = $('#subs'); list.innerHTML = ''; subs.innerHTML = '';
  if (kind === 'ch'){
    const c = DATA.ch[n-1]; sel.value = 'ch'+n; subs.hidden = false;
    c.subs.forEach((b, i) => {
      const bt = document.createElement('button'); bt.textContent = `${b.k} ${b.t}`; bt.setAttribute('role','tab');
      bt.setAttribute('aria-current', String(i+1 === s)); bt.onclick = () => go(`ch${n}-${i+1}`); subs.append(bt);
    });
    const b = c.subs[s-1];
    list.insertAdjacentHTML('beforeend', `<p class="intro">Chapter ${c.n} · <b>${b.k} ${esc(b.t)}</b> · ${qsOf(b.items).length} questions. Tick an option to check it.</p>`);
    cur = {kind, qs: render(list, b.items), label: `${b.k} block`};
    const ac = subs.children[s-1]; ac && ac.scrollIntoView({block:'nearest', inline:'nearest'});
  } else {
    const m = DATA.mock[n-1]; sel.value = 'mock'+n; subs.hidden = true;
    list.insertAdjacentHTML('beforeend', `<p class="intro">Mock exam ${m.m}: ${B.mockIntro}</p>`);
    let k = 0, all = [];
    m.secs.forEach(sec => {
      const cnt = qsOf(sec.items).length;
      list.insertAdjacentHTML('beforeend', `<h2>${esc(sec.t)} · Q${k+1}–${k+cnt}</h2>`);
      all.push(...render(list, sec.items, () => ++k));
    });
    list.insertAdjacentHTML('beforeend', '<div class="result" id="result"></div>');
    cur = {kind, qs: all, label: 'mock exam'};
  }
  score(); window.scrollTo(0, 0);
}
function esc(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function card(q, label){
  const el = document.createElement('article'); el.className = 'card'; el.id = 'q-'+q.id;
  el.innerHTML = `<div class="meta"><span class="id">${label}</span><span>1 mark</span>${q.tag?`<span class="chip">${esc(q.tag)}</span>`:''}</div>
    <div class="stem">${q.q}</div>
    <div class="opts" role="group" aria-label="Options for ${label}">${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="box" aria-hidden="true"></span><span class="t"><span class="l">${L[i]}.</span>${o}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => { mem[q.id] = +b.dataset.i; store.set(q.id, b.dataset.i); paint(el, q); score(); });
  paint(el, q); return el;
}
function paint(el, q){
  const p = pick(q.id), btns = el.querySelectorAll('.opt'), old = el.querySelector('.fb'); old && old.remove();
  btns.forEach(b => { b.className = 'opt'; b.disabled = p !== null; b.querySelector('.box').textContent = ''; b.removeAttribute('aria-label'); });
  el.classList.toggle('done', p !== null);
  if (p === null) return;
  const right = btns[q.a]; right.classList.add('right'); right.querySelector('.box').textContent = '✓';
  const ans = `${L[q.a]}. ${q.o[q.a]}`;
  const fb = document.createElement('div');
  if (p === q.a){
    right.setAttribute('aria-label', 'Your answer, correct');
    fb.className = 'fb ok';
    fb.innerHTML = `<div class="h">✓ Correct</div><details><summary>Show explanation</summary>${q.s}</details>`;
  } else {
    const w = btns[p]; w.classList.add('wrong'); w.querySelector('.box').textContent = '✗'; w.setAttribute('aria-label', 'Your answer, wrong');
    fb.className = 'fb bad';
    fb.innerHTML = `<div class="h">✗ Wrong. Correct answer: ${ans}</div>${q.s}`;
  }
  el.append(fb);
}
function score(){
  const qs = cur.qs, n = qs.length; let a = 0, c = 0;
  qs.forEach(q => { const p = pick(q.id); if (p !== null){ a++; if (p === q.a) c++; } });
  const w = a - c, net = c - B.neg * w, pct = a ? Math.round(c*100/a) : 0;
  $('#score').innerHTML = `<span>Answered <b>${a}/${n}</b></span><span>Correct <b>${c}</b> · Wrong <b>${w}</b></span>${B.neg ? `<span>Net <b>${net.toFixed(2)}</b> (−${B.neg} per wrong)</span>` : ''}<span>Accuracy <b>${a?pct+'%':'–'}</b></span>
    <span class="bar" aria-hidden="true"><i class="c" style="width:${c*100/n}%"></i><i class="w" style="width:${w*100/n}%"></i></span>
    <button class="reset" id="reset" type="button">Reset this ${cur.label}</button>`;
  const r = $('#reset'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.classList.add('arm'); r.textContent = 'Tap again to clear your answers'; setTimeout(()=>{ if (armed){ armed=false; r.classList.remove('arm'); r.textContent=`Reset this ${cur.label}`; } }, 3500); return; }
    qs.forEach(q => { delete mem[q.id]; store.del(q.id); });
    document.querySelectorAll('.card').forEach(el => { const q = qs.find(x => 'q-'+x.id === el.id); q && paint(el, q); });
    score();
  };
  const res = $('#result');
  if (res){
    const good = net >= 0.6 * n;
    res.innerHTML = `Result${a < n ? ' so far' : ''}: <b class="${good?'pass':'fail'}">${B.neg ? net.toFixed(2) : c}/${n}</b> (${c} correct, ${w} wrong, ${n-a} blank). `
      + (B.neg ? `A blank costs nothing and a wrong answer costs ${B.neg}, so skip pure guesses. ` : 'No negative marking is assumed, so answer every question. ')
      + (a < n ? '' : good ? 'A strong score. ' : 'Aim for 60%+: revise the topics named in the wrong answers. ')
      + 'No official cut-off is published; admission is by merit rank.';
  }
}
route();
</script>
</body></html>
