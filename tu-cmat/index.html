 excise.<br>Other options: A — collects customs duties at the border; C — audits public accounts; D — manages government accounting and payments.<\/p>","tag":""},{"id":"4.4.25","q":"<p>The term of office of the Auditor General of Nepal is<\/p>","o":["six years","five years","four years","until the age of 70"],"a":0,"s":"<p>The Auditor General is appointed by the President on the Constitutional Council's recommendation for a six-year term (Article 240).<br>Other options: B — the term is six years; C — the term is six years; D — the term is a fixed six years.<\/p>","tag":""},{"id":"4.4.26","q":"<p>Nepal's National Population and Housing Census 2021 was conducted by the<\/p>","o":["Nepal Rastra Bank","Election Commission","Central Bureau of Statistics (now the National Statistics Office)","Ministry of Home Affairs"],"a":2,"s":"<p>The Central Bureau of Statistics conducted the 2021 census; it was later renamed the National Statistics Office.<br>Other options: A — conducts banking surveys, not the census; B — maintains the voter roll, not the census; D — not the census agency.<\/p>","tag":""},{"id":"4.4.27","q":"<p>The central office of Nepal Rastra Bank is located at<\/p>","o":["Singha Durbar, Kathmandu","Thapathali, Kathmandu","Baluwatar, Kathmandu","Pulchowk, Lalitpur"],"a":2,"s":"<p>NRB's central office is at Baluwatar, Kathmandu.<br>Other options: A — the main government secretariat; B — not the NRB central office; D — not the NRB central office.<\/p>","tag":""},{"id":"4.4.28","q":"<p>Dematerialised (demat) shares in Nepal are held and settled through<\/p>","o":["Nepal Clearing House Limited","Securities Board of Nepal","Nepal Rastra Bank","CDS and Clearing Limited"],"a":3,"s":"<p>CDS and Clearing Limited (CDSC), a subsidiary of NEPSE, is Nepal's central depository for demat securities and clearing.<br>Other options: A — it clears interbank payments and cheques, not shares; B — the regulator, not the depository; C — the central bank, not the securities depository.<\/p>","tag":""},{"id":"4.4.29","q":"<p>The long-term national aspiration adopted in the Fifteenth Plan is<\/p>","o":["Digital Nepal, Smart Nepal","Prosperous Nepal, Happy Nepali","Clean Nepal, Green Nepal","Garibi Hatao"],"a":1,"s":"<p>The Fifteenth Plan set the long-term vision 'Samriddha Nepal, Sukhi Nepali' (Prosperous Nepal, Happy Nepali).<br>Other options: A — not the long-term aspiration of the Fifteenth Plan; C — an environmental slogan, not the national aspiration; D — an Indian political slogan.<\/p>","tag":""},{"id":"4.4.30","q":"<p>Which body regulates the insurance business in Nepal?<\/p>","o":["Nepal Insurance Authority (formerly Beema Samiti)","Securities Board of Nepal","Nepal Rastra Bank","Ministry of Finance directly"],"a":0,"s":"<p>Under the Insurance Act 2079 (2022), the Beema Samiti became the Nepal Insurance Authority, the regulator of insurance companies.<br>Other options: B — regulates the securities market; C — regulates banks and financial institutions; D — the Authority, not the Ministry, regulates insurers.<\/p>","tag":""}]},{"k":"4.5","t":"World: International Organisations, World Geography and Notable Firsts","items":[{"id":"4.5.1","q":"<p>The United Nations came into existence on 24 October 1945, the day<\/p>","o":["the UN Charter was signed in San Francisco","the UN Charter came into force after ratification","the Second World War ended in Europe","the League of Nations was founded"],"a":1,"s":"<p>The Charter was signed in San Francisco on 26 June 1945 and came into force on 24 October 1945, now observed as UN Day.<br>Other options: A — that was on 26 June 1945; C — that was in May 1945; D — the League was founded in 1920.<\/p>","tag":""},{"id":"4.5.2","q":"<p>As of 2026, how many member states does the United Nations have?<\/p>","o":["193","192","195","191"],"a":0,"s":"<p>The UN has 193 member states; South Sudan, admitted in 2011, was the latest. The Holy See and Palestine are non-member observer states.<br>Other options: B — the number before South Sudan joined in 2011; C — counts the two observer states as members; D — an older figure.<\/p>","tag":""},{"id":"4.5.3","q":"<p>How many non-permanent members does the UN Security Council have, and for what term are they elected?<\/p>","o":["5 members, for five-year terms","10 members, for two-year terms","15 members, for two-year terms","10 members, for three-year terms"],"a":1,"s":"<p>The Security Council has 15 members: 5 permanent with veto power (China, France, Russia, UK, USA) and 10 non-permanent members elected by the General Assembly for two-year terms.<br>Other options: A — 5 is the number of permanent members, who have no fixed term; C — 15 is the total membership; D — the term is two years.<\/p>","tag":""},{"id":"4.5.4","q":"<p>Nepal became a member of the United Nations in<\/p>","o":["1955","1945","1949","1961"],"a":0,"s":"<p>Nepal joined the UN on 14 December 1955.<br>Other options: B — the UN was founded then; Nepal was not a founding member; C — Nepal applied in 1949 but was admitted only in 1955; D — not the year Nepal joined.<\/p>","tag":""},{"id":"4.5.5","q":"<p>SAARC was established on 8 December 1985 at its first summit in<\/p>","o":["Kathmandu","New Delhi","Dhaka","Colombo"],"a":2,"s":"<p>The South Asian Association for Regional Cooperation was founded at the Dhaka summit in December 1985.<br>Other options: A — the SAARC Secretariat was set up there in 1987; B — not where SAARC was founded; D — not where SAARC was founded.<\/p>","tag":""},{"id":"4.5.6","q":"<p>The SAARC Secretariat is located in<\/p>","o":["Dhaka","New Delhi","Islamabad","Kathmandu"],"a":3,"s":"<p>The SAARC Secretariat was established in Kathmandu on 16 January 1987.<br>Other options: A — the BIMSTEC Secretariat is in Dhaka; B — not the seat of the Secretariat; C — not the seat of the Secretariat.<\/p>","tag":""},{"id":"4.5.7","q":"<p>Which country joined SAARC in 2007 as its eighth member?<\/p>","o":["Myanmar","Afghanistan","China","Iran"],"a":1,"s":"<p>Afghanistan joined at the 14th summit in New Delhi in April 2007; the other members are Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan and Sri Lanka.<br>Other options: A — a BIMSTEC member, not a SAARC member; C — an observer, not a member; D — an observer, not a member.<\/p>","tag":""},{"id":"4.5.8","q":"<p>Which of the following countries is NOT a member of BIMSTEC?<\/p>","o":["Nepal","Myanmar","Thailand","Pakistan"],"a":3,"s":"<p>BIMSTEC has seven members: Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka and Thailand.<br>Other options: A — a member since 2004; B — a member; C — a founding member (Bangkok Declaration, 1997).<\/p>","tag":""},{"id":"4.5.9","q":"<p>The permanent secretariat of BIMSTEC is in<\/p>","o":["Dhaka","Bangkok","Kathmandu","Colombo"],"a":0,"s":"<p>BIMSTEC's permanent secretariat was opened in Dhaka in 2014.<br>Other options: B — BIMSTEC was founded there in 1997, but the secretariat is in Dhaka; C — the SAARC Secretariat is there; D — not the BIMSTEC secretariat.<\/p>","tag":""},{"id":"4.5.10","q":"<p>The World Trade Organization, set up on 1 January 1995, replaced the<\/p>","o":["United Nations Conference on Trade and Development (UNCTAD)","International Monetary Fund (IMF)","General Agreement on Tariffs and Trade (GATT)","Organisation for Economic Co-operation and Development (OECD)"],"a":2,"s":"<p>The WTO, headquartered in Geneva, replaced GATT (1947) after the Uruguay Round.<br>Other options: A — UNCTAD still exists as a UN body; B — the IMF still exists; D — the OECD still exists.<\/p>","tag":""},{"id":"4.5.11","q":"<p>Nepal became a member of the World Trade Organization in<\/p>","o":["1995","2004","2001","2008"],"a":1,"s":"<p>Nepal joined the WTO on 23 April 2004 as its 147th member.<br>Other options: A — the year the WTO was set up; C — the year China joined; D — not the year Nepal joined.<\/p>","tag":""},{"id":"4.5.12","q":"<p>The International Monetary Fund and the World Bank were created at which conference in 1944?<\/p>","o":["Bretton Woods Conference","Yalta Conference","San Francisco Conference","Potsdam Conference"],"a":0,"s":"<p>The UN Monetary and Financial Conference at Bretton Woods, New Hampshire (July 1944) created the IMF and the IBRD (World Bank).<br>Other options: B — a 1945 meeting of Allied leaders on post-war Europe; C — drafted the UN Charter in 1945; D — a 1945 meeting on post-war Germany.<\/p>","tag":""},{"id":"4.5.13","q":"<p>The headquarters of the International Monetary Fund is in<\/p>","o":["New York","Geneva","Paris","Washington, D.C."],"a":3,"s":"<p>Both the IMF and the World Bank have their headquarters in Washington, D.C.<br>Other options: A — the UN headquarters is there; B — the WTO and WHO are there; C — the OECD and UNESCO are there.<\/p>","tag":""},{"id":"4.5.14","q":"<p>The Asian Development Bank, of which Nepal is a founding member, was established in 1966 with its headquarters in<\/p>","o":["Tokyo","Bangkok","Manila","Beijing"],"a":2,"s":"<p>ADB was set up in 1966 with headquarters in Manila (Mandaluyong, Metro Manila), Philippines.<br>Other options: A — Japan is a major shareholder, but the HQ is in Manila; B — not ADB's headquarters; D — the AIIB's headquarters.<\/p>","tag":""},{"id":"4.5.15","q":"<p>Which organisation–headquarters pair is correct?<\/p>","o":["UNESCO – Geneva","FAO – Vienna","WHO – New York","UNEP – Nairobi"],"a":3,"s":"<p>The UN Environment Programme is headquartered in Nairobi. UNESCO is in Paris, FAO in Rome and WHO in Geneva.<br>Other options: A — UNESCO is in Paris; B — FAO is in Rome; C — WHO is in Geneva.<\/p>","tag":""},{"id":"4.5.16","q":"<p>Which of these organisations has its headquarters in Brussels?<\/p>","o":["OPEC","ASEAN","NATO","African Union"],"a":2,"s":"<p>NATO (founded 1949) is headquartered in Brussels, which also hosts the main EU institutions.<br>Other options: A — headquartered in Vienna; B — secretariat in Jakarta; D — headquartered in Addis Ababa.<\/p>","tag":""},{"id":"4.5.17","q":"<p>Who was the first Secretary-General of the United Nations?<\/p>","o":["Dag Hammarskjöld","U Thant","Kofi Annan","Trygve Lie"],"a":3,"s":"<p>Trygve Lie of Norway served as the first UN Secretary-General from 1946 to 1952.<br>Other options: A — the second Secretary-General; B — the third Secretary-General; C — the seventh Secretary-General.<\/p>","tag":""},{"id":"4.5.18","q":"<p>The largest and deepest ocean in the world is the<\/p>","o":["Atlantic Ocean","Indian Ocean","Pacific Ocean","Southern Ocean"],"a":2,"s":"<p>The Pacific covers about a third of the earth's surface and contains the deepest point, the Challenger Deep.<br>Other options: A — second largest; B — third largest; D — much smaller.<\/p>","tag":""},{"id":"4.5.19","q":"<p>The smallest country in the world by area is<\/p>","o":["Monaco","Vatican City","San Marino","Maldives"],"a":1,"s":"<p>Vatican City (about 0.44 sq km), an enclave in Rome, is the smallest sovereign state.<br>Other options: A — the second smallest; C — larger than both Vatican City and Monaco; D — the smallest country in Asia, not in the world.<\/p>","tag":""},{"id":"4.5.20","q":"<p>The Panama Canal connects the<\/p>","o":["Atlantic and Pacific Oceans","Mediterranean Sea and Red Sea","Atlantic Ocean and Mediterranean Sea","Pacific and Indian Oceans"],"a":0,"s":"<p>The Panama Canal, opened in 1914, links the Atlantic (Caribbean Sea) with the Pacific across the Isthmus of Panama.<br>Other options: B — the Suez Canal does this; C — linked by the Strait of Gibraltar; D — not linked by the Panama Canal.<\/p>","tag":""},{"id":"4.5.21","q":"<p>The deepest known point in the world's oceans, the Challenger Deep, lies in the<\/p>","o":["Puerto Rico Trench","Java (Sunda) Trench","Mariana Trench","Tonga Trench"],"a":2,"s":"<p>The Challenger Deep in the Mariana Trench (western Pacific) is nearly 11,000 m deep.<br>Other options: A — the deepest point of the Atlantic; B — the deepest point of the Indian Ocean; D — deep, but not as deep as the Mariana Trench.<\/p>","tag":""},{"id":"4.5.22","q":"<p>The world's highest uninterrupted waterfall, Angel Falls, is in<\/p>","o":["Venezuela","Brazil","Zambia/Zimbabwe","Canada/USA"],"a":0,"s":"<p>Angel Falls (about 979 m) is in Canaima National Park, Venezuela.<br>Other options: B — has the Iguazu Falls (shared with Argentina); C — have the Victoria Falls; D — have the Niagara Falls.<\/p>","tag":""},{"id":"4.5.23","q":"<p>The largest hot desert in the world is the<\/p>","o":["Sahara","Gobi","Thar","Kalahari"],"a":0,"s":"<p>The Sahara in North Africa is the largest hot desert (Antarctica is the largest desert overall, but it is cold).<br>Other options: B — a cold desert in Mongolia and China; C — in India and Pakistan, much smaller; D — in southern Africa, much smaller.<\/p>","tag":""},{"id":"4.5.24","q":"<p>Who was the first human to travel into space, in April 1961?<\/p>","o":["Neil Armstrong","Yuri Gagarin","Valentina Tereshkova","Alan Shepard"],"a":1,"s":"<p>Yuri Gagarin of the Soviet Union orbited the earth in Vostok 1 on 12 April 1961.<br>Other options: A — the first person to walk on the Moon (1969); C — the first woman in space (1963); D — the first American in space (May 1961).<\/p>","tag":""},{"id":"4.5.25","q":"<p>The first woman to climb Mount Everest (1975) was<\/p>","o":["Junko Tabei","Pasang Lhamu Sherpa","Wanda Rutkiewicz","Bachendri Pal"],"a":0,"s":"<p>Junko Tabei of Japan reached the summit on 16 May 1975.<br>Other options: B — the first Nepali woman to climb Everest (1993); C — the first European woman to climb Everest (1978); D — the first Indian woman to climb Everest (1984).<\/p>","tag":""},{"id":"4.5.26","q":"<p>The Paris Agreement on climate change was adopted in 2015 at<\/p>","o":["COP3","COP21","COP15","COP26"],"a":1,"s":"<p>The Paris Agreement was adopted at the 21st Conference of the Parties (COP21) to the UNFCCC in December 2015.<br>Other options: A — adopted the Kyoto Protocol in 1997; C — the Copenhagen summit of 2009; D — the Glasgow summit of 2021.<\/p>","tag":""},{"id":"4.5.27","q":"<p>The Montreal Protocol (1987) is an international agreement to<\/p>","o":["cut greenhouse gas emissions","phase out ozone-depleting substances","protect wetlands of international importance","control international trade in endangered species"],"a":1,"s":"<p>The Montreal Protocol controls chlorofluorocarbons (CFCs) and other substances that deplete the ozone layer.<br>Other options: A — the aim of the Kyoto Protocol and Paris Agreement; C — the aim of the Ramsar Convention; D — the aim of CITES.<\/p>","tag":""},{"id":"4.5.28","q":"<p>The ASEAN Secretariat is located in<\/p>","o":["Bangkok","Singapore","Manila","Jakarta"],"a":3,"s":"<p>ASEAN was founded in Bangkok in 1967; its Secretariat is in Jakarta, Indonesia.<br>Other options: A — ASEAN was founded there, but the Secretariat is in Jakarta; B — not the Secretariat's seat; C — the ADB headquarters.<\/p>","tag":""},{"id":"4.5.29","q":"<p>The Asian Infrastructure Investment Bank (AIIB), which began operations in 2016, is headquartered in<\/p>","o":["Shanghai","Manila","Beijing","Singapore"],"a":2,"s":"<p>AIIB is headquartered in Beijing; Nepal is a founding member.<br>Other options: A — the headquarters of the BRICS New Development Bank; B — the ADB headquarters; D — not the AIIB headquarters.<\/p>","tag":""},{"id":"4.5.30","q":"<p>The International Court of Justice, the principal judicial organ of the UN, sits at<\/p>","o":["Geneva","New York","Vienna","The Hague"],"a":3,"s":"<p>The ICJ sits in the Peace Palace at The Hague, Netherlands; it is the only principal UN organ not based in New York.<br>Other options: A — home of many UN agencies, but not the ICJ; B — the UN headquarters; the ICJ is not there; C — home of the IAEA and UNODC, not the ICJ.<\/p>","tag":""}]},{"k":"4.6","t":"Science and Technology, Sports, Awards and Books","items":[{"id":"4.6.1","q":"<p>NepaliSat-1, Nepal's first satellite, built under Japan's BIRDS project, was launched in<\/p>","o":["April 2019","September 2015","December 2017","January 2022"],"a":0,"s":"<p>NepaliSat-1 was launched on 17–18 April 2019 to the International Space Station and released into orbit in June 2019; it was developed by Nepali scientists with the Nepal Academy of Science and Technology.<br>Other options: B — Nepal had no satellite then; C — Nepal had no satellite then; D — NepaliSat-1 had already re-entered the atmosphere in 2021.<\/p>","tag":""},{"id":"4.6.2","q":"<p>Penicillin, the first widely used antibiotic, was discovered in 1928 by<\/p>","o":["Louis Pasteur","Edward Jenner","Robert Koch","Alexander Fleming"],"a":3,"s":"<p>Alexander Fleming noticed in 1928 that Penicillium mould killed bacteria.<br>Other options: A — known for pasteurisation and the rabies vaccine; B — developed the smallpox vaccine; C — identified the bacteria causing tuberculosis and cholera.<\/p>","tag":""},{"id":"4.6.3","q":"<p>The SI unit of force is the<\/p>","o":["joule","watt","pascal","newton"],"a":3,"s":"<p>One newton is the force that gives a 1 kg mass an acceleration of 1 m/s².<br>Other options: A — the unit of work and energy; B — the unit of power; C — the unit of pressure.<\/p>","tag":""},{"id":"4.6.4","q":"<p>Scurvy is caused by a deficiency of<\/p>","o":["vitamin A","vitamin D","vitamin C","vitamin B1"],"a":2,"s":"<p>Vitamin C (ascorbic acid) deficiency causes scurvy, with bleeding gums and poor wound healing.<br>Other options: A — deficiency causes night blindness; B — deficiency causes rickets; D — deficiency causes beriberi.<\/p>","tag":""},{"id":"4.6.5","q":"<p>The double-helix model of DNA was proposed in 1953 by<\/p>","o":["Gregor Mendel","Charles Darwin and Alfred Russel Wallace","James Watson and Francis Crick","Alfred Hershey and Martha Chase"],"a":2,"s":"<p>Watson and Crick published the double-helix structure in 1953, using X-ray data from Rosalind Franklin and Maurice Wilkins.<br>Other options: A — founded genetics with his pea experiments in the 1860s; B — proposed evolution by natural selection; D — showed in 1952 that DNA is the genetic material, but did not propose its structure.<\/p>","tag":""},{"id":"4.6.6","q":"<p>The World Wide Web was invented in 1989 at CERN by<\/p>","o":["Tim Berners-Lee","Vint Cerf","Charles Babbage","Bill Gates"],"a":0,"s":"<p>Tim Berners-Lee proposed the World Wide Web (HTTP, HTML and URLs) at CERN in 1989.<br>Other options: B — co-designed the TCP/IP protocols of the internet; C — designed the Analytical Engine in the 19th century; D — co-founded Microsoft.<\/p>","tag":""},{"id":"4.6.7","q":"<p>In the binary convention traditionally used in computing, one kilobyte equals<\/p>","o":["1,000 bits","1,024 bytes","1,024 bits","8 bytes"],"a":1,"s":"<p>1 KB = 2¹⁰ = 1,024 bytes; each byte has 8 bits.<br>Other options: A — mixes bits and bytes; C — the unit is bytes, not bits; D — 8 is the number of bits in one byte.<\/p>","tag":""},{"id":"4.6.8","q":"<p>The speed of light in a vacuum is approximately<\/p>","o":["3 × 10⁸ m/s","3 × 10⁵ m/s","340 m/s","3 × 10⁶ m/s"],"a":0,"s":"<p>Light travels at about 300,000 km/s, i.e. 3 × 10⁸ m/s.<br>Other options: B — this is the value in km/s written wrongly as m/s; C — the approximate speed of sound in air; D — too small by a factor of 100.<\/p>","tag":""},{"id":"4.6.9","q":"<p>The most abundant gas in the earth's atmosphere is<\/p>","o":["oxygen","argon","nitrogen","carbon dioxide"],"a":2,"s":"<p>Dry air is about 78 per cent nitrogen, 21 per cent oxygen and about 1 per cent argon.<br>Other options: A — about 21 per cent; B — about 1 per cent; D — only about 0.04 per cent.<\/p>","tag":""},{"id":"4.6.10","q":"<p>Which blood group is known as the universal donor for red blood cells?<\/p>","o":["AB positive","A positive","O negative","B negative"],"a":2,"s":"<p>O negative red cells carry no A, B or Rh(D) antigens, so they can be given to patients of any group in emergencies.<br>Other options: A — the universal recipient; B — cannot be given to group B or O patients; D — cannot be given to group A or O patients.<\/p>","tag":""},{"id":"4.6.11","q":"<p>In 2017 the Government of Nepal declared which game as the national sport?<\/p>","o":["Volleyball","Dandi Biyo","Football","Cricket"],"a":0,"s":"<p>A cabinet decision in May 2017 declared volleyball Nepal's national sport because it is cheap and played across the country.<br>Other options: B — a traditional game long regarded informally as the national game; C — popular, but not the declared national sport; D — popular, but not the declared national sport.<\/p>","tag":""},{"id":"4.6.12","q":"<p>Nepal gained One Day International (ODI) status in cricket in<\/p>","o":["2018","2014","2010","2023"],"a":0,"s":"<p>Nepal earned ODI status on 15 March 2018 at the ICC World Cup Qualifier in Zimbabwe.<br>Other options: B — the year Nepal played its first ICC World T20; C — Nepal did not have ODI status then; D — Nepal already had ODI status.<\/p>","tag":""},{"id":"4.6.13","q":"<p>Nepal made its first appearance at the ICC Men's T20 World Cup in<\/p>","o":["2016, in India","2010, in the West Indies","2024, in the West Indies and USA","2014, in Bangladesh"],"a":3,"s":"<p>Nepal's first T20 World Cup was the 2014 edition in Bangladesh, where they beat Hong Kong and Afghanistan.<br>Other options: A — Nepal did not qualify for 2016; B — Nepal did not take part in 2010; C — Nepal played in 2024, but it was not their first appearance.<\/p>","tag":""},{"id":"4.6.14","q":"<p>At the 2023 Asian Games in Hangzhou, Dipendra Singh Airee broke Yuvraj Singh's record for the fastest T20 International fifty. How many balls did he take?<\/p>","o":["12","10","15","9"],"a":3,"s":"<p>Airee reached fifty off 9 balls against Mongolia, beating Yuvraj Singh's 12-ball fifty (2007).<br>Other options: A — Yuvraj Singh's earlier record; B — not the number of balls; C — not the number of balls.<\/p>","tag":""},{"id":"4.6.15","q":"<p>Nepal first took part in the Olympic Games in<\/p>","o":["1960 at Rome","1964 at Tokyo","1972 at Munich","1988 at Seoul"],"a":1,"s":"<p>Nepal made its Olympic debut at the 1964 Tokyo Summer Olympics.<br>Other options: A — Nepal did not take part in 1960; C — Nepal had already debuted; D — Nepal had already debuted; this was the Games of Bidhan Lama's bronze.<\/p>","tag":""},{"id":"4.6.16","q":"<p>Bidhan Lama won a bronze medal for Nepal at the 1988 Seoul Olympics, where it was a demonstration sport, in<\/p>","o":["boxing","judo","karate","taekwondo"],"a":3,"s":"<p>Bidhan Lama won bronze in taekwondo, then a demonstration sport, at Seoul 1988.<br>Other options: A — not Bidhan Lama's sport; B — not Bidhan Lama's sport; C — not Bidhan Lama's sport.<\/p>","tag":""},{"id":"4.6.17","q":"<p>The first modern Olympic Games were held in<\/p>","o":["Paris in 1900","Athens in 1896","London in 1896","Athens in 1900"],"a":1,"s":"<p>Revived by Pierre de Coubertin, the first modern Olympics were held in Athens in 1896.<br>Other options: A — the second modern Olympics; C — wrong host city; D — wrong year.<\/p>","tag":""},{"id":"4.6.18","q":"<p>The first FIFA World Cup in football was held in 1930 in<\/p>","o":["Brazil","Uruguay","Italy","France"],"a":1,"s":"<p>Uruguay hosted and won the first FIFA World Cup in 1930.<br>Other options: A — first hosted in 1950; C — hosted the second World Cup in 1934; D — hosted the third World Cup in 1938.<\/p>","tag":""},{"id":"4.6.19","q":"<p>Tenzing Norgay Sherpa and Edmund Hillary first reached the summit of Mount Everest on<\/p>","o":["29 May 1953","29 May 1952","16 May 1975","22 April 1993"],"a":0,"s":"<p>The first ascent was on 29 May 1953, by the British expedition led by John Hunt.<br>Other options: B — a Swiss expedition reached high on the mountain in 1952, but did not summit; C — the date Junko Tabei summited; D — the date Pasang Lhamu Sherpa summited.<\/p>","tag":""},{"id":"4.6.20","q":"<p>The first Nepali woman to climb Mount Everest (1993) was<\/p>","o":["Junko Tabei","Pasang Lhamu Sherpa","Lhakpa Sherpa","Maya Sherpa"],"a":1,"s":"<p>Pasang Lhamu Sherpa reached the summit on 22 April 1993 but died during the descent; she was declared a national hero.<br>Other options: A — the first woman ever to climb Everest (Japan, 1975); C — holds the women's record for most Everest ascents, but was not the first; D — a later Nepali woman climber, not the first.<\/p>","tag":""},{"id":"4.6.21","q":"<p>The Nobel Prizes were first awarded in<\/p>","o":["1895","1896","1901","1969"],"a":2,"s":"<p>Under Alfred Nobel's will (1895), the first prizes were given in 1901; the economics prize was added in 1968 and first given in 1969.<br>Other options: A — the year Nobel signed his will; B — the year Nobel died; D — the year the economics prize was first given.<\/p>","tag":""},{"id":"4.6.22","q":"<p>Which Nobel Prize category was NOT part of Alfred Nobel's original will?<\/p>","o":["Peace","Economic Sciences","Literature","Physiology or Medicine"],"a":1,"s":"<p>The Sveriges Riksbank Prize in Economic Sciences was created in 1968 by Sweden's central bank. Nobel's will named physics, chemistry, physiology or medicine, literature and peace.<br>Other options: A — named in the will; C — named in the will; D — named in the will.<\/p>","tag":""},{"id":"4.6.23","q":"<p>Mahabir Pun received the 2007 Ramon Magsaysay Award mainly for<\/p>","o":["using wireless technology to connect remote mountain villages to the internet","developing low-cost cataract surgery","leading the community forestry movement","founding a microfinance bank"],"a":0,"s":"<p>Mahabir Pun's Nepal Wireless Networking Project linked villages around Nangi, Myagdi, to the internet; he received the award for community leadership.<br>Other options: B — the work of Dr Sanduk Ruit (Magsaysay Award 2006); C — not the reason for his award; D — not the reason for his award.<\/p>","tag":""},{"id":"4.6.24","q":"<p>The Ramon Magsaysay Award, often called Asia's Nobel Prize, is presented by a foundation based in<\/p>","o":["Sweden","Norway","Japan","the Philippines"],"a":3,"s":"<p>The award is named after Ramon Magsaysay, a former President of the Philippines, and is presented in Manila.<br>Other options: A — home of the Nobel Prizes (except Peace); B — where the Nobel Peace Prize is presented; C — not the home of this award.<\/p>","tag":""},{"id":"4.6.25","q":"<p>'Shirishko Phool', which won the Madan Puraskar in 2022 BS, was written by<\/p>","o":["Diamond Shumsher Rana","Lil Bahadur Chettri","Parijat","B. P. Koirala"],"a":2,"s":"<p>Parijat (Bishnu Kumari Waiba) won the Madan Puraskar for the novel Shirishko Phool (The Blue Mimosa).<br>Other options: A — author of Seto Bagh; B — author of Basain; D — author of Sumnima and Teen Ghumti.<\/p>","tag":""},{"id":"4.6.26","q":"<p>The historical novel 'Seto Bagh' was written by<\/p>","o":["Parijat","Narayan Wagle","Buddhisagar","Diamond Shumsher Rana"],"a":3,"s":"<p>Seto Bagh, set in the Rana period, is Diamond Shumsher Rana's best-known novel.<br>Other options: A — author of Shirishko Phool; B — author of Palpasa Café; C — author of Karnali Blues.<\/p>","tag":""},{"id":"4.6.27","q":"<p>The novel 'Palpasa Café', set during the armed conflict and winner of the Madan Puraskar, was written by<\/p>","o":["Buddhisagar","Parijat","Narayan Wagle","Diamond Shumsher Rana"],"a":2,"s":"<p>Journalist Narayan Wagle's Palpasa Café won the Madan Puraskar.<br>Other options: A — author of Karnali Blues; B — author of Shirishko Phool; D — author of Seto Bagh.<\/p>","tag":""},{"id":"4.6.28","q":"<p>The novel 'Basain', about the hardships that force a hill family to migrate, was written by<\/p>","o":["Laxmi Prasad Devkota","Lil Bahadur Chettri","B. P. Koirala","Parijat"],"a":1,"s":"<p>Lil Bahadur Chettri's Basain is a classic of Nepali social realism.<br>Other options: A — a poet, known for Muna Madan; C — author of Sumnima; D — author of Shirishko Phool.<\/p>","tag":""},{"id":"4.6.29","q":"<p>The novel 'Sumnima' was written by<\/p>","o":["B. P. Koirala","Lil Bahadur Chettri","Laxmi Prasad Devkota","Narayan Wagle"],"a":0,"s":"<p>Sumnima, contrasting a Kirat girl and a Brahmin youth, is one of B. P. Koirala's novels.<br>Other options: B — author of Basain; C — a poet, known for Muna Madan; D — author of Palpasa Café.<\/p>","tag":""},{"id":"4.6.30","q":"<p>The Booker Prize is awarded for<\/p>","o":["investigative journalism","fiction written in English and published in the UK or Ireland","contributions to world peace","excellence in films"],"a":1,"s":"<p>The Booker Prize is a literary award for the best novel in English published in the UK or Ireland.<br>Other options: A — the Pulitzer Prize covers journalism; C — the Nobel Peace Prize; D — the Academy Awards (Oscars).<\/p>","tag":""}]}]},{"n":5,"t":"Business and Economics","subs":[{"k":"5.1","t":"Principles of Management","items":[{"id":"5.1.1","q":"<p>Who is known as the 'father of scientific management'?<\/p>","o":["Henri Fayol","F. W. Taylor","Max Weber","Elton Mayo"],"a":1,"s":"<p>Frederick Winslow Taylor (The Principles of Scientific Management, 1911) introduced time and motion study, differential piece-rate and functional foremanship.<br>Other options: A — father of modern (administrative/general) management theory; C — developed the theory of bureaucracy; D — associated with the human relations movement and the Hawthorne studies.<\/p>","tag":""},{"id":"5.1.2","q":"<p>How many principles of management did Henri Fayol propose?<\/p>","o":["12","10","14","16"],"a":2,"s":"<p>Fayol's General and Industrial Management (1916) lists 14 principles, from division of work to esprit de corps.<br>Other options: A — a miscount, as Fayol listed fourteen; B — a miscount, as Fayol listed fourteen; D — a miscount, as Fayol listed fourteen.<\/p>","tag":""},{"id":"5.1.3","q":"<p>The acronym POSDCORB, describing the functions of an executive, was coined by<\/p>","o":["Luther Gulick","Henri Fayol","Peter Drucker","F. W. Taylor"],"a":0,"s":"<p>Luther Gulick (with Lyndall Urwick, 1937) coined POSDCORB: Planning, Organising, Staffing, Directing, Co-ordinating, Reporting and Budgeting.<br>Other options: B — Fayol gave the five elements: plan, organise, command, coordinate, control; C — known for MBO and management as a discipline, not POSDCORB; D — known for scientific management at shop-floor level.<\/p>","tag":""},{"id":"5.1.4","q":"<p>The Hawthorne experiments, which highlighted the effect of social and psychological factors on productivity, are mainly associated with<\/p>","o":["F. W. Taylor","Elton Mayo","Abraham Maslow","Frederick Herzberg"],"a":1,"s":"<p>Elton Mayo and colleagues studied workers at Western Electric's Hawthorne Works (1924-1932); the findings launched the human relations school.<br>Other options: A — Taylor focused on work methods and incentives, not social factors; C — known for the hierarchy of needs; D — known for the two-factor (motivation-hygiene) theory.<\/p>","tag":""},{"id":"5.1.5","q":"<p>'Management by Objectives' (MBO) was popularised by<\/p>","o":["Douglas McGregor","Peter Drucker","Chester Barnard","Mary Parker Follett"],"a":1,"s":"<p>Drucker described MBO in The Practice of Management (1954): goals are set jointly by superior and subordinate and performance is judged against them.<br>Other options: A — known for Theory X and Theory Y; C — known for the acceptance theory of authority and The Functions of the Executive; D — known for constructive conflict and integration.<\/p>","tag":""},{"id":"5.1.6","q":"<p>Theory X and Theory Y, two contrasting sets of assumptions about workers, were proposed by<\/p>","o":["William Ouchi","Rensis Likert","Douglas McGregor","David McClelland"],"a":2,"s":"<p>McGregor's The Human Side of Enterprise (1960): Theory X assumes people dislike work and must be controlled; Theory Y assumes they seek responsibility.<br>Other options: A — proposed Theory Z (Japanese-style management); B — proposed the four systems of management; D — proposed the theory of needs for achievement, affiliation and power.<\/p>","tag":""},{"id":"5.1.7","q":"<p>Theory Z, which blends American and Japanese management practices such as long-term employment and collective decision-making, was given by<\/p>","o":["Douglas McGregor","Abraham Maslow","Victor Vroom","William Ouchi"],"a":3,"s":"<p>William Ouchi's Theory Z (1981) stresses long-term employment, consensus decisions and concern for employee welfare.<br>Other options: A — gave Theory X and Theory Y; B — gave the hierarchy of needs; C — gave expectancy theory.<\/p>","tag":""},{"id":"5.1.8","q":"<p>The 'ideal type' of bureaucracy, based on rules, hierarchy and impersonality, was described by<\/p>","o":["Henri Fayol","Max Weber","Elton Mayo","Herbert Simon"],"a":1,"s":"<p>Max Weber described legal-rational authority exercised through a bureaucracy with a clear hierarchy, written rules, specialisation and impersonal relations.<br>Other options: A — described principles of administration, not the bureaucratic ideal type; C — a human relations theorist; D — known for bounded rationality in decision-making.<\/p>","tag":""},{"id":"5.1.9","q":"<p>Fayol's principle of 'unity of command' states that<\/p>","o":["there should be one head and one plan for a group of activities having the same objective","an employee should receive orders from one superior only","work should be divided so that each person specialises","authority should flow in an unbroken line from top to bottom"],"a":1,"s":"<p>Unity of command: each subordinate is accountable to, and takes orders from, one boss only, which avoids conflicting instructions.<br>Other options: A — this is unity of direction; C — this is division of work; D — this is the scalar chain.<\/p>","tag":""},{"id":"5.1.10","q":"<p>Fayol's 'gang plank' permits direct communication between employees at the same level. It is an exception to which principle?<\/p>","o":["Scalar chain","Unity of direction","Centralisation","Order"],"a":0,"s":"<p>The scalar chain requires communication to pass up and down the line of authority; the gang plank lets peers communicate directly (with their superiors' consent) to save time.<br>Other options: B — the gang plank does not concern plans for a group of activities; C — concerns where decision authority is concentrated; D — concerns a place for everything and everyone.<\/p>","tag":""},{"id":"5.1.11","q":"<p>Which function of management is regarded as the 'primary' function because all other functions follow from it?<\/p>","o":["Organising","Controlling","Planning","Staffing"],"a":2,"s":"<p>Planning decides in advance what to do and how; organising, staffing, directing and controlling all work towards the plan (primacy of planning).<br>Other options: A — organising arranges resources to carry out plans already made; B — controlling compares results with plans, so it depends on planning; D — staffing fills positions created to carry out plans.<\/p>","tag":""},{"id":"5.1.12","q":"<p>Which of the following is a standing (repeated-use) plan?<\/p>","o":["Policy","Programme","Project","Budget prepared for a one-time event"],"a":0,"s":"<p>Standing plans (policies, procedures, rules) guide recurring situations; programmes, projects and one-off budgets are single-use plans.<br>Other options: B — a single-use plan for a specific undertaking; C — a single-use plan with a definite end; D — a single-use plan.<\/p>","tag":""},{"id":"5.1.13","q":"<p>In a SWOT analysis, which two elements are internal to the organisation?<\/p>","o":["Opportunities and threats","Strengths and weaknesses","Strengths and opportunities","Weaknesses and threats"],"a":1,"s":"<p>Strengths and weaknesses relate to the firm's own resources and capabilities; opportunities and threats arise in the external environment.<br>Other options: A — these are external factors; C — opportunities are external; D — threats are external.<\/p>","tag":""},{"id":"5.1.14","q":"<p>A narrow span of control throughout an organisation generally results in<\/p>","o":["a tall structure with many levels of management","a flat structure with few levels","fewer managers for the same number of workers","more delegation and less supervision"],"a":0,"s":"<p>If each manager supervises few people, more managers and more layers are needed for the same workforce, giving a tall hierarchy.<br>Other options: B — a flat structure results from a wide span; C — a narrow span needs more managers; D — a narrow span means closer supervision.<\/p>","tag":""},{"id":"5.1.15","q":"<p>In a line and staff organisation, the authority of staff specialists is mainly<\/p>","o":["advisory","command authority over line workers","unlimited functional authority","the same as line authority"],"a":0,"s":"<p>Staff (e.g. legal, HR, research) advise and assist line managers, who keep the authority to decide and command.<br>Other options: B — command authority belongs to line managers; C — staff authority is limited to advice unless specific functional authority is granted; D — staff and line authority differ by definition.<\/p>","tag":""},{"id":"5.1.16","q":"<p>In delegation, which of the following cannot be delegated by a manager?<\/p>","o":["Authority","Tasks","Ultimate responsibility","Routine decision-making rights"],"a":2,"s":"<p>A manager can delegate authority and duties but remains ultimately accountable to his or her own superior for the result.<br>Other options: A — authority can be delegated to subordinates; B — assigning tasks is the core of delegation; D — routine decisions are commonly delegated.<\/p>","tag":""},{"id":"5.1.17","q":"<p>A matrix organisation, in which employees report both to a functional head and to a project manager, departs from the principle of<\/p>","o":["unity of command","division of work","equity","stability of tenure"],"a":0,"s":"<p>Dual reporting means two bosses for one subordinate, which breaks unity of command.<br>Other options: B — matrix structures still rely on specialisation; C — equity concerns fair treatment, not reporting lines; D — concerns job security, not reporting lines.<\/p>","tag":""},{"id":"5.1.18","q":"<p>In Maslow's hierarchy of needs, which need lies immediately above safety needs?<\/p>","o":["Physiological needs","Esteem needs","Self-actualisation needs","Social (belongingness) needs"],"a":3,"s":"<p>Order from the base: physiological, safety, social (love/belonging), esteem, self-actualisation.<br>Other options: A — these are below safety needs, at the base; B — esteem lies above social needs; C — this is the top level.<\/p>","tag":""},{"id":"5.1.19","q":"<p>Which of the following is a hygiene factor in Herzberg's two-factor theory?<\/p>","o":["Achievement","Recognition","Company policy and administration","The work itself"],"a":2,"s":"<p>Hygiene factors (company policy, supervision, salary, working conditions, interpersonal relations) prevent dissatisfaction; motivators (achievement, recognition, work itself, responsibility, growth) create satisfaction.<br>Other options: A — a motivator; B — a motivator; D — a motivator.<\/p>","tag":""},{"id":"5.1.20","q":"<p>In Vroom's expectancy theory, Motivation = Expectancy × Instrumentality × Valence. If an employee places no value at all on the reward offered (valence = 0), his motivation will be<\/p>","o":["zero, however high expectancy and instrumentality are","high if expectancy is high","equal to expectancy plus instrumentality","negative"],"a":0,"s":"<p>Because the three terms are multiplied, a valence of 0 gives M = E × I × 0 = 0.<br>Other options: B — the terms multiply, so one zero makes the product zero; C — the model is multiplicative, not additive; D — a valence of zero gives zero, not a negative value.<\/p>","tag":""},{"id":"5.1.21","q":"<p>In Blake and Mouton's Managerial Grid, the 9,9 style, with high concern for both people and production, is called<\/p>","o":["Country club management","Authority-compliance management","Middle-of-the-road management","Team management"],"a":3,"s":"<p>The 9,9 team-management style is presented by Blake and Mouton as the most effective.<br>Other options: A — this is the 1,9 style (high people, low production); B — this is the 9,1 style (high production, low people); C — this is the 5,5 style.<\/p>","tag":""},{"id":"5.1.22","q":"<p>The 'least preferred co-worker' (LPC) scale is used in<\/p>","o":["Hersey and Blanchard's situational leadership model","Fiedler's contingency model","House's path-goal theory","The Vroom-Yetton decision model"],"a":1,"s":"<p>Fred Fiedler measured a leader's basic style (task- or relationship-oriented) with the LPC questionnaire, then matched it to situational favourableness.<br>Other options: A — uses follower readiness, not LPC; C — focuses on how leaders clarify paths to goals; D — uses a decision tree on participation.<\/p>","tag":""},{"id":"5.1.23","q":"<p>Under Hersey and Blanchard's situational leadership model, which style suits followers who are both unable and unwilling (lowest readiness)?<\/p>","o":["Selling","Participating","Delegating","Telling"],"a":3,"s":"<p>For R1 followers the leader gives specific instructions and close supervision (high task, low relationship): telling.<br>Other options: A — suits followers who are unable but willing; B — suits followers who are able but unwilling; C — suits followers who are able and willing.<\/p>","tag":""},{"id":"5.1.24","q":"<p>Which is the correct sequence of steps in the control process?<\/p>","o":["Measure performance → set standards → take corrective action → compare with standards","Set standards → measure performance → compare with standards → take corrective action","Compare with standards → set standards → measure performance → take corrective action","Set standards → take corrective action → measure performance → compare with standards"],"a":1,"s":"<p>Control starts with standards, measures actual results, compares them with standards and corrects deviations.<br>Other options: A — standards must exist before measurement; C — comparison needs both standards and measurement first; D — correction comes only after a deviation is found.<\/p>","tag":""},{"id":"5.1.25","q":"<p>Inspecting raw materials before they enter the production process is an example of<\/p>","o":["concurrent control","feedback control","budgetary control","feedforward control"],"a":3,"s":"<p>Feedforward (preventive) control anticipates problems before the activity begins, e.g. by checking inputs.<br>Other options: A — concurrent control takes place while the activity is going on; B — feedback control acts after the output is produced; C — budgetary control compares actual spending with budgets.<\/p>","tag":""},{"id":"5.1.26","q":"<p>According to Henry Mintzberg's classification of managerial roles, 'disturbance handler' is a<\/p>","o":["interpersonal role","informational role","decisional role","technical role"],"a":2,"s":"<p>Mintzberg's ten roles: interpersonal (3), informational (3) and decisional (4: entrepreneur, disturbance handler, resource allocator, negotiator).<br>Other options: A — interpersonal roles are figurehead, leader and liaison; B — informational roles are monitor, disseminator and spokesperson; D — not one of Mintzberg's three categories.<\/p>","tag":""},{"id":"5.1.27","q":"<p>According to Robert Katz, which managerial skill becomes most important at the top level of management?<\/p>","o":["Technical skill","Human skill","Clerical skill","Conceptual skill"],"a":3,"s":"<p>Katz identified technical, human and conceptual skills; top managers most need the ability to see the organisation as a whole.<br>Other options: A — most important at the lower (supervisory) level; B — important at all levels, not specially at the top; C — not one of Katz's three skills.<\/p>","tag":""},{"id":"5.1.28","q":"<p>Reordering stationery automatically whenever stock falls to a fixed level is an example of a<\/p>","o":["non-programmed decision","strategic decision","programmed decision","decision under uncertainty"],"a":2,"s":"<p>Routine, repetitive problems are handled by a set rule or procedure; these are programmed decisions.<br>Other options: A — non-programmed decisions are novel and unstructured; B — strategic decisions are long-term and non-routine; D — the situation and outcome here are known.<\/p>","tag":""},{"id":"5.1.29","q":"<p>The concepts of 'bounded rationality' and 'satisficing' in decision-making are associated with<\/p>","o":["Peter Drucker","Henri Fayol","Chester Barnard","Herbert Simon"],"a":3,"s":"<p>Herbert Simon argued that managers have limited information and capacity, so they accept the first satisfactory option rather than the optimal one.<br>Other options: A — known for MBO and knowledge workers; B — known for the principles of management; C — known for the acceptance theory of authority.<\/p>","tag":""},{"id":"5.1.30","q":"<p>In PERT, an activity has an optimistic time of 4 days, a most likely time of 6 days and a pessimistic time of 14 days. Its expected time is<\/p>","o":["7 days","8 days","6 days","9 days"],"a":0,"s":"<p>te = (o + 4m + p)/6 = (4 + 24 + 14)/6 = 42/6 = 7 days.<br>Other options: B — simple average (4 + 6 + 14)/3, which ignores the weight of 4 on the most likely time; C — this is only the most likely time; D — midpoint of the optimistic and pessimistic times.<\/p>","tag":""}]},{"k":"5.2","t":"Marketing","items":[{"id":"5.2.1","q":"<p>The '4Ps' classification of the marketing mix (product, price, place, promotion) was proposed by<\/p>","o":["Philip Kotler","Neil Borden","E. Jerome McCarthy","Theodore Levitt"],"a":2,"s":"<p>McCarthy grouped Borden's marketing-mix ingredients into the 4Ps in Basic Marketing (1960).<br>Other options: A — Kotler popularised the 4Ps in his textbooks but did not propose them; B — Borden popularised the term 'marketing mix' with a longer list of ingredients; D — known for 'Marketing Myopia' and globalisation of markets.<\/p>","tag":""},{"id":"5.2.2","q":"<p>Which of the following is NOT one of the three extra Ps added to the marketing mix for services (the 7Ps)?<\/p>","o":["Packaging","People","Process","Physical evidence"],"a":0,"s":"<p>Booms and Bitner added People, Process and Physical evidence to the 4Ps for services. Packaging is part of the product decision.<br>Other options: B — one of the three extra service Ps; C — one of the three extra service Ps; D — one of the three extra service Ps.<\/p>","tag":""},{"id":"5.2.3","q":"<p>In marketing, the abbreviation STP stands for<\/p>","o":["Sales, Trade, Promotion","Segmentation, Targeting, Positioning","Strategy, Tactics, Planning","Segmentation, Testing, Product Placement"],"a":1,"s":"<p>STP: divide the market into segments, choose target segments, then position the offer in the minds of the target customers.<br>Other options: A — not a recognised marketing framework; C — these are planning terms, not STP; D — targeting and positioning are the second and third steps.<\/p>","tag":""},{"id":"5.2.4","q":"<p>Dividing a market on the basis of lifestyle, personality and values is called<\/p>","o":["socio-demographic segmentation","psychographic segmentation","geographic segmentation","behavioural segmentation"],"a":1,"s":"<p>Psychographic segmentation groups buyers by psychological traits, lifestyle and values.<br>Other options: A — uses age, gender, income, education, etc.; C — uses region, climate, city size, etc.; D — uses usage rate, loyalty, benefits sought, occasions.<\/p>","tag":""},{"id":"5.2.5","q":"<p>A bank that groups customers by how often they use its services and how loyal they are is using<\/p>","o":["psychographic segmentation","demographic segmentation","behavioural segmentation","geographic segmentation"],"a":2,"s":"<p>Usage rate, user status, loyalty, benefits sought and purchase occasion are behavioural variables.<br>Other options: A — this uses lifestyle, personality and values; B — this uses age, income, occupation, etc.; D — this uses location.<\/p>","tag":""},{"id":"5.2.6","q":"<p>In the product life cycle, the stage in which sales reach their peak and competition is most intense is<\/p>","o":["maturity","introduction","growth","decline"],"a":0,"s":"<p>In maturity sales growth slows and peaks, the market is saturated and firms fight for share with price cuts and promotions.<br>Other options: B — sales are low and growing slowly in this stage; C — sales rise rapidly but have not yet peaked; D — sales are falling in this stage.<\/p>","tag":""},{"id":"5.2.7","q":"<p>In which stage of the product life cycle are profits usually negative or very low because of heavy promotion and distribution costs?<\/p>","o":["Introduction","Growth","Maturity","Decline"],"a":0,"s":"<p>At launch, sales volume is small while spending on awareness and channel building is high, so profits are low or negative.<br>Other options: B — profits normally rise in the growth stage; C — profits are usually at or near their peak; D — profits fall, but heavy launch costs are typical of introduction.<\/p>","tag":""},{"id":"5.2.8","q":"<p>Setting a high initial price for an innovative product to earn maximum revenue from buyers who are less price-sensitive, and lowering it later, is called<\/p>","o":["penetration pricing","price skimming","cost-plus pricing","psychological pricing"],"a":1,"s":"<p>Skimming 'skims the cream' off the market, then cuts price step by step to reach more price-sensitive segments.<br>Other options: A — starts with a low price to win market share fast; C — adds a fixed mark-up to cost; D — uses prices such as Rs 999 to influence perception.<\/p>","tag":""},{"id":"5.2.9","q":"<p>The main objective of penetration pricing is to<\/p>","o":["recover research and development costs quickly from early adopters","signal premium quality through a high price","charge different prices to different customer groups","gain a large market share quickly with a low initial price"],"a":3,"s":"<p>Penetration pricing sets a low price to attract many buyers fast and discourage competitors from entering.<br>Other options: A — this is the aim of price skimming; B — this is prestige pricing; C — this is price discrimination.<\/p>","tag":""},{"id":"5.2.10","q":"<p>A shop prices a pair of shoes at Rs 1,999 instead of Rs 2,000. This is an example of<\/p>","o":["price skimming","loss-leader pricing","psychological (odd) pricing","geographical (zone) pricing"],"a":2,"s":"<p>Prices ending just below a round number make the product look cheaper than it is (odd-even or psychological pricing).<br>Other options: A — skimming is a high launch price, not a just-below-round-number price; B — a loss leader is sold below cost to attract shoppers; D — varies price by location.<\/p>","tag":""},{"id":"5.2.11","q":"<p>In the BCG growth-share matrix, a business unit with high market growth but low relative market share is called a<\/p>","o":["question mark","star","cash cow","dog"],"a":0,"s":"<p>Question marks (problem children) need heavy investment to raise share; otherwise they may be divested.<br>Other options: B — a star has high growth and high share; C — a cash cow has low growth and high share; D — a dog has low growth and low share.<\/p>","tag":""},{"id":"5.2.12","q":"<p>In the BCG matrix, a business with high relative market share in a slow-growing market, which generates more cash than it needs, is a<\/p>","o":["cash cow","star","question mark","dog"],"a":0,"s":"<p>Cash cows are 'milked' to fund stars and question marks.<br>Other options: B — stars are in high-growth markets and need heavy investment; C — question marks have low share; D — dogs have low share.<\/p>","tag":""},{"id":"5.2.13","q":"<p>According to the Ansoff matrix, launching a new product in a firm's existing market is called<\/p>","o":["market penetration","product development","market development","diversification"],"a":1,"s":"<p>Ansoff's four growth strategies: penetration, market development, product development and diversification.<br>Other options: A — existing product in existing market; C — existing product in a new market; D — new product in a new market.<\/p>","tag":""},{"id":"5.2.14","q":"<p>The famous article 'Marketing Myopia' (1960), which warned firms against defining their business too narrowly in terms of products, was written by<\/p>","o":["Philip Kotler","Theodore Levitt","Peter Drucker","Michael E. Porter"],"a":1,"s":"<p>Levitt argued, for example, that railways declined because they saw themselves in the railway business rather than the transport business.<br>Other options: A — author of Marketing Management, not this article; C — wrote on management and the marketing concept but not this article; D — known for competitive strategy and the five forces.<\/p>","tag":""},{"id":"5.2.15","q":"<p>The first stage of the consumer buying decision process is<\/p>","o":["need (problem) recognition","information search","evaluation of alternatives","purchase decision"],"a":0,"s":"<p>Stages: need recognition → information search → evaluation of alternatives → purchase decision → post-purchase behaviour.<br>Other options: B — comes after the need is recognised; C — the third stage; D — the fourth stage.<\/p>","tag":""},{"id":"5.2.16","q":"<p>The doubt or discomfort a buyer feels after buying an expensive item, wondering whether the right choice was made, is called<\/p>","o":["brand loyalty","impulse buying","selective attention","cognitive dissonance"],"a":3,"s":"<p>Post-purchase (cognitive) dissonance is common for high-involvement purchases; marketers reduce it with reassurance and after-sales service.<br>Other options: A — loyalty is a repeated preference for one brand; B — unplanned buying, not after-purchase doubt; C — the tendency to screen out most stimuli before purchase.<\/p>","tag":""},{"id":"5.2.17","q":"<p>In the AIDA model of communication, the letters stand for<\/p>","o":["Awareness, Information, Decision, Adoption","Attention, Information, Demand, Action","Attention, Interest, Desire, Action","Advertising, Interest, Distribution, Action"],"a":2,"s":"<p>AIDA describes the stages a message should move a buyer through: attention, interest, desire and action.<br>Other options: A — a mix of adoption-model terms, not AIDA; B — the second and third steps are interest and desire; D — advertising and distribution are tools, not response stages.<\/p>","tag":""},{"id":"5.2.18","q":"<p>A manufacturer offers trade discounts, display allowances and incentives to wholesalers and retailers so that they stock and actively sell its product. This is a<\/p>","o":["pull strategy","penetration strategy","direct marketing strategy","push strategy"],"a":3,"s":"<p>In a push strategy the product is 'pushed' through the channel by promoting to intermediaries.<br>Other options: A — a pull strategy aims promotion at final consumers to create demand; B — a pricing strategy, not a promotion strategy; C — direct marketing bypasses intermediaries.<\/p>","tag":""},{"id":"5.2.19","q":"<p>A distribution channel of the form Manufacturer → Retailer → Consumer is a<\/p>","o":["zero-level channel","two-level channel","three-level channel","one-level channel"],"a":3,"s":"<p>The level of a channel equals the number of intermediaries between producer and consumer. Here there is one, the retailer.<br>Other options: A — a zero-level (direct) channel has no intermediary; B — a two-level channel has a wholesaler and a retailer; C — a three-level channel adds a jobber or agent as well.<\/p>","tag":""},{"id":"5.2.20","q":"<p>A company known for toothpaste launches toothbrushes under the same brand name. This is an example of<\/p>","o":["line extension","co-branding","brand extension","private labelling"],"a":2,"s":"<p>Brand extension uses an established brand name to enter a new product category.<br>Other options: A — a line extension adds variants (flavours, sizes) in the same product category; B — co-branding combines two different brands on one product; D — private labels are retailers' own brands.<\/p>","tag":""},{"id":"5.2.21","q":"<p>A soft-drink company adds a new lemon flavour under its existing brand in the same category. This is<\/p>","o":["brand extension","multibranding","line extension","rebranding"],"a":2,"s":"<p>A line extension adds new flavours, sizes or forms to an existing product line under the same brand.<br>Other options: A — brand extension moves into a new category; B — multibranding launches new brands in the same category; D — rebranding changes the brand name or identity.<\/p>","tag":""},{"id":"5.2.22","q":"<p>'Positioning' in marketing means<\/p>","o":["dividing the market into distinct groups of buyers who have different needs, characteristics or behaviour","designing the offer and image to occupy a clear and valued place in the minds of target customers","choosing which segments to serve","placing products on the best shelves in a store"],"a":1,"s":"<p>Positioning is the last step of STP: deciding how the brand should be perceived relative to competitors.<br>Other options: A — this is segmentation; C — this is targeting; D — this is merchandising, not positioning.<\/p>","tag":""},{"id":"5.2.23","q":"<p>Free installation, a two-year warranty and home delivery offered with an air-conditioner belong to which of Kotler's product levels?<\/p>","o":["Core benefit","Basic (actual) product","Augmented product","Potential product"],"a":2,"s":"<p>Additional services and benefits beyond what customers normally expect form the augmented product.<br>Other options: A — the core benefit is the basic need served, e.g. cooling comfort; B — the actual product is the physical unit with its features; D — the potential product covers possible future augmentations.<\/p>","tag":""},{"id":"5.2.24","q":"<p>Products such as soap, salt and toothpaste, bought frequently, immediately and with little comparison effort, are<\/p>","o":["shopping products","specialty products","unsought products","convenience products"],"a":3,"s":"<p>Convenience products are low-priced, widely available and bought with minimum effort.<br>Other options: A — shopping products are compared on price, quality and style, e.g. furniture; B — specialty products have unique features buyers make special efforts for; C — unsought products are those buyers do not normally think of buying, e.g. insurance.<\/p>","tag":""},{"id":"5.2.25","q":"<p>Making a soft drink available through as many outlets as possible is called<\/p>","o":["intensive distribution","selective distribution","exclusive distribution","franchising"],"a":0,"s":"<p>Intensive distribution maximises availability, which suits convenience goods.<br>Other options: B — uses some, but not all, willing outlets; C — gives one dealer the sole right in an area; D — a contractual business model, not a coverage level.<\/p>","tag":""},{"id":"5.2.26","q":"<p>A firm's sales are Rs 30 crore in a market whose total sales are Rs 240 crore. Its market share is<\/p>","o":["8 per cent","12 per cent","25 per cent","12.5 per cent"],"a":3,"s":"<p>Market share = 30/240 × 100 = 12.5 per cent.<br>Other options: A — this is 240/30, the inverse ratio; B — a rounding slip; C — a doubling slip.<\/p>","tag":""},{"id":"5.2.27","q":"<p>A product sells for Rs 200 per unit with a variable cost of Rs 120 per unit. Fixed costs are Rs 6,00,000. The break-even volume is<\/p>","o":["3,000 units","5,000 units","7,000 units","7,500 units"],"a":3,"s":"<p>Contribution per unit = 200 − 120 = 80. Break-even = 6,00,000/80 = 7,500 units.<br>Other options: A — divides fixed cost by price instead of by contribution; B — divides fixed cost by variable cost; C — an arithmetic slip.<\/p>","tag":""},{"id":"5.2.28","q":"<p>A retailer buys an item for Rs 400 and wants a mark-up of 25 per cent on the selling price. The selling price should be about<\/p>","o":["Rs 500","Rs 533","Rs 525","Rs 480"],"a":1,"s":"<p>If the mark-up is 25 per cent of SP, cost is 75 per cent of SP. SP = 400/0.75 = Rs 533.33.<br>Other options: A — this is a 25 per cent mark-up on cost, not on selling price; C — an arithmetic slip; D — a 20 per cent mark-up on cost.<\/p>","tag":""},{"id":"5.2.29","q":"<p>A customer spends Rs 2,000 a month at a store and stays for 5 years. If the store's profit margin is 20 per cent, the customer's lifetime profit contribution (ignoring discounting) is<\/p>","o":["Rs 1,20,000","Rs 24,000","Rs 4,800","Rs 2,000"],"a":1,"s":"<p>Revenue = 2,000 × 12 × 5 = 1,20,000. Profit = 20 per cent of 1,20,000 = Rs 24,000.<br>Other options: A — this is lifetime revenue, not profit; C — this is profit for one year only; D — treats Rs 2,000 as yearly spending, 2,000 × 5 × 20 per cent.<\/p>","tag":""},{"id":"5.2.30","q":"<p>Data collected by a firm through its own questionnaire survey for the current research problem are called<\/p>","o":["primary data","secondary data","census data","syndicated data"],"a":0,"s":"<p>Primary data are gathered first-hand for the specific purpose at hand.<br>Other options: B — secondary data were collected earlier by someone else for another purpose; C — census data come from a full count, usually by the government; D — syndicated data are sold by research agencies to many clients.<\/p>","tag":""}]},{"k":"5.3","t":"Accounting and Finance Basics","items":[{"id":"5.3.1","q":"<p>A business has total assets of Rs 5,00,000 and total liabilities of Rs 1,80,000. Its owner's equity is<\/p>","o":["Rs 6,80,000","Rs 3,20,000","Rs 2,80,000","Rs 1,80,000"],"a":1,"s":"<p>Assets = Liabilities + Owner's equity, so equity = 5,00,000 − 1,80,000 = Rs 3,20,000.<br>Other options: A — adds liabilities to assets instead of subtracting; C — a subtraction slip; D — this is the liabilities figure.<\/p>","tag":""},{"id":"5.3.2","q":"<p>The owner brings Rs 50,000 cash into the business as additional capital. The effect on the accounting equation is<\/p>","o":["assets increase and liabilities increase by Rs 50,000","assets remain unchanged and equity increases","assets and owner's equity both increase by Rs 50,000","assets increase and equity decreases by Rs 50,000"],"a":2,"s":"<p>Cash (asset) +50,000 and capital (equity) +50,000, so the equation stays in balance.<br>Other options: A — capital is owner's equity, not a liability to outsiders; B — cash, an asset, rises; D — equity rises, it does not fall.<\/p>","tag":""},{"id":"5.3.3","q":"<p>Under the double-entry system, an increase in an expense account is recorded as<\/p>","o":["a debit","a credit","a credit to the asset account only","no entry until the expense is paid"],"a":0,"s":"<p>Expenses and assets increase on the debit side; liabilities, capital and income increase on the credit side.<br>Other options: B — credits record increases in income, liabilities and capital; C — an expense is not recorded only as a credit to an asset; D — under accrual accounting, expenses are recorded when incurred.<\/p>","tag":""},{"id":"5.3.4","q":"<p>Which financial statement shows the financial position of a business at a particular date?<\/p>","o":["Income statement","Cash flow statement","Statement of changes in equity","Balance sheet"],"a":3,"s":"<p>The balance sheet (statement of financial position) lists assets, liabilities and equity as on a given date.<br>Other options: A — shows performance over a period; B — shows cash movements over a period; C — shows changes in equity over a period.<\/p>","tag":""},{"id":"5.3.5","q":"<p>A machine costs Rs 2,20,000, has a residual value of Rs 20,000 and a useful life of 5 years. Annual depreciation under the straight-line method is<\/p>","o":["Rs 40,000","Rs 44,000","Rs 36,000","Rs 48,000"],"a":0,"s":"<p>Depreciation = (Cost − Residual value)/Life = (2,20,000 − 20,000)/5 = Rs 40,000 a year.<br>Other options: B — ignores the residual value; C — an arithmetic slip; D — adds the residual value to cost.<\/p>","tag":""},{"id":"5.3.6","q":"<p>An asset costing Rs 1,00,000 is depreciated at 20 per cent a year under the written-down value method. Depreciation for the second year is<\/p>","o":["Rs 20,000","Rs 16,000","Rs 18,000","Rs 64,000"],"a":1,"s":"<p>Year 1: 20 per cent of 1,00,000 = 20,000, WDV = 80,000. Year 2: 20 per cent of 80,000 = Rs 16,000.<br>Other options: A — this is the straight-line amount, or the first-year charge; C — an arithmetic slip; D — this is the book value at the end of year 2.<\/p>","tag":""},{"id":"5.3.7","q":"<p>A firm has current assets of Rs 3,60,000 and current liabilities of Rs 2,40,000. Its current ratio is<\/p>","o":["0.67 : 1","1.5 : 1","2 : 1","1.2 : 1"],"a":1,"s":"<p>Current ratio = 3,60,000/2,40,000 = 1.5 : 1.<br>Other options: A — the ratio is inverted; C — this is the conventional ideal, not the actual figure; D — an arithmetic slip.<\/p>","tag":""},{"id":"5.3.8","q":"<p>Current assets are Rs 3,60,000, of which inventory is Rs 1,20,000. Current liabilities are Rs 2,40,000. The quick (acid-test) ratio is<\/p>","o":["1 : 1","1.5 : 1","0.5 : 1","2 : 1"],"a":0,"s":"<p>Quick assets = 3,60,000 − 1,20,000 = 2,40,000. Quick ratio = 2,40,000/2,40,000 = 1 : 1.<br>Other options: B — this is the current ratio, which includes inventory; C — uses inventory alone as the numerator; D — an arithmetic slip.<\/p>","tag":""},{"id":"5.3.9","q":"<p>The conventional rule-of-thumb (ideal) current ratio is<\/p>","o":["1 : 1","2 : 1","1 : 2","3 : 1"],"a":1,"s":"<p>Traditionally a current ratio of 2 : 1 and a quick ratio of 1 : 1 are treated as satisfactory.<br>Other options: A — this is the conventional ideal for the quick ratio; C — this would mean current liabilities exceed current assets; D — not the conventional benchmark.<\/p>","tag":""},{"id":"5.3.10","q":"<p>A company has long-term debt of Rs 4,00,000 and shareholders' equity of Rs 8,00,000. Its debt-equity ratio is<\/p>","o":["0.5 : 1","2 : 1","0.33 : 1","1.5 : 1"],"a":0,"s":"<p>Debt-equity ratio = 4,00,000/8,00,000 = 0.5 : 1.<br>Other options: B — the ratio is inverted; C — divides debt by debt plus equity; D — an arithmetic slip.<\/p>","tag":""},{"id":"5.3.11","q":"<p>Net sales are Rs 8,00,000 and the cost of goods sold is Rs 6,00,000. The gross profit ratio is<\/p>","o":["33.33 per cent","75 per cent","20 per cent","25 per cent"],"a":3,"s":"<p>Gross profit = 2,00,000. GP ratio = 2,00,000/8,00,000 × 100 = 25 per cent.<br>Other options: A — this is gross profit as a percentage of cost, not of sales; B — this is the cost of goods sold ratio; C — an arithmetic slip.<\/p>","tag":""},{"id":"5.3.12","q":"<p>Cost of goods sold is Rs 6,00,000, opening inventory Rs 70,000 and closing inventory Rs 50,000. The inventory turnover ratio is<\/p>","o":["12 times","8.57 times","5 times","10 times"],"a":3,"s":"<p>Average inventory = (70,000 + 50,000)/2 = 60,000. Turnover = 6,00,000/60,000 = 10 times.<br>Other options: A — uses closing inventory instead of average inventory; B — uses opening inventory instead of average inventory; C — uses total of opening and closing inventory, not the average.<\/p>","tag":""},{"id":"5.3.13","q":"<p>A company earns a net profit of Rs 5,00,000 after tax and pays a preference dividend of Rs 1,00,000. It has 40,000 equity shares. Its earnings per share (EPS) is<\/p>","o":["Rs 12.50","Rs 15","Rs 10","Rs 2.50"],"a":2,"s":"<p>EPS = (5,00,000 − 1,00,000)/40,000 = Rs 10.<br>Other options: A — ignores the preference dividend; B — adds the preference dividend; D — uses only the preference dividend.<\/p>","tag":""},{"id":"5.3.14","q":"<p>A share trades at Rs 250 and its EPS is Rs 10. Its price-earnings (P/E) ratio is<\/p>","o":["0.04","2.5","25","240"],"a":2,"s":"<p>P/E = Market price/EPS = 250/10 = 25.<br>Other options: A — this is the earnings yield (EPS/price), not P/E; B — a decimal slip; D — subtracts instead of dividing.<\/p>","tag":""},{"id":"5.3.15","q":"<p>Rs 10,000 is invested at 10 per cent per annum compounded annually. Its value after 3 years is<\/p>","o":["Rs 13,000","Rs 13,100","Rs 12,100","Rs 13,310"],"a":3,"s":"<p>FV = 10,000 × 1.1³ = 10,000 × 1.331 = Rs 13,310.<br>Other options: A — this is simple interest; B — an arithmetic slip; C — this is the value after 2 years.<\/p>","tag":""},{"id":"5.3.16","q":"<p>At a discount rate of 10 per cent compounded annually, the present value of Rs 12,100 receivable after 2 years is<\/p>","o":["Rs 9,680","Rs 11,000","Rs 10,000","Rs 10,083"],"a":2,"s":"<p>PV = 12,100/1.1² = 12,100/1.21 = Rs 10,000.<br>Other options: A — deducts simple discount of 20 per cent of 12,100; B — discounts for one year only; D — divides by 1.2 (simple interest) instead of 1.21.<\/p>","tag":""},{"id":"5.3.17","q":"<p>A nominal interest rate of 12 per cent per annum is compounded quarterly. The effective annual rate is about<\/p>","o":["12.55 per cent","12.00 per cent","12.36 per cent","12.68 per cent"],"a":0,"s":"<p>EAR = (1 + 0.12/4)⁴ − 1 = 1.03⁴ − 1 = 0.1255, i.e. about 12.55 per cent.<br>Other options: B — ignores compounding; C — this is for semi-annual compounding; D — this is for monthly compounding.<\/p>","tag":""},{"id":"5.3.18","q":"<p>Using the 'rule of 72', money invested at 8 per cent compound interest per year will double in approximately<\/p>","o":["12.5 years","8 years","9 years","6 years"],"a":2,"s":"<p>Doubling time ≈ 72/8 = 9 years (the exact answer is about 9.01 years).<br>Other options: A — this is 100/8, the simple-interest doubling time; B — confuses the rate with the time; D — an arithmetic slip.<\/p>","tag":""},{"id":"5.3.19","q":"<p>What is the present value of a perpetuity of Rs 5,000 a year if the discount rate is 10 per cent?<\/p>","o":["Rs 500","Rs 55,000","Rs 45,455","Rs 50,000"],"a":3,"s":"<p>PV of a perpetuity = C/r = 5,000/0.10 = Rs 50,000.<br>Other options: A — multiplies by the rate instead of dividing; B — adds one year's payment to the correct value; C — divides the correct value by 1.1 again.<\/p>","tag":""},{"id":"5.3.20","q":"<p>A project costs Rs 1,00,000 now and gives cash inflows of Rs 40,000 at the end of each of the next 3 years. At a 10 per cent discount rate its NPV is about<\/p>","o":["− Rs 526","+ Rs 20,000","+ Rs 526","− Rs 10,000"],"a":0,"s":"<p>PV of inflows = 40,000 × (1/1.1 + 1/1.21 + 1/1.331) = 40,000 × 2.4869 = 99,474. NPV = 99,474 − 1,00,000 ≈ − Rs 526, so the project should be rejected.<br>Other options: B — this ignores discounting; C — the sign is wrong, as the PV of inflows is less than the cost; D — an arithmetic slip.<\/p>","tag":""},{"id":"5.3.21","q":"<p>A project costs Rs 1,50,000 and gives cash inflows of Rs 50,000, Rs 60,000 and Rs 80,000 in years 1, 2 and 3. Its payback period is<\/p>","o":["3 years","2.5 years","2.4 years","2 years"],"a":1,"s":"<p>After 2 years, 1,10,000 is recovered. The remaining 40,000 takes 40,000/80,000 = 0.5 of year 3. Payback = 2.5 years.<br>Other options: A — ignores the part-year in year 3; C — an arithmetic slip; D — only Rs 1,10,000 is recovered after two years.<\/p>","tag":""},{"id":"5.3.22","q":"<p>Under the IRR method, an independent project should be accepted when<\/p>","o":["its IRR is less than the cost of capital","its IRR is greater than the cost of capital","its IRR is positive","its payback period is shorter than its IRR"],"a":1,"s":"<p>If IRR exceeds the required return (cost of capital), the project's NPV at that rate is positive.<br>Other options: A — the project would then have a negative NPV; C — a positive IRR may still be below the cost of capital; D — these two measures cannot be compared.<\/p>","tag":""},{"id":"5.3.23","q":"<p>The discount rate at which the NPV of a project becomes zero is called the<\/p>","o":["cost of capital","accounting rate of return","internal rate of return","profitability index"],"a":2,"s":"<p>By definition, IRR is the rate that equates the PV of cash inflows with the initial outlay (NPV = 0).<br>Other options: A — the cost of capital is the required rate, not necessarily the rate that sets NPV to zero; B — ARR uses accounting profit and is not a discount rate; D — the PI is a ratio of PV of inflows to outlay.<\/p>","tag":""},{"id":"5.3.24","q":"<p>The present value of a project's cash inflows is Rs 1,30,000 and the initial investment is Rs 1,00,000. The profitability index is<\/p>","o":["0.77","0.3","30,000","1.3"],"a":3,"s":"<p>PI = PV of inflows/Initial investment = 1,30,000/1,00,000 = 1.3.<br>Other options: A — the ratio is inverted; B — this is NPV divided by investment; C — this is the NPV, not the index.<\/p>","tag":""},{"id":"5.3.25","q":"<p>A bond with a face value of Rs 1,000 and an annual coupon rate of 10 per cent is trading at Rs 800. Its current yield is<\/p>","o":["10 per cent","11.1 per cent","12.5 per cent","20 per cent"],"a":2,"s":"<p>Annual coupon = Rs 100. Current yield = 100/800 = 12.5 per cent.<br>Other options: A — this is the coupon rate on face value; B — uses the average of price and face value (Rs 900) as the base; D — uses the discount (Rs 200) as income.<\/p>","tag":""},{"id":"5.3.26","q":"<p>When market interest rates rise, the prices of existing fixed-coupon bonds generally<\/p>","o":["fall","rise","remain unchanged","rise only for long-term bonds"],"a":0,"s":"<p>A bond's price is the PV of its fixed cash flows; a higher discount rate lowers that PV.<br>Other options: B — bond prices and yields move in opposite directions; C — fixed coupons become less attractive, so prices adjust; D — long-term bond prices fall even more.<\/p>","tag":""},{"id":"5.3.27","q":"<p>A 2-year bond has a face value of Rs 1,000 and pays an 8 per cent annual coupon. If the required yield is 10 per cent, its price is about<\/p>","o":["Rs 1,000.00","Rs 1,036.67","Rs 960.00","Rs 965.29"],"a":3,"s":"<p>Price = 80/1.1 + 1,080/1.1² = 72.73 + 892.56 = Rs 965.29. It sells at a discount because the yield exceeds the coupon.<br>Other options: A — price equals face value only when the yield equals the coupon rate; B — this is the price at a 6 per cent yield, i.e. a premium price; C — an approximation that is not a correct discounting.<\/p>","tag":""},{"id":"5.3.28","q":"<p>A company has just paid a dividend of Rs 10 per share (D0). Dividends are expected to grow at 5 per cent a year for ever, and the required return is 15 per cent. Using the Gordon growth model, the share's value is<\/p>","o":["Rs 100","Rs 105","Rs 70","Rs 52.50"],"a":1,"s":"<p>D1 = 10 × 1.05 = 10.50. P0 = D1/(k − g) = 10.50/(0.15 − 0.05) = Rs 105.<br>Other options: A — uses D0 instead of D1 = D0 × 1.05; C — divides D1 by the required return without subtracting growth; D — adds growth to the required return in the denominator.<\/p>","tag":""},{"id":"5.3.29","q":"<p>Which holders of a company's securities are the residual claimants on its income and assets, and normally have voting rights?<\/p>","o":["Debenture holders","Equity shareholders","Preference shareholders","Bondholders"],"a":1,"s":"<p>Equity (ordinary) shareholders are owners: they receive what is left after all prior claims are met.<br>Other options: A — they are creditors with a fixed claim to interest and principal; C — they have a preferential fixed dividend and normally no voting rights; D — they are creditors, paid before any shareholders.<\/p>","tag":""},{"id":"5.3.30","q":"<p>A firm is financed 60 per cent by equity costing 15 per cent and 40 per cent by debt with a pre-tax cost of 10 per cent. The tax rate is 20 per cent. Its weighted average cost of capital (WACC) is<\/p>","o":["12.2 per cent","13.0 per cent","11.5 per cent","12.5 per cent"],"a":0,"s":"<p>After-tax cost of debt = 10 × (1 − 0.20) = 8 per cent. WACC = 0.6 × 15 + 0.4 × 8 = 9 + 3.2 = 12.2 per cent.<br>Other options: B — uses the pre-tax cost of debt; C — takes the simple average of 15 and 8 instead of weighting; D — takes the simple average of 15 and 10 per cent.<\/p>","tag":""}]},{"k":"5.4","t":"Microeconomics","items":[{"id":"5.4.1","q":"<p>The law of demand states that, other things remaining the same,<\/p>","o":["quantity demanded varies directly with price","quantity demanded varies inversely with price","demand rises when income rises","price is determined by cost of production"],"a":1,"s":"<p>Ceteris paribus, a fall in price raises quantity demanded and a rise in price lowers it.<br>Other options: A — this describes the law of supply for sellers; C — this is about income, not price, and holds only for normal goods; D — this is a cost theory of value, not the law of demand.<\/p>","tag":""},{"id":"5.4.2","q":"<p>A movement along a given demand curve is caused by a change in<\/p>","o":["the price of the good itself","consumers' income","the price of a related good","consumers' tastes"],"a":0,"s":"<p>Own-price changes cause extension or contraction along the curve. Other determinants shift the curve (increase or decrease in demand).<br>Other options: B — shifts the whole demand curve; C — shifts the whole demand curve; D — shifts the whole demand curve.<\/p>","tag":""},{"id":"5.4.3","q":"<p>If the price of tea rises sharply, the demand curve for coffee (a substitute) will<\/p>","o":["shift to the right","shift to the left","remain unchanged","become vertical"],"a":0,"s":"<p>Consumers switch from dearer tea to coffee, so more coffee is demanded at every price.<br>Other options: B — this would happen for a complement, not a substitute; C — the price of a related good is a demand determinant; D — the slope is not changed this way.<\/p>","tag":""},{"id":"5.4.4","q":"<p>A good whose quantity demanded rises when its price rises, because it is an inferior staple with a strong negative income effect, is a<\/p>","o":["Veblen good","normal good","Giffen good","complementary good"],"a":2,"s":"<p>For a Giffen good the income effect (which is negative and large) outweighs the substitution effect, so the demand curve slopes upward.<br>Other options: A — Veblen goods are demanded more at high prices for prestige, not because of an income effect; B — a normal good obeys the law of demand; D — complementarity concerns the relation between two goods.<\/p>","tag":""},{"id":"5.4.5","q":"<p>When the price of a good rises from Rs 10 to Rs 12, quantity demanded falls from 100 to 90 units. Using percentage changes measured from the initial values, the price elasticity of demand (in absolute terms) is<\/p>","o":["2","1","0.5","0.2"],"a":2,"s":"<p>%ΔQ = 10/100 = 10 per cent. %ΔP = 2/10 = 20 per cent. Ed = 10/20 = 0.5 (inelastic).<br>Other options: A — divides the percentage change in price by that in quantity; B — assumes unit elasticity; D — uses the absolute changes 2/10 instead of percentages.<\/p>","tag":""},{"id":"5.4.6","q":"<p>Price rises from Rs 20 to Rs 30 and quantity demanded falls from 50 to 30 units. Using the midpoint (arc) formula, the price elasticity of demand (in absolute terms) is<\/p>","o":["1.25","0.8","2.0","0.67"],"a":0,"s":"<p>%ΔQ = 20/40 = 0.5. %ΔP = 10/25 = 0.4. Arc elasticity = 0.5/0.4 = 1.25.<br>Other options: B — uses initial values instead of midpoints; C — divides quantity change by price change without using percentages; D — an arithmetic slip from mixing bases.<\/p>","tag":""},{"id":"5.4.7","q":"<p>If the demand for a good is price elastic (|Ed| > 1), a cut in its price will<\/p>","o":["decrease total revenue","leave total revenue unchanged","increase total revenue","reduce the quantity demanded"],"a":2,"s":"<p>With elastic demand, the percentage rise in quantity exceeds the percentage fall in price, so P × Q rises.<br>Other options: A — this happens when demand is inelastic; B — this happens only when demand is unitary elastic; D — a price cut raises quantity demanded.<\/p>","tag":""},{"id":"5.4.8","q":"<p>A good with a negative income elasticity of demand is<\/p>","o":["a normal good","a luxury good","a necessity","an inferior good"],"a":3,"s":"<p>When income rises, people buy less of an inferior good, so income elasticity is negative.<br>Other options: A — normal goods have positive income elasticity; B — luxuries have income elasticity greater than 1; C — necessities have income elasticity between 0 and 1.<\/p>","tag":""},{"id":"5.4.9","q":"<p>If the cross elasticity of demand between two goods is positive, the goods are<\/p>","o":["substitutes","complements","unrelated","inferior goods"],"a":0,"s":"<p>A rise in the price of one raises the demand for the other, as with tea and coffee.<br>Other options: B — complements have negative cross elast
