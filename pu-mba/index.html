},{"id":"M1.4.20","q":"<p>The Strait of Gibraltar separates<\/p>","o":["Italy and Tunisia","Spain and Morocco","the European and Asian parts of Turkey","the United Kingdom and France"],"a":1,"s":"<p>The Strait of Gibraltar links the Atlantic Ocean with the Mediterranean Sea and separates Spain (Europe) from Morocco (Africa).<br>Other options: A — separated by the Strait of Sicily; C — separated by the Bosporus; D — separated by the Strait of Dover.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M1.4.21","q":"<p>The first summit of the Non-Aligned Movement, attended by Nepal as a founding member, was held in 1961 in<\/p>","o":["Bandung","Cairo","Belgrade","New Delhi"],"a":2,"s":"<p>The Non-Aligned Movement held its first summit in Belgrade, Yugoslavia, in September 1961.<br>Other options: A — the Asian-African Conference of 1955, a forerunner, was held there; B — hosted the second summit (1964); D — hosted the seventh summit (1983).<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M1.4.22","q":"<p>What is the SI unit of electric current?<\/p>","o":["volt","ohm","ampere","watt"],"a":2,"s":"<p>The ampere (A) is the SI base unit of electric current.<br>Other options: A — the unit of potential difference; B — the unit of resistance; D — the unit of power.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M1.4.23","q":"<p>The first Asian to win a Nobel Prize (Literature, 1913) was<\/p>","o":["Rabindranath Tagore","C.V. Raman","Mahatma Gandhi","Amartya Sen"],"a":0,"s":"<p>Rabindranath Tagore received the 1913 Nobel Prize in Literature, chiefly for \"Gitanjali\".<br>Other options: B — won the Nobel Prize in Physics in 1930; C — never received a Nobel Prize; D — won the economics prize in 1998.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M1.4.24","q":"<p>In 2019, Nirmal \"Nims\" Purja set a record by climbing all 14 peaks above 8,000 m in about<\/p>","o":["two years","six months","one month","ten years"],"a":1,"s":"<p>Between April and October 2019 he climbed all 14 eight-thousanders in about six months (189 days), breaking the previous record of almost eight years. (The record has since been bettered, in 2023.)<br>Other options: A — his expedition, Project Possible, took about 189 days; C — far shorter than his actual time; D — the earlier record was nearly eight years.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M1.4.25","q":"<p>Radio Nepal, the national radio broadcaster, was established in<\/p>","o":["1985","1951","1960","1943"],"a":1,"s":"<p>Radio Nepal was established on 2 April 1951, shortly after the end of Rana rule (it grew out of Prajatantra Radio in Biratnagar).<br>Other options: A — the year Nepal Television began; C — not the founding year; D — before the end of Rana rule; not the founding year.<\/p>","tag":"4.6 Science and technology, sports, awards and books"}]}]},{"m":2,"secs":[{"t":"Section 1 · Quantitative Ability (25)","items":[{"id":"M2.1.1","q":"<p>What is the LCM of 16, 24 and 40?<\/p>","o":["480","240","120","960"],"a":1,"s":"<p>16 = 2⁴, 24 = 2³ × 3, 40 = 2³ × 5. Take the highest power of each prime: 2⁴ × 3 × 5 = 240.<br>Other options: A — a common multiple, but not the least; C — 120 is not divisible by 16; D — a common multiple, but not the least.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M2.1.2","q":"<p>What is the remainder when 3⁴⁰ is divided by 7?<\/p>","o":["1","3","2","4"],"a":3,"s":"<p>Powers of 3 mod 7 repeat every 6: 3, 2, 6, 4, 5, 1. 40 = 6 × 6 + 4, so 3⁴⁰ leaves the same remainder as 3⁴ = 81, and 81 = 7 × 11 + 4.<br>Other options: A — this would be true only if 40 were a multiple of 6; B — this is the remainder of 3¹ (or 3⁷), not 3⁴⁰; C — this is the remainder of 3² (9 ÷ 7), not 3⁴.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M2.1.3","q":"<p>Which of the following is the largest?<\/p>","o":["√3","⁴√10","∛5","⁶√30"],"a":1,"s":"<p>Raise each to the 12th power: (√3)¹² = 3⁶ = 729, (∛5)¹² = 5⁴ = 625, (⁴√10)¹² = 10³ = 1000, (⁶√30)¹² = 30² = 900. The largest is ⁴√10.<br>Other options: A — √3 ≈ 1.732, the second smallest of the four; C — ∛5 ≈ 1.710, the smallest; D — ⁶√30 ≈ 1.763, close but smaller than ⁴√10.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M2.1.4","q":"<p>How many numbers from 1 to 300 are divisible by 4 or by 6?<\/p>","o":["125","75","150","100"],"a":3,"s":"<p>Multiples of 4: 75; of 6: 50; of both (i.e. of 12): 25. Answer = 75 + 50 − 25 = 100.<br>Other options: A — this adds 75 + 50 without removing the multiples of 12; B — this counts only the multiples of 4; C — this adds the multiples of 12 instead of subtracting them.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M2.1.5","q":"<p>In an examination, 65% of candidates passed in English, 55% passed in Mathematics and 30% passed in both. What percentage failed in both subjects?<\/p>","o":["10%","30%","0%","35%"],"a":0,"s":"<p>Passed in at least one = 65 + 55 − 30 = 90%. Failed in both = 100 − 90 = 10%.<br>Other options: B — this is the share who passed in both; C — this ignores the 30% counted twice; D — this is 100 − 65, those who failed English.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M2.1.6","q":"<p>By selling a watch for Rs 1,680, a man gains 12%. What is the cost price of the watch?<\/p>","o":["Rs 1,478.40","Rs 1,880","Rs 1,500","Rs 1,560"],"a":2,"s":"<p>SP = 1.12 × CP, so CP = 1680 ÷ 1.12 = Rs 1,500.<br>Other options: A — this subtracts 12% of the selling price; B — this adds the gain instead of removing it; D — this subtracts Rs 120 without working out the percentage.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M2.1.7","q":"<p>What is the simple interest on Rs 6,000 at 9% per annum for 2 years 6 months?<\/p>","o":["Rs 1,350","Rs 1,080","Rs 1,620","Rs 1,404"],"a":0,"s":"<p>SI = 6000 × 9 × 2.5 / 100 = Rs 1,350.<br>Other options: B — this uses only 2 years; C — this uses 3 years; D — this treats 2 years 6 months as 2.6 years.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M2.1.8","q":"<p>At what rate of compound interest per annum will Rs 8,000 amount to Rs 9,680 in 2 years?<\/p>","o":["10.5%","21%","10%","12%"],"a":2,"s":"<p>(1 + r)² = 9680/8000 = 1.21, so 1 + r = 1.1 and r = 10%.<br>Other options: A — this is the simple-interest rate (1,680 ÷ 8,000 ÷ 2); B — this is the total two-year growth, not the annual rate; D — this gives 8,000 × 1.2544 = 10,035, too much.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M2.1.9","q":"<p>Two numbers are in the ratio 5 : 7. If 6 is added to each, the ratio becomes 7 : 9. What is the larger number?<\/p>","o":["15","27","21","28"],"a":2,"s":"<p>(5x + 6)/(7x + 6) = 7/9, so 45x + 54 = 49x + 42, 4x = 12, x = 3. The numbers are 15 and 21.<br>Other options: A — this is the smaller number; B — this is the larger number after adding 6; D — this is 7 × 4, taking x = 4 instead of 3.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M2.1.10","q":"<p>The average of four consecutive even numbers is 27. What is the largest of them?<\/p>","o":["28","30","29","33"],"a":1,"s":"<p>The average of four consecutive even numbers lies midway between the 2nd and 3rd: 26 and 28. The numbers are 24, 26, 28, 30.<br>Other options: A — this is the third number; C — this is odd, so it cannot be one of them; D — this adds 6 to the average instead of 3.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M2.1.11","q":"<p>A and B start a business with Rs 25,000 and Rs 35,000 respectively for one year. Out of a profit of Rs 18,000, what is B's share?<\/p>","o":["Rs 10,500","Rs 7,500","Rs 9,000","Rs 12,600"],"a":0,"s":"<p>Profit is shared in the ratio 25 : 35 = 5 : 7. B's share = 7/12 × 18,000 = Rs 10,500.<br>Other options: B — this is A's share; C — this splits the profit equally; D — this takes 35/50 instead of 35/60.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M2.1.12","q":"<p>An 80-litre mixture contains milk and water in the ratio 7 : 1. How much water must be added to make the ratio 5 : 3?<\/p>","o":["20 litres","32 litres","30 litres","42 litres"],"a":1,"s":"<p>Milk = 70 L, water = 10 L. Need 70/(10 + w) = 5/3, so 210 = 50 + 5w, w = 32 litres.<br>Other options: A — this gives 70 : 30 = 7 : 3; C — this gives 70 : 40 = 7 : 4; D — this is the total water after adding, not the amount added.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M2.1.13","q":"<p>6 men can finish a job in 10 days. How many men are needed to finish it in 4 days?<\/p>","o":["15","12","24","10"],"a":0,"s":"<p>Work = 6 × 10 = 60 man-days. Men needed = 60 ÷ 4 = 15.<br>Other options: B — this is not consistent with 60 man-days; C — this multiplies 6 by 4; D — this uses the number of days as the answer.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M2.1.14","q":"<p>A pipe can fill a tank in 10 hours. Because of a leak at the bottom, it takes 12 hours to fill it. In how long can the leak empty the full tank?<\/p>","o":["2 hours","22 hours","30 hours","60 hours"],"a":3,"s":"<p>Leak rate = 1/10 − 1/12 = 1/60 of the tank per hour, so the leak empties it in 60 hours.<br>Other options: A — this simply subtracts 10 from 12; B — this adds the times; C — this halves the correct answer.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M2.1.15","q":"<p>A person crosses a 600 m long street in 5 minutes. What is his speed?<\/p>","o":["2 km/h","7.2 km/h","12 km/h","3.6 km/h"],"a":1,"s":"<p>Speed = 600 m ÷ 300 s = 2 m/s = 2 × 18/5 = 7.2 km/h.<br>Other options: A — this is the speed in m/s written as km/h; C — this divides 600 by 50 instead of converting units; D — this is half the correct speed.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M2.1.16","q":"<p>Two trains start at the same time from stations A and B, 300 km apart, and move towards each other at 70 km/h and 80 km/h. How far from A do they meet?<\/p>","o":["160 km","140 km","150 km","210 km"],"a":1,"s":"<p>Relative speed = 150 km/h, so they meet after 300 ÷ 150 = 2 hours. The train from A has gone 70 × 2 = 140 km.<br>Other options: A — this is the distance from B; C — this assumes equal speeds; D — this is 70 × 3, using the wrong time.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M2.1.17","q":"<p>Walking at 5 km/h, a student reaches school 6 minutes late; walking at 6 km/h, he reaches 4 minutes early. How far is the school?<\/p>","o":["6 km","1 km","10 km","5 km"],"a":3,"s":"<p>The time difference is 6 + 4 = 10 minutes = 1/6 hour. d/5 − d/6 = 1/6, so d/30 = 1/6 and d = 5 km.<br>Other options: A — this does not give a 10-minute difference; B — this uses 6 − 4 = 2 minutes instead of 6 + 4 = 10 minutes; C — this gives a 20-minute difference.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M2.1.18","q":"<p>If 2x − 3y = 7 and 3x + 2y = 4, what is the value of y?<\/p>","o":["1","2","−2","−1"],"a":3,"s":"<p>Multiply the first equation by 2 and the second by 3: 4x − 6y = 14 and 9x + 6y = 12. Adding, 13x = 26, x = 2. Then 4 − 3y = 7, so y = −1.<br>Other options: A — the sign is wrong; B — this is the value of x; C — this does not satisfy 2x − 3y = 7 with x = 2.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M2.1.19","q":"<p>How many terms are there in the arithmetic progression 7, 11, 15, …, 107?<\/p>","o":["26","25","27","100"],"a":0,"s":"<p>n = (107 − 7)/4 + 1 = 25 + 1 = 26.<br>Other options: B — this forgets to add 1 after dividing the gap by 4; C — this adds 2 instead of 1; D — this is the gap 107 − 7, not the number of terms.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M2.1.20","q":"<p>Each exterior angle of a regular polygon is 24°. How many sides does it have?<\/p>","o":["12","24","15","18"],"a":2,"s":"<p>The exterior angles of any polygon add up to 360°, so n = 360 ÷ 24 = 15.<br>Other options: A — this would give exterior angles of 30°; B — this uses the angle as the number of sides; D — this would give exterior angles of 20°.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M2.1.21","q":"<p>A rectangular field 40 m long and 30 m wide has a path 2.5 m wide running all round it on the outside. What is the area of the path?<\/p>","o":["350 m²","375 m²","175 m²","1,575 m²"],"a":1,"s":"<p>Outer rectangle = (40 + 5) × (30 + 5) = 45 × 35 = 1,575 m². Path = 1,575 − 40 × 30 = 375 m².<br>Other options: A — this multiplies the perimeter (140 m) by 2.5 and forgets the four corner squares; C — this is half of perimeter × width; D — this is the area of the field and path together.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M2.1.22","q":"<p>Study the table and answer: what is the ratio of total enrolment in 2022 to that in 2024?<br>Students enrolled in a college<\/p><div class=\"tw\"><table><thead><tr><th>Course<\/th><th>2022<\/th><th>2023<\/th><th>2024<\/th><\/tr><\/thead><tbody><tr><td>BBA<\/td><td>120<\/td><td>150<\/td><td>180<\/td><\/tr><tr><td>BBS<\/td><td>200<\/td><td>180<\/td><td>160<\/td><\/tr><tr><td>BIM<\/td><td>80<\/td><td>90<\/td><td>100<\/td><\/tr><\/tbody><\/table><\/div>","o":["10 : 11","11 : 10","2 : 3","5 : 4"],"a":0,"s":"<p>Total 2022 = 120 + 200 + 80 = 400; total 2024 = 180 + 160 + 100 = 440. Ratio 400 : 440 = 10 : 11.<br>Other options: B — this reverses the ratio; C — this compares BBA only (120 : 180); D — this compares BBS only (200 : 160).<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M2.1.23","q":"<p>Using the same table (BBA 120, 150, 180; BBS 200, 180, 160; BIM 80, 90, 100 in 2022, 2023, 2024), BBA students formed approximately what percentage of all students in 2024?<\/p>","o":["45%","37.5%","36.4%","40.9%"],"a":3,"s":"<p>BBA share in 2024 = 180 ÷ 440 × 100 ≈ 40.9%.<br>Other options: A — this divides 180 by 400, the 2022 total; B — this divides 180 by 480 instead of 440; C — this is the BBS share (160/440), not BBA.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M2.1.24","q":"<p>Two fair dice are thrown. What is the probability that the total is 10 or more?<\/p>","o":["1/12","1/4","1/6","5/36"],"a":2,"s":"<p>Favourable: (4,6), (5,5), (6,4), (5,6), (6,5), (6,6) = 6 of 36 outcomes. Probability = 6/36 = 1/6.<br>Other options: A — this counts only (4,6), (5,5) and (6,4); B — this counts 9 outcomes; D — this misses one outcome.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M2.1.25","q":"<p>The mean of 20 observations is 15. If each observation is multiplied by 3 and then 2 is subtracted, what is the new mean?<\/p>","o":["45","13","43","39"],"a":2,"s":"<p>The mean changes in the same way as each observation: 3 × 15 − 2 = 43.<br>Other options: A — this multiplies by 3 but forgets to subtract 2; B — this subtracts 2 but forgets to multiply; D — this subtracts 2 before multiplying by 3.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"}]},{"t":"Section 2 · Verbal Ability (25)","items":[{"id":"M2.2.1","q":"<p>Choose the word closest in meaning to EXACERBATE.<\/p>","o":["alleviate","exaggerate","examine","worsen"],"a":3,"s":"<p>To exacerbate a problem is to make it worse.<br>Other options: A — this is the opposite; B — a look-alike word meaning to overstate; C — unrelated.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.2.2","q":"<p>Choose the word most nearly opposite in meaning to ZEALOUS.<\/p>","o":["eager","jealous","apathetic","fanatical"],"a":2,"s":"<p>Zealous means full of eager enthusiasm; its opposite is apathetic (showing no interest or enthusiasm).<br>Other options: A — this is a synonym; B — a sound-alike trap; D — this is an extreme form of zealous.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.2.3","q":"<p>Choose the word closest in meaning to AUSTERE.<\/p>","o":["luxurious","strict and plain","ancient","generous"],"a":1,"s":"<p>Austere means severe or strict in manner, or plain and without luxury.<br>Other options: A — this is the opposite; C — unrelated; D — unrelated.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.2.4","q":"<p>Choose the word most nearly opposite in meaning to VERACITY.<\/p>","o":["truthfulness","falsehood","speed","courage"],"a":1,"s":"<p>Veracity means truthfulness; its opposite is falsehood.<br>Other options: A — this is a synonym; C — a confusion with \"velocity\"; D — a confusion with \"valour\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.2.5","q":"<p>In which sentence is the word \"imminent\" used correctly?<\/p>","o":["The dark clouds warned us that a storm was imminent.","He is an imminent scientist known all over the world.","Her imminent career in medicine spanned forty years.","The imminent leader was honoured at the ceremony."],"a":0,"s":"<p>\"Imminent\" means about to happen. \"Eminent\" means famous and respected.<br>Other options: B — \"famous and respected\" is \"eminent\"; C — a career that already spanned years is \"eminent\", not about to happen; D — \"eminent\" (distinguished) is meant.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.2.6","q":"<p>Choose the word that best completes the sentence: \"The witness's account was ___; every detail matched the CCTV footage.\"<\/p>","o":["dubious","contradictory","vague","credible"],"a":3,"s":"<p>An account confirmed in every detail is believable: credible.<br>Other options: A — a doubtful account would not match every detail; B — the details agreed, so the account did not contradict itself; C — a vague account would not give details that match.<\/p>","tag":"1.2 Sentence completion"},{"id":"M2.2.7","q":"<p>Fill in the blank: \"He was accused ___ stealing the documents.\"<\/p>","o":["with","for","of","about"],"a":2,"s":"<p>The verb \"accuse\" is followed by \"of\": accused of stealing.<br>Other options: A — \"charged with\" takes \"with\", but \"accused\" takes \"of\"; B — wrong preposition after \"accused\"; D — wrong preposition after \"accused\".<\/p>","tag":"1.2 Sentence completion"},{"id":"M2.2.8","q":"<p>Fill in the blank: \"I wish I ___ more time to prepare for the test.\"<\/p>","o":["have","would have","will have","had"],"a":3,"s":"<p>For a wish about the present, \"wish\" is followed by the past simple: \"I wish I had more time.\"<br>Other options: A — a wish about the present needs a past form; B — \"wish … would\" is not used for one's own present situation; C — the future form is not used after \"wish\".<\/p>","tag":"1.2 Sentence completion"},{"id":"M2.2.9","q":"<p>Choose the pair that best completes the sentence: \"The minister's speech was so ___ that even her ___ admitted it was convincing.\"<\/p>","o":["dull, critics","persuasive, admirers","persuasive, critics","confusing, opponents"],"a":2,"s":"<p>\"Even\" suggests that the people admitting it were unlikely to do so, i.e. her critics, and \"convincing\" requires a persuasive speech.<br>Other options: A — a dull speech would not be called convincing; B — \"even\" signals surprise; admirers praising her is no surprise; D — a confusing speech would not be convincing.<\/p>","tag":"1.2 Sentence completion"},{"id":"M2.2.10","q":"<p>Choose the word that best completes the sentence: \"Because of the economic slowdown, the company decided to ___ its expansion plans until next year.\"<\/p>","o":["launch","accelerate","shelve","publicise"],"a":2,"s":"<p>To shelve a plan is to postpone it, which fits \"until next year\".<br>Other options: A — launching contradicts \"until next year\"; B — speeding up does not fit a slowdown; D — announcing the plans does not fit \"until next year\".<\/p>","tag":"1.2 Sentence completion"},{"id":"M2.2.11","q":"<p>Which part of the sentence contains an error?<br>\"Many a student / have failed / in this paper.\"<\/p>","o":["Many a student","have failed","in this paper","No error"],"a":1,"s":"<p>\"Many a\" is followed by a singular noun and a singular verb: \"Many a student has failed in this paper.\"<br>Other options: A — this phrase is correct; C — this part is correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.2.12","q":"<p>Which part of the sentence contains an error?<br>\"Neither of the two answers / are / correct.\"<\/p>","o":["Neither of the two answers","are","correct","No error"],"a":1,"s":"<p>\"Neither\" (meaning not one of the two) takes a singular verb: \"Neither of the two answers is correct.\"<br>Other options: A — this part is correct; C — this part is correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.2.13","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["He is one of those men who always help others.","The boy whom I thought was honest cheated me.","He is elder than his cousin.","Let he and I finish the work."],"a":0,"s":"<p>\"Who\" refers to \"men\" (plural), so the plural verb \"help\" is correct.<br>Other options: B — \"who\" is needed as the subject of \"was honest\"; C — \"elder\" is not used with \"than\"; \"older\" is correct; D — after \"let\", object pronouns are needed: \"him and me\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.2.14","q":"<p>Which part of the sentence contains an error?<br>\"She laid / on the sofa / all afternoon.\"<\/p>","o":["She laid","on the sofa","all afternoon","No error"],"a":0,"s":"<p>\"Lay\" (past of \"lie\", to recline) is needed: \"She lay on the sofa.\" \"Laid\" is the past of \"lay\", which needs an object (laid the book down).<br>Other options: B — this part is correct; C — this part is correct; D — there is a verb error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"p":"<p><b>Passage 1<\/b><br>Electricity is cheapest to produce when demand is low and most expensive at the evening peak, when extra power plants must be switched on or power must be imported. Yet most households pay the same price for a unit of electricity whatever the hour. Economists argue that this hides the true cost of evening consumption and encourages people to run washing machines, water pumps and irons at exactly the wrong time. Time-of-day tariffs, which charge more during peak hours and less at night, are meant to correct this. Where they have been tried, many households shifted some use to cheaper hours, flattening the peak and reducing the need for costly new capacity. Critics worry that poorer families, who have little flexible use to shift, may simply pay more. Supporters reply that the tariff can be designed so that a household with typical habits pays no more than before, while anyone willing to change gains. The real obstacle, they suggest, is not fairness but metering: the scheme needs meters that record when power is used, and these cost money to install.<\/p>"},{"id":"M2.2.15","q":"<p>(Passage 1) What is the main purpose of the passage?<\/p>","o":["to argue that electricity should be free at night","to describe how power plants are built","to explain the case for time-of-day electricity tariffs and the objections to them","to criticise economists for ignoring poor households"],"a":2,"s":"<p>The passage sets out why economists favour time-of-day tariffs, the evidence for them, and the objections (fairness and metering).<br>Other options: A — the passage says night power should be cheaper, not free; B — plants are mentioned only in passing; D — the concern about the poor comes from critics, and supporters answer it.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.2.16","q":"<p>(Passage 1) According to the passage, a single price for every hour<\/p>","o":["makes electricity too expensive at night.","hides the higher cost of supplying power at peak times.","requires new meters to be installed.","benefits poor households the most."],"a":1,"s":"<p>Economists argue that a flat price \"hides the true cost of evening consumption\".<br>Other options: A — the passage does not say this; C — new meters are needed for time-of-day tariffs, not for a flat price; D — not stated in the passage.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.2.17","q":"<p>(Passage 1) According to the supporters, the main obstacle to time-of-day tariffs is<\/p>","o":["unfairness to poorer families.","a shortage of power at night.","opposition from economists.","the cost of installing meters that record when power is used."],"a":3,"s":"<p>The last sentence: \"The real obstacle, they suggest, is not fairness but metering\".<br>Other options: A — this is the critics' view, which supporters reject; B — power is cheapest at night; C — economists favour the tariffs.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.2.18","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. As the water rose, families carried what they could to the school on the hill.<br>Q. Heavy rain fell on the village for three days without a break.<br>R. By the fourth morning, the river had burst its banks.<br>S. Volunteers from the town arrived that evening with food and blankets.<\/p>","o":["RQPS","QRPS","QPRS","QRSP"],"a":1,"s":"<p>Cause to effect in time order: rain (Q), river bursts (R), families move (P), help arrives (S).<br>Other options: A — the flood (R) is the result of the rain (Q), so Q comes first; C — the water cannot rise before the river bursts its banks; D — \"that evening\" in S follows the families' move to the school.<\/p>","tag":"1.5 Para jumbles"},{"id":"M2.2.19","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. It is calculated by dividing net profit by total revenue.<br>Q. Investors watch several ratios to judge a company's health.<br>R. A high margin suggests that the firm controls its costs well.<br>S. One of the most common is the net profit margin.<\/p>","o":["QSPR","SQPR","QPSR","QSRP"],"a":0,"s":"<p>Q introduces ratios; S names one; P defines it (\"It\"); R interprets a high value.<br>Other options: B — \"One of the most common\" needs the ratios mentioned in Q first; C — \"It\" in P refers to the net profit margin named in S; D — the definition (P) should come before its interpretation (R).<\/p>","tag":"1.5 Para jumbles"},{"id":"M2.2.20","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Still, she refused to give up.<br>Q. Maya failed her driving test twice.<br>R. On her third attempt, she passed with ease.<br>S. She booked extra lessons and practised every morning.<\/p>","o":["PQSR","QSPR","QPRS","QPSR"],"a":3,"s":"<p>Failure (Q), determination (P), effort (S), success (R).<br>Other options: A — \"Still\" in P must follow the failures in Q; B — P (\"refused to give up\") leads naturally into the extra practice in S; C — the practice (S) must come before passing the third attempt (R).<\/p>","tag":"1.5 Para jumbles"},{"id":"M2.2.21","q":"<p>Choose the correct meaning of the idiom \"to break the ice\".<\/p>","o":["to break a promise","to cause trouble in a group","to say or do something that eases the tension when people first meet","to win a difficult contest"],"a":2,"s":"<p>To break the ice is to make people who do not know each other feel more relaxed.<br>Other options: A — unrelated; B — the opposite effect; D — unrelated.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M2.2.22","q":"<p>Choose the correct meaning of the idiom \"a dark horse\".<\/p>","o":["a dishonest person","an unlucky person","a secret enemy","a little-known competitor who unexpectedly does well"],"a":3,"s":"<p>A dark horse is a candidate or competitor about whom little is known but who wins or succeeds unexpectedly.<br>Other options: A — this is closer to \"a snake in the grass\"; B — unrelated; C — unrelated.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M2.2.23","q":"<p>Choose the one word for: \"A cure for all diseases or problems.\"<\/p>","o":["placebo","antidote","panacea","vaccine"],"a":2,"s":"<p>A panacea is a remedy for all ills.<br>Other options: A — a harmless substance given for psychological effect; B — a remedy for a particular poison; D — protects against a particular disease.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M2.2.24","q":"<p>Choose the one word for: \"One who hates mankind.\"<\/p>","o":["misanthrope","philanthropist","misogynist","pessimist"],"a":0,"s":"<p>A misanthrope (Greek misos, hatred + anthropos, man) dislikes humankind.<br>Other options: B — one who loves mankind and gives to good causes; C — one who hates women; D — one who expects the worst.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M2.2.25","q":"<p>Choose the word that completes the analogy. Water : Thirst :: Food : ?<\/p>","o":["Hunger","Taste","Kitchen","Cook"],"a":0,"s":"<p>Water satisfies thirst; food satisfies hunger.<br>Other options: B — food has taste, but water relieves thirst, so food relieves hunger; C — a place, not a need; D — a person, not a need.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"}]},{"t":"Section 3 · Logical Reasoning (25)","items":[{"id":"M2.3.1","q":"<p>Find the next term: 3, 4, 8, 17, 33, ?<\/p>","o":["49","58","50","57"],"a":1,"s":"<p>The differences are 1, 4, 9, 16 (squares of 1, 2, 3, 4), so the next difference is 25: 33 + 25 = 58.<br>Other options: A — this adds 16 again; C — this adds 17; D — this adds 24.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M2.3.2","q":"<p>Find the next term: 1, 1, 2, 3, 5, 8, 13, ?<\/p>","o":["20","18","26","21"],"a":3,"s":"<p>Each term is the sum of the two before it (Fibonacci series): 8 + 13 = 21.<br>Other options: A — this adds 7; B — this adds 5; C — this doubles 13.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M2.3.3","q":"<p>Find the next term: AB, DE, GH, JK, ?<\/p>","o":["MN","LM","NO","KL"],"a":0,"s":"<p>Each pair starts 3 letters after the previous pair's first letter: A, D, G, J, M. So the next pair is MN.<br>Other options: B — this moves 2 places instead of 3; C — this moves 4 places; D — this moves 1 place.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M2.3.4","q":"<p>Flower : Petal :: Book : ?<\/p>","o":["Author","Library","Read","Page"],"a":3,"s":"<p>A petal is a part of a flower; a page is a part of a book.<br>Other options: A — the writer, not a part of the book; B — where books are kept; C — what is done with a book.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M2.3.5","q":"<p>Which one is the odd one out: Copper, Iron, Brass, Silver?<\/p>","o":["Brass","Copper","Iron","Silver"],"a":0,"s":"<p>Copper, iron and silver are elements; brass is an alloy of copper and zinc.<br>Other options: B — a pure metal (element); C — a pure metal (element); D — a pure metal (element).<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M2.3.6","q":"<p>If CAT is coded as 3120 (each letter replaced by its position in the alphabet), how is DOG coded?<\/p>","o":["4156","4157","3157","4147"],"a":1,"s":"<p>C = 3, A = 1, T = 20 gives 3120. D = 4, O = 15, G = 7 gives 4157.<br>Other options: A — G is 7, not 6; C — D is 4, not 3; D — O is 15, not 14.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.7","q":"<p>If BRAIN is coded as CQBHO, how is HEART coded?<\/p>","o":["IFBSU","GDZQS","IDBQU","IDBSU"],"a":2,"s":"<p>The letters alternately move +1 and −1: B+1 = C, R−1 = Q, A+1 = B, I−1 = H, N+1 = O. So H→I, E→D, A→B, R→Q, T→U: IDBQU.<br>Other options: A — this adds 1 to every letter; B — this subtracts 1 from every letter; D — R should become Q (−1), not S.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.8","q":"<p>If 3 # 4 = 25 and 5 # 12 = 169, what is 6 # 8?<\/p>","o":["14","100","48","196"],"a":1,"s":"<p>a # b = a² + b²: 9 + 16 = 25, 25 + 144 = 169. So 6 # 8 = 36 + 64 = 100.<br>Other options: A — this simply adds 6 and 8; C — this multiplies 6 and 8; D — this is (6 + 8)².<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.9","q":"<p>In a certain code, ROAD is written as URDG. Which word is written as VWRS in that code?<\/p>","o":["STOP","SPOT","TOPS","POST"],"a":0,"s":"<p>Each letter moves 3 places forward (R→U, O→R, A→D, D→G). Moving VWRS 3 places back gives S, T, O, P: STOP.<br>Other options: B — coding SPOT gives VSRW; C — coding TOPS gives WRSV; D — coding POST gives SRVW.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.10","q":"<p>Pointing to a woman, Arjun says, \"She is the daughter of the only child of my grandmother.\" How is the woman related to Arjun?<\/p>","o":["Sister","Cousin","Mother","Niece"],"a":0,"s":"<p>The only child of Arjun's grandmother is Arjun's parent. The daughter of Arjun's parent is Arjun's sister.<br>Other options: B — a cousin's parent would be a sibling of Arjun's parent, but the parent is an only child; C — the woman is the daughter of Arjun's parent, not the parent; D — a niece is a sibling's daughter.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.11","q":"<p>P is the sister of Q. R is the mother of Q. S is the father of R. T is the mother of S. How is P related to T?<\/p>","o":["Granddaughter","Daughter","Great-granddaughter","Grandmother"],"a":2,"s":"<p>P is R's daughter, R is S's daughter, S is T's son. So P is T's great-granddaughter.<br>Other options: A — P is the granddaughter of S, one generation below T's child; B — P is three generations below T; D — the relation is the other way round.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.12","q":"<p>Gita walks 10 m north, turns right and walks 10 m, turns right again and walks 15 m, then turns left and walks 5 m. In which direction is she now from her starting point?<\/p>","o":["North-east","East","South-west","South-east"],"a":3,"s":"<p>North 10, east 10, south 15, east 5. Net: 15 m east and 5 m south, so she is to the south-east of the start.<br>Other options: A — she ends 5 m south of the start, not north; B — she is also 5 m south of the start; C — all her east-west movement is towards the east.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.13","q":"<p>A cyclist rides 8 km west and then 15 km north. What is the shortest distance between him and his starting point?<\/p>","o":["23 km","7 km","17 km","13 km"],"a":2,"s":"<p>Distance = √(8² + 15²) = √(64 + 225) = √289 = 17 km.<br>Other options: A — this adds the two legs; B — this subtracts the legs; D — this is not √(8² + 15²).<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.14","q":"<p>In a queue of 30 people, Pemba is 10th from the front. Dawa stands behind Pemba with 6 people between them. What is Dawa's position from the back?<\/p>","o":["15th","13th","14th","17th"],"a":2,"s":"<p>Dawa is 10 + 6 + 1 = 17th from the front, so 30 − 17 + 1 = 14th from the back.<br>Other options: A — this places Dawa 16th from the front; B — this forgets the \"+1\" in (total − position + 1); D — this is Dawa's position from the front.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M2.3.15","q":"<p>(Puzzle 1) Five friends A, B, C, D and E sit around a circular table facing the centre. B sits second to the right of A. D sits immediately to the left of B. C is not an immediate neighbour of A.<br>Who sits immediately to the right of B?<\/p>","o":["D","C","E","A"],"a":1,"s":"<p>Going to the right (anticlockwise) from A: A, D, B, C, E. D is immediately left of B, so D sits between A and B; C cannot be next to A, so C takes the seat right of B and E the seat left of A.<br>Other options: A — D is immediately to the left of B; C — E is second to the right of B; D — A is second to the left of B.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M2.3.16","q":"<p>(Puzzle 1) Who sits between A and B?<\/p>","o":["C","E","D","No one"],"a":2,"s":"<p>Order to the right of A: A, D, B, C, E. D is between A and B.<br>Other options: A — C sits on the other side of B; B — E sits on the other side of A; D — there is one seat between A and B, taken by D.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M2.3.17","q":"<p>(Puzzle 1) Who sits immediately to the left of A?<\/p>","o":["D","C","B","E"],"a":3,"s":"<p>Order to the right of A: A, D, B, C, E, and back to A. So E is immediately to the left of A.<br>Other options: A — D is immediately to the right of A; B — C is not a neighbour of A; C — B is second to the right of A.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M2.3.18","q":"<p>Statements: All doctors are graduates. Some graduates are unemployed.<br>Conclusions: I. Some doctors are unemployed. II. All graduates are doctors.<\/p>","o":["Only I follows","Only II follows","Both I and II follow","Neither I nor II follows"],"a":3,"s":"<p>The unemployed graduates may all be non-doctors, so I does not follow. An \"all\" statement cannot simply be reversed, so II does not follow.<br>Other options: A — the unemployed graduates need not include any doctor; B — \"All doctors are graduates\" cannot be reversed to \"all graduates are doctors\"; C — neither follows.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M2.3.19","q":"<p>Statements: Some cars are red. All red things are bright.<br>Conclusions: I. Some cars are bright. II. Some bright things are cars.<\/p>","o":["Both I and II follow","Only I follows","Only II follows","Neither I nor II follows"],"a":0,"s":"<p>The cars that are red are bright, so some cars are bright (I). Its converse, \"some bright things are cars\", also follows (II).<br>Other options: B — II follows too, as the converse of I; C — I follows directly; D — both follow.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M2.3.20","q":"<p>Statement: A traffic police notice says, \"Wear a helmet; it can save your life.\"<br>Assumptions: I. Helmets protect riders in accidents. II. Riders who wear helmets never have accidents.<\/p>","o":["Only II is implicit","Both I and II are implicit","Only I is implicit","Neither I nor II is implicit"],"a":2,"s":"<p>Saying a helmet \"can save your life\" assumes it protects the rider in an accident (I). It does not assume helmet wearers never crash (II).<br>Other options: A — the notice is about surviving accidents, not avoiding them; B — II is not assumed; D — the advice makes sense only if helmets protect riders.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M2.3.21","q":"<p>Statement: Most of the students who failed the entrance test had not attended the preparation classes.<br>Conclusions: I. The preparation classes guarantee success. II. Attending the preparation classes may improve the chance of passing.<\/p>","o":["Only I follows","Only II follows","Both I and II follow","Neither I nor II follows"],"a":1,"s":"<p>The data suggest that the classes may help (II), but cannot show they guarantee success (I).<br>Other options: A — \"guarantee\" is too strong; some who attended may also have failed; C — I does not follow; D — the pattern reasonably supports a possible benefit.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M2.3.22","q":"<p>What is the smaller angle between the hands of a clock at 9:15?<\/p>","o":["180°","187.5°","165°","172.5°"],"a":3,"s":"<p>|30 × 9 − 5.5 × 15| = |270 − 82.5| = 187.5°. The smaller angle is 360 − 187.5 = 172.5°.<br>Other options: A — this ignores the hour hand moving past 9; B — this is the larger (reflex) angle; C — this moves the hour hand the wrong way.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.23","q":"<p>1 January 2026 is a Thursday. What day of the week will 1 January 2027 be?<\/p>","o":["Saturday","Friday","Thursday","Wednesday"],"a":1,"s":"<p>2026 is not a leap year, so it has 365 days = 52 weeks + 1 odd day. Thursday + 1 = Friday.<br>Other options: A — this treats 2026 as a leap year; C — a year always shifts the day; D — this moves backwards.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.24","q":"<p>\"The company should move its call centre from Kathmandu to Pokhara, because salaries in Pokhara are 20 per cent lower.\" Which assumption does this argument depend on?<\/p>","o":["The savings on salaries will not be cancelled out by other costs of moving.","Pokhara attracts more tourists than Kathmandu.","Every current employee is willing to move to Pokhara.","Salaries in Kathmandu will fall next year."],"a":0,"s":"<p>The argument concludes that the move pays off from salary savings alone; it must assume that other moving costs do not outweigh those savings.<br>Other options: B — tourism is irrelevant to the argument; C — the firm could hire locally; this is not needed; D — if anything, this would weaken the argument.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.25","q":"<p>Data sufficiency. Question: Is the integer x divisible by 6?<br>I. x is divisible by 3.<br>II. x is divisible by 4.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["I alone is sufficient","II alone is sufficient","Neither I nor II, even together, is sufficient","Both I and II together are needed"],"a":3,"s":"<p>Together, x is divisible by 3 and 4, hence by 12 and so by 6. Neither statement alone settles it.<br>Other options: A — 3 and 6 are both divisible by 3, but only 6 is divisible by 6; B — 4 is not divisible by 6, but 12 is; C — together they make x a multiple of 12, so the answer is yes.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"}]},{"t":"Section 4 · General Awareness (25)","items":[{"id":"M2.4.1","q":"<p>Lumbini, the birthplace of Gautam Buddha, was inscribed on the UNESCO World Heritage List in<\/p>","o":["1979","1997","1984","2008"],"a":1,"s":"<p>Lumbini, in Rupandehi district, was inscribed as a World Heritage Site in 1997.<br>Other options: A — the year the Kathmandu Valley and Sagarmatha National Park were listed; C — the year Chitwan National Park was listed; D — not the year of Lumbini's listing.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M2.4.2","q":"<p>Nepal's first comprehensive national legal code, the Muluki Ain of 1854, was issued during the rule of<\/p>","o":["Jung Bahadur Rana","Chandra Shumsher","Bhimsen Thapa","Prithvi Narayan Shah"],"a":0,"s":"<p>The Muluki Ain was promulgated in 1854 (1910 BS) under Jung Bahadur Rana, after his visit to Europe.<br>Other options: B — he abolished sati and slavery in the 20th century; C — he died in 1839; D — he died in 1775.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M2.4.3","q":"<p>The 1923 treaty in which Britain formally recognised Nepal's independence was signed when the Rana Prime Minister was<\/p>","o":["Chandra Shumsher","Jung Bahadur","Juddha Shumsher","Mohan Shumsher"],"a":0,"s":"<p>The Nepal–Britain Treaty of Friendship was signed on 21 December 1923, during the premiership of Chandra Shumsher (1901–1929).<br>Other options: B — he died in 1877; C — he became Prime Minister in 1932; D — the last Rana Prime Minister (1948–1951).<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M2.4.4","q":"<p>According to the chronicles, the first Kirat king of the Kathmandu Valley was<\/p>","o":["Manadeva","Amshuverma","Yalambar","Gunakamadeva"],"a":2,"s":"<p>The vamshavalis (chronicles) name Yalambar as the first Kirat king.<br>Other options: A — a Licchavi king (Changunarayan inscription); B — a Licchavi-era ruler who built Kailashkut Bhawan; D — a later king traditionally credited with founding Kantipur.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M2.4.5","q":"<p>Which is the largest national park of Nepal by area?<\/p>","o":["Chitwan National Park","Sagarmatha National Park","Shey Phoksundo National Park","Bardia National Park"],"a":2,"s":"<p>Shey Phoksundo National Park in Dolpa and Mugu (about 3,555 km²) is the largest national park in Nepal.<br>Other options: A — the oldest, but not the largest; B — much smaller; D — the largest in the Terai, but smaller than Shey Phoksundo.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M2.4.6","q":"<p>Which river system of Nepal is named after its seven main tributaries, including the Arun, Tamor and Sun Koshi?<\/p>","o":["Gandaki","Karnali","Mahakali","Koshi"],"a":3,"s":"<p>The Sapta Koshi is formed by seven rivers, among them the Arun, Tamor and Sun Koshi, in eastern Nepal.<br>Other options: A — also called Sapta Gandaki, but its tributaries include the Kali Gandaki and Trishuli, not the Arun or Tamor; B — the longest river; its tributaries include the Bheri and Seti; C — forms the western border.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M2.4.7","q":"<p>Mount Manaslu, the eighth-highest mountain in the world, is in which district?<\/p>","o":["Lamjung","Manang","Dhading","Gorkha"],"a":3,"s":"<p>Manaslu (8,163 m) lies in Gorkha district.<br>Other options: A — west of the Manaslu region; B — has the Annapurna range and Tilicho; C — south-east of Manaslu.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M2.4.8","q":"<p>Which of the following is an Inner Terai (Bhitri Madhes) valley?<\/p>","o":["Pokhara","Kathmandu","Chitwan","Jumla"],"a":2,"s":"<p>The Inner Terai valleys lie between the Chure and Mahabharat ranges; Chitwan, Dang and Surkhet are examples.<br>Other options: A — a hill valley; B — a hill valley; D — a high mountain valley.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M2.4.9","q":"<p>Part 2 of the Constitution of Nepal deals with<\/p>","o":["citizenship","fundamental rights and duties","directive principles, policies and obligations of the State","the federal legislature"],"a":0,"s":"<p>Part 2 (Articles 10–15) covers citizenship.<br>Other options: B — these are in Part 3; C — these are in Part 4; D — this is in Part 8.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M2.4.10","q":"<p>The right to constitutional remedy is guaranteed by which Article?<\/p>","o":["Article 27","Article 16","Article 48","Article 46"],"a":3,"s":"<p>Article 46 lets citizens seek remedies under Article 133 or 144 for the enforcement of fundamental rights.<br>Other options: A — the right to information; B — the right to live with dignity; C — the duties of citizens.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M2.4.11","q":"<p>How many High Courts does the Constitution of Nepal provide for?<\/p>","o":["7, one in each province","16","5","14"],"a":0,"s":"<p>Article 139 provides for a High Court in each province, so there are seven.<br>Other options: B — the number of the old appellate courts; C — the number of the old development regions; D — the number of the old zones.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M2.4.12","q":"<p>Which of the following is NOT a constitutional body under the Constitution of Nepal?<\/p>","o":["National Human Rights Commission","National Planning Commission","Election Commission","Commission for the Investigation of Abuse of Authority"],"a":1,"s":"<p>The National Planning Commission is set up by the government, not by the Constitution. The others are constitutional commissions.<br>Other options: A — a constitutional commission (Part 25); C — a constitutional commission (Part 24); D — a constitutional commission (Part 21).<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M2.4.13","q":"<p>Agricultural Development Bank Limited (ADBL), set up to provide credit to farmers, was established in<\/p>","o":["1956","1937","1968","1994"],"a":2,"s":"<p>The Agricultural Development Bank opened in January 1968 under the ADBN Act 1967.<br>Other options: A — the year Nepal Rastra Bank was established; B — the year Nepal Bank Limited was established; D — not the founding year.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M2.4.14","q":"<p>Gautam Buddha International Airport, which began international operations in 2022, is located at<\/p>","o":["Pokhara","Bhairahawa","Nijgadh","Biratnagar"],"a":1,"s":"<p>Gautam Buddha International Airport is at Bhairahawa in Rupandehi district, near Lumbini.<br>Other options: A — Pokhara International Airport opened on 1 January 2023; C — a proposed airport site in Bara; D — has a domestic airport.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M2.4.15","q":"<p>The Lands Act, which fixed ceilings on landholding as part of Nepal's land reform programme, was enacted in<\/p>","o":["1964","1951","1990","2015"],"a":0,"s":"<p>The Lands Act 2021 BS (1964) introduced land ceilings and tenancy rights.<br>Other options: B — the year Rana rule ended; C — the year multiparty democracy was restored; D — the year the current Constitution was promulgated.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M2.4.16","q":"<p>Nepal Airlines, the national flag carrier, was earlier known as<\/p>","o":["Royal Nepal Airlines","Nepal Air Services","Himalayan Airlines","Buddha Air"],"a":0,"s":"<p>Royal Nepal Airlines Corporation was founded in 1958 and was renamed Nepal Airlines after Nepal became a republic.<br>Other options: B — not its former name; C — a different, private airline; D — a private domestic airline.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M2.4.17","q":"<p>World Health Day, observed on 7 April, marks the founding of the World Health Organization in<\/p>","o":["1945","1919","1950","1948"],"a":3,"s":"<p>The WHO Constitution came into force on 7 April 1948, the date now celebrated as World Health Day.<br>Other options: A — the year the UN was founded; B — the year the ILO was founded; C — not the WHO's founding year.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M2.4.18","q":"<p>How many principal organs does the United Nations have under its Charter?<\/p>","o":["Five","Seven","Six","Four"],"a":2,"s":"<p>The General Assembly, Security Council, Economic and Social Council, Trusteeship Council, International Court of Justice and Secretariat.<br>Other options: A — this leaves one out; B — there is no seventh; D — this leaves two out.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M2.4.19","q":"<p>Mount Kilimanjaro, the highest mountain in Africa, is in<\/p>","o":["Kenya","Tanzania","Uganda","Ethiopia"],"a":1,"s":"<p>Kilimanjaro (5,895 m) is in north-eastern Tanzania.<br>Other options: A — Kilimanjaro is close to the Kenyan border but lies in Tanzania; C — not the location; D — not the location.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M2.4.20","q":"<p>BIMSTEC was established in 1997 through the<\/p>","o":["Dhaka Declaration","Kathmandu Declaration","Colombo Plan","Bangkok Declaration"],"a":3,"s":"<p>BIMSTEC was founded by the Bangkok Declaration of 6 June 1997; Nepal became a full member in 2004.<br>Other options: A — Dhaka hosts the BIMSTEC secretariat, but the founding declaration was elsewhere; B — Kathmandu hosted the 4th BIMSTEC summit (2018); C — a different, older cooperation scheme.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M2.4.21","q":"<p>Who led the first expedition to reach the South Pole, in December 1911?<\/p>","o":["Roald Amundsen","Robert Falcon Scott","Ernest Shackleton","Robert Peary"],"a":0,"s":"<p>The Norwegian Roald Amundsen reached the South Pole on 14 December 1911.<br>Other options: B — he reached the Pole about five weeks later; C — he did not reach the Pole; D — associated with the North Pole.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M2.4.22","q":"<p>Which organ of the human body produces insulin?<\/p>","o":["Liver","Thyroid gland","Pancreas","Kidney"],"a":2,"s":"<p>Insulin is made by the beta cells of the islets of Langerhans in the pancreas.<br>Other options: A — produces bile and stores glycogen; B — produces thyroxine; D — filters blood and makes urine.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M2.4.23","q":"<p>The telephone was invented in 1876 by<\/p>","o":["Thomas Edison","Guglielmo Marconi","Samuel Morse","Alexander Graham Bell"],"a":3,"s":"<p>Alexander Graham Bell was granted the telephone patent in 1876.<br>Other options: A — famous for the light bulb and phonograph; B — pioneer of radio; C — invented Morse code and the telegraph.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M2.4.24","q":"<p>The 13th South Asian Games, held in December 2019, were hosted by<\/p>","o":["India","Nepal","Sri Lanka","Bangladesh"],"a":1,"s":"<p>Nepal hosted the 13th South Asian Games in Kathmandu, Pokhara and Janakpur in December 2019.<br>Other options: A — hosted the 12th Games (2016); C — not the host in 2019; D — not the host in 2019.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M2.4.25","q":"<p>\"An Inquiry into the Nature and Causes of the Wealth of Nations\" (1776) was written by<\/p>","o":["Karl Marx","Adam Smith","John Maynard Keynes","David Ricardo"],"a":1,"s":"<p>Adam Smith's \"The Wealth of Nations\" is regarded as the founding work of modern economics.<br>Other options: A — wrote \"Das Kapital\"; C — wrote \"The General Theory\" (1936); D — wrote \"Principles of Political Economy and Taxation\".<\/p>","tag":"4.6 Science and technology, sports, awards and books"}]}]},{"m":3,"secs":[{"t":"Section 1 · Quantitative Ability (25)","items":[{"id":"M3.1.1","q":"<p>The HCF and LCM of two numbers are 8 and 168. If one of the numbers is 24, what is the other?<\/p>","o":["42","56","21","168"],"a":1,"s":"<p>Product of the numbers = HCF × LCM = 8 × 168 = 1,344. Other number = 1,344 ÷ 24 = 56. (Check: HCF(24, 56) = 8, LCM = 168.)<br>Other options: A — 42 is not a multiple of the HCF 8; C — this divides 168 by 8 only; D — this is the LCM itself; HCF(24, 168) would be 24, not 8.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M3.1.2","q":"<p>What is the unit digit of 7²³ × 3¹⁸?<\/p>","o":["7","3","9","1"],"a":0,"s":"<p>Powers of 7 end in 7, 9, 3, 1; 23 ÷ 4 leaves 3, so 7²³ ends in 3. Powers of 3 end in 3, 9, 7, 1; 18 ÷ 4 leaves 2, so 3¹⁸ ends in 9. 3 × 9 = 27, so the unit digit is 7.<br>Other options: B — this is only the unit digit of 7²³; C — this is only the unit digit of 3¹⁸; D — this treats both powers as multiples of 4.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M3.1.3","q":"<p>Simplify: (3.5 × 3.5 − 1.5 × 1.5) ÷ (3.5 − 1.5)<\/p>","o":["2","10","5","4"],"a":2,"s":"<p>a² − b² = (a + b)(a − b), so the expression = a + b = 3.5 + 1.5 = 5.<br>Other options: A — this is 3.5 − 1.5, the divisor; B — this is (3.5 − 1.5)², a slip in the identity; D — this is 12.25 − 2.25 = 10 divided by 2.5 by mistake.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M3.1.4","q":"<p>What is the smallest number which, when divided by 5, 6 and 7, leaves remainders 3, 4 and 5 respectively?<\/p>","o":["208","210","212","213"],"a":0,"s":"<p>In each case the remainder is 2 less than the divisor, so the number + 2 is divisible by 5, 6 and 7. LCM = 210, so the number = 210 − 2 = 208.<br>Other options: B — this is the LCM itself; C — this adds 2 instead of subtracting it; D — this adds the first remainder 3.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M3.1.5","q":"<p>If 30% of a number is 72, what is 45% of the same number?<\/p>","o":["87","96","120","108"],"a":3,"s":"<p>The number = 72 ÷ 0.30 = 240. 45% of 240 = 108. (Or 72 × 45/30 = 108.)<br>Other options: A — this adds 15 instead of 15 per cent of the number; B — this is 40% of 240; C — this is half of 240.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M3.1.6","q":"<p>An article is sold at a loss of 10%. Had it been sold for Rs 90 more, there would have been a gain of 5%. What is the cost price?<\/p>","o":["Rs 900","Rs 450","Rs 600","Rs 1,800"],"a":2,"s":"<p>The difference between a 5% gain and a 10% loss is 15% of CP = Rs 90, so CP = 90 ÷ 0.15 = Rs 600.<br>Other options: A — this treats Rs 90 as 10% of the cost; B — this treats Rs 90 as 20% of the cost; D — this treats Rs 90 as 5% of the cost.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M3.1.7","q":"<p>A sum of money amounts to Rs 13,310 in 3 years at 10% per annum compound interest. What is the sum?<\/p>","o":["Rs 10,238","Rs 11,000","Rs 9,317","Rs 10,000"],"a":3,"s":"<p>P × (1.1)³ = 13,310, and 1.1³ = 1.331, so P = 13,310 ÷ 1.331 = Rs 10,000.<br>Other options: A — this uses simple interest (13,310 ÷ 1.3); B — this discounts for only two years; C — this subtracts 30% of the amount.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M3.1.8","q":"<p>A shopkeeper marks his goods 50% above cost price and then allows two successive discounts of 10% each. What is his profit percentage?<\/p>","o":["21.5%","30%","35%","20%"],"a":0,"s":"<p>SP = 1.5 × 0.9 × 0.9 × CP = 1.215 × CP, so the profit is 21.5%.<br>Other options: B — this subtracts the two discounts (20%) from 50%; C — this applies only one discount of 10%; D — this treats the two discounts as a single 20% discount.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M3.1.9","q":"<p>What is the third proportional to 9 and 12?<\/p>","o":["15","108","10.5","16"],"a":3,"s":"<p>The third proportional x satisfies 9 : 12 = 12 : x, so x = 144 ÷ 9 = 16.<br>Other options: A — this adds 3 again instead of using a proportion; B — this is 9 × 12; C — this is the average of 9 and 12.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M3.1.10","q":"<p>The average age of a family of five is 24 years. The youngest member is 4 years old. What was the average age of the family just before the youngest was born?<\/p>","o":["24 years","29 years","25 years","20 years"],"a":2,"s":"<p>Total age now = 5 × 24 = 120. Remove the child: 116 for the other four. Four years ago each was 4 years younger: 116 − 16 = 100. Average = 100 ÷ 4 = 25 years.<br>Other options: A — the average changes when the child is removed and time is turned back; B — this removes the child but forgets that the others were 4 years younger; D — this subtracts 4 from the present average.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M3.1.11","q":"<p>20 kg of rice costing Rs 50 per kg is mixed with 30 kg of rice costing Rs 60 per kg. What is the cost per kg of the mixture?<\/p>","o":["Rs 55","Rs 56","Rs 54","Rs 58"],"a":1,"s":"<p>Total cost = 20 × 50 + 30 × 60 = 1,000 + 1,800 = 2,800 for 50 kg, i.e. Rs 56 per kg.<br>Other options: A — this is the simple average of the two prices, ignoring the quantities; C — this weights the prices the wrong way round; D — this is an arithmetic slip.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M3.1.12","q":"<p>The present ages of A and B are in the ratio 3 : 5. Four years ago the ratio was 1 : 2. What is A's present age?<\/p>","o":["20 years","8 years","12 years","15 years"],"a":2,"s":"<p>(3x − 4)/(5x − 4) = 1/2, so 6x − 8 = 5x − 4 and x = 4. A = 12 years, B = 20 years.<br>Other options: A — this is B's present age; B — this is A's age four years ago; D — this takes x = 5 without solving.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M3.1.13","q":"<p>A is 50% more efficient than B. B alone can finish a job in 30 days. In how many days can A and B together finish it?<\/p>","o":["15 days","12 days","20 days","18 days"],"a":1,"s":"<p>A takes 30 ÷ 1.5 = 20 days. Together: 1/20 + 1/30 = 5/60 = 1/12, so 12 days.<br>Other options: A — this is the time if A and B were equally efficient; C — this is A's time alone; D — this is a slip in adding the rates.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M3.1.14","q":"<p>Pipe A can fill a tank in 12 hours and pipe B in 18 hours. A is opened alone, and after 4 hours B is also opened. How long does it take in all to fill the tank?<\/p>","o":["8 hours 48 minutes","7 hours 12 minutes","4 hours 48 minutes","9 hours"],"a":0,"s":"<p>In 4 hours A fills 4/12 = 1/3. The remaining 2/3 at the joint rate 1/12 + 1/18 = 5/36 takes (2/3) ÷ (5/36) = 4.8 hours = 4 h 48 min. Total = 8 h 48 min.<br>Other options: B — this is the time if both pipes were open from the start; C — this is only the time after B is opened; D — this is a rounding slip.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M3.1.15","q":"<p>A train covers a distance in 50 minutes at 48 km/h. At what speed must it run to cover the same distance in 40 minutes?<\/p>","o":["38.4 km/h","58 km/h","64 km/h","60 km/h"],"a":3,"s":"<p>Distance = 48 × 50/60 = 40 km. Speed = 40 ÷ (40/60) = 60 km/h.<br>Other options: A — this multiplies by 40/50 instead of 50/40; B — this adds 10 to the speed for 10 minutes saved; C — this is a slip in the ratio.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M3.1.16","q":"<p>Two trains of equal length run in the same direction on parallel tracks at 46 km/h and 36 km/h. The faster train passes the slower one in 36 seconds. What is the length of each train?<\/p>","o":["100 m","50 m","25 m","410 m"],"a":1,"s":"<p>Relative speed = 10 km/h = 25/9 m/s. In 36 s it covers 36 × 25/9 = 100 m, which is the sum of the two equal lengths. Each train is 50 m.<br>Other options: A — this is the combined length of the two trains; C — this halves the answer again; D — this uses the sum of the speeds (82 km/h) instead of the difference.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M3.1.17","q":"<p>A man rows 24 km downstream in 4 hours and 12 km upstream in 4 hours. What is his speed in still water?<\/p>","o":["1.5 km/h","9 km/h","6 km/h","4.5 km/h"],"a":3,"s":"<p>Downstream speed = 6 km/h, upstream speed = 3 km/h. Speed in still water = (6 + 3)/2 = 4.5 km/h.<br>Other options: A — this is the speed of the stream; B — this adds the two speeds without halving; C — this is his downstream speed.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M3.1.18","q":"<p>If x + 1/x = 3, what is the value of x³ + 1/x³?<\/p>","o":["27","7","18","36"],"a":2,"s":"<p>x³ + 1/x³ = (x + 1/x)³ − 3(x + 1/x) = 27 − 9 = 18.<br>Other options: A — this simply cubes 3; B — this is x² + 1/x²; D — this adds 3 × 3 instead of subtracting it.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M3.1.19","q":"<p>What is the sum of the first 8 terms of the geometric progression 3, 6, 12, 24, …?<\/p>","o":["384","768","381","765"],"a":3,"s":"<p>S₈ = 3 × (2⁸ − 1)/(2 − 1) = 3 × 255 = 765.<br>Other options: A — this is the 8th term, not the sum; B — this is 3 × 2⁸, forgetting to subtract 1; C — this is the sum of the first 7 terms.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M3.1.20","q":"<p>What is the volume of a cone of base radius 3 cm and height 7 cm? (Take π = 22/7.)<\/p>","o":["198 cm³","22 cm³","66 cm³","132 cm³"],"a":2,"s":"<p>V = (1/3)πr²h = (1/3) × (22/7) × 9 × 7 = 66 cm³.<br>Other options: A — this is the volume of a cylinder (it forgets the factor 1/3); B — this divides by 3 twice; D — this uses 2/3 instead of 1/3.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M3.1.21","q":"<p>What is the distance between the points (−2, 3) and (4, −5)?<\/p>","o":["10 units","14 units","2 units","√8 units"],"a":0,"s":"<p>d = √[(4 − (−2))² + (−5 − 3)²] = √(36 + 64) = √100 = 10.<br>Other options: B — this adds the differences 6 and 8; C — this subtracts the differences; D — this adds the coordinates instead of subtracting them.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M3.1.22","q":"<p>Study the table and answer: what were the average monthly sales of shop Y over the three months?<br>Sales of three shops (Rs thousand)<\/p><div class=\"tw\"><table><thead><tr><th>Shop<\/th><th>January<\/th><th>February<\/th><th>March<\/th><\/tr><\/thead><tbody><tr><td>X<\/td><td>120<\/td><td>150<\/td><td>180<\/td><\/tr><tr><td>Y<\/td><td>210<\/td><td>160<\/td><td>140<\/td><\/tr><tr><td>Z<\/td><td>90<\/td><td>110<\/td><td>130<\/td><\/tr><\/tbody><\/table><\/div>","o":["Rs 170 thousand","Rs 160 thousand","Rs 175 thousand","Rs 510 thousand"],"a":0,"s":"<p>(210 + 160 + 140) ÷ 3 = 510 ÷ 3 = Rs 170 thousand.<br>Other options: B — this is February's figure, the median; C — this averages only January and March; D — this is the total, not the average.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M3.1.23","q":"<p>Using the same table (X 120, 150, 180; Y 210, 160, 140; Z 90, 110, 130 in January, February, March), in which month were the combined sales of the three shops the highest?<\/p>","o":["January","February","January and February equally","March"],"a":3,"s":"<p>January: 120 + 210 + 90 = 420. February: 150 + 160 + 110 = 420. March: 180 + 140 + 130 = 450. March is highest.<br>Other options: A — January's total is 420; B — February's total is also 420; C — they are equal, but both are lower than March.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M3.1.24","q":"<p>In how many ways can a president and a secretary be chosen from a club of 10 members, if one person cannot hold both posts?<\/p>","o":["45","90","100","20"],"a":1,"s":"<p>The president can be chosen in 10 ways and then the secretary in 9 ways: 10 × 9 = 90.<br>Other options: A — this is C(10, 2); it ignores that the two posts are different; C — this allows the same person to hold both posts; D — this adds 10 + 10.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M3.1.25","q":"<p>Two cards are drawn at random, one after the other without replacement, from a well-shuffled pack of 52. What is the probability that both are aces?<\/p>","o":["1/169","1/221","1/13","2/13"],"a":1,"s":"<p>P = 4/52 × 3/51 = 12/2652 = 1/221.<br>Other options: A — this is the answer with replacement (4/52 × 4/52); C — this is the probability for one card only; D — this adds the probabilities instead of multiplying.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"}]},{"t":"Section 2 · Verbal Ability (25)","items":[{"id":"M3.2.1","q":"<p>Choose the word closest in meaning to PERNICIOUS.<\/p>","o":["beneficial","precious","harmful","persistent"],"a":2,"s":"<p>Pernicious means having a harmful effect, especially gradually or in a hidden way.<br>Other options: A — this is the opposite; B — a look-alike word; D — a sound-alike, but different meaning.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.2.2","q":"<p>Choose the word closest in meaning to TENACIOUS.<\/p>","o":["feeble","tense","persistent","temporary"],"a":2,"s":"<p>Tenacious means holding firmly to something; persistent and determined.<br>Other options: A — nearly the opposite; B — a sound-alike trap; D — unrelated.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.2.3","q":"<p>Choose the word most nearly opposite in meaning to FRIVOLOUS.<\/p>","o":["serious","playful","trivial","foolish"],"a":0,"s":"<p>Frivolous means not serious or lacking importance; its opposite is serious.<br>Other options: B — close to a synonym; C — a synonym; D — close to a synonym.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.2.4","q":"<p>Choose the word most nearly opposite in meaning to ABATE.<\/p>","o":["intensify","subside","decrease","abandon"],"a":0,"s":"<p>To abate is to become less intense (the storm abated). Its opposite is to intensify.<br>Other options: B — a synonym; C — a synonym; D — a look-alike word.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.2.5","q":"<p>In which sentence is the word \"loose\" used correctly?<\/p>","o":["Don't loose your ticket on the bus.","We cannot afford to loose this match.","If you loose weight, you will feel better.","These trousers are too loose at the waist."],"a":3,"s":"<p>\"Loose\" is an adjective meaning not tight. \"Lose\" is a verb meaning to misplace or to fail to win.<br>Other options: A — \"to misplace\" is \"lose\"; B — \"to be defeated\" is \"lose\"; C — \"to shed\" is \"lose\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.2.6","q":"<p>Choose the word that best completes the sentence: \"The findings were ___ by three independent laboratories, so they are now widely accepted.\"<\/p>","o":["disputed","ignored","replicated","concealed"],"a":2,"s":"<p>Findings become accepted when other laboratories repeat the work and get the same result: they were replicated.<br>Other options: A — disputed findings would not become widely accepted; B — ignored findings would not gain acceptance; D — hidden findings could not be accepted.<\/p>","tag":"1.2 Sentence completion"},{"id":"M3.2.7","q":"<p>Fill in the blank: \"She has been living in Kathmandu ___ five years.\"<\/p>","o":["since","from","during","for"],"a":3,"s":"<p>A length of time with the present perfect takes \"for\" (for five years).<br>Other options: A — \"since\" is used with a point in time (since 2020), not a period; B — \"from\" needs an end point or a starting date; C — \"during\" does not combine with the present perfect continuous for a length of time.<\/p>","tag":"1.2 Sentence completion"},{"id":"M3.2.8","q":"<p>Fill in the blank: \"By next June, she ___ in this company for ten years.\"<\/p>","o":["will work","will have worked","has worked","worked"],"a":1,"s":"<p>An action continuing up to a point in the future takes the future perfect: \"will have worked\".<br>Other options: A — the simple future does not show completion by a future point; C — the present perfect does not fit \"by next June\"; D — the past tense does not fit a future time.<\/p>","tag":"1.2 Sentence completion"},{"id":"M3.2.9","q":"<p>Choose the pair that best completes the sentence: \"Although the region is ___ in natural resources, most of its people remain ___.\"<\/p>","o":["rich, poor","rich, prosperous","abundant, wealthy","deficient, hungry"],"a":0,"s":"<p>\"Although\" sets up a contrast: rich in resources, yet the people remain poor.<br>Other options: B — \"although\" needs a contrast; these agree; C — no contrast; plentiful resources and wealthy people agree; D — no contrast; poor resources and hunger agree.<\/p>","tag":"1.2 Sentence completion"},{"id":"M3.2.10","q":"<p>Choose the word that best completes the sentence: \"The negotiations reached a(n) ___; neither side was willing to give way.\"<\/p>","o":["agreement","breakthrough","impasse","applause"],"a":2,"s":"<p>An impasse is a deadlock in which no progress is possible, matching \"neither side was willing to give way\".<br>Other options: A — an agreement means someone gave way; B — a breakthrough is the opposite of a deadlock; D — unrelated, and does not fit the meaning.<\/p>","tag":"1.2 Sentence completion"},{"id":"M3.2.11","q":"<p>Which part of the sentence contains an error?<br>\"The scenery / of Pokhara / are breathtaking.\"<\/p>","o":["The scenery","of Pokhara","are breathtaking","No error"],"a":2,"s":"<p>\"Scenery\" is an uncountable noun and takes a singular verb: \"The scenery of Pokhara is breathtaking.\"<br>Other options: A — this part is correct; B — this part is correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.2.12","q":"<p>Which part of the sentence contains an error?<br>\"Each student and teacher / were given / a badge.\"<\/p>","o":["Each student and teacher","were given","a badge","No error"],"a":1,"s":"<p>When \"each\" qualifies subjects joined by \"and\", the verb is singular: \"Each student and teacher was given a badge.\"<br>Other options: A — this part is correct; C — this part is correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.2.13","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["He did not knew the answer.","The police is investigating the case.","I am knowing him for many years.","Hardly anyone came to the meeting."],"a":3,"s":"<p>\"Hardly anyone\" is correct standard English (not \"hardly no one\").<br>Other options: A — after \"did not\", the base form is needed: \"did not know\"; B — \"police\" takes a plural verb: \"are investigating\"; C — \"know\" is not used in the continuous; \"I have known him\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.2.14","q":"<p>Which part of the sentence contains an error?<br>\"Ten kilometres / are / a long distance to walk.\"<\/p>","o":["Ten kilometres","are","a long distance to walk","No error"],"a":1,"s":"<p>A distance, amount or period treated as one quantity takes a singular verb: \"Ten kilometres is a long distance to walk.\"<br>Other options: A — this part is correct; C — this part is correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"p":"<p><b>Passage 1<\/b><br>Most firms in Nepal, as in much of the world, are family businesses, and their greatest test usually comes not from competitors but from succession. Founders often run their companies by instinct and personal relationships, and they find it hard to hand over control. Children may be appointed to senior posts because of their name rather than their ability, while capable outside managers leave because they see no path to the top. Studies of family firms suggest that only about a third survive into the second generation. Yet family ownership also has strengths. Owners who expect to pass a business to their children tend to think in decades rather than quarters, keep debt low and protect the firm's reputation. The families whose firms last tend to do two things: they plan the transfer of leadership years in advance, and they separate the roles of owner and manager, so that a family member can keep a stake without necessarily running the business.<\/p>"},{"id":"M3.2.15","q":"<p>(Passage 1) The passage is mainly about<\/p>","o":["the challenge of succession in family businesses and how lasting family firms handle it.","why family businesses should be sold to outside investors before the founding generation retires.","how competitors drive most family firms out of business.","the history of family businesses in Nepal."],"a":0,"s":"<p>The passage describes the succession problem, notes the strengths of family ownership, and ends with what successful families do.<br>Other options: B — the passage notes strengths of family ownership and does not recommend selling; C — the passage says the greatest test is succession, not competitors; D — the passage gives no history.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.2.16","q":"<p>(Passage 1) Which of the following does the passage mention as a strength of family ownership?<\/p>","o":["quick promotion of the owner's children","easy entry for outside managers to the top posts in the firm once the founder retires","heavy borrowing to grow quickly","a long-term outlook, with low debt and care for the firm's reputation"],"a":3,"s":"<p>\"Owners who expect to pass a business to their children tend to think in decades rather than quarters, keep debt low and protect the firm's reputation.\"<br>Other options: A — the passage presents this as a weakness; B — the passage says outside managers see no path to the top; C — the passage says family owners keep debt low.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.2.17","q":"<p>(Passage 1) As used in the passage, to \"think in decades rather than quarters\" means to<\/p>","o":["plan for the long term rather than focus on short-term results.","divide the business into four parts.","hold family meetings once every ten years instead of every three months.","report profits every three months."],"a":0,"s":"<p>\"Quarters\" refers to three-month business periods; thinking in decades means taking a long-term view.<br>Other options: B — a literal misreading of \"quarters\"; C — a literal misreading of \"decades\"; D — quarterly reporting is the short-term view being contrasted.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.2.18","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. She read reviews online and compared prices in three shops.<br>Q. Anita needed a new laptop for her studies.<br>R. Two weeks later, she was glad she had taken her time.<br>S. Finally, she chose a mid-priced model with a long battery life.<\/p>","o":["PQSR","QSPR","QPRS","QPSR"],"a":3,"s":"<p>Need (Q), research (P), decision (S), reflection afterwards (R).<br>Other options: A — the need (Q) must come before the research (P); B — \"Finally\" (S) cannot come before the comparison (P); C — R looks back on the purchase, so S must come before R.<\/p>","tag":"1.5 Para jumbles"},{"id":"M3.2.19","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Their roots also hold the soil together on steep slopes.<br>Q. Forests do far more than supply timber.<br>R. They store carbon and regulate the flow of water to rivers.<br>S. Clearing them can therefore lead to floods and landslides.<\/p>","o":["QPRS","QRPS","RQPS","QRSP"],"a":1,"s":"<p>Q introduces forests; R gives their main functions; P adds another (\"also\"); S concludes (\"therefore\").<br>Other options: A — \"also\" in P shows it adds to an earlier point (R); C — \"They\" in R needs \"Forests\" from Q first; D — S's \"therefore\" draws on the soil point in P, so P must come before S.<\/p>","tag":"1.5 Para jumbles"},{"id":"M3.2.20","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. He spent the next morning repairing the leak.<br>Q. Ramesh woke at midnight to the sound of dripping water.<br>R. By noon the ceiling was as good as new.<br>S. A pipe above the ceiling had cracked in the cold.<\/p>","o":["QSPR","SQPR","QPSR","QSRP"],"a":0,"s":"<p>Q sets the scene; S explains the cause; P describes the repair; R gives the result.<br>Other options: B — the story begins with Ramesh noticing the problem (Q); C — the cause (S) is found before the repair (P); D — \"By noon\" (R) follows the morning's repair (P).<\/p>","tag":"1.5 Para jumbles"},{"id":"M3.2.21","q":"<p>Choose the correct meaning of the idiom \"to cry over spilt milk\".<\/p>","o":["to waste food carelessly","to regret something that has happened and cannot be changed","to complain about a small expense","to sympathise with someone's loss and offer to help put it right"],"a":1,"s":"<p>\"It's no use crying over spilt milk\" means there is no point in being upset about something that cannot be undone.<br>Other options: A — a literal reading; C — not the meaning; D — not the meaning.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M3.2.22","q":"<p>Choose the correct meaning of the idiom \"the ball is in your court\".<\/p>","o":["you have won the game","you are in trouble with the law","you must play fairly","it is your turn to act or decide"],"a":3,"s":"<p>Saying \"the ball is in your court\" means the next move or decision is up to the other person.<br>Other options: A — a literal sporting reading; B — a confusion with \"court\" as a law court; C — not the meaning.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M3.2.23","q":"<p>Choose the one word for: \"The study of past human societies through the remains they left behind.\"<\/p>","o":["archaeology","anthropology","palaeontology","astrology"],"a":0,"s":"<p>Archaeology studies the human past through excavated objects, buildings and other remains.<br>Other options: B — the study of human societies and cultures in general; C — the study of fossils of ancient plants and animals; D — the belief that stars influence human affairs.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M3.2.24","q":"<p>Choose the one word for: \"A person who collects postage stamps.\"<\/p>","o":["numismatist","philatelist","cartographer","lexicographer"],"a":1,"s":"<p>A philatelist collects and studies postage stamps.<br>Other options: A — a collector of coins; C — a map-maker
