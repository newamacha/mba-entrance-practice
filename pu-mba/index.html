o tell them what their crops were worth.<br>R. As a result, they are less likely to be cheated and often earn more.<\/p>","o":["PQR","QPR","QRP","RQP"],"a":1,"s":"<p>\"Earlier\" (Q) describes the old situation, \"Now\" (P) the new one, and \"As a result\" (R) the benefit of the change. Order: QPR.<br>Other options: A — \"Earlier\" should precede \"Now\"; C — the result must follow the change in P; D — the result cannot open the sequence.<\/p>","tag":""},{"id":"1.5.12","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. He jumped again and again, but could not reach them.<br>Q. The story gave us the phrase \"sour grapes\".<br>R. A fox saw a bunch of grapes hanging from a high vine.<br>S. At last he walked away, saying, \"They are sour anyway.\"<\/p>","o":["PRSQ","RSPQ","RPSQ","RQPS"],"a":2,"s":"<p>R sets the scene; P (trying to reach \"them\") follows; S (\"At last\") ends the story; Q comments on the story as a whole. Order: RPSQ.<br>Other options: A — \"He\" and \"them\" need R first; B — he cannot give up before trying; D — the comment on \"the story\" must come after the story.<\/p>","tag":""},{"id":"1.5.13","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. People on fixed incomes, such as pensioners, are therefore hit hardest.<br>Q. Inflation is a general rise in prices over time.<br>R. When it is high, each rupee buys less than before.<br>S. This is why controlling inflation is one of the main tasks of a central bank.<\/p>","o":["QRPS","QPRS","RQPS","QRSP"],"a":0,"s":"<p>Q defines inflation; R (\"it\") explains its effect on money; P (\"therefore\") follows from R; S (\"This is why\") draws the conclusion from the harm described. Order: QRPS.<br>Other options: B — P's \"therefore\" needs R's explanation first; C — \"it\" in R needs Q first; D — S's \"This\" should refer back to the harm in P.<\/p>","tag":""},{"id":"1.5.14","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. This year, for the first time, no one has had to walk to the river for water.<br>Q. The old spring that had supplied it for generations had nearly dried up.<br>R. The villagers met and decided to build a rainwater-harvesting tank.<br>S. Last year our village faced a severe water shortage.<\/p>","o":["SRQP","QSRP","SQPR","SQRP"],"a":3,"s":"<p>Problem (S), cause (Q, \"it\" = the village), solution (R), result (P). Order: SQRP.<br>Other options: A — the cause should be explained before the solution; B — \"it\" in Q needs \"village\" from S; C — the result cannot come before the solution.<\/p>","tag":""},{"id":"1.5.15","q":"<p>The first sentence (S1) and the last sentence (S5) are given. Arrange P, Q and R.<br>S1. A company's balance sheet shows what it owns and what it owes on a particular date.<br>P. Liabilities, on the other hand, are what it owes to outsiders, such as loans and unpaid bills.<br>Q. The difference between the two is the owners' equity.<br>R. Assets are the resources it owns, such as cash, machinery and buildings.<br>S5. That is why assets always equal liabilities plus equity.<\/p>","o":["PRQ","QRP","RPQ","RQP"],"a":2,"s":"<p>R (assets) matches \"what it owns\" in S1; P (\"on the other hand\") contrasts liabilities; Q (\"the two\") needs both defined first. Order: RPQ.<br>Other options: A — \"on the other hand\" in P needs R first; B and D — Q's \"the two\" requires both assets and liabilities to have been introduced.<\/p>","tag":""},{"id":"1.5.16","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. The hare, sure of winning, stopped halfway for a nap.<br>Q. When the hare woke up, the tortoise was already crossing the finishing line.<br>R. A hare once laughed at a tortoise for being slow, and the tortoise challenged him to a race.<br>S. Meanwhile, the tortoise plodded on steadily without stopping.<\/p>","o":["RSPQ","RPSQ","PRSQ","RPQS"],"a":1,"s":"<p>The challenge (R), the nap (P), \"Meanwhile\" the tortoise keeps going (S), the ending (Q). Order: RPSQ.<br>Other options: A — \"Meanwhile\" must refer to the nap, so P comes before S; C — the race must be set up before the nap; D — the ending (Q) must come last.<\/p>","tag":""},{"id":"1.5.17","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Sunita wanted to buy a laptop for her studies.<br>P. Instead, she took a part-time job at a bookshop and saved for six months.<br>Q. But her parents could not afford one.<br>R. In the end, she bought it with her own money.<\/p>","o":["PQR","QRP","PRQ","QPR"],"a":3,"s":"<p>Q (\"But\") gives the obstacle; P (\"Instead\") gives her alternative plan; R (\"In the end\") gives the outcome. Order: QPR.<br>Other options: A and C — \"Instead\" needs the obstacle first; B — she cannot buy it before saving.<\/p>","tag":""},{"id":"1.5.18","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Not every new business succeeds, of course.<br>Q. An entrepreneur is someone who sets up a business, taking on financial risk in the hope of profit.<br>R. Those that survive, however, can create jobs and drive economic growth.<br>S. Many fail within the first few years because of poor planning or lack of capital.<\/p>","o":["QPSR","QSPR","PQSR","QPRS"],"a":0,"s":"<p>Q defines the term; P notes that not all succeed; S (\"Many fail\") expands on P; R (\"Those that survive, however\") contrasts with the failures. Order: QPSR.<br>Other options: B — S expands P and so must follow it; C — the definition should open the paragraph; D — \"Those that survive\" contrasts with \"Many fail\", so S must come before R.<\/p>","tag":""},{"id":"1.5.19","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. The rainy season brings both blessings and problems to Nepal.<br>P. On the other hand, it also causes landslides and floods that block roads and destroy homes.<br>Q. Farmers depend on it to plant rice.<br>R. Planning for the monsoon, therefore, must aim to make use of the water while reducing the damage.<\/p>","o":["QRP","QPR","PQR","PRQ"],"a":1,"s":"<p>Q (blessing) and P (\"On the other hand\", problem) follow the order of S1; R (\"therefore\") concludes using both. Order: QPR.<br>Other options: A — R's conclusion needs the damage in P first; C — \"On the other hand\" needs a first hand; D — Q cannot come after the conclusion.<\/p>","tag":""},{"id":"1.5.20","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Unfortunately, a power cut during the night reset both of them.<br>Q. The train was due to leave at 6 a.m.<br>R. He woke at seven, an hour after the train had left.<br>S. Hari set two alarms the night before so that he would not miss it.<\/p>","o":["QPSR","SQPR","QSPR","QSRP"],"a":2,"s":"<p>The train time (Q), the two alarms (S, \"it\" = the train), the power cut that reset \"both of them\" (P), the result (R). Order: QSPR.<br>Other options: A — \"both of them\" in P needs the alarms in S first; B — \"it\" in S needs Q first; D — the result must follow its cause.<\/p>","tag":""},{"id":"1.5.21","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Good customer service can turn a single sale into a lasting relationship.<br>P. That customer is likely to return and to recommend the shop to friends.<br>Q. When a complaint is handled quickly and politely, the customer feels valued.<br>R. In this way, one well-handled problem can bring in many new customers.<\/p>","o":["PQR","QRP","RQP","QPR"],"a":3,"s":"<p>Q introduces the customer; P (\"That customer\") continues; R (\"In this way\") sums up. Order: QPR.<br>Other options: A — \"That customer\" in P needs Q first; B and C — \"In this way\" must come after the process it summarises.<\/p>","tag":""},{"id":"1.5.22","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. His name was third from the top.<br>Q. On the day of the results, he could hardly eat breakfast.<br>R. Ravi had been preparing for the entrance exam for a year.<br>S. When the list was finally published, he searched it with trembling hands.<\/p>","o":["RQSP","RSQP","QRSP","RQPS"],"a":0,"s":"<p>Background (R), the morning of the results (Q), the list is published (S), the outcome (P). Order: RQSP.<br>Other options: B — the morning must come before the list is published; C — \"he\" in Q needs Ravi named first; D — he must search the list before finding his name.<\/p>","tag":""},{"id":"1.5.23","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Tree roots bind the soil and hold it in place.<br>Q. Replanting such slopes is therefore an important way to reduce the risk.<br>R. Deforestation on steep slopes is one of the main causes of landslides.<br>S. When the trees are removed, heavy rain can easily wash the loose soil downhill.<\/p>","o":["PRSQ","RPSQ","RSQP","RQSP"],"a":1,"s":"<p>Claim (R), how roots help (P), what happens without them (S), solution (Q, \"such slopes\", \"therefore\"). Order: RPSQ.<br>Other options: A — the claim should open the paragraph; C — S's \"the trees are removed\" builds on P's explanation, and the solution must be last; D — the solution cannot precede the explanation.<\/p>","tag":""},{"id":"1.5.24","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Many students find it hard to manage their time during exams.<br>P. Then they should give each subject a fixed slot in a weekly timetable.<br>Q. Finally, they should review the timetable every week and adjust it.<br>R. First, they should list all the subjects and the topics still to be covered.<\/p>","o":["RQP","PRQ","RPQ","QRP"],"a":2,"s":"<p>First (R), Then (P), Finally (Q).<br>Other options: A, B and D break the First-Then-Finally sequence.<\/p>","tag":""},{"id":"1.5.25","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. It is the set of ideas and feelings that customers associate with a product.<br>Q. A strong brand allows a company to charge higher prices than its rivals.<br>R. A brand is more than a name or a logo.<br>S. For this reason, firms spend heavily on building and protecting their brands.<\/p>","o":["RPQS","RQPS","PRQS","RPSQ"],"a":0,"s":"<p>R opens; P (\"It\") completes the definition; Q gives the benefit; S (\"For this reason\") follows from the benefit. Order: RPQS.<br>Other options: B — the definition (P) should directly follow R; C — \"It\" in P needs R first; D — \"For this reason\" refers to the higher prices in Q, so Q comes before S.<\/p>","tag":""},{"id":"1.5.26","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. After collecting rock samples, they returned to the lunar module and lifted off.<br>Q. In 1969, astronauts landed on the Moon for the first time.<br>R. Days later, they splashed down safely in the Pacific Ocean.<br>S. The journey from the Earth had taken about four days.<\/p>","o":["QPSR","SQPR","QSRP","QSPR"],"a":3,"s":"<p>The landing (Q), the journey that led to it (S), the departure from the Moon (P), the return to Earth (R). Order: QSPR.<br>Other options: A — S describes the outward journey and fits right after the landing, not after lift-off; B — \"The journey\" needs Q first; C — splashdown cannot come before lift-off.<\/p>","tag":""},{"id":"1.5.27","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Opportunity cost is the value of the next best alternative given up when a choice is made.<br>P. The opportunity cost of her studies is therefore not only the fees but also the salary she gives up.<br>Q. Suppose a graduate chooses to do an MBA instead of taking a job.<br>R. She gives up the salary she could have earned during those two years.<\/p>","o":["QPR","QRP","RQP","PQR"],"a":1,"s":"<p>Q sets up the example; R gives what is sacrificed; P (\"therefore\") concludes. Order: QRP.<br>Other options: A — \"therefore\" in P needs R first; C — \"She\" in R needs Q first; D — P's conclusion cannot open the example.<\/p>","tag":""},{"id":"1.5.28","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. He therefore began ordering extra stock in May.<br>Q. His profits that season were the highest he had ever earned.<br>R. The shopkeeper noticed that sales of umbrellas rose sharply every June.<br>S. The following monsoon, while other shops ran out, he still had umbrellas to sell.<\/p>","o":["RSPQ","PRSQ","RPSQ","RPQS"],"a":2,"s":"<p>Observation (R), action (P, \"therefore\"), result (S), outcome for profits (Q). Order: RPSQ.<br>Other options: A — S's result must follow the action in P; B — \"therefore\" in P needs the observation in R; D — the profits \"that season\" refer to the monsoon in S.<\/p>","tag":""},{"id":"1.5.29","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Learning a new language as an adult is difficult but rewarding.<br>P. Gradually, however, the patterns become familiar and speaking becomes easier.<br>Q. At first, the learner struggles with unfamiliar sounds and grammar.<br>R. Eventually, a new world of books, films and friendships opens up.<\/p>","o":["PQR","QRP","RQP","QPR"],"a":3,"s":"<p>At first (Q), Gradually, however (P), Eventually (R).<br>Other options: A — \"however\" in P needs the struggle in Q first; B and C — \"Eventually\" must be the last stage.<\/p>","tag":""},{"id":"1.5.30","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Many experts therefore argue that better public transport is the real solution.<br>Q. Kathmandu's traffic has grown far faster than its roads.<br>R. A single large bus can carry as many people as dozens of cars while taking up far less road space.<br>S. Widening the roads has helped only for a short time, because more vehicles soon fill them.<\/p>","o":["QSPR","QPSR","SQPR","QSRP"],"a":0,"s":"<p>Problem (Q), failed remedy (S), proposed solution (P, \"therefore\"), supporting reason (R). Order: QSPR.<br>Other options: B — P's \"therefore\" follows from the failure of road widening in S; C — the problem should be stated first; D — R supports public transport and must follow P, which introduces it.<\/p>","tag":""}]},{"k":"1.6","t":"Idioms, Phrases, One-word Substitution and Verbal Analogies","items":[{"id":"1.6.1","q":"<p>Choose the correct meaning of the idiom \"to beat around the bush\".<\/p>","o":["to work in a garden","to avoid coming to the point","to hunt wild animals","to win easily"],"a":1,"s":"<p>To beat around (or about) the bush is to talk indirectly and avoid the main issue.<br>Other options: A and C — literal readings of \"bush\"; D — winning easily is \"to win hands down\".<\/p>","tag":""},{"id":"1.6.2","q":"<p>Choose the correct meaning of the idiom \"a blessing in disguise\".<\/p>","o":["a hidden enemy","a religious ceremony","a false friend","something that seems bad at first but turns out to be good"],"a":3,"s":"<p>A blessing in disguise is an apparent misfortune that later proves beneficial.<br>Other options: A and C — describe hidden or false people, not good outcomes; B — a literal reading of \"blessing\".<\/p>","tag":""},{"id":"1.6.3","q":"<p>Choose the correct meaning of the idiom \"to burn the midnight oil\".<\/p>","o":["to work or study late into the night","to waste money","to start a fire","to be very angry"],"a":0,"s":"<p>The idiom comes from working by an oil lamp at midnight: to work or study late at night.<br>Other options: B — wasting money is \"to burn a hole in one's pocket\"; C — a literal reading; D — anger is unrelated.<\/p>","tag":""},{"id":"1.6.4","q":"<p>Choose the correct meaning of the idiom \"to let the cat out of the bag\".<\/p>","o":["to set an animal free","to make a mistake in public","to reveal a secret","to escape from a difficult situation"],"a":2,"s":"<p>To let the cat out of the bag is to disclose a secret, often by accident.<br>Other options: A — literal reading; B — a public mistake is not necessarily a secret revealed; D — escaping is unrelated.<\/p>","tag":""},{"id":"1.6.5","q":"<p>Choose the correct meaning of the idiom \"to be in hot water\".<\/p>","o":["to take a warm bath","to be in trouble","to be very busy","to be very angry"],"a":1,"s":"<p>To be in hot water is to be in trouble or disgrace.<br>Other options: A — literal reading; C — busy is \"to have one's hands full\"; D — angry is \"to be hot under the collar\".<\/p>","tag":""},{"id":"1.6.6","q":"<p>Choose the correct meaning of the idiom \"once in a blue moon\".<\/p>","o":["very rarely","every month","only at night","on full-moon days"],"a":0,"s":"<p>Once in a blue moon means very rarely.<br>Other options: B, C and D are literal readings connected with the moon.<\/p>","tag":""},{"id":"1.6.7","q":"<p>Choose the correct meaning of the idiom \"to pull someone's leg\".<\/p>","o":["to injure someone","to help someone stand up","to criticise someone harshly","to tease or joke with someone"],"a":3,"s":"<p>To pull someone's leg is to tease them playfully, often by telling them something untrue.<br>Other options: A and B — literal readings; C — criticising harshly is not playful teasing.<\/p>","tag":""},{"id":"1.6.8","q":"<p>Choose the correct meaning of the idiom \"to bite off more than one can chew\".<\/p>","o":["to eat greedily","to speak rudely","to take on more than one can manage","to save food for later"],"a":2,"s":"<p>The idiom means to attempt a task too big for one's abilities or resources.<br>Other options: A and D — literal readings about food; B — rudeness is unrelated.<\/p>","tag":""},{"id":"1.6.9","q":"<p>Choose the correct meaning of the idiom \"a white elephant\".<\/p>","o":["a rare animal","a costly possession that is more trouble than it is worth","a peace offering","a very honest person"],"a":1,"s":"<p>A white elephant is something expensive to keep that brings little benefit, such as an unused stadium.<br>Other options: A — literal reading; C — a peace offering is \"an olive branch\"; D — unrelated.<\/p>","tag":""},{"id":"1.6.10","q":"<p>Choose the correct meaning of the idiom \"to turn a deaf ear\".<\/p>","o":["to become deaf","to listen carefully","to speak in a whisper","to ignore or refuse to listen"],"a":3,"s":"<p>To turn a deaf ear to something is to deliberately ignore it.<br>Other options: A — literal reading; B — the opposite meaning; C — unrelated.<\/p>","tag":""},{"id":"1.6.11","q":"<p>Choose the one word for: \"A person who can speak two languages fluently.\"<\/p>","o":["linguist","polyglot","bilingual","translator"],"a":2,"s":"<p>Bilingual describes a person who speaks two languages fluently.<br>Other options: A — a linguist studies language scientifically; B — a polyglot speaks many languages; D — a translator converts text from one language to another as a job.<\/p>","tag":""},{"id":"1.6.12","q":"<p>Choose the one word for: \"Government by the people or their elected representatives.\"<\/p>","o":["democracy","autocracy","monarchy","bureaucracy"],"a":0,"s":"<p>Democracy (from Greek demos, people, + kratos, rule) is government by the people.<br>Other options: B — autocracy is rule by one person with absolute power; C — monarchy is rule by a king or queen; D — bureaucracy is administration by officials.<\/p>","tag":""},{"id":"1.6.13","q":"<p>Choose the one word for: \"A person who does not believe in the existence of God.\"<\/p>","o":["theist","atheist","agnostic","heretic"],"a":1,"s":"<p>An atheist denies or lacks belief in the existence of God.<br>Other options: A — a theist believes in God; C — an agnostic holds that God's existence cannot be known; D — a heretic holds views contrary to accepted religious teaching.<\/p>","tag":""},{"id":"1.6.14","q":"<p>Choose the one word for: \"A list of items to be discussed at a meeting.\"<\/p>","o":["minutes","memorandum","syllabus","agenda"],"a":3,"s":"<p>The agenda lists the items to be discussed at a meeting.<br>Other options: A — minutes are the written record after the meeting; B — a memorandum is a written note or message; C — a syllabus lists the topics of a course.<\/p>","tag":""},{"id":"1.6.15","q":"<p>Choose the one word for: \"That which cannot be read.\"<\/p>","o":["illegible","ineligible","inaudible","invisible"],"a":0,"s":"<p>Illegible means (of handwriting or print) not clear enough to be read.<br>Other options: B — ineligible means not qualified; C — inaudible means cannot be heard; D — invisible means cannot be seen.<\/p>","tag":""},{"id":"1.6.16","q":"<p>Choose the one word for: \"A person who looks on the bright side of things.\"<\/p>","o":["pessimist","optimist","realist","fatalist"],"a":1,"s":"<p>An optimist expects good outcomes and looks on the bright side.<br>Other options: A — a pessimist expects the worst; C — a realist sees things as they are; D — a fatalist believes events are fixed and cannot be changed.<\/p>","tag":""},{"id":"1.6.17","q":"<p>Choose the one word for: \"The murder of one's own mother.\"<\/p>","o":["patricide","fratricide","matricide","regicide"],"a":2,"s":"<p>Matricide (Latin mater, mother) is the killing of one's mother.<br>Other options: A — patricide is killing one's father; B — fratricide is killing one's brother; D — regicide is killing a king.<\/p>","tag":""},{"id":"1.6.18","q":"<p>Choose the one word for: \"A speech made without any preparation.\"<\/p>","o":["monologue","extempore","soliloquy","eulogy"],"a":1,"s":"<p>An extempore speech is delivered on the spot, without preparation.<br>Other options: A — a monologue is a long speech by one person, prepared or not; C — a soliloquy is a character speaking thoughts aloud alone on stage; D — a eulogy is a speech praising someone, usually someone who has died.<\/p>","tag":""},{"id":"1.6.19","q":"<p>Choose the one word for: \"An abnormal fear of heights.\"<\/p>","o":["claustrophobia","hydrophobia","xenophobia","acrophobia"],"a":3,"s":"<p>Acrophobia (Greek akron, peak) is an extreme fear of heights.<br>Other options: A — claustrophobia is fear of enclosed spaces; B — hydrophobia is fear of water; C — xenophobia is fear or dislike of foreigners.<\/p>","tag":""},{"id":"1.6.20","q":"<p>Choose the one word for: \"A person who is new to a profession or activity.\"<\/p>","o":["novice","veteran","expert","connoisseur"],"a":0,"s":"<p>A novice is a beginner.<br>Other options: B — a veteran has long experience; C — an expert has great skill; D — a connoisseur is an expert judge in matters of taste, such as art or food.<\/p>","tag":""},{"id":"1.6.21","q":"<p>Choose the word that completes the analogy. Doctor : Hospital :: Teacher : ?<\/p>","o":["student","book","school","lesson"],"a":2,"s":"<p>The relation is professional : place of work. A doctor works in a hospital; a teacher works in a school.<br>Other options: A — a student is the person served, not the place; B and D — a book and a lesson are tools or content, not the workplace.<\/p>","tag":""},{"id":"1.6.22","q":"<p>Choose the word that completes the analogy. Pen : Write :: Knife : ?<\/p>","o":["sharp","cut","kitchen","steel"],"a":1,"s":"<p>The relation is tool : its function. A pen is used to write; a knife is used to cut.<br>Other options: A — sharp is a quality; C — kitchen is a place; D — steel is the material.<\/p>","tag":""},{"id":"1.6.23","q":"<p>Choose the word that completes the analogy. Bird : Flock :: Fish : ?<\/p>","o":["shoal","herd","pack","swarm"],"a":0,"s":"<p>The relation is animal : collective noun. Birds form a flock; fish form a shoal (or school).<br>Other options: B — herd is for cattle; C — pack is for wolves or dogs; D — swarm is for bees or insects.<\/p>","tag":""},{"id":"1.6.24","q":"<p>Choose the word that completes the analogy. Hot : Cold :: Victory : ?<\/p>","o":["war","success","triumph","defeat"],"a":3,"s":"<p>The relation is antonyms; the opposite of victory is defeat.<br>Other options: A — war is related but not opposite; B and C — success and triumph are synonyms of victory.<\/p>","tag":""},{"id":"1.6.25","q":"<p>Choose the word that completes the analogy. Author : Novel :: Composer : ?<\/p>","o":["poem","painting","symphony","sculpture"],"a":2,"s":"<p>The relation is creator : creation. An author writes a novel; a composer writes a symphony.<br>Other options: A — a poem is written by a poet; B — a painting by a painter; D — a sculpture by a sculptor.<\/p>","tag":""},{"id":"1.6.26","q":"<p>Choose the word that completes the analogy. Puppy : Dog :: Calf : ?<\/p>","o":["goat","cow","horse","sheep"],"a":1,"s":"<p>The relation is young one : adult animal. A puppy is a young dog; a calf is a young cow.<br>Other options: A — a young goat is a kid; C — a young horse is a foal; D — a young sheep is a lamb.<\/p>","tag":""},{"id":"1.6.27","q":"<p>Choose the option that completes the analogy. Thermometer : Temperature :: Barometer : ?<\/p>","o":["humidity","rainfall","wind speed","atmospheric pressure"],"a":3,"s":"<p>The relation is instrument : what it measures. A barometer measures atmospheric pressure.<br>Other options: A — humidity is measured by a hygrometer; B — rainfall by a rain gauge; C — wind speed by an anemometer.<\/p>","tag":""},{"id":"1.6.28","q":"<p>Choose the word that completes the analogy. Ephemeral : Permanent :: Frugal : ?<\/p>","o":["lavish","thrifty","brief","poor"],"a":0,"s":"<p>The relation is antonyms: ephemeral (short-lived) is the opposite of permanent; frugal (sparing) is the opposite of lavish (extravagant).<br>Other options: B — thrifty is a synonym of frugal; C — brief is a synonym of ephemeral, not an opposite of frugal; D — poor describes lack of money, not the opposite of carefulness with it.<\/p>","tag":""},{"id":"1.6.29","q":"<p>Choose the word that completes the analogy. Carpenter : Wood :: Mason : ?<\/p>","o":["clay","metal","stone","cloth"],"a":2,"s":"<p>The relation is worker : material. A carpenter works with wood; a mason works with stone (and brick).<br>Other options: A — clay is the potter's material; B — metal is the smith's; D — cloth is the tailor's.<\/p>","tag":""},{"id":"1.6.30","q":"<p>Choose the word that completes the analogy. Eye : See :: Ear : ?<\/p>","o":["sound","noise","deaf","hear"],"a":3,"s":"<p>The relation is organ : its function (a verb). The eye is used to see; the ear is used to hear.<br>Other options: A and B — sound and noise are what is heard, not the function; C — deaf describes the loss of the function.<\/p>","tag":""}]}]},{"n":2,"t":"Quantitative Ability","subs":[{"k":"2.1","t":"Number System, HCF/LCM, Simplification, Surds and Indices","items":[{"id":"2.1.1","q":"<p>What is the HCF of 84, 126 and 210?<\/p>","o":["21","14","84","42"],"a":3,"s":"<p>84 = 2²·3·7, 126 = 2·3²·7, 210 = 2·3·5·7. Common primes with lowest powers: 2·3·7 = 42.<br>Other options: A — a common factor, but not the highest; B — a common factor, but 42 is larger; C — does not divide 126 or 210.<\/p>","tag":""},{"id":"2.1.2","q":"<p>What is the LCM of 12, 18 and 30?<\/p>","o":["360","90","180","60"],"a":2,"s":"<p>12 = 2²·3, 18 = 2·3², 30 = 2·3·5. Highest powers: 2²·3²·5 = 180.<br>Other options: A — a common multiple, but not the least; B — not divisible by 12; D — not divisible by 18.<\/p>","tag":""},{"id":"2.1.3","q":"<p>What is the least number which, when divided by 12, 15 and 20, leaves a remainder of 5 in each case?<\/p>","o":["60","55","125","65"],"a":3,"s":"<p>LCM(12, 15, 20) = 60. Required number = 60 + 5 = 65.<br>Other options: A — this is the LCM itself; it leaves remainder 0; B — subtracted 5 instead of adding it; C — used 2 × LCM + 5; not the least.<\/p>","tag":""},{"id":"2.1.4","q":"<p>What is the greatest number that divides 1657 and 2037 leaving remainders 6 and 5 respectively?<\/p>","o":["381","127","254","63"],"a":1,"s":"<p>The number must divide 1657 − 6 = 1651 and 2037 − 5 = 2032. HCF(1651, 2032): 2032 − 1651 = 381; 1651 = 4 × 381 + 127; 381 = 3 × 127. HCF = 127.<br>Other options: A — divides 2032 but not 1651; C — does not divide 1651 (odd); D — not a common factor of 1651 and 2032.<\/p>","tag":""},{"id":"2.1.5","q":"<p>The product of two numbers is 2160 and their HCF is 12. What is their LCM?<\/p>","o":["180","120","216","2148"],"a":0,"s":"<p>HCF × LCM = product of the numbers, so LCM = 2160 ÷ 12 = 180.<br>Other options: B — arithmetic slip in 2160 ÷ 12; C — divided by 10 instead of by the HCF; D — subtracted the HCF instead of dividing.<\/p>","tag":""},{"id":"2.1.6","q":"<p>What is the unit digit of 7⁹⁵?<\/p>","o":["1","3","7","9"],"a":1,"s":"<p>Unit digits of powers of 7 repeat in the cycle 7, 9, 3, 1. 95 = 4 × 23 + 3, so the unit digit is the 3rd in the cycle: 3.<br>Other options: A — this is the unit digit when the power is a multiple of 4; C — unit digit of 7¹, i.e. remainder 1 on division by 4; D — unit digit of 7², i.e. remainder 2.<\/p>","tag":""},{"id":"2.1.7","q":"<p>How many positive factors does 360 have?<\/p>","o":["18","20","36","24"],"a":3,"s":"<p>360 = 2³ · 3² · 5. Number of factors = (3+1)(2+1)(1+1) = 24.<br>Other options: A — missed one power of 2, i.e. used (2+1)(2+1)(1+1); B — counting slip; C — used (3+1)(2+1)(2+1).<\/p>","tag":""},{"id":"2.1.8","q":"<p>What is the remainder when 2³¹ is divided by 5?<\/p>","o":["1","2","3","4"],"a":2,"s":"<p>Remainders of 2ⁿ on division by 5 cycle 2, 4, 3, 1. 31 = 4 × 7 + 3, so the remainder is the 3rd term: 3.<br>Other options: A — remainder for a power that is a multiple of 4; B — remainder for 2¹ only; D — remainder for 2².<\/p>","tag":""},{"id":"2.1.9","q":"<p>Simplify: 36 ÷ 4 × 3 + 8 − 2 × 5<\/p>","o":["25","1","35","165"],"a":0,"s":"<p>BODMAS, with ÷ and × taken left to right: 36 ÷ 4 = 9; 9 × 3 = 27; 2 × 5 = 10; 27 + 8 − 10 = 25.<br>Other options: B — did 4 × 3 before the division; ÷ and × go left to right; C — forgot to subtract 2 × 5 = 10; D — added and subtracted before multiplying.<\/p>","tag":""},{"id":"2.1.10","q":"<p>Simplify: (0.2 × 0.2 + 0.01) ÷ (0.1 × 0.1 + 0.02)<\/p>","o":["3/5","5/3","5","1/3"],"a":1,"s":"<p>Numerator = 0.04 + 0.01 = 0.05; denominator = 0.01 + 0.02 = 0.03. 0.05 ÷ 0.03 = 5/3.<br>Other options: A — inverted the fraction; C — decimal-place slip; D — used only 0.01 ÷ 0.03.<\/p>","tag":""},{"id":"2.1.11","q":"<p>What is √0.0169?<\/p>","o":["0.013","0.13","1.3","0.0013"],"a":1,"s":"<p>0.0169 = 169/10000, so √0.0169 = 13/100 = 0.13.<br>Other options: A — too many decimal places: 0.013² = 0.000169; C — 1.3² = 1.69; D — squares to 0.00000169.<\/p>","tag":""},{"id":"2.1.12","q":"<p>Simplify: (2⁵ × 2⁻³) ÷ 2⁻¹<\/p>","o":["8","2","4","16"],"a":0,"s":"<p>2⁵ × 2⁻³ = 2²; 2² ÷ 2⁻¹ = 2^(2 + 1) = 2³ = 8.<br>Other options: B — subtracted −1 the wrong way: 2^(2 − 1); C — ignored the division by 2⁻¹; D — added an extra power of 2.<\/p>","tag":""},{"id":"2.1.13","q":"<p>If 3^(x + 2) = 243, what is x?<\/p>","o":["3","5","7","2"],"a":0,"s":"<p>243 = 3⁵, so x + 2 = 5 and x = 3.<br>Other options: B — this is x + 2, not x; C — added 2 instead of subtracting; D — used 3⁴ = 81 instead of 243.<\/p>","tag":""},{"id":"2.1.14","q":"<p>Simplify: (√3 + √2) ÷ (√3 − √2)<\/p>","o":["5 − 2√6","5 + 2√6","1 + 2√6","5"],"a":1,"s":"<p>Multiply numerator and denominator by (√3 + √2): (√3 + √2)² ÷ (3 − 2) = 3 + 2 + 2√6 = 5 + 2√6.<br>Other options: A — this is the reciprocal (√3 − √2)/(√3 + √2); C — took the numerator square as 1 + 2√6 instead of 5 + 2√6; D — dropped the cross term 2√6.<\/p>","tag":""},{"id":"2.1.15","q":"<p>Which of the following is the greatest?<\/p>","o":["⁴√5","√2","∛3","⁶√6"],"a":0,"s":"<p>Compare approximate values: √2 ≈ 1.414, ∛3 ≈ 1.442, ⁴√5 ≈ 1.495, ⁶√6 ≈ 1.348. (Or raise all to the 12th power: 64, 81, 125, 36.) Greatest is ⁴√5.<br>Other options: B — √2 ≈ 1.414; C — ∛3 ≈ 1.442; D — ⁶√6 ≈ 1.348.<\/p>","tag":""},{"id":"2.1.16","q":"<p>Express 0.363636… (36 recurring) as a fraction in lowest terms.<\/p>","o":["9/25","2/5","3/11","4/11"],"a":3,"s":"<p>Two recurring digits: 0.3636… = 36/99 = 4/11.<br>Other options: A — this is 0.36 exactly, not recurring; B — = 36/90, wrong denominator; C — = 0.2727….<\/p>","tag":""},{"id":"2.1.17","q":"<p>Express 0.2333… (only the 3 recurring) as a fraction.<\/p>","o":["7/33","23/99","23/90","7/30"],"a":3,"s":"<p>For one non-recurring and one recurring digit: (23 − 2)/90 = 21/90 = 7/30.<br>Other options: A — = 21/99, wrong denominator; should be 90; B — treated both digits as recurring; C — forgot to subtract the non-recurring part 2.<\/p>","tag":""},{"id":"2.1.18","q":"<p>What is the sum of all prime numbers between 50 and 70?<\/p>","o":["240","187","291","300"],"a":0,"s":"<p>Primes between 50 and 70: 53, 59, 61, 67. Sum = 240.<br>Other options: B — left out 53; C — wrongly included 51 (= 3 × 17); D — arithmetic error.<\/p>","tag":""},{"id":"2.1.19","q":"<p>What is the largest four-digit number exactly divisible by 12, 15 and 18?<\/p>","o":["9960","9900","9720","9990"],"a":1,"s":"<p>LCM(12, 15, 18) = 180. 9999 ÷ 180 = 55 remainder 99, so the answer is 9999 − 99 = 9900.<br>Other options: A — divisible by 12 and 15 but not by 18; C — divisible by 180 but not the largest; D — divisible by 15 and 18 but not by 12.<\/p>","tag":""},{"id":"2.1.20","q":"<p>Four bells toll at intervals of 6, 8, 12 and 15 minutes. If they toll together at 9:00 am, when will they next toll together?<\/p>","o":["10:00 am","10:30 am","12:00 noon","11:00 am"],"a":3,"s":"<p>LCM(6, 8, 12, 15) = 120 minutes = 2 hours. 9:00 am + 2 hours = 11:00 am.<br>Other options: A — used 60 minutes, which is not divisible by 8; B — used 90 minutes, not a common multiple; C — used 180 minutes, which is not divisible by 8.<\/p>","tag":""},{"id":"2.1.21","q":"<p>What is the remainder when 5⁹⁹ is divided by 13?<\/p>","o":["5","12","8","1"],"a":2,"s":"<p>5² = 25 ≡ −1 (mod 13), so 5⁴ ≡ 1. 99 = 4 × 24 + 3, so 5⁹⁹ ≡ 5³ = 125 ≡ 125 − 117 = 8.<br>Other options: A — remainder of 5¹ only; B — remainder of 5², i.e. power 2 in the cycle; D — remainder when the power is a multiple of 4.<\/p>","tag":""},{"id":"2.1.22","q":"<p>How many zeros are there at the end of 100! (100 factorial)?<\/p>","o":["20","24","25","21"],"a":1,"s":"<p>Count factors of 5: ⌊100/5⌋ + ⌊100/25⌋ = 20 + 4 = 24.<br>Other options: A — counted only multiples of 5, not the extra 5s in 25, 50, 75, 100; C — counting slip; D — counted only one extra factor of 5.<\/p>","tag":""},{"id":"2.1.23","q":"<p>If a = 2 + √3, what is a + 1/a?<\/p>","o":["2√3","4","2","4 + 2√3"],"a":1,"s":"<p>1/a = 1/(2 + √3) = (2 − √3)/(4 − 3) = 2 − √3. a + 1/a = (2 + √3) + (2 − √3) = 4.<br>Other options: A — this is a − 1/a; C — took 1/a = −√3; D — did not rationalise 1/a.<\/p>","tag":""},{"id":"2.1.24","q":"<p>Simplify: 81^(3/4) × 32^(−2/5)<\/p>","o":["108","9/4","27/4","27/16"],"a":2,"s":"<p>81^(3/4) = (3⁴)^(3/4) = 27. 32^(−2/5) = (2⁵)^(−2/5) = 2⁻² = 1/4. Product = 27/4.<br>Other options: A — used 32^(+2/5) = 4, multiplied instead of divided; B — took 81^(3/4) as 9; D — took 32^(2/5) as 16.<\/p>","tag":""},{"id":"2.1.25","q":"<p>If x = 5 + 2√6, what is √x + 1/√x?<\/p>","o":["2√2","10","√6","2√3"],"a":3,"s":"<p>x = 5 + 2√6 = (√3 + √2)², so √x = √3 + √2 and 1/√x = √3 − √2. Sum = 2√3.<br>Other options: A — this is √x − 1/√x; B — this is x + 1/x; C — arithmetic slip.<\/p>","tag":""},{"id":"2.1.26","q":"<p>The HCF of two numbers is 13 and their sum is 117. How many such pairs of numbers are possible?<\/p>","o":["4","2","3","1"],"a":2,"s":"<p>Let the numbers be 13a and 13b with a, b co-prime. a + b = 117 ÷ 13 = 9. Co-prime pairs: (1, 8), (2, 7), (4, 5). So 3 pairs.<br>Other options: A — wrongly counted (3, 6), which are not co-prime; B — missed a pair; D — missed two pairs.<\/p>","tag":""},{"id":"2.1.27","q":"<p>What is the smallest number by which 1152 must be multiplied to make it a perfect square?<\/p>","o":["2","3","6","8"],"a":0,"s":"<p>1152 = 2⁷ × 3². The power of 2 is odd, so multiply by 2 to get 2⁸ × 3² = 48².<br>Other options: B — 3 already appears to an even power (3²); C — multiplying by 6 gives 2⁸·3³, not a square; D — gives a square, but not the smallest multiplier.<\/p>","tag":""},{"id":"2.1.28","q":"<p>Simplify: 1/(1×2) + 1/(2×3) + 1/(3×4) + … + 1/(9×10)<\/p>","o":["9/10","1/10","10/11","11/10"],"a":0,"s":"<p>Each term 1/(n(n+1)) = 1/n − 1/(n+1). The sum telescopes to 1 − 1/10 = 9/10.<br>Other options: B — this is only the leftover term 1/10; C — used the sum up to 1/(10×11); D — added 1/10 instead of subtracting.<\/p>","tag":""},{"id":"2.1.29","q":"<p>A number divided by 136 leaves a remainder of 36. What is the remainder when the same number is divided by 17?<\/p>","o":["19","36","2","0"],"a":2,"s":"<p>N = 136k + 36. Since 136 = 8 × 17, N mod 17 = 36 mod 17 = 2.<br>Other options: A — 19 is larger than 17, so it cannot be a remainder; B — 36 is larger than 17; D — ignored the remainder 36.<\/p>","tag":""},{"id":"2.1.30","q":"<p>Simplify: (0.75)³ ÷ (1 − 0.75) + [0.75 + (0.75)² + 1]<\/p>","o":["1","3","4","0.75"],"a":2,"s":"<p>Let a = 0.75. a³/(1 − a) + (1 + a + a²) = [a³ + (1 − a)(1 + a + a²)]/(1 − a) = [a³ + 1 − a³]/(1 − a) = 1/(1 − a) = 1/0.25 = 4.<br>Other options: A — took only the numerator 1 of the combined fraction; B — arithmetic slip in the first term; D — cancelled terms wrongly.<\/p>","tag":""}]},{"k":"2.2","t":"Percentage, Profit and Loss, Discount, Simple and Compound Interest","items":[{"id":"2.2.1","q":"<p>What is 25% of 40% of 600?<\/p>","o":["90","150","240","60"],"a":3,"s":"<p>40% of 600 = 240; 25% of 240 = 60.<br>Other options: A — took 15% (40% − 25%) of 600; B — this is 25% of 600 only; C — this is 40% of 600 only.<\/p>","tag":""},{"id":"2.2.2","q":"<p>A's salary is 25% more than B's. By what percentage is B's salary less than A's?<\/p>","o":["20%","25%","15%","22.5%"],"a":0,"s":"<p>Let B = 100, A = 125. B is less than A by 25/125 × 100 = 20%.<br>Other options: B — used B as the base instead of A; C — arithmetic slip; D — averaged 20% and 25%.<\/p>","tag":""},{"id":"2.2.3","q":"<p>A number is first increased by 20% and then decreased by 20%. What is the net change?<\/p>","o":["4% decrease","No change","4% increase","2% decrease"],"a":0,"s":"<p>Net factor = 1.2 × 0.8 = 0.96, i.e. a 4% decrease. (Shortcut: x − y − xy/100 = 20 − 20 − 4 = −4%.)<br>Other options: B — the two 20% changes are on different bases; C — wrong sign; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.4","q":"<p>The population of a town is 50,000 and it grows by 10% every year. What will it be after 2 years?<\/p>","o":["60,000","55,000","60,500","61,000"],"a":2,"s":"<p>50,000 × 1.1 × 1.1 = 60,500.<br>Other options: A — used simple growth (10% of 50,000 twice); B — growth for only one year; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.5","q":"<p>The price of petrol rises by 20%. By what percentage must a car owner reduce consumption so that the expenditure stays the same?<\/p>","o":["20%","16⅔%","18%","15%"],"a":1,"s":"<p>Reduction = r/(100 + r) × 100 = 20/120 × 100 = 16⅔%.<br>Other options: A — used the same percentage as the rise; C — guess between the two; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.6","q":"<p>The pass mark in an examination is 35%. A candidate scores 210 marks and fails by 35 marks. What are the maximum marks?<\/p>","o":["700","600","650","800"],"a":0,"s":"<p>Pass mark = 210 + 35 = 245 = 35% of maximum. Maximum = 245 ÷ 0.35 = 700.<br>Other options: B — took 210 as 35% of the maximum (ignored the 35-mark shortfall); C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.7","q":"<p>An article bought for Rs 800 is sold for Rs 920. What is the profit percentage?<\/p>","o":["13.04%","12%","15%","18%"],"a":2,"s":"<p>Profit = 920 − 800 = 120. Profit % = 120/800 × 100 = 15%.<br>Other options: A — took profit as a percentage of SP (120/920); B — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.8","q":"<p>By selling an article for Rs 1,140, a man loses 5%. At what price should he sell it to gain 5%?<\/p>","o":["Rs 1,197","Rs 1,254","Rs 1,250","Rs 1,260"],"a":3,"s":"<p>CP = 1,140 ÷ 0.95 = 1,200. SP for 5% gain = 1,200 × 1.05 = Rs 1,260.<br>Other options: A — added 5% to the selling price 1,140; B — added 10% to 1,140; C — arithmetic slip.<\/p>","tag":""},{"id":"2.2.9","q":"<p>A shopkeeper marks his goods 40% above cost price and allows a discount of 15%. What is his profit percentage?<\/p>","o":["19%","25%","21%","17%"],"a":0,"s":"<p>Let CP = 100. MP = 140; SP = 140 × 0.85 = 119. Profit = 19%.<br>Other options: B — subtracted 15 from 40; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.10","q":"<p>What single discount is equivalent to two successive discounts of 20% and 10%?<\/p>","o":["30%","28%","25%","32%"],"a":1,"s":"<p>Remaining price = 0.8 × 0.9 = 0.72, so single discount = 28%. (20 + 10 − 20×10/100 = 28.)<br>Other options: A — simply added the two discounts; C — arithmetic slip; D — added the product term instead of subtracting it.<\/p>","tag":""},{"id":"2.2.11","q":"<p>A dishonest shopkeeper sells goods at cost price but uses a weight of 900 g for 1 kg. What is his gain percentage?<\/p>","o":["11⅑%","10%","9%","12½%"],"a":0,"s":"<p>He gains 100 g on every 900 g he actually gives. Gain % = 100/900 × 100 = 11⅑%.<br>Other options: B — took the gain on 1,000 g instead of 900 g; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.12","q":"<p>What is the simple interest on Rs 5,000 at 8% per annum for 3 years?<\/p>","o":["Rs 1,200","Rs 1,298.56","Rs 400","Rs 1,500"],"a":0,"s":"<p>SI = P × R × T/100 = 5,000 × 8 × 3/100 = Rs 1,200.<br>Other options: B — this is compound interest; C — interest for one year only; D — used 10% instead of 8%.<\/p>","tag":""},{"id":"2.2.13","q":"<p>A sum of money doubles itself in 8 years at simple interest. What is the rate of interest per annum?<\/p>","o":["8%","12.5%","10%","25%"],"a":1,"s":"<p>Interest = P in 8 years, so P × R × 8/100 = P, giving R = 100/8 = 12.5%.<br>Other options: A — used the number of years as the rate; C — guess; D — halved the time: this rate doubles the sum in 4 years.<\/p>","tag":""},{"id":"2.2.14","q":"<p>What is the compound interest on Rs 10,000 at 10% per annum for 2 years, compounded annually?<\/p>","o":["Rs 2,000","Rs 2,100","Rs 2,200","Rs 1,210"],"a":1,"s":"<p>Amount = 10,000 × 1.1² = 12,100. CI = 12,100 − 10,000 = Rs 2,100.<br>Other options: A — this is simple interest; C — arithmetic slip; D — took 10% of the amount 12,100.<\/p>","tag":""},{"id":"2.2.15","q":"<p>What is the difference between compound interest and simple interest on Rs 8,000 at 5% per annum for 2 years?<\/p>","o":["Rs 40","Rs 25","Rs 20","Rs 10"],"a":2,"s":"<p>For 2 years, CI − SI = P(R/100)² = 8,000 × 0.05² = Rs 20.<br>Other options: A — doubled the difference; B — arithmetic slip; D — halved the difference.<\/p>","tag":""},{"id":"2.2.16","q":"<p>A sum amounts to Rs 7,800 in 3 years and to Rs 8,400 in 5 years at simple interest. What is the sum?<\/p>","o":["Rs 7,200","Rs 6,600","Rs 7,000","Rs 6,900"],"a":3,"s":"<p>Interest for 2 years = 8,400 − 7,800 = 600, so 300 per year. Sum = 7,800 − 3 × 300 = Rs 6,900.<br>Other options: A — subtracted interest for only 2 years; B — subtracted interest for 4 years; C — arithmetic slip.<\/p>","tag":""},{"id":"2.2.17","q":"<p>What is the compound interest on Rs 16,000 for 1 year at 10% per annum, compounded half-yearly?<\/p>","o":["Rs 1,600","Rs 3,360","Rs 1,640","Rs 800"],"a":2,"s":"<p>Half-yearly rate 5%, 2 periods. Amount = 16,000 × 1.05² = 17,640. CI = Rs 1,640.<br>Other options: A — compounded annually (same as simple interest for 1 year); B — used 10% per half-year instead of 5%; D — interest for one half-year only.<\/p>","tag":""},{"id":"2.2.18","q":"<p>A sum at compound interest amounts to Rs 6,050 in 2 years and Rs 6,655 in 3 years. What is the sum?<\/p>","o":["Rs 5,000","Rs 5,500","Rs 4,840","Rs 5,445"],"a":0,"s":"<p>Interest on 6,050 for 1 year = 605, so rate = 10%. Sum = 6,050 ÷ 1.1² = Rs 5,000.<br>Other options: B — went back only one year; C — went back two years using simple interest of 605 a year; D — subtracted 605 from 6,050.<\/p>","tag":""},{"id":"2.2.19","q":"<p>By selling 18 articles, a merchant gains the selling price of 3 articles. What is his gain percentage?<\/p>","o":["16⅔%","18%","25%","20%"],"a":3,"s":"<p>SP of 18 − CP of 18 = SP of 3, so CP of 18 = SP of 15. Gain = 3 on a cost of 15 = 20%.<br>Other options: A — took gain as a fraction of SP (3/18); B — guess; C — arithmetic slip.<\/p>","tag":""},{"id":"2.2.20","q":"<p>The cost price of 20 articles equals the selling price of 16 articles. What is the profit percentage?<\/p>","o":["20%","4%","80%","25%"],"a":3,"s":"<p>Let CP of each = 1. SP of 16 = 20, so SP of each = 20/16 = 1.25. Profit = 25%.<br>Other options: A — divided by 20 instead of 16; B — difference of counts, not a percentage; C — took 16/20.<\/p>","tag":""},{"id":"2.2.21","q":"<p>Two articles are sold for Rs 990 each, one at a 10% gain and the other at a 10% loss. What is the overall result?<\/p>","o":["No profit, no loss","Loss of Rs 20","Gain of Rs 20","Loss of Rs 10"],"a":1,"s":"<p>CPs: 990 ÷ 1.1 = 900 and 990 ÷ 0.9 = 1,100; total CP = 2,000. Total SP = 1,980. Loss = Rs 20.<br>Other options: A — the 10% gain and loss are on different cost prices; C — wrong sign; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.22","q":"<p>In an election between two candidates, the winner gets 58% of the valid votes and wins by 2,560 votes. How many valid votes were cast?<\/p>","o":["4,414","14,000","16,000","18,000"],"a":2,"s":"<p>Margin = 58% − 42% = 16% of valid votes = 2,560. Valid votes = 2,560 ÷ 0.16 = 16,000.<br>Other options: A — divided 2,560 by 0.58; B — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.23","q":"<p>Rs 12,000 is lent in two parts, one at 10% and the other at 12% simple interest per annum. The total interest after 1 year is Rs 1,340. How much was lent at 10%?<\/p>","o":["Rs 7,000","Rs 6,000","Rs 4,000","Rs 5,000"],"a":3,"s":"<p>Let x be lent at 10%: 0.10x + 0.12(12,000 − x) = 1,340 → 1,440 − 0.02x = 1,340 → x = 5,000.<br>Other options: A — this is the part lent at 12%; B — assumed equal parts; C — arithmetic slip.<\/p>","tag":""},{"id":"2.2.24","q":"<p>A trader allows a 15% discount on a marked price of Rs 1,500 and still gains 2%. What is the cost price?<\/p>","o":["Rs 1,250","Rs 1,275","Rs 1,300","Rs 1,249.50"],"a":0,"s":"<p>SP = 1,500 × 0.85 = 1,275. CP = 1,275 ÷ 1.02 = Rs 1,250.<br>Other options: B — this is the selling price; C — arithmetic slip; D — subtracted 2% of SP from SP.<\/p>","tag":""},{"id":"2.2.25","q":"<p>A sum of money at compound interest becomes 3 times itself in 4 years. In how many years will it become 9 times itself?<\/p>","o":["12 years","16 years","8 years","6 years"],"a":2,"s":"<p>9 = 3², so it takes twice as long: (1 + r)⁴ = 3 ⇒ (1 + r)⁸ = 9. Answer 8 years.<br>Other options: A — treated growth as additive (3 → 9 is 6 more); B — squared the time; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.26","q":"<p>A 20% fall in the price of rice lets a buyer get 5 kg more for Rs 800. What was the original price per kg?<\/p>","o":["Rs 32","Rs 40","Rs 48","Rs 50"],"a":1,"s":"<p>Saving = 20% of 800 = Rs 160, which buys 5 kg at the new price: new price = 160 ÷ 5 = Rs 32. Original price = 32 ÷ 0.8 = Rs 40.<br>Other options: A — this is the reduced price; C — added 20% to 40; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.27","q":"<p>A man spends 75% of his income. His income rises by 20% and his expenditure by 10%. By what percentage do his savings increase?<\/p>","o":["10%","50%","30%","40%"],"a":1,"s":"<p>Let income = 100: expenditure 75, savings 25. New income 120, new expenditure 82.5, new savings 37.5. Increase = 12.5/25 = 50%.<br>Other options: A — difference of the two rises; C — added the two rises; D — arithmetic slip.<\/p>","tag":""},{"id":"2.2.28","q":"<p>What is the effective annual rate of interest for 12% per annum compounded quarterly?<\/p>","o":["12%","12.36%","13%","12.55%"],"a":3,"s":"<p>Quarterly rate 3%. Effective rate = 1.03⁴ − 1 = 0.1255… ≈ 12.55%.<br>Other options: A — ignored compounding; B — compounded half-yearly instead of quarterly; C — rounded up wrongly.<\/p>","tag":""},{"id":"2.2.29","q":"<p>At what rate of simple interest per annum will Rs 2,400 amount to Rs 3,000 in 5 years?<\/p>","o":["4%","5%","6%","25%"],"a":1,"s":"<p>SI = 600. R = 600 × 100/(2,400 × 5) = 5%.<br>Other options: A — arithmetic slip; C — arithmetic slip; D — took total interest ÷ principal without dividing by the years.<\/p>","tag":""},{"id":"2.2.30","q":"<p>A loan of Rs 21,000 is to be repaid in two equal annual instalments at 10% per annum compound interest. What is each instalment?<\/p>","o":["Rs 11,550","Rs 11,025","Rs 12,100","Rs 10,500"],"a":2,"s":"<p>x/1.1 + x/1.1² = 21,000 → x(1.1 + 1)/1.21 = 21,000 → x = 21,000 × 1.21/2.1 = Rs 12,100.<br>Other options: A — added interest for one year to half the loan; B — arithmetic slip; D — ignored interest.<\/p>","tag":""}]},{"k":"2.3","t":"Ratio and Proportion, Averages, Mixtures and Alligation, Partnership, Ages","items":[{"id":"2.3.1","q":"<p>Rs 1,200 is divided between two people in the ratio 3 : 5. What is the larger share?<\/p>","o":["Rs 450","Rs 720","Rs 750","Rs 800"],"a":2,"s":"<p>Total parts = 8. Larger share = 1,200 × 5/8 = Rs 750.<br>Other options: A — this is the smaller share; B — arithmetic slip; D — divided 1,200 into 3 parts and took 2.<\/p>","tag":""},{"id":"2.3.2","q":"<p>If a : b = 2 : 3 and b : c = 4 : 5, what is a : b : c?<\/p>","o":["2 : 3 : 5","8 : 12 : 15","8 : 12 : 5","2 : 12 : 15"],"a":1,"s":"<p>Make b the same: a : b = 8 : 12 and b : c = 12 : 15. So a : b : c = 8 : 12 : 15.<br>Other options: A — joined the ratios without making b equal; C — did not scale c; D — did not scale a.<\/p>","tag":""},{"id":"2.3.3","q":"<p>What is the fourth proportional to 4, 9 and 12?<\/p>","o":["18","36","24","27"],"a":3,"s":"<p>4 : 9 = 12 : x, so x = 9 × 12/4 = 27.<br>Other options: A — arithmetic slip; B — multiplied 4 × 9; C — doubled 12.<\/p>","tag":""},{"id":"2.3.4","q":"<p>What is the mean proportional between 9 and 16?<\/p>","o":["12.5","25","144","12"],"a":3,"s":"<p>Mean proportional = √(9 × 16) = √144 = 12.<br>Other options: A — this is the arithmetic mean; B — this is the sum; C — this is the product, not its square root.<\/p>","tag":""},{"id":"2.3.5","q":"<p>What is the average of the first 20 odd natural numbers?<\/p>","o":["21","19","20","400"],"a":2,"s":"<p>Sum of the first n odd numbers = n² = 400. Average = 400/20 = 20.<br>Other options: A — off by one; B — off by one; D — this is their sum.<\/p>","tag":""},{"id":"2.3.6","q":"<p>The average of five numbers is 27. If one number is removed, the average of the rest becomes 25. What number was removed?<\/p>","o":["2","27","35","30"],"a":2,"s":"<p>Sum of five = 135; sum of four = 100. Removed number = 35.<br>Other options: A — difference of the averages; B — assumed it equals the old average; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.7","q":"<p>A batsman scores 85 runs in his 16th innings and thereby raises his average by 3. What is his average after the 16th innings?<\/p>","o":["40","37","43","45"],"a":0,"s":"<p>Let the old average be a: 15a + 85 = 16(a + 3) → a = 37. New average = 40.<br>Other options: B — this is the average before the 16th innings; C — added 3 to the new average; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.8","q":"<p>The average weight of 8 persons increases by 2.5 kg when a new person replaces one weighing 65 kg. What is the weight of the new person?<\/p>","o":["67.5 kg","85 kg","75 kg","80 kg"],"a":1,"s":"<p>Total weight rises by 8 × 2.5 = 20 kg. New person = 65 + 20 = 85 kg.<br>Other options: A — added only 2.5 kg; C — arithmetic slip; D — used 6 persons instead of 8.<\/p>","tag":""},{"id":"2.3.9","q":"<p>The incomes of A and B are in the ratio 4 : 3 and their expenditures in the ratio 3 : 2. If each saves Rs 6,000, what is A's income?<\/p>","o":["Rs 24,000","Rs 18,000","Rs 20,000","Rs 30,000"],"a":0,"s":"<p>Incomes 4x, 3x; expenditures 3y, 2y. 4x − 3y = 6,000 and 3x − 2y = 6,000. Solving: x = 6,000, y = 6,000. A's income = 4x = Rs 24,000.<br>Other options: B — this is B's income; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.10","q":"<p>A 60-litre mixture contains milk and water in the ratio 2 : 1. How much water must be added to make the ratio 1 : 2?<\/p>","o":["40 litres","20 litres","60 litres","80 litres"],"a":2,"s":"<p>Milk = 40 l, water = 20 l. For milk : water = 1 : 2, water must be 80 l. Water to add = 80 − 20 = 60 l.<br>Other options: A — this is the amount of milk; B — this is the water already present; D — this is the total water needed, not the amount to add.<\/p>","tag":""},{"id":"2.3.11","q":"<p>Rice at Rs 60 per kg and rice at Rs 75 per kg are mixed so that the mixture is worth Rs 65 per kg. In what ratio are they mixed (cheaper : dearer)?<\/p>","o":["1 : 2","2 : 1","3 : 2","1 : 1"],"a":1,"s":"<p>Alligation: cheaper : dearer = (75 − 65) : (65 − 60) = 10 : 5 = 2 : 1.<br>Other options: A — reversed the alligation ratio; C — arithmetic slip; D — that would give Rs 67.50.<\/p>","tag":""},{"id":"2.3.12","q":"<p>A invests Rs 40,000 for 12 months and B invests Rs 60,000 for 8 months. Out of a profit of Rs 36,000, what is A's share?<\/p>","o":["Rs 14,400","Rs 21,600","Rs 18,000","Rs 12,000"],"a":2,"s":"<p>A : B = 40,000 × 12 : 60,000 × 8 = 4,80,000 : 4,80,000 = 1 : 1. A's share = Rs 18,000.<br>Other options: A — split by capital only (40 : 60); B — took B's share by capital only; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.13","q":"<p>The ages of A and B are in the ratio 4 : 5. After 6 years the ratio will be 5 : 6. What is A's present age?<\/p>","o":["24 years","30 years","20 years","18 years"],"a":0,"s":"<p>(4x + 6)/(5x + 6) = 5/6 → 24x + 36 = 25x + 30 → x = 6. A = 4 × 6 = 24 years.<br>Other options: B — this is B's present age; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.14","q":"<p>A father is three times as old as his son. After 15 years he will be twice as old as his son. What is the father's present age?<\/p>","o":["15 years","60 years","30 years","45 years"],"a":3,"s":"<p>3s + 15 = 2(s + 15) → s = 15. Father = 45 years.<br>Other options: A — this is the son's age; B — father's age after 15 years; C — son's age after 15 years.<\/p>","tag":""},{"id":"2.3.15","q":"<p>The sum of the ages of 5 children born at intervals of 3 years each is 50 years. What is the age of the youngest child?<\/p>","o":["4 years","8 years","10 years","6 years"],"a":0,"s":"<p>y + (y + 3) + (y + 6) + (y + 9) + (y + 12) = 50 → 5y + 30 = 50 → y = 4.<br>Other options: B — arithmetic slip; C — this is the average age; D — used intervals of 2 years.<\/p>","tag":""},{"id":"2.3.16","q":"<p>What is the compound ratio of 2 : 3, 6 : 11 and 11 : 2?<\/p>","o":["1 : 2","2 : 1","19 : 16","11 : 6"],"a":1,"s":"<p>Multiply antecedents and consequents: (2 × 6 × 11) : (3 × 11 × 2) = 132 : 66 = 2 : 1.<br>Other options: A — inverted the ratio; C — added the terms instead of multiplying; D — dropped one of the ratios.<\/p>","tag":""},{"id":"2.3.17","q":"<p>If x : y = 3 : 4, what is (5x − 2y) : (7x + 2y)?<\/p>","o":["7 : 29","7 : 13","23 : 29","15 : 21"],"a":0,"s":"<p>Put x = 3, y = 4: (15 − 8) : (21 + 8) = 7 : 29.<br>Other options: B — used 7x − 2y in the second term; C — used 5x + 2y in the first term; D — ignored the y terms.<\/p>","tag":""},{"id":"2.3.18","q":"<p>A bag contains Re 1, 50-paisa and 25-paisa coins in the ratio 5 : 6 : 8. The total value is Rs 210. How many 25-paisa coins are there?<\/p>","o":["168","105","126","42"],"a":0,"s":"<p>Values in rupees: 5x × 1 + 6x × 0.5 + 8x × 0.25 = 5x + 3x + 2x = 10x = 210 → x = 21. 25-paisa coins = 8 × 21 = 168.<br>Other options: B — number of Re 1 coins; C — number of 50-paisa coins; D — value in rupees of the 25-paisa coins.<\/p>","tag":""},{"id":"2.3.19","q":"<p>A container holds 40 litres of milk. 4 litres are taken out and replaced with water; this is done once more. How much milk is now in the container?<\/p>","o":["32 litres","32.4 litres","36 litres","33.6 litres"],"a":1,"s":"<p>Milk left = 40 × (1 − 4/40)² = 40 × 0.81 = 32.4 litres.<br>Other options: A — subtracted 4 litres of milk twice; C — did the step only once; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.20","q":"<p>How many kg of tea at Rs 420 per kg must be mixed with 30 kg of tea at Rs 500 per kg to get a mixture worth Rs 450 per kg?<\/p>","o":["18 kg","30 kg","50 kg","40 kg"],"a":2,"s":"<p>Cheaper : dearer = (500 − 450) : (450 − 420) = 50 : 30 = 5 : 3. Cheaper tea = 30 × 5/3 = 50 kg.<br>Other options: A — inverted the alligation ratio; B — assumed equal quantities; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.21","q":"<p>A, B and C start a business with Rs 20,000, Rs 30,000 and Rs 50,000. After 6 months C withdraws half his capital. Out of a year-end profit of Rs 42,000, what is C's share?<\/p>","o":["Rs 21,000","Rs 18,000","Rs 12,000","Rs 14,400"],"a":1,"s":"<p>Capital-months: A 2,40,000; B 3,60,000; C 50,000 × 6 + 25,000 × 6 = 4,50,000. Ratio 8 : 12 : 15 (total 35). C = 42,000 × 15/35 = Rs 18,000.<br>Other options: A — ignored the withdrawal; C — arithmetic slip; D — B's share.<\/p>","tag":""},{"id":"2.3.22","q":"<p>The average of 11 results is 50. The average of the first six is 49 and that of the last six is 52. What is the sixth result?<\/p>","o":["50","56","51","54"],"a":1,"s":"<p>The sixth result is counted in both groups: 6 × 49 + 6 × 52 − 11 × 50 = 294 + 312 − 550 = 56.<br>Other options: A — assumed it equals the overall average; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.23","q":"<p>The average age of 30 students is 15 years. When the teacher's age is included, the average becomes 16 years. What is the teacher's age?<\/p>","o":["31 years","16 years","45 years","46 years"],"a":3,"s":"<p>Teacher = 31 × 16 − 30 × 15 = 496 − 450 = 46 years.<br>Other options: A — this is just 15 + 16, the two averages added; B — took the new average; C — forgot the teacher's own 1-year share.<\/p>","tag":""},{"id":"2.3.24","q":"<p>Ten years ago, A was half as old as B. If the ratio of their present ages is 3 : 4, what is the sum of their present ages?<\/p>","o":["45 years","30 years","35 years","40 years"],"a":2,"s":"<p>Present ages 3x and 4x: 2(3x − 10) = 4x − 10 → 6x − 20 = 4x − 10 → x = 5. Ages 15 and 20; sum = 35.<br>Other options: A — arithmetic slip; B — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.25","q":"<p>Two vessels contain milk and water in the ratios 3 : 1 and 5 : 3. Equal quantities from both are mixed. What is the ratio of milk to water in the new mixture?<\/p>","o":["11 : 5","2 : 1","5 : 3","13 : 3"],"a":0,"s":"<p>Milk = 3/4 + 5/8 = 11/8; water = 1/4 + 3/8 = 5/8. Ratio = 11 : 5.<br>Other options: B — added the ratio terms directly (8 : 4); C — ratio of the second vessel only; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.26","q":"<p>The average of five consecutive odd numbers is 61. What is the product of the smallest and the largest?<\/p>","o":["3705","3721","3599","3965"],"a":0,"s":"<p>The numbers are 57, 59, 61, 63, 65. Product = 57 × 65 = 3705.<br>Other options: B — squared the average; C — this is 59 × 61, the wrong pair; D — used 61 and 65.<\/p>","tag":""},{"id":"2.3.27","q":"<p>A starts a business with Rs 3,500. Some months later B joins with Rs 9,000. At the end of the year, the profit is shared 2 : 3. After how many months did B join?<\/p>","o":["7 months","4 months","6 months","5 months"],"a":3,"s":"<p>3,500 × 12 : 9,000 × (12 − x) = 2 : 3 → 3 × 42,000 = 2 × 9,000 × (12 − x) → 12 − x = 7 → x = 5.<br>Other options: A — this is how long B's capital was invested; B — arithmetic slip; C — arithmetic slip.<\/p>","tag":""},{"id":"2.3.28","q":"<p>The salaries of A and B are in the ratio 5 : 7. If each gets an increase of Rs 5,000, the ratio becomes 3 : 4. What is A's present salary?<\/p>","o":["Rs 35,000","Rs 25,000","Rs 30,000","Rs 20,000"],"a":1,"s":"<p>(5k + 5,000)/(7k + 5,000) = 3/4 → 20k + 20,000 = 21k + 15,000 → k = 5,000. A = 5k = Rs 25,000.<br>Other options: A — this is B's salary; C — A's salary after the increase; D — arithmetic slip.<\/p>","tag":""},{"id":"2.3.29","q":"<p>Section A has 30 students with an average mark of 60 and section B has 20 students with an average mark of 70. What is the average for both sections together?<\/p>","o":["65","66","62","64"],"a":3,"s":"<p>Weighted average = (30 × 60 + 20 × 70)/50 = (1,800 + 1,400)/50 = 64.<br>Other options: A — took the simple average of 60 and 70; B — weighted the wrong way round; C — arithmetic slip.<\/p>","tag":""},{"id":"2.3.30","q":"<p>A mother is now 4 times as old as her daughter. Five years ago she was 7 times as old as her daughter. How old will the daughter be after 5 years?<\/p>","o":["10 years","45 years","20 years","15 years"],"a":3,"s":"<p>m = 4d and m − 5 = 7(d − 5) → 4d − 5 = 7d − 35 → d = 10. After 5 years: 15.<br>Other options: A — daughter's present age; B — mother's age after 5 years; C — arithmetic slip.<\/p>","tag":""}]},{"k":"2.4","t":"Time and Work, Pipes and Cisterns, Time-Speed-Distance, Boats and Trains","items":[{"id":"2.4.1","q":"<p>A can do a piece of work in 10 days and B in 15 days. In how many days can they finish it working together?<\/p>","o":["12.5 days","5 days","25 days","6 days"],"a":3,"s":"<p>Work per day = 1/10 + 1/15 = 5/30 = 1/6. Together they take 6 days.<br>Other options: A — averaged the two times; B — arithmetic slip; C — added the two times.<\/p>","tag":""},{"id":"2.4.2","q":"<p>A and B together can finish a job in 12 days; A alone can finish it in 20 days. How long will B take alone?<\/p>","o":["8 days","30 days","32 days","24 days"],"a":1,"s":"<p>B's rate = 1/12 − 1/20 = (5 − 3)/60 = 1/30. B takes 30 days.<br>Other options: A — subtracted 12 from 20; C — added 12 and 20; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.3","q":"<p>12 men can complete a work in 18 days. In how many days will 27 men complete the same work?<\/p>","o":["8 days","40.5 days","9 days","6 days"],"a":0,"s":"<p>Man-days = 12 × 18 = 216. Days for 27 men = 216 ÷ 27 = 8.<br>Other options: B — treated men and days as directly proportional; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.4","q":"<p>A is twice as efficient as B. Together they finish a job in 14 days. How long will A take alone?<\/p>","o":["42 days","21 days","28 days","7 days"],"a":1,"s":"<p>Rates A : B = 2 : 1. Total work = 3 × 14 = 42 units; A does 2 units a day, so 21 days.<br>Other options: A — this is B's time alone; C — doubled the joint time; D — halved the joint time.<\/p>","tag":""},{"id":"2.4.5","q":"<p>Pipe A fills a tank in 20 minutes and pipe B in 30 minutes. How long will both pipes together take to fill it?<\/p>","o":["25 minutes","10 minutes","12 minutes","50 minutes"],"a":2,"s":"<p>Rate = 1/20 + 1/30 = 5/60 = 1/12. Time = 12 minutes.<br>Other options: A — averaged the two times; B — arithmetic slip; D — added the times.<\/p>","tag":""},{"id":"2.4.6","q":"<p>A pipe can fill a tank in 6 hours, but a leak can empty the full tank in 12 hours. How long will it take to fill the tank with the leak?<\/p>","o":["4 hours","12 hours","18 hours","9 hours"],"a":1,"s":"<p>Net rate = 1/6 − 1/12 = 1/12. Time = 12 hours.<br>Other options: A — added the leak's rate instead of subtracting; C — added the two times; D — averaged the two times.<\/p>","tag":""},{"id":"2.4.7","q":"<p>Pipes A and B fill a tank in 10 hours and 15 hours; pipe C empties it in 30 hours. If all three are opened together, how long will it take to fill the tank?<\/p>","o":["6 hours","8 hours","5 hours","7.5 hours"],"a":3,"s":"<p>Net rate = 1/10 + 1/15 − 1/30 = (3 + 2 − 1)/30 = 4/30. Time = 30/4 = 7.5 hours.<br>Other options: A — ignored the outlet pipe C; B — arithmetic slip; C — added C's rate instead of subtracting.<\/p>","tag":""},{"id":"2.4.8","q":"<p>What is 72 km/h in metres per second?<\/p>","o":["25 m/s","20 m/s","18 m/s","7.2 m/s"],"a":1,"s":"<p>Multiply by 5/18: 72 × 5/18 = 20 m/s.<br>Other options: A — arithmetic slip in multiplying by 5/18; C — arithmetic slip; D — divided by 10.<\/p>","tag":""},{"id":"2.4.9","q":"<p>A car covers 300 km in 5 hours. What speed is needed to cover the same distance in 4 hours?<\/p>","o":["75 km/h","60 km/h","80 km/h","70 km/h"],"a":0,"s":"<p>Required speed = 300 ÷ 4 = 75 km/h.<br>Other options: B — this is the present speed; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.10","q":"<p>A man goes to a place at 40 km/h and returns along the same route at 60 km/h. What is his average speed for the whole journey?<\/p>","o":["50 km/h","48 km/h","45 km/h","52 km/h"],"a":1,"s":"<p>For equal distances, average speed = 2xy/(x + y) = 2 × 40 × 60/100 = 48 km/h.<br>Other options: A — took the simple average of the speeds; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.11","q":"<p>A train 150 m long runs at 54 km/h. How long does it take to pass a pole?<\/p>","o":["2.78 seconds","9 seconds","15 seconds","10 seconds"],"a":3,"s":"<p>54 km/h = 15 m/s. Time = 150 ÷ 15 = 10 seconds.<br>Other options: A — divided 150 by 54 without converting units; B — arithmetic slip; C — used 10 m/s as the speed.<\/p>","tag":""},{"id":"2.4.12","q":"<p>A train 200 m long running at 72 km/h crosses a platform 300 m long. How long does it take?<\/p>","o":["10 seconds","15 seconds","25 seconds","30 seconds"],"a":2,"s":"<p>72 km/h = 20 m/s. Distance = 200 + 300 = 500 m. Time = 500 ÷ 20 = 25 seconds.<br>Other options: A — used only the train's length; B — used only the platform's length; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.13","q":"<p>Two trains 120 m and 180 m long run at 50 km/h and 40 km/h in opposite directions on parallel tracks. How long do they take to cross each other?<\/p>","o":["12 seconds","108 seconds","21.6 seconds","7.2 seconds"],"a":0,"s":"<p>Relative speed = 90 km/h = 25 m/s. Distance = 300 m. Time = 12 seconds.<br>Other options: B — subtracted the speeds (that is for the same direction); C — used only one train's speed; D — used only the longer train's length.<\/p>","tag":""},{"id":"2.4.14","q":"<p>Two trains 120 m and 180 m long run in the same direction at 60 km/h and 42 km/h. How long does the faster train take to pass the slower one completely?<\/p>","o":["10.6 seconds","36 seconds","24 seconds","60 seconds"],"a":3,"s":"<p>Relative speed = 18 km/h = 5 m/s. Distance = 300 m. Time = 60 seconds.<br>Other options: A — added the speeds (that is for opposite directions); B — used only the 180 m train; C — used only the 120 m train.<\/p>","tag":""},{"id":"2.4.15","q":"<p>A boat goes downstream at 18 km/h and upstream at 12 km/h. What is the speed of the stream?<\/p>","o":["3 km/h","15 km/h","6 km/h","1.5 km/h"],"a":0,"s":"<p>Stream speed = (18 − 12)/2 = 3 km/h.<br>Other options: B — this is the speed in still water; C — took the full difference, not half; D — quartered the difference.<\/p>","tag":""},{"id":"2.4.16","q":"<p>A boat's speed in still water is 15 km/h and the stream flows at 3 km/h. How long will it take to go 36 km downstream and come back?<\/p>","o":["4.8 hours","4 hours","6 hours","5 hours"],"a":3,"s":"<p>Downstream 18 km/h: 2 hours. Upstream 12 km/h: 3 hours. Total = 5 hours.<br>Other options: A — ignored the stream (72 ÷ 15); B — used 18 km/h both ways; C — used 12 km/h both ways.<\/p>","tag":""},{"id":"2.4.17","q":"<p>Two people 60 km apart start walking towards each other at 4 km/h and 6 km/h. After how long will they meet?<\/p>","o":["30 hours","10 hours","6 hours","15 hours"],"a":2,"s":"<p>Closing speed = 4 + 6 = 10 km/h. Time = 60 ÷ 10 = 6 hours.<br>Other options: A — subtracted the speeds; B — used only the faster speed; D — used only the slower speed.<\/p>","tag":""},{"id":"2.4.18","q":"<p>A thief is spotted by a policeman 400 m away. The thief runs at 8 km/h and the policeman chases at 10 km/h. How far will the thief have run before he is caught?<\/p>","o":["2,000 m","400 m","1,200 m","1,600 m"],"a":3,"s":"<p>Relative speed = 2 km/h; the 0.4 km gap closes in 0.2 h. Thief runs 8 × 0.2 = 1.6 km = 1,600 m.<br>Other options: A — this is the distance the policeman runs; B — the initial gap; C — arithmetic slip.<\/p>","tag":""},{"id":"2.4.19","q":"<p>Walking at 3/4 of his usual speed, a man reaches his office 20 minutes late. What is his usual time for the journey?<\/p>","o":["60 minutes","80 minutes","15 minutes","45 minutes"],"a":0,"s":"<p>At 3/4 speed the time is 4/3 of usual, so the extra time is 1/3 of usual = 20 minutes. Usual time = 60 minutes.<br>Other options: B — this is the time at the slower speed; C — took 3/4 of 20; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.20","q":"<p>A can do a job in 6 days and B in 8 days. With the help of C they finish it in 3 days and are paid Rs 3,200 in all. What is C's share?<\/p>","o":["Rs 400","Rs 800","Rs 1,600","Rs 1,200"],"a":0,"s":"<p>In 3 days A does 3/6 = 1/2, B does 3/8, so C does 1 − 1/2 − 3/8 = 1/8. C's share = 3,200 × 1/8 = Rs 400.<br>Other options: B — arithmetic slip; C — A's share; D — B's share.<\/p>","tag":""},{"id":"2.4.21","q":"<p>15 men working 8 hours a day finish a job in 20 days. How many days will 20 men take working 6 hours a day?<\/p>","o":["15 days","20 days","11.25 days","25 days"],"a":1,"s":"<p>Man-hours = 15 × 8 × 20 = 2,400. Days = 2,400 ÷ (20 × 6) = 20.<br>Other options: A — ignored the change in hours; C — inverted the hours ratio; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.22","q":"<p>A does 1/3 of a work in 5 days and B does 2/5 of it in 10 days. How long will they take to finish the whole work together?<\/p>","o":["20 days","10 days","9⅜ days","8 days"],"a":2,"s":"<p>A alone: 15 days; B alone: 25 days. Together: 1/(1/15 + 1/25) = 75/8 = 9⅜ days.<br>Other options: A — averaged the full times of 15 and 25 days; B — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.23","q":"<p>A and B can do a job in 12 days, B and C in 15 days, and C and A in 20 days. How long will A, B and C take working together?<\/p>","o":["5 days","15 days","10 days","20 days"],"a":2,"s":"<p>2(A + B + C) = 1/12 + 1/15 + 1/20 = 12/60 = 1/5, so A + B + C = 1/10. Together 10 days.<br>Other options: A — forgot to halve the sum of the pair rates; B — roughly the average of the three pair times; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.24","q":"<p>A and B can do a job in 12 days, B and C in 15 days, and C and A in 20 days. How long will A alone take?<\/p>","o":["30 days","60 days","20 days","40 days"],"a":0,"s":"<p>A + B + C = 1/10 (from the three pair rates). A = 1/10 − 1/15 = 1/30, so 30 days.<br>Other options: B — this is C's time alone; C — this is B's time alone; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.25","q":"<p>A train passes a man standing on a platform in 8 seconds and passes the 264 m long platform in 20 seconds. What is the length of the train?<\/p>","o":["264 m","176 m","132 m","220 m"],"a":1,"s":"<p>The extra 12 seconds cover the 264 m platform: speed = 22 m/s. Train length = 22 × 8 = 176 m.<br>Other options: A — the platform's length; C — halved the platform length; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.26","q":"<p>A boat goes 30 km upstream and 44 km downstream in 10 hours, and 40 km upstream and 55 km downstream in 13 hours. What is the speed of the boat in still water?<\/p>","o":["3 km/h","8 km/h","11 km/h","5 km/h"],"a":1,"s":"<p>Let u = 1/upstream speed, d = 1/downstream speed: 30u + 44d = 10, 40u + 55d = 13. Solving: d = 1/11, u = 1/5, so downstream 11 and upstream 5 km/h. Still water = (11 + 5)/2 = 8 km/h.<br>Other options: A — this is the speed of the stream; C — downstream speed; D — upstream speed.<\/p>","tag":""},{"id":"2.4.27","q":"<p>Two runners start together from the same point on a 600 m circular track and run in the same direction at 5 m/s and 7 m/s. When will they first meet again?<\/p>","o":["After 50 seconds","After 120 seconds","After 300 seconds","After 600 seconds"],"a":2,"s":"<p>The faster runner must gain one full lap: 600 ÷ (7 − 5) = 300 seconds.<br>Other options: A — added the speeds (that is for opposite directions); B — time for the slower runner to complete one lap; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.28","q":"<p>Two pipes can fill a tank in 12 minutes and 15 minutes. Both are opened together, but the first pipe is closed after 3 minutes. How long does it take in all to fill the tank?<\/p>","o":["11¼ minutes","8¼ minutes","6⅔ minutes","12 minutes"],"a":0,"s":"<p>In 3 minutes both fill 3(1/12 + 1/15) = 27/60. The remaining 33/60 takes the second pipe 33/60 × 15 = 8¼ minutes. Total = 3 + 8¼ = 11¼ minutes.<br>Other options: B — time taken by the second pipe after the first is closed, not the total; C — time if both stay open throughout; D — arithmetic slip.<\/p>","tag":""},{"id":"2.4.29","q":"<p>A man travels half of a journey at 30 km/h and the other half at 20 km/h, taking 10 hours in all. What is the total distance?<\/p>","o":["250 km","200 km","240 km","300 km"],"a":2,"s":"<p>d/2 ÷ 30 + d/2 ÷ 20 = 10 → d/60 + d/40 = 10 → 5d/120 = 10 → d = 240 km.<br>Other options: A — used the average of the speeds (25 km/h); B — used 20 km/h throughout; D — used 30 km/h throughout.<\/p>","tag":""},{"id":"2.4.30","q":"<p>4 men or 6 women can do a piece of work in 12 days. How long will 2 men and 6 women take to do it?<\/p>","o":["6 days","9 days","10 days","8 days"],"a":3,"s":"<p>4 men = 6 women, so 1 man = 1.5 women; 2 men + 6 women = 9 women. Work = 6 × 12 = 72 woman-days. Time = 72 ÷ 9 = 8 days.<br>Other options: A — treated 2 men as equal to 6 women; B — arithmetic slip; C — arithmetic slip.<\/p>","tag":""}]},{"k":"2.5","t":"Algebra, Geometry and Mensuration","items":[{"id":"2.5.1","q":"<p>Solve: 3x − 7 = 2x + 5<\/p>","o":["x = −2","x = 2","x = 7","x = 12"],"a":3,"s":"<p>3x − 2x = 5 + 7, so x = 12.<br>Other options: A — moved −7 across without changing its sign; B — subtracted 5 − 7 wrongly; C — arithmetic slip.<\/p>","tag":""},{"id":"2.5.2","q":"<p>If 2x + 3y = 12 and x − y = 1, what is x?<\/p>","o":["2","5","3","1"],"a":2,"s":"<p>From x − y = 1, y = x − 1. Then 2x + 3(x − 1) = 12 → 5x = 15 → x = 3 (and y = 2).<br>Other options: A — this is y; B — this is x + y; D — this is x − y.<\/p>","tag":""},{"id":"2.5.3","q":"<p>What are the roots of x² − 5x + 6 = 0?<\/p>","o":["2 and 3","−2 and −3","1 and 6","−1 and 6"],"a":0,"s":"<p>x² − 5x + 6 = (x − 2)(x − 3), so x = 2 or x = 3.<br>Other options: B — wrong signs: these are roots of x² + 5x + 6; C — product is 6 but the sum is 7; D — these are roots of x² − 5x − 6.<\/p>","tag":""},{"id":"2.5.4","q":"<p>What is the sum of the roots of 2x² − 7x + 3 = 0?<\/p>","o":["3/2","−7/2","7","7/2"],"a":3,"s":"<p>Sum of roots = −b/a = 7/2. (Roots are 3 and 1/2.)<br>Other options: A — this is the product of the roots; B — wrong sign: sum = −b/a; C — forgot to divide by a = 2.<\/p>","tag":""},{"id":"2.5.5","q":"<p>If x + 1/x = 4, what is x² + 1/x²?<\/p>","o":["16","18","12","14"],"a":3,"s":"<p>(x + 1/x)² = x² + 2 + 1/x², so x² + 1/x² = 16 − 2 = 14.<br>Other options: A — squared 4 but did not subtract 2; B — added 2 instead of subtracting; C — subtracted 4 instead of 2.<\/p>","tag":""},{"id":"2.5.6","q":"<p>What is the smallest integer x that satisfies 4x − 3 > 2x + 9?<\/p>","o":["7","6","3","12"],"a":0,"s":"<p>4x − 2x > 9 + 3 → 2x > 12 → x > 6. The smallest integer is 7.<br>Other options: B — x = 6 gives equality, but the inequality is strict; C — divided 12 by 4 instead of 2; D — forgot to divide by 2.<\/p>","tag":""},{"id":"2.5.7","q":"<p>What is the 10th term of the arithmetic progression 3, 7, 11, …?<\/p>","o":["43","39","40","35"],"a":1,"s":"<p>a = 3, d = 4. T₁₀ = a + 9d = 3 + 36 = 39.<br>Other options: A — used n instead of n − 1 (this is the 11th term); C — arithmetic slip; D — this is the 9th term.<\/p>","tag":""},{"id":"2.5.8","q":"<p>What is the sum of the first 20 terms of the AP 2, 5, 8, …?<\/p>","o":["551","610","640","1220"],"a":1,"s":"<p>S₂₀ = 20/2 × [2 × 2 + 19 × 3] = 10 × 61 = 610.<br>Other options: A — summed only 19 terms; C — arithmetic slip; D — forgot to halve: 20 × 61.<\/p>","tag":""},{"id":"2.5.9","q":"<p>What is the 6th term of the geometric progression 2, 6, 18, …?<\/p>","o":["486","1458","162","729"],"a":0,"s":"<p>a = 2, r = 3. T₆ = 2 × 3⁵ = 486.<br>Other options: B — this is the 7th term; C — this is the 5th term; D — computed 3⁶ and forgot a = 2.<\/p>","tag":""},{"id":"2.5.10","q":"<p>What is the sum to infinity of 1 + 1/2 + 1/4 + 1/8 + …?<\/p>","o":["1","2","3/2","Infinite"],"a":1,"s":"<p>S∞ = a/(1 − r) = 1/(1 − 1/2) = 2.<br>Other options: A — used a = 1/2; C — added only the first two terms; D — the ratio is less than 1, so the series converges.<\/p>","tag":""},{"id":"2.5.11","q":"<p>What is log₂ 64?<\/p>","o":["8","6","32","5"],"a":1,"s":"<p>2⁶ = 64, so log₂ 64 = 6.<br>Other options: A — took √64; C — halved 64; D — 2⁵ = 32, not 64.<\/p>","tag":""},{"id":"2.5.12","q":"<p>Given log 2 = 0.3010 and log 3 = 0.4771, what is log 72?<\/p>","o":["1.3801","1.5562","1.4313","1.8572"],"a":3,"s":"<p>72 = 2³ × 3². log 72 = 3(0.3010) + 2(0.4771) = 0.9030 + 0.9542 = 1.8572.<br>Other options: A — this is log 24: took 72 as 2³ × 3; B — this is log 36: took 72 as 2² × 3²; C — this is log 27.<\/p>","tag":""},{"id":"2.5.13","q":"<p>If log₁₀ x = −2, what is x?<\/p>","o":["100","0.01","−20","0.2"],"a":1,"s":"<p>x = 10⁻² = 0.01.<br>Other options: A — ignored the negative sign; C — multiplied 10 by −2; D — arithmetic slip.<\/p>","tag":""},{"id":"2.5.14","q":"<p>If log₃ x + log₉ x = 3, what is x?<\/p>","o":["27","3","9","81"],"a":2,"s":"<p>log₉ x = (1/2) log₃ x. So (3/2) log₃ x = 3 → log₃ x = 2 → x = 9.<br>Other options: A — took the equation as log₃ x = 3; B — arithmetic slip; D — took log₃ x = 4.<\/p>","tag":""},{"id":"2.5.15","q":"<p>What is each interior angle of a regular hexagon?<\/p>","o":["120°","60°","135°","108°"],"a":0,"s":"<p>Each interior angle = (n − 2) × 180°/n = 4 × 180°/6 = 120°.<br>Other options: B — this is the exterior angle; C — interior angle of a regular octagon; D — interior angle of a regular pentagon.<\/p>","tag":""},{"id":"2.5.16","q":"<p>The angles of a triangle are in the ratio 2 : 3 : 4. What is the largest angle?<\/p>","o":["80°","60°","90°","40°"],"a":0,"s":"<p>Total parts = 9; 180° ÷ 9 = 20°. Largest = 4 × 20° = 80°.<br>Other options: B — the middle angle; C — assumed a right triangle; D — the smallest angle.<\/p>","tag":""},{"id":"2.5.17","q":"<p>The two shorter sides of a right-angled triangle are 9 cm and 12 cm. What is the hypotenuse?<\/p>","o":["21 cm","15 cm","13 cm","17 cm"],"a":1,"s":"<p>Hypotenuse = √(81 + 144) = √225 = 15 cm.<br>Other options: A — added the sides; C — arithmetic slip; D — arithmetic slip.<\/p>","tag":""},{"id":"2.5.18","q":"<p>What is the area of a triangle with sides 13 cm, 14 cm and 15 cm?<\/p>","o":["84 cm²","91 cm²","42 cm²","105 cm²"],"a":0,"s":"<p>Heron: s = 21. Area = √(21 × 8 × 7 × 6) = √7056 = 84 cm².<br>Other options: B — ½ × 13 × 14; C — halved the correct area; D — ½ × 14 × 15.<\/p>","tag":""},{"id":"2.5.19","q":"<p>What is the area of a circle of radius 7 cm? (Take π = 22/7.)<\/p>","o":["154 cm²","44 cm²","616 cm²","308 cm²"],"a":0,"s":"<p>Area = πr² = 22/7 × 49 = 154 cm².<br>Other options: B — this is the circumference (in cm); C — used the diameter as the radius; D — used 2πr² by mistake.<\/p>","tag":""},{"id":"2.5.20","q":"<p>The circumference of a circle is 88 cm. What is its radius? (Take π = 22/7.)<\/p>","o":["7 cm","28 cm","44 cm","14 cm"],"a":3,"s":"<p>2πr = 88 → r = 88 × 7/44 = 14 cm.<br>Other options: A — halved the radius (used 4πr = 88); B — this is the diameter; C — halved the circumference.<\/p>","tag":""},{"id":"2.5.21","q":"<p>A rectangle has a perimeter of 46 cm and an area of 120 cm². What is the length of its diagonal?<\/p>","o":["23 cm","17 cm","15 cm","19 cm"],"a":1,"s":"<p>l + b = 23 and lb = 120, so the sides are 15 and 8. Diagonal = √(225 + 64) = √289 = 17 cm.<br>Other options: A — this is the semi-perimeter (l + b); C — this is the length; D — arithmetic slip.<\/p>","tag":""},{"id":"2.5.22","q":"<p>The volume of a cube is 343 cm³. What is its total s
