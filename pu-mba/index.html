ment: The school has decided to install CCTV cameras in all classrooms.<br>Assumptions: I. Students of this school are dishonest. II. Teachers of this school do not teach well.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":3,"s":"<p>Cameras may be for safety or general monitoring; the decision does not assume either sweeping judgement. Neither is implicit.<br>Other options: A — I is not implicit; B — II is not implicit; C — I is not implicit and II is not implicit.<\/p>","tag":""},{"id":"3.5.25","q":"<p>Statement: \"If you want to reach Pokhara quickly, take a flight,\" said the travel agent.<br>Assumptions: I. Flying to Pokhara is faster than the other ways of getting there. II. Flights to Pokhara are cheap.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":0,"s":"<p>The advice rests on flying being quicker (I). Cost is not part of the advice (II).<br>Other options: B — II is not implicit and I is also implicit; C — II is not implicit; D — I is implicit.<\/p>","tag":""},{"id":"3.5.26","q":"<p>Statement: The government has raised the passport fee to cover the cost of new e-passports.<br>Assumptions: I. Demand for passports will fall sharply. II. The old fee did not fully cover the cost of e-passports.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":1,"s":"<p>Raising a fee \"to cover the cost\" assumes the old fee fell short (II). A sharp fall in demand is not assumed and would defeat the aim (I).<br>Other options: A — I is not implicit and II is also implicit; C — I is not implicit; D — II is implicit.<\/p>","tag":""},{"id":"3.5.27","q":"<p>Statement: A shop announced, \"Buy two shirts and get one free.\"<br>Assumptions: I. The shop is closing down. II. Customers do not like shirts.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":3,"s":"<p>Such offers are used to raise sales; neither closure nor dislike of shirts is assumed.<br>Other options: A — I is not implicit; B — II is not implicit; C — I is not implicit and II is not implicit.<\/p>","tag":""},{"id":"3.5.28","q":"<p>Statement: The municipality has asked residents to separate wet and dry waste before handing it over.<br>Assumptions: I. Residents can tell wet waste from dry waste. II. Separated waste is easier to handle or recycle.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":2,"s":"<p>The request assumes residents are able to sort waste (I) and that sorting serves a purpose such as easier handling (II). Both are implicit.<br>Other options: A — II is also implicit; B — I is also implicit; D — I is implicit and II is implicit.<\/p>","tag":""},{"id":"3.5.29","q":"<p>Statement: \"Bring your own water bottle on the trek, as no water will be available on the route,\" said the guide.<br>Assumptions: I. Trekkers will need water during the trek. II. The trek will be cancelled if it rains.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":0,"s":"<p>The advice only makes sense if trekkers will need water (I). Rain and cancellation are not mentioned (II).<br>Other options: B — II is not implicit and I is also implicit; C — II is not implicit; D — I is implicit.<\/p>","tag":""},{"id":"3.5.30","q":"<p>Statement: A firm plans to advertise its new product on television only.<br>Assumptions: I. Nobody reads newspapers. II. Television advertising is free.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":3,"s":"<p>The firm needs only to believe TV reaches enough buyers; it need not assume nobody reads newspapers or that TV ads cost nothing.<br>Other options: A — I is not implicit; B — II is not implicit; C — I is not implicit and II is not implicit.<\/p>","tag":""}]},{"k":"3.6","t":"Critical Reasoning, Data Sufficiency, Clocks and Calendars","items":[{"id":"3.6.1","q":"<p>A city built new bicycle lanes last year, and the number of cycling accidents fell by 30 per cent. The council concludes that the lanes made cycling safer. Which of the following, if true, most weakens the conclusion?<\/p>","o":["The number of people cycling in the city fell by about half during the same year.","Cyclists say they feel safer riding in the new lanes.","Several other cities have also built bicycle lanes.","The lanes cost more to build than was planned."],"a":0,"s":"<p>If far fewer people cycled, accidents would fall even if cycling were no safer. The fall in accidents may reflect less cycling, not safer lanes.<br>Other options: B — this supports the conclusion; C — other cities are irrelevant to this city's accident figures; D — cost has nothing to do with safety.<\/p>","tag":""},{"id":"3.6.2","q":"<p>A company says its new training programme raised sales productivity, because staff who completed it sold 15 per cent more in the following quarter. Which of the following, if true, most strengthens the claim?<\/p>","o":["The programme was expensive to run.","Sales usually rise in that quarter for all staff, whether or not they took the programme.","Staff who did not take the programme showed no change in sales in the same quarter.","Some staff found the programme boring."],"a":2,"s":"<p>If untrained staff showed no rise, the 15 per cent gain is more likely due to the programme rather than to seasonal or market factors.<br>Other options: A — cost does not bear on effectiveness; B — this weakens the claim by offering a seasonal explanation; D — how staff felt does not show whether sales rose because of it.<\/p>","tag":""},{"id":"3.6.3","q":"<p>\"Our hotel's occupancy will rise next season because the new airport will bring more tourists to the city.\" Which assumption does this argument depend on?<\/p>","o":["The new airport will be the largest in the country.","All tourists prefer hotels to homestays.","The hotel will reduce its room rates.","Some of the additional tourists will choose to stay at our hotel."],"a":3,"s":"<p>More tourists in the city raise the hotel's occupancy only if at least some of them stay there. Without this, the conclusion fails.<br>Other options: A — the airport's size is irrelevant; B — too strong; the argument needs only some tourists to stay; C — the argument does not rely on price cuts.<\/p>","tag":""},{"id":"3.6.4","q":"<p>Every member of the debate club is a member of the library. Some library members are first-year students. Which of the following must be true?<\/p>","o":["Some debate club members are first-year students.","Anyone who is not a library member is not in the debate club.","All library members are in the debate club.","No first-year student is in the debate club."],"a":1,"s":"<p>If all debate club members are library members, then a non-member of the library cannot be in the debate club (the contrapositive).<br>Other options: A — possible but not certain; the first-year students may be outside the club; C — reverses the first statement; D — possible but not certain.<\/p>","tag":""},{"id":"3.6.5","q":"<p>Shops that play soft music record higher sales than shops that do not. A consultant concludes that soft music makes customers buy more. Which of the following, if true, most weakens the conclusion?<\/p>","o":["Most shops that play soft music are in malls visited by high-income shoppers.","Many customers say they enjoy hearing soft music while they browse and shop in stores.","Loud music annoys some customers.","Playing soft music costs very little."],"a":0,"s":"<p>This offers another cause for higher sales (richer shoppers in malls), so the music may not be responsible.<br>Other options: B — this slightly supports the conclusion; C — about loud music, not soft music and sales; D — cost does not bear on the cause of higher sales.<\/p>","tag":""},{"id":"3.6.6","q":"<p>A bank cut the interest rate on its loans, yet the total amount it lent fell. Which of the following, if true, best explains this?<\/p>","o":["The bank's deposit rates were unchanged.","Other banks cut their loan rates by even more during the same period.","Lower loan rates usually attract borrowers.","The bank opened two new branches."],"a":1,"s":"<p>If competitors became cheaper still, borrowers would move to them, so this bank's lending could fall despite its own cut.<br>Other options: A — does not explain why lending fell; C — deepens the puzzle instead of explaining it; D — new branches would, if anything, raise lending.<\/p>","tag":""},{"id":"3.6.7","q":"<p>Nepal's tea exports rose after a national quality mark was introduced, so the mark helped exports. Which of the following, if true, most strengthens this argument?<\/p>","o":["World tea prices rose sharply during the same period, raising the value of all tea exports.","The quality mark was designed by a private firm.","Exports of tea without the quality mark did not rise over the same period.","Nepal also exports coffee."],"a":2,"s":"<p>If only marked tea gained, the mark is the likely cause; a general market boom is ruled out.<br>Other options: A — this weakens the argument by offering another cause; B — who designed the mark is irrelevant; D — coffee exports are irrelevant.<\/p>","tag":""},{"id":"3.6.8","q":"<p>\"To reduce traffic jams in the city centre, the city should raise parking fees there.\" Which assumption does this argument depend on?<\/p>","o":["Public buses are always crowded.","Parking fees are the city's main source of income, so higher fees will fund more roads.","Everyone in the city owns a car.","Higher parking fees will lead some people to drive into the centre less often."],"a":3,"s":"<p>The plan cuts traffic only if higher fees change some drivers' behaviour.<br>Other options: A — not needed; if anything it works against the plan; B — income is not the argument's point; C — far too strong and not needed.<\/p>","tag":""},{"id":"3.6.9","q":"<p>In a survey of employees, 60 per cent said they prefer working from home and 70 per cent said they want flexible hours. Which of the following must be true?<\/p>","o":["At least 30 per cent of the employees want both.","Exactly 30 per cent of the employees want both.","At most 30 per cent of the employees want both.","No employee wants both."],"a":0,"s":"<p>The overlap is at least 60 + 70 − 100 = 30 per cent and could be as high as 60 per cent. So \"at least 30 per cent\" is the only certain statement.<br>Other options: B — the overlap can be anywhere from 30 to 60 per cent; C — 30 per cent is the minimum, not the maximum; D — the groups must overlap by at least 30 per cent.<\/p>","tag":""},{"id":"3.6.10","q":"<p>A school's pass rate rose from 70 to 85 per cent after it hired more teachers, so the principal concludes that hiring teachers improves results. Which of the following, if true, most weakens the conclusion?<\/p>","o":["The new teachers had more experience than the old ones.","That year the examination board made the papers easier, and pass rates rose in all schools.","Class sizes fell after the new teachers joined.","Parents approved of the decision to hire more teachers."],"a":1,"s":"<p>An easier examination offers another cause for the rise, so the hiring may not explain it.<br>Other options: A — supports the conclusion; C — supports the conclusion by showing how hiring could help; D — approval says nothing about results.<\/p>","tag":""},{"id":"3.6.11","q":"<p>Data sufficiency. Question: What is the value of x?<br>I. 3x + 5 = 20<br>II. x² = 25<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>I gives x = 5. II gives x = 5 or −5, so II alone is not enough.<br>Other options: B — II alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.12","q":"<p>Data sufficiency. Question: Is the integer n even?<br>I. n is a multiple of 3.<br>II. n + 1 is odd.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>II: if n + 1 is odd, n is even. I: multiples of 3 can be even (6) or odd (9).<br>Other options: A — I alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.13","q":"<p>Data sufficiency. Question: What is the price of one pen?<br>I. Two pens and three pencils cost Rs 70.<br>II. One pen and one pencil cost Rs 30.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":2,"s":"<p>Together: 2p + 3q = 70 and p + q = 30 give q = 10 and p = 20. Each statement alone has two unknowns.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; D — the statements are sufficient when used together.<\/p>","tag":""},{"id":"3.6.14","q":"<p>Data sufficiency. Question: How old is Ravi?<br>I. Ravi is 4 years older than Sita.<br>II. Sita is 2 years younger than Mohan.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":3,"s":"<p>Both statements give only differences between ages; no actual age is known, so Ravi's age cannot be found.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; C — even together they are not sufficient.<\/p>","tag":""},{"id":"3.6.15","q":"<p>Data sufficiency. Question: In which direction is Q from P?<br>I. P is to the south of Q.<br>II. R is to the east of P.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>I: if P is south of Q, then Q is north of P. II says nothing about Q.<br>Other options: B — II alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.16","q":"<p>Data sufficiency. Question: How many students are in the class?<br>I. Ram ranks 10th from the top.<br>II. Ram ranks 10th from the top and 21st from the bottom.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>II: total = 10 + 21 − 1 = 30. I gives no information about the bottom.<br>Other options: A — I alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.17","q":"<p>Data sufficiency. Question: On which day of the week was 1 March of a certain year?<br>I. 1 February of that year was a Sunday.<br>II. That year was not a leap year.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":2,"s":"<p>Together: February has 28 days, so 1 March is 28 days after a Sunday, i.e. a Sunday. Alone, I leaves the leap-year question open (Sunday or Monday), and II gives no day.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; D — the statements are sufficient when used together.<\/p>","tag":""},{"id":"3.6.18","q":"<p>Data sufficiency. Question: Is A the grandfather of D?<br>I. A is the father of B.<br>II. C is the mother of D.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":3,"s":"<p>Together we know A's child (B) and D's mother (C), but nothing links B to C or to D, so the question cannot be answered.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; C — even together they are not sufficient.<\/p>","tag":""},{"id":"3.6.19","q":"<p>What is the angle between the hour and minute hands of a clock at 3:40?<\/p>","o":["150°","170°","130°","110°"],"a":2,"s":"<p>Angle = |30H − 5.5M| = |90 − 220| = 130°. (The hour hand is at 90° + 20° = 110°, the minute hand at 240°.)<br>Other options: A — ignores the hour hand's 20° movement past 3; B — moves the hour hand back 20° instead of forward; D — uses 5 instead of 5.5 for the minute term.<\/p>","tag":""},{"id":"3.6.20","q":"<p>At what time between 4 and 5 o'clock are the hands of a clock together?<\/p>","o":["20 minutes past 4","24 minutes past 4","22 minutes past 4","21 9/11 minutes past 4"],"a":3,"s":"<p>The minute hand gains 5.5° per minute and must make up 120°: 120 ÷ 5.5 = 240/11 = 21 9/11 minutes.<br>Other options: A — ignores the hour hand's movement; B — uses a relative speed of 5° per minute instead of 5.5°; C — rounds 21 9/11 up; the exact time is needed.<\/p>","tag":""},{"id":"3.6.21","q":"<p>The mirror image of a clock shows the time 4:20. What is the actual time?<\/p>","o":["8:40","7:20","8:20","7:40"],"a":3,"s":"<p>For a mirror image, actual time = 11:60 − 4:20 = 7:40.<br>Other options: A — subtracts from 12:60; B — keeps the minutes unchanged; C — subtracts the hour from 12 and keeps the minutes.<\/p>","tag":""},{"id":"3.6.22","q":"<p>How many times do the hour and minute hands of a clock coincide in a day (24 hours)?<\/p>","o":["22","24","44","11"],"a":0,"s":"<p>The hands coincide 11 times in every 12 hours (the meeting near 11 and 12 is the same one at 12:00), so 22 times in 24 hours.<br>Other options: B — assumes once every hour; C — that is the number of times they are at right angles; D — that is for 12 hours only.<\/p>","tag":""},{"id":"3.6.23","q":"<p>A clock gains 5 minutes every hour. It is set right at 6 a.m. What time will it show at 6 p.m. on the same day?<\/p>","o":["6:55 p.m.","6:30 p.m.","7:00 p.m.","7:05 p.m."],"a":2,"s":"<p>In 12 hours it gains 12 × 5 = 60 minutes, so it shows 7:00 p.m.<br>Other options: A — counts only 11 hours; B — halves the gain; D — counts 13 hours.<\/p>","tag":""},{"id":"3.6.24","q":"<p>What is the angle between the hands of a clock at 7:20?<\/p>","o":["90°","100°","110°","80°"],"a":1,"s":"<p>Angle = |30 × 7 − 5.5 × 20| = |210 − 110| = 100°. (The hour hand is at 210° + 10° = 220°, the minute hand at 120°.)<br>Other options: A — ignores the hour hand's 10° movement past 7; C — uses 5 instead of 5.5 for the minute term; D — moves the hour hand back 10° instead of forward.<\/p>","tag":""},{"id":"3.6.25","q":"<p>If 1 January 2023 was a Sunday, what day of the week was 1 January 2024?<\/p>","o":["Sunday","Tuesday","Saturday","Monday"],"a":3,"s":"<p>2023 is not a leap year: 365 days = 52 weeks + 1 odd day, so the day moves on by one, to Monday.<br>Other options: A — ignores the odd day; B — treats 2023 as a leap year; C — moves the day backwards.<\/p>","tag":""},{"id":"3.6.26","q":"<p>What day of the week was 15 August 1947?<\/p>","o":["Thursday","Saturday","Friday","Sunday"],"a":2,"s":"<p>Counting odd days: 1600 years → 0; 300 years → 1; 46 years (11 leap) → 46 + 11 = 57 → 1; 1 Jan to 15 Aug 1947 = 31+28+31+30+31+30+31+15 = 227 days → 3. Total 0 + 1 + 1 + 3 = 5 → Friday.<br>Other options: A — one odd day too few; B — one odd day too many (treats 1947 as a leap year); D — two odd days too many.<\/p>","tag":""},{"id":"3.6.27","q":"<p>If today is Wednesday, what day of the week will it be after 100 days?<\/p>","o":["Friday","Thursday","Saturday","Wednesday"],"a":0,"s":"<p>100 = 14 × 7 + 2, so the day moves on by 2: Wednesday → Friday.<br>Other options: B — moves on by only 1; C — moves on by 3; D — assumes 100 is a multiple of 7.<\/p>","tag":""},{"id":"3.6.28","q":"<p>How many odd days are there in a leap year?<\/p>","o":["1","2","0","3"],"a":1,"s":"<p>A leap year has 366 days = 52 weeks + 2 days, so 2 odd days.<br>Other options: A — that is for an ordinary year; C — ignores the extra days beyond 52 weeks; D — one too many.<\/p>","tag":""},{"id":"3.6.29","q":"<p>Which year will have exactly the same calendar as 2021?<\/p>","o":["2027","2026","2032","2025"],"a":0,"s":"<p>2021 starts on a Friday and is not a leap year. Adding odd days (2021: 1, 2022: 1, 2023: 1, 2024: 2, 2025: 1, 2026: 1) gives 7 by the end of 2026, so 2027 also starts on a Friday and is not a leap year.<br>Other options: B — 2026 starts on a Thursday; C — 2032 is a leap year; D — 2025 starts on a Wednesday.<\/p>","tag":""},{"id":"3.6.30","q":"<p>In a certain year, 1 March is a Tuesday. What day of the week is 1 November of the same year?<\/p>","o":["Wednesday","Monday","Thursday","Tuesday"],"a":3,"s":"<p>From 1 March to 1 November: 31 + 30 + 31 + 30 + 31 + 31 + 30 + 31 = 245 days = 35 weeks exactly, so 1 November is also a Tuesday. (February is not involved, so leap years do not matter.)<br>Other options: A — adds a false odd day; B — subtracts a false odd day; C — adds two false odd days.<\/p>","tag":""}]}]},{"n":4,"t":"General Awareness","subs":[{"k":"4.1","t":"History and Culture of Nepal","items":[{"id":"4.1.1","q":"<p>Prithvi Narayan Shah captured Kathmandu in September 1768 while the city was celebrating which festival?<\/p>","o":["Dashain","Gai Jatra","Bisket Jatra","Indra Jatra"],"a":3,"s":"<p>Prithvi Narayan Shah's forces entered Kathmandu on the day of Indra Jatra (1825 BS) while the city was busy with the festival, and King Jaya Prakash Malla fled to Patan.<br>Other options: A — the Kathmandu conquest is linked with Indra Jatra, not Dashain; B — Gai Jatra commemorates the dead; it is not the festival of the 1768 conquest; C — Bisket Jatra is Bhaktapur's New Year festival.<\/p>","tag":""},{"id":"4.1.2","q":"<p>Which treaty ended the Anglo-Nepal War of 1814–1816?<\/p>","o":["Treaty of Betrawati","Treaty of Sugauli","Treaty of Thapathali","Treaty of Peace and Friendship"],"a":1,"s":"<p>The Treaty of Sugauli (signed December 1815, ratified March 1816) ended the war with the British East India Company; Nepal lost Sikkim, Kumaon, Garhwal and much of the Terai.<br>Other options: A — signed with Tibet/China in 1792 after the Nepal–Tibet war; C — signed with Tibet in 1856 under Jung Bahadur; D — the Nepal–India treaty of 1950.<\/p>","tag":""},{"id":"4.1.3","q":"<p>The Kot massacre of 1846 brought which person to power, beginning about a century of Rana rule?<\/p>","o":["Jung Bahadur Kunwar (Rana)","Bhimsen Thapa","Mathbar Singh Thapa","Chandra Shumsher"],"a":0,"s":"<p>After the Kot Parva of September 1846, Jung Bahadur Kunwar became Prime Minister and founded the hereditary Rana regime that lasted until 1951.<br>Other options: B — he was Mukhtiyar earlier and died in 1839; C — he was killed in 1845, before the Kot massacre; D — a later Rana Prime Minister (1901–1929).<\/p>","tag":""},{"id":"4.1.4","q":"<p>Democracy Day (Prajatantra Diwas), observed on Falgun 7, commemorates which event?<\/p>","o":["The end of Rana rule and the proclamation of democracy in 2007 BS (1951)","The success of the People's Movement of 2046 BS (1990)","The signing of the Comprehensive Peace Accord in 2063 BS","The declaration of the republic in 2065 BS"],"a":0,"s":"<p>On Falgun 7, 2007 BS (18 February 1951) King Tribhuvan proclaimed democracy, ending 104 years of Rana rule.<br>Other options: B — that movement succeeded in April 1990, in Chaitra 2046; C — the CPA was signed on Mangsir 5, 2063 (21 November 2006); D — the republic was declared on Jestha 15, 2065 (Republic Day).<\/p>","tag":""},{"id":"4.1.5","q":"<p>Nepal's first general election to Parliament was held in<\/p>","o":["2007 BS (1951)","2015 BS (1959)","2017 BS (1960)","2048 BS (1991)"],"a":1,"s":"<p>The first general election was held in 2015 BS (1959); the Nepali Congress won a two-thirds majority and B. P. Koirala became Prime Minister.<br>Other options: A — that was the year democracy was proclaimed; no election was held then; C — that year King Mahendra dismissed the elected government; D — the first general election after the restoration of democracy, not the first ever.<\/p>","tag":""},{"id":"4.1.6","q":"<p>King Mahendra dismissed the elected government and paved the way for the partyless Panchayat system on<\/p>","o":["Poush 1, 2017 BS","Falgun 7, 2007 BS","Magh 19, 2061 BS","Jestha 15, 2065 BS"],"a":0,"s":"<p>On Poush 1, 2017 BS (15 December 1960) King Mahendra dismissed the B. P. Koirala government and dissolved Parliament; the Panchayat system followed.<br>Other options: B — the date democracy was proclaimed; C — the date of King Gyanendra's takeover in 2005; D — the date the republic was declared.<\/p>","tag":""},{"id":"4.1.7","q":"<p>Nepal was declared a federal democratic republic by the first Constituent Assembly on<\/p>","o":["20 September 2015","21 November 2006","28 May 2008 (Jestha 15, 2065 BS)","24 April 2006"],"a":2,"s":"<p>The first meeting of the first Constituent Assembly on 28 May 2008 abolished the 240-year-old monarchy; the day is observed as Republic Day.<br>Other options: A — the date the present Constitution was promulgated; B — the date of the Comprehensive Peace Accord; D — the date the King announced the reinstatement of the dissolved House of Representatives.<\/p>","tag":""},{"id":"4.1.8","q":"<p>Who was the first President of the Federal Democratic Republic of Nepal?<\/p>","o":["Dr Ram Baran Yadav","Bidya Devi Bhandari","Parmananda Jha","Girija Prasad Koirala"],"a":0,"s":"<p>Dr Ram Baran Yadav was elected the first President by the Constituent Assembly in July 2008.<br>Other options: B — she was the second President and the first woman President (2015); C — he was the first Vice-President; D — as Prime Minister he acted as head of state in 2007–08, but was never President.<\/p>","tag":""},{"id":"4.1.9","q":"<p>The Constitution of Nepal was promulgated on<\/p>","o":["Asoj 3, 2072 BS","Jestha 15, 2065 BS","Kartik 23, 2047 BS","Magh 1, 2063 BS"],"a":0,"s":"<p>The Constitution was promulgated on Asoj 3, 2072 BS (20 September 2015), now observed as Constitution Day.<br>Other options: B — Republic Day; C — the date of the 1990 Constitution of the Kingdom of Nepal; D — the date of the Interim Constitution of 2063.<\/p>","tag":""},{"id":"4.1.10","q":"<p>Nepal's first written constitution, the Government of Nepal Act 2004 BS (1948), was issued by<\/p>","o":["King Tribhuvan","Padma Shumsher","King Mahendra","Mohan Shumsher"],"a":1,"s":"<p>Rana Prime Minister Padma Shumsher issued the Government of Nepal Act, 2004 BS, the first written constitution, though it was never fully implemented.<br>Other options: A — he issued the Interim Government of Nepal Act, 2007 BS; C — he issued the constitutions of 2015 BS and 2019 BS; D — the last Rana Prime Minister, who succeeded Padma Shumsher.<\/p>","tag":""},{"id":"4.1.11","q":"<p>Counting the Constitution of Nepal 2072, how many constitutions has Nepal had in all?<\/p>","o":["Five","Six","Seven","Eight"],"a":2,"s":"<p>Nepal's constitutions: 2004 BS (1948), 2007 BS interim (1951), 2015 BS (1959), 2019 BS (1962), 2047 BS (1990), 2063 BS interim (2007) and 2072 BS (2015) — seven in all.<br>Other options: A — omits the two interim constitutions; B — misses one of the seven, usually the 2004 BS Act; D — double-counts; there are seven.<\/p>","tag":""},{"id":"4.1.12","q":"<p>The Changunarayan pillar inscription, dated 464 AD, belongs to the reign of which Licchavi king?<\/p>","o":["Amshuverma","Jayasthiti Malla","Yaksha Malla","Manadeva I"],"a":3,"s":"<p>The Changunarayan pillar inscription of 464 AD was set up by Licchavi king Manadeva I and is among the earliest dated inscriptions of the Kathmandu Valley.<br>Other options: A — a later Licchavi ruler (7th century) known for the Kailashkut Bhawan; B — a 14th-century Malla king; C — a 15th-century Malla king.<\/p>","tag":""},{"id":"4.1.13","q":"<p>Which Licchavi princess married the Tibetan king Songtsen Gampo and helped spread Buddhism in Tibet?<\/p>","o":["Lalit Tripura Sundari","Yogmaya Neupane","Bhrikuti","Rajendra Laxmi"],"a":2,"s":"<p>Bhrikuti, a Licchavi princess, married Songtsen Gampo in the 7th century and is credited with taking Buddhist images and artisans to Tibet.<br>Other options: A — a queen regent of the early 19th century; B — a 20th-century social reformer and poet; D — queen regent after Pratap Singh Shah, 18th century.<\/p>","tag":""},{"id":"4.1.14","q":"<p>Araniko, the 13th-century Nepali artist, is famous for building the White Stupa (Miaoying Temple) in Beijing at the court of<\/p>","o":["Genghis Khan","Emperor Ashoka","Songtsen Gampo","Kublai Khan"],"a":3,"s":"<p>Araniko went to Tibet and then to the Yuan court of Kublai Khan, where he designed the White Stupa in Beijing.<br>Other options: A — he died in 1227, before Araniko's time; B — a Mauryan emperor of the 3rd century BC; C — the 7th-century Tibetan king who married Bhrikuti.<\/p>","tag":""},{"id":"4.1.15","q":"<p>Which Malla king is best known for organising society into castes and occupational groups?<\/p>","o":["Bhupatindra Malla","Jayasthiti Malla","Yaksha Malla","Pratap Malla"],"a":1,"s":"<p>Jayasthiti Malla (14th century) is credited with codifying the social order into castes and sub-castes based on occupation.<br>Other options: A — known for building the Nyatapola temple in Bhaktapur; C — his kingdom was later divided among his heirs; D — a 17th-century king of Kantipur known for Rani Pokhari and his scholarship.<\/p>","tag":""},{"id":"4.1.16","q":"<p>Nepal Sambat, which began in 879 AD, is associated with<\/p>","o":["Sankhadhar Sakhwa","Manadeva I","Jayasthiti Malla","Prithvi Narayan Shah"],"a":0,"s":"<p>Sankhadhar Sakhwa is credited with freeing the people of their debts and starting Nepal Sambat in 879 AD.<br>Other options: B — a 5th-century Licchavi king; C — known for social codification, not for starting the era; D — the 18th-century unifier of Nepal.<\/p>","tag":""},{"id":"4.1.17","q":"<p>Dharahara, the tower in Kathmandu, was first built in 1832 by<\/p>","o":["Jung Bahadur Rana","Chandra Shumsher","Bhimsen Thapa","Ranoddip Singh"],"a":2,"s":"<p>Mukhtiyar Bhimsen Thapa built the original Dharahara in 1832; it was rebuilt after the 1934 earthquake and again after the 2015 earthquake.<br>Other options: A — he came to power in 1846; B — known for Singha Durbar and Tri-Chandra College; D — a Rana Prime Minister of 1877–1885.<\/p>","tag":""},{"id":"4.1.18","q":"<p>Who is honoured as Adikavi (the first poet) for translating the Ramayana into Nepali?<\/p>","o":["Laxmi Prasad Devkota","Motiram Bhatta","Bhanubhakta Acharya","Lekhnath Paudyal"],"a":2,"s":"<p>Bhanubhakta Acharya (1814–1868) rendered the Ramayana into simple Nepali verse and is called Adikavi.<br>Other options: A — he is called Mahakavi (the great poet); B — he published Bhanubhakta's Ramayana and wrote his biography; D — he is known as Kavi Shiromani.<\/p>","tag":""},{"id":"4.1.19","q":"<p>The popular Nepali poem 'Muna Madan' was written by<\/p>","o":["Bhanubhakta Acharya","Laxmi Prasad Devkota","Lekhnath Paudyal","Balkrishna Sama"],"a":1,"s":"<p>Muna Madan (1930s), in the jhyaure folk metre, is one of Mahakavi Laxmi Prasad Devkota's best-known works.<br>Other options: A — known for the Nepali Ramayana; C — known for Tarun Tapasi; D — a dramatist, known for plays such as Prahlad and Mutuko Byatha.<\/p>","tag":""},{"id":"4.1.20","q":"<p>The lyrics of Nepal's national anthem 'Sayaun Thunga Phulka' were written by<\/p>","o":["Pradeep Kumar Rai (Byakul Maila)","Ambar Gurung","Chakrapani Chalise","Madhav Prasad Ghimire"],"a":0,"s":"<p>The anthem adopted in 2007 has lyrics by Pradeep Kumar Rai, known as Byakul Maila, and music by Ambar Gurung.<br>Other options: B — he composed the music, not the lyrics; C — he wrote the earlier royal anthem 'Shriman Gambhir'; D — the Rastrakavi, not the anthem's lyricist.<\/p>","tag":""},{"id":"4.1.21","q":"<p>In which work did Prithvi Narayan Shah describe Nepal as 'a yam between two boulders'?<\/p>","o":["Muluki Ain","Gopalraj Vamshavali","Dibya Upadesh","Gorkhapatra"],"a":2,"s":"<p>Dibya Upadesh, Prithvi Narayan Shah's counsel given near the end of his life, contains the 'yam between two boulders' remark about Nepal's position between China and British India.<br>Other options: A — the legal code of 1854 under Jung Bahadur; B — a medieval chronicle of the Kathmandu Valley; D — a newspaper started in 1901.<\/p>","tag":""},{"id":"4.1.22","q":"<p>Prithvi Narayan Shah's first major success in his unification campaign was the capture of Nuwakot in<\/p>","o":["1762","1768","1769","1744"],"a":3,"s":"<p>Nuwakot fell in 1744 and became the base for the later conquest of the valley: Makwanpur (1762), Kirtipur (1766) and Kathmandu (1768).<br>Other options: A — the year Makwanpur was taken; B — the year Kathmandu was taken; C — the year Bhaktapur was taken.<\/p>","tag":""},{"id":"4.1.23","q":"<p>In the Anglo-Nepal War, the defence of Nalapani fort (1814) was led by<\/p>","o":["Amar Singh Thapa","Bhakti Thapa","Balbhadra Kunwar","Kalu Pande"],"a":2,"s":"<p>Balbhadra Kunwar held the small fort of Nalapani (Khalanga) against a much larger British force in 1814.<br>Other options: A — he commanded the western front around Malaun; B — he fell at Deuthal; D — he was killed at Kirtipur in 1757.<\/p>","tag":""},{"id":"4.1.24","q":"<p>Who abolished the practice of sati in Nepal in 1920 and announced the abolition of slavery in 1924?<\/p>","o":["Jung Bahadur Rana","Chandra Shumsher","Juddha Shumsher","Mohan Shumsher"],"a":1,"s":"<p>Rana Prime Minister Chandra Shumsher abolished sati in 1920 and announced the end of slavery in 1924.<br>Other options: A — he restricted sati but did not abolish it; C — Prime Minister 1932–1945; D — the last Rana Prime Minister.<\/p>","tag":""},{"id":"4.1.25","q":"<p>The newspaper Gorkhapatra was started in 1901 (1958 BS) under which Rana Prime Minister?<\/p>","o":["Chandra Shumsher","Dev Shumsher","Bir Shumsher","Jung Bahadur Rana"],"a":1,"s":"<p>Dev Shumsher, during his short and liberal tenure in 1901, started the Gorkhapatra, Nepal's oldest newspaper still in print.<br>Other options: A — he replaced Dev Shumsher later in 1901; C — known for Bir Hospital (1889); D — known for Durbar High School (1854) and Muluki Ain.<\/p>","tag":""},{"id":"4.1.26","q":"<p>Tri-Chandra College, Nepal's first college, was established in<\/p>","o":["1854","1959","1901","1918"],"a":3,"s":"<p>Tri-Chandra College was founded in 1918 (1975 BS) under Chandra Shumsher.<br>Other options: A — the year Durbar High School was founded; B — the year Tribhuvan University was founded; C — the year Gorkhapatra was started.<\/p>","tag":""},{"id":"4.1.27","q":"<p>The decade-long armed conflict in Nepal formally ended with the Comprehensive Peace Accord signed in<\/p>","o":["1996","2005","2008","2006"],"a":3,"s":"<p>The Comprehensive Peace Accord between the Government of Nepal and the CPN (Maoist) was signed on 21 November 2006.<br>Other options: A — the year the armed conflict began (February 1996); B — the year of the 12-point understanding in New Delhi; C — the year the republic was declared.<\/p>","tag":""},{"id":"4.1.28","q":"<p>Bisket Jatra, which marks the Nepali New Year with a chariot procession and the raising of a lingo (pole), is celebrated mainly in<\/p>","o":["Lalitpur","Bhaktapur","Kathmandu","Kirtipur"],"a":1,"s":"<p>Bisket Jatra in Bhaktapur features the chariot of Bhairav and the erection of the lingo pole around Baisakh 1.<br>Other options: A — known for the Rato Machhindranath Jatra; C — known for Indra Jatra; D — not the home of Bisket Jatra.<\/p>","tag":""},{"id":"4.1.29","q":"<p>The Nyatapola, a five-storey temple in Bhaktapur and the tallest pagoda in Nepal, was built in 1702 by<\/p>","o":["Bhupatindra Malla","Yaksha Malla","Pratap Malla","Siddhinarasimha Malla"],"a":0,"s":"<p>King Bhupatindra Malla of Bhaktapur had the Nyatapola built in 1702; it is dedicated to the goddess Siddhi Lakshmi.<br>Other options: B — a 15th-century king of the undivided valley; C — a king of Kantipur, known for Rani Pokhari; D — a king of Patan, known for the Krishna Mandir.<\/p>","tag":""},{"id":"4.1.30","q":"<p>Ubhauli and Udhauli are festivals mainly celebrated by<\/p>","o":["the Tharu community","the Sherpa community","the Newar community","the Kirat communities"],"a":3,"s":"<p>Ubhauli (when birds migrate up) and Udhauli (down) are Kirat festivals of the Rai, Limbu, Yakkha and Sunuwar communities, marked by Sakela dance.<br>Other options: A — the Tharu's main festival is Maghi; B — the Sherpa celebrate Gyalpo Lhosar and Mani Rimdu; C — Newar festivals include Yomari Punhi and Mha Puja.<\/p>","tag":""}]},{"k":"4.2","t":"Geography and Environment of Nepal","items":[{"id":"4.2.1","q":"<p>The height of Mount Everest jointly announced by Nepal and China in December 2020 is<\/p>","o":["8,848.86 m","8,848 m","8,844.43 m","8,850 m"],"a":0,"s":"<p>On 8 December 2020 Nepal and China jointly announced the new height of Sagarmatha as 8,848.86 m above sea level.<br>Other options: B — the older figure from the 1954 Survey of India measurement; C — China's 2005 rock-height figure; D — the 1999 US (National Geographic) GPS figure.<\/p>","tag":""},{"id":"4.2.2","q":"<p>The lowest point of Nepal, Kechana Kalan, lies in which district?<\/p>","o":["Kailali","Jhapa","Parsa","Rupandehi"],"a":1,"s":"<p>Kechana Kalan in Jhapa district, in the south-east, is Nepal's lowest point (roughly 60–70 m above sea level).<br>Other options: A — a far-western Terai district, not the lowest point; C — a central Terai district, not the lowest point; D — home of Lumbini, not the lowest point.<\/p>","tag":""},{"id":"4.2.3","q":"<p>How many local levels (municipalities and rural municipalities) does Nepal have under the federal structure?<\/p>","o":["744","77","753","165"],"a":2,"s":"<p>There are 753 local levels: 6 metropolitan cities, 11 sub-metropolitan cities, 276 municipalities and 460 rural municipalities.<br>Other options: A — the number first proposed in 2017, later revised to 753; B — the number of districts; D — the number of first-past-the-post constituencies for the House of Representatives.<\/p>","tag":""},{"id":"4.2.4","q":"<p>Which is the largest district of Nepal by area?<\/p>","o":["Humla","Mugu","Taplejung","Dolpa"],"a":3,"s":"<p>Dolpa (Karnali Province), at about 7,900 sq km, is the largest district; Humla is second.<br>Other options: A — second largest, not the largest; B — smaller than Dolpa; C — the largest district of Koshi Province, but much smaller than Dolpa.<\/p>","tag":""},{"id":"4.2.5","q":"<p>Which is the smallest district of Nepal by area?<\/p>","o":["Bhaktapur","Lalitpur","Kathmandu","Dhanusha"],"a":0,"s":"<p>Bhaktapur, at about 119 sq km, is the smallest district.<br>Other options: B — larger than Bhaktapur; C — larger than Bhaktapur; D — a Terai district much larger than Bhaktapur.<\/p>","tag":""},{"id":"4.2.6","q":"<p>Which is the largest lake in Nepal?<\/p>","o":["Phewa Lake","Rara Lake","Tilicho Lake","Shey Phoksundo Lake"],"a":1,"s":"<p>Rara Lake in Mugu district (about 10.8 sq km) is the largest lake in Nepal.<br>Other options: A — the second-largest lake, in Pokhara; C — famous as one of the highest lakes, not the largest; D — the deepest lake, not the largest.<\/p>","tag":""},{"id":"4.2.7","q":"<p>Which lake in Dolpa district is the deepest lake of Nepal?<\/p>","o":["Shey Phoksundo Lake","Rara Lake","Begnas Lake","Gosaikunda"],"a":0,"s":"<p>Shey Phoksundo in Dolpa, inside Shey Phoksundo National Park, is the deepest lake of Nepal.<br>Other options: B — the largest lake, in Mugu; C — a lake in Pokhara (Kaski); D — a sacred lake in Rasuwa.<\/p>","tag":""},{"id":"4.2.8","q":"<p>Which is the longest river within Nepal?<\/p>","o":["Koshi","Gandaki","Bagmati","Karnali"],"a":3,"s":"<p>The Karnali, rising in Tibet and flowing through western Nepal, is the longest river in Nepal.<br>Other options: A — the largest river system by volume, not the longest; B — shorter than the Karnali; C — a much smaller river of the Kathmandu Valley.<\/p>","tag":""},{"id":"4.2.9","q":"<p>Which river forms most of Nepal's western boundary with India?<\/p>","o":["Mahakali","Mechi","Karnali","West Rapti"],"a":0,"s":"<p>The Mahakali (Kali) river forms Nepal's western border; the Mechi forms most of the eastern border.<br>Other options: B — it marks the eastern border; C — it flows through western Nepal, not along the border; D — it flows through Lumbini Province.<\/p>","tag":""},{"id":"4.2.10","q":"<p>The deep gorge between the Dhaulagiri and Annapurna massifs, often called the deepest gorge in the world, is cut by which river?<\/p>","o":["Arun","Bhote Koshi","Kali Gandaki","Trishuli"],"a":2,"s":"<p>The Kali Gandaki flows between Dhaulagiri and Annapurna, forming a gorge of extraordinary depth.<br>Other options: A — it cuts a gorge in eastern Nepal, near Makalu; B — a river of central Nepal flowing from Tibet; D — flows from Rasuwa towards the Narayani.<\/p>","tag":""},{"id":"4.2.11","q":"<p>Which province of Nepal is the largest by area?<\/p>","o":["Koshi Province","Gandaki Province","Karnali Province","Sudurpashchim Province"],"a":2,"s":"<p>Karnali Province is the largest province by area and the least populous.<br>Other options: A — smaller than Karnali; B — smaller than Karnali; D — smaller than Karnali.<\/p>","tag":""},{"id":"4.2.12","q":"<p>Which province of Nepal is the smallest by area?<\/p>","o":["Bagmati Province","Lumbini Province","Gandaki Province","Madhesh Province"],"a":3,"s":"<p>Madhesh Province, lying wholly in the Terai, is the smallest province by area though one of the most populous.<br>Other options: A — larger than Madhesh; B — larger than Madhesh; C — larger than Madhesh.<\/p>","tag":""},{"id":"4.2.13","q":"<p>Which province–capital pair is correct?<\/p>","o":["Gandaki – Butwal","Bagmati – Hetauda","Madhesh – Birgunj","Koshi – Dharan"],"a":1,"s":"<p>Hetauda (Makwanpur) is the capital of Bagmati Province. The other capitals are: Gandaki – Pokhara, Madhesh – Janakpur, Koshi – Biratnagar.<br>Other options: A — Gandaki's capital is Pokhara; C — Madhesh's capital is Janakpur; D — Koshi's capital is Biratnagar.<\/p>","tag":""},{"id":"4.2.14","q":"<p>Province No. 1 was given its permanent name by its Provincial Assembly in 2023. The name is<\/p>","o":["Mechi Province","Kirat Province","Sagarmatha Province","Koshi Province"],"a":3,"s":"<p>In March 2023 the Provincial Assembly named Province No. 1 'Koshi Province', after the Koshi river.<br>Other options: A — Mechi was an old zone, not the adopted name; B — proposed by some groups but not adopted; C — Sagarmatha was an old zone, not the adopted name.<\/p>","tag":""},{"id":"4.2.15","q":"<p>How many districts are there in Koshi Province?<\/p>","o":["13","14","12","8"],"a":1,"s":"<p>Koshi Province has 14 districts, the most of any province (Bagmati 13, Lumbini 12, Gandaki 11, Karnali 10, Sudurpashchim 9, Madhesh 8; total 77).<br>Other options: A — the number in Bagmati Province; C — the number in Lumbini Province; D — the number in Madhesh Province.<\/p>","tag":""},{"id":"4.2.16","q":"<p>Of the world's 14 peaks above 8,000 m, how many lie wholly or partly in Nepal?<\/p>","o":["8","14","10","6"],"a":0,"s":"<p>Everest, Kanchenjunga, Lhotse, Makalu, Cho Oyu, Dhaulagiri I, Manaslu and Annapurna I — eight of the fourteen — are in Nepal.<br>Other options: B — the world total, not Nepal's share; C — overcounts; D — undercounts.<\/p>","tag":""},{"id":"4.2.17","q":"<p>Kanchenjunga, the third-highest mountain in the world, lies on Nepal's border with<\/p>","o":["Tibet (China)","Sikkim (India)","Bhutan","Uttarakhand (India)"],"a":1,"s":"<p>Kanchenjunga (8,586 m) lies on the border of Taplejung district (Nepal) and Sikkim (India).<br>Other options: A — Everest and Cho Oyu lie on the Tibet border, not Kanchenjunga; C — Nepal does not border Bhutan; D — it borders far-western Nepal.<\/p>","tag":""},{"id":"4.2.18","q":"<p>Nepal Standard Time (UTC+5:45) is based on the meridian 86°15′E, which passes close to which mountain?<\/p>","o":["Mount Everest","Mount Makalu","Mount Kanchenjunga","Mount Gauri Shankar"],"a":3,"s":"<p>Nepal's standard time is set by the 86°15′E meridian, which passes close to Mount Gauri Shankar in Dolakha.<br>Other options: A — Everest lies near 86°55′E; B — Makalu lies near 87°05′E; C — Kanchenjunga lies near 88°08′E.<\/p>","tag":""},{"id":"4.2.19","q":"<p>The youngest and lowest mountain range of Nepal, lying just north of the Terai, is the<\/p>","o":["Mahabharat range","Great Himalayan range","Chure (Siwalik) range","Trans-Himalayan range"],"a":2,"s":"<p>The Chure or Siwalik range is the youngest and lowest outer range of the Himalaya, made of loose sedimentary rock and prone to erosion.<br>Other options: A — lies north of the Chure and is older and higher; B — the highest range, with the 8,000 m peaks; D — lies north of the main Himalaya, e.g. in Mustang and Dolpa.<\/p>","tag":""},{"id":"4.2.20","q":"<p>Which was the first national park of Nepal, established in 1973?<\/p>","o":["Chitwan National Park","Sagarmatha National Park","Bardia National Park","Rara National Park"],"a":0,"s":"<p>Chitwan National Park was established in 1973 and listed as a World Heritage Site in 1984.<br>Other options: B — established in 1976; C — set up first as a reserve and made a national park in 1988; D — established in 1976.<\/p>","tag":""},{"id":"4.2.21","q":"<p>Which became Nepal's first Ramsar site (wetland of international importance) in 1987?<\/p>","o":["Rara Lake","Ghodaghodi Tal","Koshi Tappu Wildlife Reserve","Beeshazar Tal"],"a":2,"s":"<p>Koshi Tappu Wildlife Reserve in the eastern Terai was designated Nepal's first Ramsar site in 1987.<br>Other options: A — listed later, in 2007; B — listed in 2003; D — listed in 2003.<\/p>","tag":""},{"id":"4.2.22","q":"<p>Nepal's only hunting reserve is<\/p>","o":["Shuklaphanta","Dhorpatan Hunting Reserve","Parsa","Khaptad"],"a":1,"s":"<p>Dhorpatan Hunting Reserve (Baglung, Myagdi and Rukum) is the only area where licensed hunting of species such as blue sheep is permitted.<br>Other options: A — formerly a wildlife reserve, now a national park; C — formerly a wildlife reserve, now a national park; D — a national park in Sudurpashchim.<\/p>","tag":""},{"id":"4.2.23","q":"<p>Which is the largest conservation area in Nepal?<\/p>","o":["Kanchenjunga Conservation Area","Annapurna Conservation Area","Manaslu Conservation Area","Api Nampa Conservation Area"],"a":1,"s":"<p>Annapurna Conservation Area (about 7,629 sq km), Nepal's first conservation area (1986), is also the largest protected area of Nepal.<br>Other options: A — smaller than Annapurna; C — smaller than Annapurna; D — smaller than Annapurna.<\/p>","tag":""},{"id":"4.2.24","q":"<p>The national bird of Nepal is the<\/p>","o":["Danfe (Himalayan monal)","Kalij pheasant","Sarus crane","Peacock"],"a":0,"s":"<p>The Danfe or Himalayan monal (Lophophorus impejanus) is the national bird of Nepal.<br>Other options: B — a common pheasant, not the national bird; C — a large Terai wetland bird, not the national bird; D — the national bird of India.<\/p>","tag":""},{"id":"4.2.25","q":"<p>The sacred Gosaikunda lake is in which district?<\/p>","o":["Nuwakot","Rasuwa","Sindhupalchok","Dolakha"],"a":1,"s":"<p>Gosaikunda (about 4,380 m) lies in Langtang National Park, Rasuwa district; pilgrims gather there on Janai Purnima.<br>Other options: A — neighbouring district to the south; C — neighbouring district to the east; D — home of the Tamakoshi projects, not Gosaikunda.<\/p>","tag":""},{"id":"4.2.26","q":"<p>The installed capacity of the Upper Tamakoshi Hydroelectric Project in Dolakha, completed in 2021, is<\/p>","o":["456 MW","144 MW","92 MW","900 MW"],"a":0,"s":"<p>Upper Tamakoshi (456 MW), fully commissioned in 2021, was the largest hydropower plant in Nepal at completion.<br>Other options: B — the capacity of Kali Gandaki 'A'; C — the combined capacity of Kulekhani I and II; D — the planned capacity of Arun III.<\/p>","tag":""},{"id":"4.2.27","q":"<p>Nepal's first hydropower plant, at Pharping (500 kW), was commissioned in<\/p>","o":["1934","1951","1911","1965"],"a":2,"s":"<p>Pharping hydropower station was commissioned in 1911 (inaugurated on 22 May 1911, now National Energy Day) under Chandra Shumsher.<br>Other options: A — Nepal's second plant, Sundarijal, came in the 1930s; the first was earlier; B — the year Rana rule ended; D — not the date of the first plant.<\/p>","tag":""},{"id":"4.2.28","q":"<p>The Melamchi Water Supply Project brings water to the Kathmandu Valley from the Melamchi river in which district?<\/p>","o":["Nuwakot","Kavrepalanchok","Dhading","Sindhupalchok"],"a":3,"s":"<p>The project diverts water through a long tunnel from the Melamchi river in Sindhupalchok to Kathmandu.<br>Other options: A — the Melamchi river is not in Nuwakot; B — the Melamchi river is not in Kavre; C — the Melamchi river is not in Dhading.<\/p>","tag":""},{"id":"4.2.29","q":"<p>In December 2009 Nepal's cabinet met at Kalapatthar, near Everest base camp. The main purpose was to<\/p>","o":["celebrate the first ascent of Everest","launch Nepal Tourism Year","adopt a new constitution","draw world attention to the effects of climate change on the Himalaya before the Copenhagen summit"],"a":3,"s":"<p>The Kalapatthar cabinet meeting (4 December 2009) highlighted glacier melt and climate change ahead of COP15 in Copenhagen.<br>Other options: A — that was in 1953; the meeting was about climate change; B — not the purpose of the meeting; C — the constitution came in 2015.<\/p>","tag":""},{"id":"4.2.30","q":"<p>According to the final results of the National Population and Housing Census 2021, Nepal's population was<\/p>","o":["26,494,504","23,151,423","29,164,578","30,378,055"],"a":2,"s":"<p>The 2021 census counted 29,164,578 people, with an annual growth rate of 0.92 per cent and a sex ratio of 95.59.<br>Other options: A — the 2011 census figure; B — the 2001 census figure; D — not a census figure.<\/p>","tag":""}]},{"k":"4.3","t":"Constitution of Nepal 2072, Polity and Governance","items":[{"id":"4.3.1","q":"<p>As promulgated in 2015, the Constitution of Nepal contains<\/p>","o":["23 parts, 133 articles and 3 schedules","35 parts, 308 articles and 9 schedules","35 parts, 296 articles and 7 schedules","37 parts, 308 articles and 8 schedules"],"a":1,"s":"<p>The Constitution of Nepal 2072 has 35 parts, 308 articles and 9 schedules.<br>Other options: A — this describes the 1990 Constitution of the Kingdom of Nepal; C — wrong article and schedule counts; D — wrong part and schedule counts.<\/p>","tag":""},{"id":"4.3.2","q":"<p>How many fundamental rights are listed in Part 3 of the Constitution of Nepal?<\/p>","o":["31","30","32","21"],"a":0,"s":"<p>Articles 16 to 46 list 31 fundamental rights; Article 47 deals with their implementation and Article 48 with the duties of citizens.<br>Other options: B — one short; Articles 16–46 inclusive make 31; C — counts Article 47, which is about implementation, not a right; D — not the number in the 2072 Constitution.<\/p>","tag":""},{"id":"4.3.3","q":"<p>Which Article of the Constitution of Nepal guarantees the right to live with dignity and provides that no law shall impose the death penalty?<\/p>","o":["Article 17","Article 16","Article 18","Article 22"],"a":1,"s":"<p>Article 16 (Right to live with dignity) states that every person has the right to live with dignity and that no law shall be made providing for capital punishment.<br>Other options: A — Right to freedom (opinion, assembly, movement, profession); C — Right to equality; D — Right against torture.<\/p>","tag":""},{"id":"4.3.4","q":"<p>The right to a clean and healthy environment is guaranteed by which Article?<\/p>","o":["Article 30","Article 35","Article 36","Article 27"],"a":0,"s":"<p>Article 30 gives every citizen the right to live in a clean and healthy environment and the right to compensation from polluters.<br>Other options: B — Right relating to health; C — Right relating to food; D — Right to information.<\/p>","tag":""},{"id":"4.3.5","q":"<p>Under Article 47, the State must make the legal provisions needed to implement the fundamental rights within what period of the commencement of the Constitution?<\/p>","o":["One year","Two years","Five years","Three years"],"a":3,"s":"<p>Article 47 required the State to make legal provisions for implementing the fundamental rights within three years of the Constitution's commencement; most such laws were passed in 2018.<br>Other options: A — the period is three years; B — the period is three years; C — the period is three years.<\/p>","tag":""},{"id":"4.3.6","q":"<p>According to Article 7 of the Constitution, the official language of Nepal is<\/p>","o":["all mother tongues spoken in Nepal","the Nepali language in the Devanagari script","Nepali and English","Nepali and Hindi"],"a":1,"s":"<p>Article 7(1) makes Nepali in the Devanagari script the official language; a province may by law choose one or more other languages spoken by a majority in it as additional official languages.<br>Other options: A — Article 6 calls these the languages of the nation, but they are not all official languages; C — English is not an official language under the Constitution; D — Hindi is not an official language under the Constitution.<\/p>","tag":""},{"id":"4.3.7","q":"<p>Which pair of national symbols under Article 9 is correct?<\/p>","o":["National animal – one-horned rhinoceros","National colour – blue","National colour – crimson","National flower – lotus"],"a":2,"s":"<p>Article 9 lists the national colour as crimson, the national flower as rhododendron (lali gurans), the national bird as the Danfe and the national animal as the cow.<br>Other options: A — the national animal is the cow; B — blue is the colour of the flag's border, but the national colour is crimson; D — the national flower is the rhododendron.<\/p>","tag":""},{"id":"4.3.8","q":"<p>The House of Representatives of Nepal has<\/p>","o":["275 members: 165 elected by first-past-the-post and 110 by proportional representation","275 members: 110 elected by first-past-the-post and 165 by proportional representation","240 members: 165 elected by first-past-the-post and 75 by proportional representation","601 members: 240 elected by first-past-the-post and 335 by proportional representation"],"a":0,"s":"<p>Article 84 provides 275 members: 165 from single-member constituencies (FPTP) and 110 by the proportional system with the whole country as one constituency.<br>Other options: B — the two numbers are reversed; C — wrong total and wrong PR number; D — this was the Constituent Assembly.<\/p>","tag":""},{"id":"4.3.9","q":"<p>The National Assembly (Rastriya Sabha) consists of<\/p>","o":["59 members: 52 elected and 7 nominated","59 members: 56 elected and 3 nominated by the President on the recommendation of the Government of Nepal","60 members: 56 elected and 4 nominated","275 members: 165 elected and 110 nominated"],"a":1,"s":"<p>Under Article 86, 56 members are elected by electoral colleges of the seven provinces (8 per province) and 3, including at least one woman, are nominated by the President on the Government's recommendation.<br>Other options: A — wrong split; 56 are elected and 3 nominated; C — the total is 59, with 3 nominated; D — confuses it with the House of Representatives.<\/p>","tag":""},{"id":"4.3.10","q":"<p>The term of office of a member of the National Assembly is<\/p>","o":["five years, all members retiring together","four years, half the members retiring every two years","six years, half the members retiring every three years","six years, with one-third of the members retiring every two years"],"a":3,"s":"<p>The National Assembly is a permanent house; members serve six years and one-third retire every two years (Article 86).<br>Other options: A — this describes the House of Representatives; B — wrong term and rotation; C — one-third, not half, retire every two years.<\/p>","tag":""},{"id":"4.3.11","q":"<p>The minimum age to be elected President of Nepal is<\/p>","o":["35 years","25 years","45 years","40 years"],"a":2,"s":"<p>Article 64 requires a presidential candidate to be at least 45 years old and qualified to be a member of the Federal Parliament.<br>Other options: A — the minimum age for a member of the National Assembly; B — the minimum age for a member of the House of Representatives; D — not the constitutional requirement.<\/p>","tag":""},{"id":"4.3.12","q":"<p>The minimum age to become a member of the House of Representatives is<\/p>","o":["21 years","30 years","25 years","35 years"],"a":2,"s":"<p>Article 87 requires a member of the House of Representatives to have completed 25 years of age; for the National Assembly it is 35.<br>Other options: A — below the constitutional requirement; B — not the constitutional requirement; D — the requirement for the National Assembly.<\/p>","tag":""},{"id":"4.3.13","q":"<p>The President of Nepal is elected by<\/p>","o":["an electoral college of the members of the Federal Parliament and of the Provincial Assemblies","direct vote of the people","the House of Representatives only","a joint sitting of the Federal Parliament only"],"a":0,"s":"<p>Under Article 62, the electoral college consists of the members of both Houses of the Federal Parliament and of the Provincial Assemblies, with weighted votes.<br>Other options: B — Nepal's President is elected indirectly; C — both Houses and the Provincial Assemblies take part; D — Provincial Assembly members also vote.<\/p>","tag":""},{"id":"4.3.14","q":"<p>Under which Article does the President appoint the leader of the parliamentary party with a majority in the House of Representatives as Prime Minister?<\/p>","o":["Article 74","Article 76","Article 61","Article 84"],"a":1,"s":"<p>Article 76 (Constitution of the Council of Ministers) sets out how the Prime Minister is appointed: majority party leader (76(1)), coalition (76(2)), largest party (76(3)) and any member able to win confidence (76(5)).<br>Other options: A — vests the executive power of Nepal in the Council of Ministers; C — concerns the office of the President; D — concerns the composition of the House of Representatives.<\/p>","tag":""},{"id":"4.3.15","q":"<p>The Speaker and Deputy Speaker of the House of Representatives must<\/p>","o":["belong to the same party","be of different genders and represent different parties","both be women","be elected by the National Assembly"],"a":1,"s":"<p>Article 91(2) requires one of the two to be a woman and that they be from different parties.<br>Other options: A — they must be from different parties; C — one of them must be a woman, not both; D — the House of Representatives elects them.<\/p>","tag":""},{"id":"4.3.16","q":"<p>The Constitution requires that, of the total members elected from each party to the Federal Parliament, women must make up at least<\/p>","o":["one-fourth","one-half","one-fifth","one-third"],"a":3,"s":"<p>Article 84(8) requires at least one-third women among each party's members in the Federal Parliament.<br>Other options: A — below the constitutional requirement; B — not the constitutional requirement; C — below the constitutional requirement.<\/p>","tag":""},{"id":"4.3.17","q":"<p>Judges of the Supreme Court of Nepal retire at the age of<\/p>","o":["60 years","63 years","70 years","65 years"],"a":3,"s":"<p>The Chief Justice and other Supreme Court judges hold office until the age of 65.<br>Other options: A — not the retirement age for Supreme Court judges; B — the retirement age for High Court judges; C — not the retirement age for Supreme Court judges.<\/p>","tag":""},{"id":"4.3.18","q":"<p>Under Article 129, the maximum term of office of the Chief Justice of Nepal is<\/p>","o":["six years","five years","four years","until the age of 70"],"a":0,"s":"<p>Article 129(4) limits the Chief Justice's term to six years (subject to the retirement age of 65).<br>Other options: B — the term is six years; C — the term is six years; D — Supreme Court judges retire at 65.<\/p>","tag":""},{"id":"4.3.19","q":"<p>The Chief Justice of Nepal is appointed by the President on the recommendation of the<\/p>","o":["Judicial Council","Constitutional Council","Prime Minister alone","Parliamentary Hearing Committee"],"a":1,"s":"<p>Article 129(2): the President appoints the Chief Justice on the recommendation of the Constitutional Council, and other Supreme Court judges on the recommendation of the Judicial Council.<br>Other options: A — it recommends the other Supreme Court judges, not the Chief Justice; C — the recommendation comes from the Constitutional Council; D — it holds the hearing but does not make the recommendation.<\/p>","tag":""},{"id":"4.3.20","q":"<p>The Constitutional Council, which recommends appointments to constitutional bodies, is chaired by the<\/p>","o":["President","Chief Justice","Prime Minister","Speaker of the House of Representatives"],"a":2,"s":"<p>The Constitutional Council is chaired by the Prime Minister; its members include the Chief Justice, the Speaker, the Chair of the National Assembly, the Leader of the Opposition and the Deputy Speaker.<br>Other options: A — the President makes the appointments but does not chair the Council; B — a member, not the chair; D — a member, not the chair.<\/p>","tag":""},{"id":"4.3.21","q":"<p>The Election Commission of Nepal consists of<\/p>","o":["a Chief Election Commissioner and two other Election Commissioners","a Chief Election Commissioner and six other Election Commissioners","a Chief Election Commissioner and four other Election Commissioners","five commissioners nominated by the political parties"],"a":2,"s":"<p>Article 245 provides a Chief Election Commissioner and four other commissioners, each with a six-year term.<br>Other options: A — the number of other commissioners is four; B — the number of other commissioners is four; D — they are appointed by the President on the Constitutional Council's recommendation.<\/p>","tag":""},{"id":"4.3.22","q":"<p>Under Article 274, a bill to amend the Constitution must be passed by<\/p>","o":["a simple majority of the House of Representatives","three-fourths of a joint sitting of both Houses","a national referendum","a two-thirds majority of the total existing members of each House of the Federal Parliament"],"a":3,"s":"<p>Article 274(8) requires at least two-thirds of the then total members of both the House of Representatives and the National Assembly.<br>Other options: A — an amendment needs two-thirds, in both Houses; B — not the requirement under Article 274; C — the Constitution does not require a referendum for amendments.<\/p>","tag":""},{"id":"4.3.23","q":"<p>The second amendment to the Constitution of Nepal, passed in June 2020, changed<\/p>","o":["the number of provinces from seven to eight","the size of the National Assembly","the map of Nepal in the coat of arms (Schedule 3) to include Lipulekh, Kalapani and Limpiyadhura","the official language provisions of Article 7"],"a":2,"s":"<p>The second amendment updated the coat of arms in Schedule 3 with the new political map that includes Limpiyadhura, Lipulekh and Kalapani.<br>Other options: A — the number of provinces has not changed; B — not the subject of the second amendment; D — not the subject of the second amendment.<\/p>","tag":""},{"id":"4.3.24","q":"<p>Which Schedule of the Constitution lists the exclusive powers of the local level?<\/p>","o":["Schedule 5","Schedule 6","Schedule 9","Schedule 8"],"a":3,"s":"<p>Schedule 5 lists federal powers, Schedule 6 provincial powers, Schedule 7 concurrent federal–provincial powers, Schedule 8 local-level powers and Schedule 9 powers concurrent to all three levels.<br>Other options: A — federal powers; B — provincial powers; C — concurrent powers of all three levels.<\/p>","tag":""},{"id":"4.3.25","q":"<p>Under Article 56, the main structure of the State of Nepal has how many levels?<\/p>","o":["Two: federal and provincial","Four: federal, provincial, district and local","Three: federal, provincial and local","Five: federal, regional, zonal, district and village"],"a":2,"s":"<p>Article 56(1) provides three levels of state power: federation, province and local level.<br>Other options: A — omits the local level; B — the district is not a separate level of government; D — regions and zones were abolished.<\/p>","tag":""},{"id":"4.3.26","q":"<p>The Province Head (Pradesh Pramukh) is appointed by the<\/p>","o":["Chief Minister","Provincial Assembly","Chief Justice","President"],"a":3,"s":"<p>Article 163 provides that the President appoints a Province Head for each province.<br>Other options: A — the Chief Minister is appointed by the Province Head, not the reverse; B — it does not appoint the Province Head; C — has no role in this appointment.<\/p>","tag":""},{"id":"4.3.27","q":"<p>At the local level, the three-member Judicial Committee of a municipality is chaired by the<\/p>","o":["Deputy Mayor","Mayor","Chief Administrative Officer","District Judge"],"a":0,"s":"<p>Article 217 provides a judicial committee chaired by the Deputy Mayor in a municipality (Vice-Chairperson in a rural municipality).<br>Other options: B — the Mayor heads the municipal executive, not the judicial committee; C — a civil servant, not the chair; D — district courts are separate from the local judicial committee.<\/p>","tag":""},{"id":"4.3.28","q":"<p>The Attorney General of Nepal is appointed by the President on the recommendation of the<\/p>","o":["Prime Minister","Chief Justice","Judicial Council","Speaker"],"a":0,"s":"<p>Article 157 provides that the President appoints the Attorney General on the recommendation of the Prime Minister.<br>Other options: B — not the recommending authority; C — it recommends judges, not the Attorney General; D — not the recommending authority.<\/p>","tag":""},{"id":"4.3.29","q":"<p>Under Article 119(3), the federal budget (estimates of revenue and expenditure) must be presented to the Federal Parliament every year on<\/p>","o":["Shrawan 1","Jestha 15","Asar 1","Asoj 3"],"a":1,"s":"<p>Article 119(3) fixes Jestha 15 (late May) for presenting the annual budget, so it can be passed before the fiscal year starts on Shrawan 1.<br>Other options: A — the start of the fiscal year; C — the date for provincial budgets, not the federal budget; D — Constitution Day.<\/p>","tag":""},{"id":"4.3.30","q":"<p>The National Security Council under Article 266, which advises on national security policy and the mobilisation of the Nepal Army, is chaired by the<\/p>","o":["Prime Minister","President","Defence Minister","Chief of the Army Staff"],"a":0,"s":"<p>Article 266 provides a National Security Council chaired by the Prime Minister; members include the Defence, Home, Foreign Affairs and Finance Ministers, the Chief Secretary and the Chief of the Army Staff.<br>Other options: B — the President is Supreme Commander of the Nepal Army but does not chair the Council; C — a member, not the chair; D — a member, not the chair.<\/p>","tag":""}]},{"k":"4.4","t":"Economy of Nepal, Development and National Organisations","items":[{"id":"4.4.1","q":"<p>Nepal Rastra Bank, the central bank of Nepal, was established in<\/p>","o":["1937","1951","1956","1966"],"a":2,"s":"<p>Nepal Rastra Bank was established on 26 April 1956 (Baisakh 14, 2013 BS) under the Nepal Rastra Bank Act, 1955.<br>Other options: A — the year Nepal Bank Limited was set up; B — the year Rana rule ended; D — the year Rastriya Banijya Bank was set up.<\/p>","tag":""},{"id":"4.4.2","q":"<p>Nepal's first commercial bank, established in 1937 (1994 BS), is<\/p>","o":["Rastriya Banijya Bank","Nepal Bank Limited","Nabil Bank","Agricultural Development Bank"],"a":1,"s":"<p>Nepal Bank Limited, founded on Kartik 30, 1994 BS (1937), was the first bank in Nepal, even before the central bank.<br>Other options: A — established in 1966; C — established in 1984 as the first joint-venture bank; D — established in 1968.<\/p>","tag":""},{"id":"4.4.3","q":"<p>Nepal's first joint-venture commercial bank, established in 1984 as Nepal Arab Bank, is now known as<\/p>","o":["Nepal Investment Bank","Standard Chartered Bank Nepal","Nabil Bank","Himalayan Bank"],"a":2,"s":"<p>Nepal Arab Bank Limited (now Nabil Bank) began in 1984 as the first joint-venture bank, under the liberalised policy of the 1980s.<br>Other options: A — began in 1986 as Nepal Indosuez Bank; B — began in 1987 as Nepal Grindlays Bank; D — established in 1993.<\/p>","tag":""},{"id":"4.4.4","q":"<p>Which of the following is NOT a function of Nepal Rastra Bank?<\/p>","o":["Collecting income tax and VAT","Issuing currency notes","Acting as banker to the Government","Acting as lender of last resort to banks"],"a":0,"s":"<p>Taxes are collected by the Inland Revenue Department under the Ministry of Finance. NRB issues currency, acts as banker to the Government and is the lender of last resort.<br>Other options: B — this is an NRB function; C — this is an NRB function; D — this is an NRB function.<\/p>","tag":""},{"id":"4.4.5","q":"<p>In Nepal Rastra Bank's classification of banks and financial institutions, class 'B' institutions are<\/p>","o":["commercial banks","finance companies","development banks","microfinance financial institutions"],"a":2,"s":"<p>Under BAFIA 2073, class A = commercial banks, B = development banks, C = finance companies, D = microfinance financial institutions.<br>Other options: A — class A; B — class C; D — class D.<\/p>","tag":""},{"id":"4.4.6","q":"<p>Nepal Stock Exchange (NEPSE) was formed in 1993 by converting the<\/p>","o":["Securities Board of Nepal","Citizen Investment Trust","CDS and Clearing Limited","Securities Exchange Centre"],"a":3,"s":"<p>The Securities Exchange Centre, set up in 1976, was converted into NEPSE in 1993; NEPSE opened its trading floor on 13 January 1994.<br>Other options: A — SEBON is the regulator, created separately in 1993; B — an investment institution, not NEPSE's predecessor; C — a later depository company for demat and settlement, not NEPSE's predecessor.<\/p>","tag":""},{"id":"4.4.7","q":"<p>Which body regulates the securities (capital) market in Nepal?<\/p>","o":["Nepal Rastra Bank","Securities Board of Nepal (SEBON)","Nepal Stock Exchange","Nepal Insurance Authority"],"a":1,"s":"<p>SEBON, established on 7 June 1993, regulates and supervises the securities market, including NEPSE and brokers.<br>Other options: A — regulates banks and financial institutions; C — the exchange itself, regulated by SEBON; D — regulates insurance.<\/p>","tag":""},{"id":"4.4.8","q":"<p>The base value of the NEPSE index is<\/p>","o":["1,000","500","10","100"],"a":3,"s":"<p>The NEPSE index is a value-weighted index of all listed shares with a base value of 100.<br>Other options: A — not the base value; B — not the base value; C — not the base value.<\/p>","tag":""},{"id":"4.4.9","q":"<p>The ex officio chairperson of the National Planning Commission is the<\/p>","o":["Prime Minister","Finance Minister","Governor of Nepal Rastra Bank","President"],"a":0,"s":"<p>The Prime Minister chairs the National Planning Commission; the full-time Vice-Chairperson runs its day-to-day work.<br>Other options: B — an ex officio member, not the chair; C — not the chair of the NPC; D — not part of the NPC.<\/p>","tag":""},{"id":"4.4.10","q":"<p>Nepal's first five-year plan covered the period<\/p>","o":["1951–1956","1962–1965","1956–1961","1970–1975"],"a":2,"s":"<p>Planned development began with the First Five-Year Plan, 1956–1961 (2013–2018 BS).<br>Other options: A — planned development had not yet begun; B — the Second Plan was a three-year plan, 1962–65; D — the Fourth Plan.<\/p>","tag":""},{"id":"4.4.11","q":"<p>The periodic plan covering fiscal years 2081/82 to 2085/86 BS (2024/25 to 2028/29) is Nepal's<\/p>","o":["Fifteenth Plan","Fourteenth Plan","Seventeenth Plan","Sixteenth Plan"],"a":3,"s":"<p>The Sixteenth Plan runs from FY 2081/82 to 2085/86; the Fifteenth Plan covered 2076/77 to 2080/81.<br>Other options: A — covered 2076/77 to 2080/81 BS; B — covered 2073/74 to 2075/76 BS; C — will follow the Sixteenth.<\/p>","tag":""},{"id":"4.4.12","q":"<p>Nepal's fiscal year begins on<\/p>","o":["Shrawan 1 (mid-July)","Baisakh 1 (mid-April)","Magh 1 (mid-January)","1 January"],"a":0,"s":"<p>The Nepali fiscal year runs from Shrawan 1 to Asar end (mid-July to mid-July).<br>Other options: B — the Nepali New Year, not the fiscal year; C — not the start of the fiscal year; D — the calendar year, not Nepal's fiscal year.<\/p>","tag":""},{"id":"4.4.13","q":"<p>Value Added Tax (VAT) was introduced in Nepal, replacing the sales tax and some other taxes, in<\/p>","o":["1991 (2048 BS)","1997 (2054 BS)","2004 (2061 BS)","2010 (2067 BS)"],"a":1,"s":"<p>VAT came into effect on Mangsir 1, 2054 BS (November 1997); the present standard rate is 13 per cent.<br>Other options: A — VAT had not been introduced yet; C — the year Nepal joined the WTO; D — VAT already existed.<\/p>","tag":""},{"id":"4.4.14","q":"<p>Since 1993 the Nepali rupee has been pegged to the Indian rupee at<\/p>","o":["NPR 1.60 = INR 1","NPR 1.00 = INR 1","NPR 1.45 = INR 1","NPR 1.65 = INR 1"],"a":0,"s":"<p>The fixed rate of NPR 160 for INR 100 (1.60) has been maintained since 1993; other currencies float.<br>Other options: B — not the pegged rate; C — not the pegged rate; D — not the pegged rate.<\/p>","tag":""},{"id":"4.4.15","q":"<p>Nepal's largest trading partner is<\/p>","o":["China","Bangladesh","United States","India"],"a":3,"s":"<p>India has long been Nepal's largest trading partner, with the largest share of both imports and exports.<br>Other options: A — the second-largest partner, mainly for imports; B — a much smaller partner; C — an important export market, but far smaller in total trade.<\/p>","tag":""},{"id":"4.4.16","q":"<p>South Asia's first cross-border petroleum products pipeline, inaugurated in 2019, links Motihari in India with<\/p>","o":["Amlekhgunj","Birgunj","Biratnagar","Bhairahawa"],"a":0,"s":"<p>The Motihari–Amlekhgunj pipeline (about 69 km) carries diesel to Nepal Oil Corporation's depot at Amlekhgunj in Bara.<br>Other options: B — the pipeline ends at Amlekhgunj, not Birgunj; C — in eastern Nepal, not on this pipeline; D — in western Nepal, not on this pipeline.<\/p>","tag":""},{"id":"4.4.17","q":"<p>Investment Board Nepal, set up in 2011 to facilitate large investment projects, is chaired by the<\/p>","o":["Finance Minister","Governor of Nepal Rastra Bank","Minister for Industry","Prime Minister"],"a":3,"s":"<p>The Investment Board Nepal is chaired by the Prime Minister; it handles projects above a set investment threshold, such as large hydropower projects.<br>Other options: A — not the chair of the Board; B — not the chair of the Board; C — not the chair of the Board.<\/p>","tag":""},{"id":"4.4.18","q":"<p>Nepal Electricity Authority, which generates, transmits and distributes most of Nepal's electricity, was established in<\/p>","o":["1911","1985","1975","1993"],"a":1,"s":"<p>Nepal Electricity Authority was formed on 16 August 1985 under the NEA Act, 1984, merging earlier electricity bodies.<br>Other options: A — the year of the first hydropower plant at Pharping; C — not the year NEA was formed; D — not the year NEA was formed.<\/p>","tag":""},{"id":"4.4.19","q":"<p>In recent years, Nepal's single largest source of foreign exchange earnings has been<\/p>","o":["workers' remittances","tourism","merchandise exports","foreign direct investment"],"a":0,"s":"<p>Remittances from Nepali workers abroad equal roughly a quarter of GDP and far exceed earnings from exports, tourism or FDI.<br>Other options: B — important, but much smaller than remittances; C — much smaller than remittances; Nepal has a large trade deficit; D — small in Nepal.<\/p>","tag":""},{"id":"4.4.20","q":"<p>The US$ 500 million Millennium Challenge Corporation (MCC) Nepal Compact, ratified by Parliament in 2022, funds projects in<\/p>","o":["irrigation and agriculture","electricity transmission and road maintenance","school education and health","international airports"],"a":1,"s":"<p>The MCC Nepal Compact has an Electricity Transmission Project and a Road Maintenance Project.<br>Other options: A — not the compact's projects; C — not the compact's projects; D — not the compact's projects.<\/p>","tag":""},{"id":"4.4.21","q":"<p>Which sector contributes the largest share of Nepal's GDP?<\/p>","o":["Agriculture","Manufacturing","Mining and quarrying","The service (tertiary) sector"],"a":3,"s":"<p>Services (trade, transport, real estate, education, public administration, etc.) contribute more than half of Nepal's GDP; agriculture is second, industry third.<br>Other options: A — employs the most people, but its share of GDP is about a quarter; B — a small share, around 5 per cent; C — a very small share.<\/p>","tag":""},{"id":"4.4.22","q":"<p>Which of the following is a monetary policy instrument used by Nepal Rastra Bank?<\/p>","o":["Value Added Tax rate","Cash Reserve Ratio (CRR)","Customs duty","Government budget allocation"],"a":1,"s":"<p>CRR, the bank rate, open market operations and the policy rate are monetary tools of NRB. Tax rates and budget spending are fiscal policy tools of the Government.<br>Other options: A — a fiscal policy tool; C — a fiscal/trade policy tool; D — a fiscal policy tool.<\/p>","tag":""},{"id":"4.4.23","q":"<p>Whose signature appears on Nepali currency notes?<\/p>","o":["The Finance Minister","The Finance Secretary","The Governor of Nepal Rastra Bank","The Prime Minister"],"a":2,"s":"<p>Nepal Rastra Bank issues the banknotes, and they carry the signature of its Governor.<br>Other options: A — the Finance Minister does not sign banknotes; B — the Finance Secretary does not sign banknotes; D — the Prime Minister does not sign banknotes.<\/p>","tag":""},{"id":"4.4.24","q":"<p>Income tax and VAT in Nepal are administered by the<\/p>","o":["Department of Customs","Inland Revenue Department","Office of the Auditor General","Financial Comptroller General Office"],"a":1,"s":"<p>The Inland Revenue Department under the Ministry of Finance administers income tax, VAT and excise.<br>Other options: A — collects custo
