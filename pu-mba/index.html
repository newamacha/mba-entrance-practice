ms duties at the border; C — audits public accounts; D — manages government accounting and payments.<\/p>","tag":""},{"id":"4.4.25","q":"<p>The term of office of the Auditor General of Nepal is<\/p>","o":["six years","five years","four years","until the age of 70"],"a":0,"s":"<p>The Auditor General is appointed by the President on the Constitutional Council's recommendation for a six-year term (Article 240).<br>Other options: B — the term is six years; C — the term is six years; D — the term is a fixed six years.<\/p>","tag":""},{"id":"4.4.26","q":"<p>Nepal's National Population and Housing Census 2021 was conducted by the<\/p>","o":["Nepal Rastra Bank","Election Commission","Central Bureau of Statistics (now the National Statistics Office)","Ministry of Home Affairs"],"a":2,"s":"<p>The Central Bureau of Statistics conducted the 2021 census; it was later renamed the National Statistics Office.<br>Other options: A — conducts banking surveys, not the census; B — maintains the voter roll, not the census; D — not the census agency.<\/p>","tag":""},{"id":"4.4.27","q":"<p>The central office of Nepal Rastra Bank is located at<\/p>","o":["Singha Durbar, Kathmandu","Thapathali, Kathmandu","Baluwatar, Kathmandu","Pulchowk, Lalitpur"],"a":2,"s":"<p>NRB's central office is at Baluwatar, Kathmandu.<br>Other options: A — the main government secretariat; B — not the NRB central office; D — not the NRB central office.<\/p>","tag":""},{"id":"4.4.28","q":"<p>Dematerialised (demat) shares in Nepal are held and settled through<\/p>","o":["Nepal Clearing House Limited","Securities Board of Nepal","Nepal Rastra Bank","CDS and Clearing Limited"],"a":3,"s":"<p>CDS and Clearing Limited (CDSC), a subsidiary of NEPSE, is Nepal's central depository for demat securities and clearing.<br>Other options: A — it clears interbank payments and cheques, not shares; B — the regulator, not the depository; C — the central bank, not the securities depository.<\/p>","tag":""},{"id":"4.4.29","q":"<p>The long-term national aspiration adopted in the Fifteenth Plan is<\/p>","o":["Digital Nepal, Smart Nepal","Prosperous Nepal, Happy Nepali","Clean Nepal, Green Nepal","Garibi Hatao"],"a":1,"s":"<p>The Fifteenth Plan set the long-term vision 'Samriddha Nepal, Sukhi Nepali' (Prosperous Nepal, Happy Nepali).<br>Other options: A — not the long-term aspiration of the Fifteenth Plan; C — an environmental slogan, not the national aspiration; D — an Indian political slogan.<\/p>","tag":""},{"id":"4.4.30","q":"<p>Which body regulates the insurance business in Nepal?<\/p>","o":["Nepal Insurance Authority (formerly Beema Samiti)","Securities Board of Nepal","Nepal Rastra Bank","Ministry of Finance directly"],"a":0,"s":"<p>Under the Insurance Act 2079 (2022), the Beema Samiti became the Nepal Insurance Authority, the regulator of insurance companies.<br>Other options: B — regulates the securities market; C — regulates banks and financial institutions; D — the Authority, not the Ministry, regulates insurers.<\/p>","tag":""}]},{"k":"4.5","t":"World: International Organisations, World Geography and Notable Firsts","items":[{"id":"4.5.1","q":"<p>The United Nations came into existence on 24 October 1945, the day<\/p>","o":["the UN Charter was signed in San Francisco","the UN Charter came into force after ratification","the Second World War ended in Europe","the League of Nations was founded"],"a":1,"s":"<p>The Charter was signed in San Francisco on 26 June 1945 and came into force on 24 October 1945, now observed as UN Day.<br>Other options: A — that was on 26 June 1945; C — that was in May 1945; D — the League was founded in 1920.<\/p>","tag":""},{"id":"4.5.2","q":"<p>As of 2026, how many member states does the United Nations have?<\/p>","o":["193","192","195","191"],"a":0,"s":"<p>The UN has 193 member states; South Sudan, admitted in 2011, was the latest. The Holy See and Palestine are non-member observer states.<br>Other options: B — the number before South Sudan joined in 2011; C — counts the two observer states as members; D — an older figure.<\/p>","tag":""},{"id":"4.5.3","q":"<p>How many non-permanent members does the UN Security Council have, and for what term are they elected?<\/p>","o":["5 members, for five-year terms","10 members, for two-year terms","15 members, for two-year terms","10 members, for three-year terms"],"a":1,"s":"<p>The Security Council has 15 members: 5 permanent with veto power (China, France, Russia, UK, USA) and 10 non-permanent members elected by the General Assembly for two-year terms.<br>Other options: A — 5 is the number of permanent members, who have no fixed term; C — 15 is the total membership; D — the term is two years.<\/p>","tag":""},{"id":"4.5.4","q":"<p>Nepal became a member of the United Nations in<\/p>","o":["1955","1945","1949","1961"],"a":0,"s":"<p>Nepal joined the UN on 14 December 1955.<br>Other options: B — the UN was founded then; Nepal was not a founding member; C — Nepal applied in 1949 but was admitted only in 1955; D — not the year Nepal joined.<\/p>","tag":""},{"id":"4.5.5","q":"<p>SAARC was established on 8 December 1985 at its first summit in<\/p>","o":["Kathmandu","New Delhi","Dhaka","Colombo"],"a":2,"s":"<p>The South Asian Association for Regional Cooperation was founded at the Dhaka summit in December 1985.<br>Other options: A — the SAARC Secretariat was set up there in 1987; B — not where SAARC was founded; D — not where SAARC was founded.<\/p>","tag":""},{"id":"4.5.6","q":"<p>The SAARC Secretariat is located in<\/p>","o":["Dhaka","New Delhi","Islamabad","Kathmandu"],"a":3,"s":"<p>The SAARC Secretariat was established in Kathmandu on 16 January 1987.<br>Other options: A — the BIMSTEC Secretariat is in Dhaka; B — not the seat of the Secretariat; C — not the seat of the Secretariat.<\/p>","tag":""},{"id":"4.5.7","q":"<p>Which country joined SAARC in 2007 as its eighth member?<\/p>","o":["Myanmar","Afghanistan","China","Iran"],"a":1,"s":"<p>Afghanistan joined at the 14th summit in New Delhi in April 2007; the other members are Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan and Sri Lanka.<br>Other options: A — a BIMSTEC member, not a SAARC member; C — an observer, not a member; D — an observer, not a member.<\/p>","tag":""},{"id":"4.5.8","q":"<p>Which of the following countries is NOT a member of BIMSTEC?<\/p>","o":["Nepal","Myanmar","Thailand","Pakistan"],"a":3,"s":"<p>BIMSTEC has seven members: Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka and Thailand.<br>Other options: A — a member since 2004; B — a member; C — a founding member (Bangkok Declaration, 1997).<\/p>","tag":""},{"id":"4.5.9","q":"<p>The permanent secretariat of BIMSTEC is in<\/p>","o":["Dhaka","Bangkok","Kathmandu","Colombo"],"a":0,"s":"<p>BIMSTEC's permanent secretariat was opened in Dhaka in 2014.<br>Other options: B — BIMSTEC was founded there in 1997, but the secretariat is in Dhaka; C — the SAARC Secretariat is there; D — not the BIMSTEC secretariat.<\/p>","tag":""},{"id":"4.5.10","q":"<p>The World Trade Organization, set up on 1 January 1995, replaced the<\/p>","o":["United Nations Conference on Trade and Development (UNCTAD)","International Monetary Fund (IMF)","General Agreement on Tariffs and Trade (GATT)","Organisation for Economic Co-operation and Development (OECD)"],"a":2,"s":"<p>The WTO, headquartered in Geneva, replaced GATT (1947) after the Uruguay Round.<br>Other options: A — UNCTAD still exists as a UN body; B — the IMF still exists; D — the OECD still exists.<\/p>","tag":""},{"id":"4.5.11","q":"<p>Nepal became a member of the World Trade Organization in<\/p>","o":["1995","2004","2001","2008"],"a":1,"s":"<p>Nepal joined the WTO on 23 April 2004 as its 147th member.<br>Other options: A — the year the WTO was set up; C — the year China joined; D — not the year Nepal joined.<\/p>","tag":""},{"id":"4.5.12","q":"<p>The International Monetary Fund and the World Bank were created at which conference in 1944?<\/p>","o":["Bretton Woods Conference","Yalta Conference","San Francisco Conference","Potsdam Conference"],"a":0,"s":"<p>The UN Monetary and Financial Conference at Bretton Woods, New Hampshire (July 1944) created the IMF and the IBRD (World Bank).<br>Other options: B — a 1945 meeting of Allied leaders on post-war Europe; C — drafted the UN Charter in 1945; D — a 1945 meeting on post-war Germany.<\/p>","tag":""},{"id":"4.5.13","q":"<p>The headquarters of the International Monetary Fund is in<\/p>","o":["New York","Geneva","Paris","Washington, D.C."],"a":3,"s":"<p>Both the IMF and the World Bank have their headquarters in Washington, D.C.<br>Other options: A — the UN headquarters is there; B — the WTO and WHO are there; C — the OECD and UNESCO are there.<\/p>","tag":""},{"id":"4.5.14","q":"<p>The Asian Development Bank, of which Nepal is a founding member, was established in 1966 with its headquarters in<\/p>","o":["Tokyo","Bangkok","Manila","Beijing"],"a":2,"s":"<p>ADB was set up in 1966 with headquarters in Manila (Mandaluyong, Metro Manila), Philippines.<br>Other options: A — Japan is a major shareholder, but the HQ is in Manila; B — not ADB's headquarters; D — the AIIB's headquarters.<\/p>","tag":""},{"id":"4.5.15","q":"<p>Which organisation–headquarters pair is correct?<\/p>","o":["UNESCO – Geneva","FAO – Vienna","WHO – New York","UNEP – Nairobi"],"a":3,"s":"<p>The UN Environment Programme is headquartered in Nairobi. UNESCO is in Paris, FAO in Rome and WHO in Geneva.<br>Other options: A — UNESCO is in Paris; B — FAO is in Rome; C — WHO is in Geneva.<\/p>","tag":""},{"id":"4.5.16","q":"<p>Which of these organisations has its headquarters in Brussels?<\/p>","o":["OPEC","ASEAN","NATO","African Union"],"a":2,"s":"<p>NATO (founded 1949) is headquartered in Brussels, which also hosts the main EU institutions.<br>Other options: A — headquartered in Vienna; B — secretariat in Jakarta; D — headquartered in Addis Ababa.<\/p>","tag":""},{"id":"4.5.17","q":"<p>Who was the first Secretary-General of the United Nations?<\/p>","o":["Dag Hammarskjöld","U Thant","Kofi Annan","Trygve Lie"],"a":3,"s":"<p>Trygve Lie of Norway served as the first UN Secretary-General from 1946 to 1952.<br>Other options: A — the second Secretary-General; B — the third Secretary-General; C — the seventh Secretary-General.<\/p>","tag":""},{"id":"4.5.18","q":"<p>The largest and deepest ocean in the world is the<\/p>","o":["Atlantic Ocean","Indian Ocean","Pacific Ocean","Southern Ocean"],"a":2,"s":"<p>The Pacific covers about a third of the earth's surface and contains the deepest point, the Challenger Deep.<br>Other options: A — second largest; B — third largest; D — much smaller.<\/p>","tag":""},{"id":"4.5.19","q":"<p>The smallest country in the world by area is<\/p>","o":["Monaco","Vatican City","San Marino","Maldives"],"a":1,"s":"<p>Vatican City (about 0.44 sq km), an enclave in Rome, is the smallest sovereign state.<br>Other options: A — the second smallest; C — larger than both Vatican City and Monaco; D — the smallest country in Asia, not in the world.<\/p>","tag":""},{"id":"4.5.20","q":"<p>The Panama Canal connects the<\/p>","o":["Atlantic and Pacific Oceans","Mediterranean Sea and Red Sea","Atlantic Ocean and Mediterranean Sea","Pacific and Indian Oceans"],"a":0,"s":"<p>The Panama Canal, opened in 1914, links the Atlantic (Caribbean Sea) with the Pacific across the Isthmus of Panama.<br>Other options: B — the Suez Canal does this; C — linked by the Strait of Gibraltar; D — not linked by the Panama Canal.<\/p>","tag":""},{"id":"4.5.21","q":"<p>The deepest known point in the world's oceans, the Challenger Deep, lies in the<\/p>","o":["Puerto Rico Trench","Java (Sunda) Trench","Mariana Trench","Tonga Trench"],"a":2,"s":"<p>The Challenger Deep in the Mariana Trench (western Pacific) is nearly 11,000 m deep.<br>Other options: A — the deepest point of the Atlantic; B — the deepest point of the Indian Ocean; D — deep, but not as deep as the Mariana Trench.<\/p>","tag":""},{"id":"4.5.22","q":"<p>The world's highest uninterrupted waterfall, Angel Falls, is in<\/p>","o":["Venezuela","Brazil","Zambia/Zimbabwe","Canada/USA"],"a":0,"s":"<p>Angel Falls (about 979 m) is in Canaima National Park, Venezuela.<br>Other options: B — has the Iguazu Falls (shared with Argentina); C — have the Victoria Falls; D — have the Niagara Falls.<\/p>","tag":""},{"id":"4.5.23","q":"<p>The largest hot desert in the world is the<\/p>","o":["Sahara","Gobi","Thar","Kalahari"],"a":0,"s":"<p>The Sahara in North Africa is the largest hot desert (Antarctica is the largest desert overall, but it is cold).<br>Other options: B — a cold desert in Mongolia and China; C — in India and Pakistan, much smaller; D — in southern Africa, much smaller.<\/p>","tag":""},{"id":"4.5.24","q":"<p>Who was the first human to travel into space, in April 1961?<\/p>","o":["Neil Armstrong","Yuri Gagarin","Valentina Tereshkova","Alan Shepard"],"a":1,"s":"<p>Yuri Gagarin of the Soviet Union orbited the earth in Vostok 1 on 12 April 1961.<br>Other options: A — the first person to walk on the Moon (1969); C — the first woman in space (1963); D — the first American in space (May 1961).<\/p>","tag":""},{"id":"4.5.25","q":"<p>The first woman to climb Mount Everest (1975) was<\/p>","o":["Junko Tabei","Pasang Lhamu Sherpa","Wanda Rutkiewicz","Bachendri Pal"],"a":0,"s":"<p>Junko Tabei of Japan reached the summit on 16 May 1975.<br>Other options: B — the first Nepali woman to climb Everest (1993); C — the first European woman to climb Everest (1978); D — the first Indian woman to climb Everest (1984).<\/p>","tag":""},{"id":"4.5.26","q":"<p>The Paris Agreement on climate change was adopted in 2015 at<\/p>","o":["COP3","COP21","COP15","COP26"],"a":1,"s":"<p>The Paris Agreement was adopted at the 21st Conference of the Parties (COP21) to the UNFCCC in December 2015.<br>Other options: A — adopted the Kyoto Protocol in 1997; C — the Copenhagen summit of 2009; D — the Glasgow summit of 2021.<\/p>","tag":""},{"id":"4.5.27","q":"<p>The Montreal Protocol (1987) is an international agreement to<\/p>","o":["cut greenhouse gas emissions","phase out ozone-depleting substances","protect wetlands of international importance","control international trade in endangered species"],"a":1,"s":"<p>The Montreal Protocol controls chlorofluorocarbons (CFCs) and other substances that deplete the ozone layer.<br>Other options: A — the aim of the Kyoto Protocol and Paris Agreement; C — the aim of the Ramsar Convention; D — the aim of CITES.<\/p>","tag":""},{"id":"4.5.28","q":"<p>The ASEAN Secretariat is located in<\/p>","o":["Bangkok","Singapore","Manila","Jakarta"],"a":3,"s":"<p>ASEAN was founded in Bangkok in 1967; its Secretariat is in Jakarta, Indonesia.<br>Other options: A — ASEAN was founded there, but the Secretariat is in Jakarta; B — not the Secretariat's seat; C — the ADB headquarters.<\/p>","tag":""},{"id":"4.5.29","q":"<p>The Asian Infrastructure Investment Bank (AIIB), which began operations in 2016, is headquartered in<\/p>","o":["Shanghai","Manila","Beijing","Singapore"],"a":2,"s":"<p>AIIB is headquartered in Beijing; Nepal is a founding member.<br>Other options: A — the headquarters of the BRICS New Development Bank; B — the ADB headquarters; D — not the AIIB headquarters.<\/p>","tag":""},{"id":"4.5.30","q":"<p>The International Court of Justice, the principal judicial organ of the UN, sits at<\/p>","o":["Geneva","New York","Vienna","The Hague"],"a":3,"s":"<p>The ICJ sits in the Peace Palace at The Hague, Netherlands; it is the only principal UN organ not based in New York.<br>Other options: A — home of many UN agencies, but not the ICJ; B — the UN headquarters; the ICJ is not there; C — home of the IAEA and UNODC, not the ICJ.<\/p>","tag":""}]},{"k":"4.6","t":"Science and Technology, Sports, Awards and Books","items":[{"id":"4.6.1","q":"<p>NepaliSat-1, Nepal's first satellite, built under Japan's BIRDS project, was launched in<\/p>","o":["April 2019","September 2015","December 2017","January 2022"],"a":0,"s":"<p>NepaliSat-1 was launched on 17–18 April 2019 to the International Space Station and released into orbit in June 2019; it was developed by Nepali scientists with the Nepal Academy of Science and Technology.<br>Other options: B — Nepal had no satellite then; C — Nepal had no satellite then; D — NepaliSat-1 had already re-entered the atmosphere in 2021.<\/p>","tag":""},{"id":"4.6.2","q":"<p>Penicillin, the first widely used antibiotic, was discovered in 1928 by<\/p>","o":["Louis Pasteur","Edward Jenner","Robert Koch","Alexander Fleming"],"a":3,"s":"<p>Alexander Fleming noticed in 1928 that Penicillium mould killed bacteria.<br>Other options: A — known for pasteurisation and the rabies vaccine; B — developed the smallpox vaccine; C — identified the bacteria causing tuberculosis and cholera.<\/p>","tag":""},{"id":"4.6.3","q":"<p>The SI unit of force is the<\/p>","o":["joule","watt","pascal","newton"],"a":3,"s":"<p>One newton is the force that gives a 1 kg mass an acceleration of 1 m/s².<br>Other options: A — the unit of work and energy; B — the unit of power; C — the unit of pressure.<\/p>","tag":""},{"id":"4.6.4","q":"<p>Scurvy is caused by a deficiency of<\/p>","o":["vitamin A","vitamin D","vitamin C","vitamin B1"],"a":2,"s":"<p>Vitamin C (ascorbic acid) deficiency causes scurvy, with bleeding gums and poor wound healing.<br>Other options: A — deficiency causes night blindness; B — deficiency causes rickets; D — deficiency causes beriberi.<\/p>","tag":""},{"id":"4.6.5","q":"<p>The double-helix model of DNA was proposed in 1953 by<\/p>","o":["Gregor Mendel","Charles Darwin and Alfred Russel Wallace","James Watson and Francis Crick","Alfred Hershey and Martha Chase"],"a":2,"s":"<p>Watson and Crick published the double-helix structure in 1953, using X-ray data from Rosalind Franklin and Maurice Wilkins.<br>Other options: A — founded genetics with his pea experiments in the 1860s; B — proposed evolution by natural selection; D — showed in 1952 that DNA is the genetic material, but did not propose its structure.<\/p>","tag":""},{"id":"4.6.6","q":"<p>The World Wide Web was invented in 1989 at CERN by<\/p>","o":["Tim Berners-Lee","Vint Cerf","Charles Babbage","Bill Gates"],"a":0,"s":"<p>Tim Berners-Lee proposed the World Wide Web (HTTP, HTML and URLs) at CERN in 1989.<br>Other options: B — co-designed the TCP/IP protocols of the internet; C — designed the Analytical Engine in the 19th century; D — co-founded Microsoft.<\/p>","tag":""},{"id":"4.6.7","q":"<p>In the binary convention traditionally used in computing, one kilobyte equals<\/p>","o":["1,000 bits","1,024 bytes","1,024 bits","8 bytes"],"a":1,"s":"<p>1 KB = 2¹⁰ = 1,024 bytes; each byte has 8 bits.<br>Other options: A — mixes bits and bytes; C — the unit is bytes, not bits; D — 8 is the number of bits in one byte.<\/p>","tag":""},{"id":"4.6.8","q":"<p>The speed of light in a vacuum is approximately<\/p>","o":["3 × 10⁸ m/s","3 × 10⁵ m/s","340 m/s","3 × 10⁶ m/s"],"a":0,"s":"<p>Light travels at about 300,000 km/s, i.e. 3 × 10⁸ m/s.<br>Other options: B — this is the value in km/s written wrongly as m/s; C — the approximate speed of sound in air; D — too small by a factor of 100.<\/p>","tag":""},{"id":"4.6.9","q":"<p>The most abundant gas in the earth's atmosphere is<\/p>","o":["oxygen","argon","nitrogen","carbon dioxide"],"a":2,"s":"<p>Dry air is about 78 per cent nitrogen, 21 per cent oxygen and about 1 per cent argon.<br>Other options: A — about 21 per cent; B — about 1 per cent; D — only about 0.04 per cent.<\/p>","tag":""},{"id":"4.6.10","q":"<p>Which blood group is known as the universal donor for red blood cells?<\/p>","o":["AB positive","A positive","O negative","B negative"],"a":2,"s":"<p>O negative red cells carry no A, B or Rh(D) antigens, so they can be given to patients of any group in emergencies.<br>Other options: A — the universal recipient; B — cannot be given to group B or O patients; D — cannot be given to group A or O patients.<\/p>","tag":""},{"id":"4.6.11","q":"<p>In 2017 the Government of Nepal declared which game as the national sport?<\/p>","o":["Volleyball","Dandi Biyo","Football","Cricket"],"a":0,"s":"<p>A cabinet decision in May 2017 declared volleyball Nepal's national sport because it is cheap and played across the country.<br>Other options: B — a traditional game long regarded informally as the national game; C — popular, but not the declared national sport; D — popular, but not the declared national sport.<\/p>","tag":""},{"id":"4.6.12","q":"<p>Nepal gained One Day International (ODI) status in cricket in<\/p>","o":["2018","2014","2010","2023"],"a":0,"s":"<p>Nepal earned ODI status on 15 March 2018 at the ICC World Cup Qualifier in Zimbabwe.<br>Other options: B — the year Nepal played its first ICC World T20; C — Nepal did not have ODI status then; D — Nepal already had ODI status.<\/p>","tag":""},{"id":"4.6.13","q":"<p>Nepal made its first appearance at the ICC Men's T20 World Cup in<\/p>","o":["2016, in India","2010, in the West Indies","2024, in the West Indies and USA","2014, in Bangladesh"],"a":3,"s":"<p>Nepal's first T20 World Cup was the 2014 edition in Bangladesh, where they beat Hong Kong and Afghanistan.<br>Other options: A — Nepal did not qualify for 2016; B — Nepal did not take part in 2010; C — Nepal played in 2024, but it was not their first appearance.<\/p>","tag":""},{"id":"4.6.14","q":"<p>At the 2023 Asian Games in Hangzhou, Dipendra Singh Airee broke Yuvraj Singh's record for the fastest T20 International fifty. How many balls did he take?<\/p>","o":["12","10","15","9"],"a":3,"s":"<p>Airee reached fifty off 9 balls against Mongolia, beating Yuvraj Singh's 12-ball fifty (2007).<br>Other options: A — Yuvraj Singh's earlier record; B — not the number of balls; C — not the number of balls.<\/p>","tag":""},{"id":"4.6.15","q":"<p>Nepal first took part in the Olympic Games in<\/p>","o":["1960 at Rome","1964 at Tokyo","1972 at Munich","1988 at Seoul"],"a":1,"s":"<p>Nepal made its Olympic debut at the 1964 Tokyo Summer Olympics.<br>Other options: A — Nepal did not take part in 1960; C — Nepal had already debuted; D — Nepal had already debuted; this was the Games of Bidhan Lama's bronze.<\/p>","tag":""},{"id":"4.6.16","q":"<p>Bidhan Lama won a bronze medal for Nepal at the 1988 Seoul Olympics, where it was a demonstration sport, in<\/p>","o":["boxing","judo","karate","taekwondo"],"a":3,"s":"<p>Bidhan Lama won bronze in taekwondo, then a demonstration sport, at Seoul 1988.<br>Other options: A — not Bidhan Lama's sport; B — not Bidhan Lama's sport; C — not Bidhan Lama's sport.<\/p>","tag":""},{"id":"4.6.17","q":"<p>The first modern Olympic Games were held in<\/p>","o":["Paris in 1900","Athens in 1896","London in 1896","Athens in 1900"],"a":1,"s":"<p>Revived by Pierre de Coubertin, the first modern Olympics were held in Athens in 1896.<br>Other options: A — the second modern Olympics; C — wrong host city; D — wrong year.<\/p>","tag":""},{"id":"4.6.18","q":"<p>The first FIFA World Cup in football was held in 1930 in<\/p>","o":["Brazil","Uruguay","Italy","France"],"a":1,"s":"<p>Uruguay hosted and won the first FIFA World Cup in 1930.<br>Other options: A — first hosted in 1950; C — hosted the second World Cup in 1934; D — hosted the third World Cup in 1938.<\/p>","tag":""},{"id":"4.6.19","q":"<p>Tenzing Norgay Sherpa and Edmund Hillary first reached the summit of Mount Everest on<\/p>","o":["29 May 1953","29 May 1952","16 May 1975","22 April 1993"],"a":0,"s":"<p>The first ascent was on 29 May 1953, by the British expedition led by John Hunt.<br>Other options: B — a Swiss expedition reached high on the mountain in 1952, but did not summit; C — the date Junko Tabei summited; D — the date Pasang Lhamu Sherpa summited.<\/p>","tag":""},{"id":"4.6.20","q":"<p>The first Nepali woman to climb Mount Everest (1993) was<\/p>","o":["Junko Tabei","Pasang Lhamu Sherpa","Lhakpa Sherpa","Maya Sherpa"],"a":1,"s":"<p>Pasang Lhamu Sherpa reached the summit on 22 April 1993 but died during the descent; she was declared a national hero.<br>Other options: A — the first woman ever to climb Everest (Japan, 1975); C — holds the women's record for most Everest ascents, but was not the first; D — a later Nepali woman climber, not the first.<\/p>","tag":""},{"id":"4.6.21","q":"<p>The Nobel Prizes were first awarded in<\/p>","o":["1895","1896","1901","1969"],"a":2,"s":"<p>Under Alfred Nobel's will (1895), the first prizes were given in 1901; the economics prize was added in 1968 and first given in 1969.<br>Other options: A — the year Nobel signed his will; B — the year Nobel died; D — the year the economics prize was first given.<\/p>","tag":""},{"id":"4.6.22","q":"<p>Which Nobel Prize category was NOT part of Alfred Nobel's original will?<\/p>","o":["Peace","Economic Sciences","Literature","Physiology or Medicine"],"a":1,"s":"<p>The Sveriges Riksbank Prize in Economic Sciences was created in 1968 by Sweden's central bank. Nobel's will named physics, chemistry, physiology or medicine, literature and peace.<br>Other options: A — named in the will; C — named in the will; D — named in the will.<\/p>","tag":""},{"id":"4.6.23","q":"<p>Mahabir Pun received the 2007 Ramon Magsaysay Award mainly for<\/p>","o":["using wireless technology to connect remote mountain villages to the internet","developing low-cost cataract surgery","leading the community forestry movement","founding a microfinance bank"],"a":0,"s":"<p>Mahabir Pun's Nepal Wireless Networking Project linked villages around Nangi, Myagdi, to the internet; he received the award for community leadership.<br>Other options: B — the work of Dr Sanduk Ruit (Magsaysay Award 2006); C — not the reason for his award; D — not the reason for his award.<\/p>","tag":""},{"id":"4.6.24","q":"<p>The Ramon Magsaysay Award, often called Asia's Nobel Prize, is presented by a foundation based in<\/p>","o":["Sweden","Norway","Japan","the Philippines"],"a":3,"s":"<p>The award is named after Ramon Magsaysay, a former President of the Philippines, and is presented in Manila.<br>Other options: A — home of the Nobel Prizes (except Peace); B — where the Nobel Peace Prize is presented; C — not the home of this award.<\/p>","tag":""},{"id":"4.6.25","q":"<p>'Shirishko Phool', which won the Madan Puraskar in 2022 BS, was written by<\/p>","o":["Diamond Shumsher Rana","Lil Bahadur Chettri","Parijat","B. P. Koirala"],"a":2,"s":"<p>Parijat (Bishnu Kumari Waiba) won the Madan Puraskar for the novel Shirishko Phool (The Blue Mimosa).<br>Other options: A — author of Seto Bagh; B — author of Basain; D — author of Sumnima and Teen Ghumti.<\/p>","tag":""},{"id":"4.6.26","q":"<p>The historical novel 'Seto Bagh' was written by<\/p>","o":["Parijat","Narayan Wagle","Buddhisagar","Diamond Shumsher Rana"],"a":3,"s":"<p>Seto Bagh, set in the Rana period, is Diamond Shumsher Rana's best-known novel.<br>Other options: A — author of Shirishko Phool; B — author of Palpasa Café; C — author of Karnali Blues.<\/p>","tag":""},{"id":"4.6.27","q":"<p>The novel 'Palpasa Café', set during the armed conflict and winner of the Madan Puraskar, was written by<\/p>","o":["Buddhisagar","Parijat","Narayan Wagle","Diamond Shumsher Rana"],"a":2,"s":"<p>Journalist Narayan Wagle's Palpasa Café won the Madan Puraskar.<br>Other options: A — author of Karnali Blues; B — author of Shirishko Phool; D — author of Seto Bagh.<\/p>","tag":""},{"id":"4.6.28","q":"<p>The novel 'Basain', about the hardships that force a hill family to migrate, was written by<\/p>","o":["Laxmi Prasad Devkota","Lil Bahadur Chettri","B. P. Koirala","Parijat"],"a":1,"s":"<p>Lil Bahadur Chettri's Basain is a classic of Nepali social realism.<br>Other options: A — a poet, known for Muna Madan; C — author of Sumnima; D — author of Shirishko Phool.<\/p>","tag":""},{"id":"4.6.29","q":"<p>The novel 'Sumnima' was written by<\/p>","o":["B. P. Koirala","Lil Bahadur Chettri","Laxmi Prasad Devkota","Narayan Wagle"],"a":0,"s":"<p>Sumnima, contrasting a Kirat girl and a Brahmin youth, is one of B. P. Koirala's novels.<br>Other options: B — author of Basain; C — a poet, known for Muna Madan; D — author of Palpasa Café.<\/p>","tag":""},{"id":"4.6.30","q":"<p>The Booker Prize is awarded for<\/p>","o":["investigative journalism","fiction written in English and published in the UK or Ireland","contributions to world peace","excellence in films"],"a":1,"s":"<p>The Booker Prize is a literary award for the best novel in English published in the UK or Ireland.<br>Other options: A — the Pulitzer Prize covers journalism; C — the Nobel Peace Prize; D — the Academy Awards (Oscars).<\/p>","tag":""}]}]}],"mock":[{"m":1,"secs":[{"t":"Section 1 · Quantitative Ability (25)","items":[{"id":"M1.1.1","q":"<p>What is the HCF of 72, 108 and 180?<\/p>","o":["36","18","12","72"],"a":0,"s":"<p>72 = 2³ × 3², 108 = 2² × 3³, 180 = 2² × 3² × 5. Take the lowest power of each common prime: 2² × 3² = 36.<br>Other options: B — 18 is a common factor but not the highest one; C — 12 is a common factor but not the highest one; D — 72 does not divide 108.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M1.1.2","q":"<p>What is the unit digit of 3⁶⁵?<\/p>","o":["9","7","3","1"],"a":2,"s":"<p>The unit digits of powers of 3 repeat in the cycle 3, 9, 7, 1. 65 ÷ 4 leaves remainder 1, so the unit digit is the first in the cycle: 3.<br>Other options: A — this is the unit digit of 3⁶⁶ (remainder 2); B — this is the unit digit of 3⁶⁷ (remainder 3); D — this is the unit digit when the power is a multiple of 4.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M1.1.3","q":"<p>What is the smallest number that must be added to 2000 to make it exactly divisible by 48?<\/p>","o":["16","32","8","20"],"a":0,"s":"<p>48 × 41 = 1968 and 2000 − 1968 = 32, so the remainder is 32. The next multiple is 48 × 42 = 2016, so 2016 − 2000 = 16 must be added.<br>Other options: B — 2000 ÷ 48 leaves remainder 32; that is the number to subtract, not add; C — 2008 is not divisible by 48; D — 2020 is not divisible by 48.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M1.1.4","q":"<p>Find the value of 1/(√1 + √2) + 1/(√2 + √3) + 1/(√3 + √4) + … + 1/(√99 + √100).<\/p>","o":["10","99","9","11"],"a":2,"s":"<p>Rationalise each term: 1/(√k + √(k+1)) = √(k+1) − √k. The sum telescopes to √100 − √1 = 10 − 1 = 9.<br>Other options: A — this is √100, forgetting to subtract √1; B — this counts the number of terms, not their sum; D — this adds √1 instead of subtracting it.<\/p>","tag":"2.1 Number system, HCF/LCM and simplification"},{"id":"M1.1.5","q":"<p>When a number is increased by 25 per cent, it becomes 375. What is the number?<\/p>","o":["281.25","350","300","312.5"],"a":2,"s":"<p>1.25 × N = 375, so N = 375 ÷ 1.25 = 300.<br>Other options: A — this subtracts 25% of 375 instead of dividing by 1.25; B — this subtracts 25 instead of 25 per cent; D — this divides by 1.2 instead of 1.25.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M1.1.6","q":"<p>An article marked at Rs 4,000 is sold after two successive discounts of 25% and 20%. What is the selling price?<\/p>","o":["Rs 1,800","Rs 2,200","Rs 3,000","Rs 2,400"],"a":3,"s":"<p>SP = 4000 × 0.75 × 0.80 = Rs 2,400. Successive discounts are not added; 25% and 20% equal a single discount of 40%.<br>Other options: A — this takes a single 55% discount; B — this adds the discounts to 45%; C — this applies only the first discount.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M1.1.7","q":"<p>What is the compound interest on Rs 12,500 at 8% per annum for 2 years, compounded annually?<\/p>","o":["Rs 2,000","Rs 2,160","Rs 1,040","Rs 2,080"],"a":3,"s":"<p>Amount = 12500 × (1.08)² = 12500 × 1.1664 = 14,580. CI = 14,580 − 12,500 = Rs 2,080.<br>Other options: A — this is the simple interest; B — this uses 8.64% each year; C — this is half the correct interest.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M1.1.8","q":"<p>A shopkeeper buys pens at 12 for Rs 100 and sells them at 10 for Rs 100. What is his profit percentage?<\/p>","o":["16.67%","2%","20%","25%"],"a":2,"s":"<p>CP of one pen = 100/12 = Rs 8.33; SP of one pen = 100/10 = Rs 10. Profit % = (10 − 8.33) ÷ 8.33 × 100 = 20%. Shortcut: (12 − 10)/10 × 100 = 20%.<br>Other options: A — this divides the profit by the selling price instead of the cost price; B — this subtracts the counts 12 − 10 directly; D — this divides the 2 extra pens by 8 instead of 10.<\/p>","tag":"2.2 Percentage, profit and loss, interest"},{"id":"M1.1.9","q":"<p>A sum is divided among A, B and C in the ratio 2 : 3 : 5. C gets Rs 1,500 more than A. What is the total sum?<\/p>","o":["Rs 3,000","Rs 7,500","Rs 2,500","Rs 5,000"],"a":3,"s":"<p>C − A = 5 − 2 = 3 parts = Rs 1,500, so 1 part = Rs 500. Total = 10 parts = Rs 5,000.<br>Other options: A — this is twice the difference, not the whole sum; B — this takes one part as Rs 750; C — this is C's share, not the total.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M1.1.10","q":"<p>The average of six numbers is 30. The average of the first four is 25. What is the average of the last two?<\/p>","o":["35","80","40","27.5"],"a":2,"s":"<p>Sum of six = 6 × 30 = 180. Sum of first four = 4 × 25 = 100. Sum of last two = 80, so their average = 40.<br>Other options: A — this is the average of 30 and 40, a confusion of averages; B — this is the sum of the last two, not their average; D — this averages 25 and 30.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M1.1.11","q":"<p>In what ratio must water be mixed with milk costing Rs 60 per litre to get a mixture worth Rs 50 per litre?<\/p>","o":["1 : 5","5 : 1","1 : 6","1 : 4"],"a":0,"s":"<p>Water costs Rs 0. By alligation, water : milk = (60 − 50) : (50 − 0) = 10 : 50 = 1 : 5.<br>Other options: B — this reverses the ratio (milk : water); C — this is water to the whole mixture; D — this is an arithmetic slip in the alligation.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M1.1.12","q":"<p>The sum of the present ages of a father and his son is 50 years. Five years ago, the father was 7 times as old as the son. What is the father's present age?<\/p>","o":["35 years","40 years","45 years","42 years"],"a":1,"s":"<p>Let the son be s. Then (50 − s − 5) = 7(s − 5), so 45 − s = 7s − 35, 8s = 80, s = 10. Father = 50 − 10 = 40 years.<br>Other options: A — this is the father's age five years ago; C — this does not fit: the son would be 5 and was 0 five years ago; D — this does not satisfy the second condition.<\/p>","tag":"2.3 Ratio, averages, mixtures, partnership and ages"},{"id":"M1.1.13","q":"<p>A can finish a piece of work in 20 days. He works on it for 5 days and B then finishes the rest in 9 days. In how many days can B alone do the whole work?<\/p>","o":["15 days","9 days","18 days","12 days"],"a":3,"s":"<p>In 5 days A does 5/20 = 1/4. B does the remaining 3/4 in 9 days, so B alone needs 9 ÷ (3/4) = 12 days.<br>Other options: A — this treats B's 9 days as covering 3/5 of the work; B — this is the time B took for only three-quarters of the work; C — this assumes B did half the work in 9 days.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M1.1.14","q":"<p>A tap can fill a tank in 4 hours and an outlet can empty the full tank in 6 hours. Both are opened when the tank is half full. How long will it take to fill the tank completely?<\/p>","o":["6 hours","12 hours","3 hours","2.4 hours"],"a":0,"s":"<p>Net rate = 1/4 − 1/6 = 1/12 of the tank per hour. Half the tank needs (1/2) ÷ (1/12) = 6 hours.<br>Other options: B — this is the time to fill an empty tank; C — this halves the time again by mistake; D — this adds the rates instead of subtracting them.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M1.1.15","q":"<p>A car covers the first 120 km at 60 km/h and the next 180 km at 45 km/h. What is its average speed for the whole journey?<\/p>","o":["52.5 km/h","50 km/h","51.4 km/h","48 km/h"],"a":1,"s":"<p>Time = 120/60 + 180/45 = 2 + 4 = 6 hours. Average speed = 300 km ÷ 6 h = 50 km/h.<br>Other options: A — this is the simple average of the two speeds; C — this is the harmonic mean, which applies only to equal distances; D — this is an arithmetic slip in the total time.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M1.1.16","q":"<p>A train 240 m long crosses a bridge 360 m long in 30 seconds. What is the speed of the train?<\/p>","o":["43.2 km/h","28.8 km/h","72 km/h","20 km/h"],"a":2,"s":"<p>Distance = 240 + 360 = 600 m in 30 s, i.e. 20 m/s. 20 × 18/5 = 72 km/h.<br>Other options: A — this uses only the length of the bridge; B — this uses only the length of the train; D — this is the speed in m/s written as km/h.<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M1.1.17","q":"<p>A boat takes three times as long to go upstream as to go the same distance downstream. If its speed in still water is 16 km/h, what is the speed of the stream?<\/p>","o":["4 km/h","5.33 km/h","6 km/h","8 km/h"],"a":3,"s":"<p>Same distance, so speeds are in the inverse ratio of times: 16 + s = 3(16 − s). Then 4s = 32, s = 8 km/h.<br>Other options: A — this divides the boat speed by 4 instead of 2; B — this divides 16 by 3; C — this does not satisfy (16 + s) = 3(16 − s).<\/p>","tag":"2.4 Time and work, pipes, speed and distance"},{"id":"M1.1.18","q":"<p>Solve: 5(x − 2) − 3(x + 1) = 7<\/p>","o":["x = 10","x = 7","x = 5","x = 3"],"a":0,"s":"<p>5x − 10 − 3x − 3 = 7, so 2x − 13 = 7, 2x = 20, x = 10.<br>Other options: B — this drops the −3 from −3(x + 1); C — this solves 2x = 10 after a sign slip; D — this forgets to multiply the brackets out.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M1.1.19","q":"<p>What is the product of the roots of 3x² + 5x − 12 = 0?<\/p>","o":["4","−4","−5/3","−12"],"a":1,"s":"<p>For ax² + bx + c = 0, the product of the roots is c/a = −12/3 = −4.<br>Other options: A — the sign is wrong; the product is c/a = −12/3; C — this is the sum of the roots (−b/a); D — this forgets to divide by a = 3.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M1.1.20","q":"<p>A trapezium has parallel sides of 14 cm and 22 cm, and the distance between them is 9 cm. What is its area?<\/p>","o":["324 cm²","162 cm²","198 cm²","126 cm²"],"a":1,"s":"<p>Area = ½ × (14 + 22) × 9 = 18 × 9 = 162 cm².<br>Other options: A — this forgets the factor ½; C — this multiplies only the longer side by the height; D — this multiplies only the shorter side by the height.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M1.1.21","q":"<p>If log x + log (x − 3) = 1 (logarithms to base 10), what is x?<\/p>","o":["−2","10","Both 5 and −2","5"],"a":3,"s":"<p>log [x(x − 3)] = 1, so x² − 3x = 10, x² − 3x − 10 = 0, (x − 5)(x + 2) = 0. Since x and x − 3 must be positive, x = 5.<br>Other options: A — log of a negative number is not defined, so this root is rejected; B — this ignores the second logarithm; C — −2 must be rejected because log(−2) does not exist.<\/p>","tag":"2.5 Algebra, geometry and mensuration"},{"id":"M1.1.22","q":"<p>Study the table and answer: total production in 2023 is what percentage more than in 2021?<br>Production of a company (thousand units)<\/p><div class=\"tw\"><table><thead><tr><th>Product<\/th><th>2021<\/th><th>2022<\/th><th>2023<\/th><\/tr><\/thead><tbody><tr><td>Shoes<\/td><td>40<\/td><td>50<\/td><td>60<\/td><\/tr><tr><td>Bags<\/td><td>25<\/td><td>30<\/td><td>45<\/td><\/tr><tr><td>Belts<\/td><td>35<\/td><td>40<\/td><td>45<\/td><\/tr><\/tbody><\/table><\/div>","o":["33.33%","50%","150%","45%"],"a":1,"s":"<p>Total 2021 = 40 + 25 + 35 = 100; total 2023 = 60 + 45 + 45 = 150. Increase = 50 on 100 = 50%.<br>Other options: A — this divides the increase by the 2023 total; C — this is 2023 as a percentage of 2021, not the increase; D — this is an arithmetic slip in the totals.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M1.1.23","q":"<p>Using the same table (Shoes 40, 50, 60; Bags 25, 30, 45; Belts 35, 40, 45 thousand units in 2021, 2022, 2023), which product had the highest percentage growth from 2021 to 2023?<\/p>","o":["Shoes","Belts","All grew by the same percentage","Bags"],"a":3,"s":"<p>Shoes: 20/40 = 50%. Bags: 20/25 = 80%. Belts: 10/35 ≈ 28.6%. Bags grew the most in percentage terms.<br>Other options: A — Shoes grew by the most units (20) but only 50%; B — Belts grew by only 10/35 ≈ 28.6%; C — the growth rates are 50%, 80% and 28.6%.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M1.1.24","q":"<p>A number is picked at random from 1 to 30. What is the probability that it is a multiple of 3 or of 5?<\/p>","o":["7/15","8/15","1/2","2/5"],"a":0,"s":"<p>Multiples of 3: 10; of 5: 6; of both (15, 30): 2. Favourable = 10 + 6 − 2 = 14. Probability = 14/30 = 7/15.<br>Other options: B — this adds 10 + 6 without removing the 2 numbers counted twice; C — this is a guess; 14 of the 30 numbers qualify, not 15; D — this ignores the multiples of 5 that are not multiples of 3.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"},{"id":"M1.1.25","q":"<p>A committee of 4 is to be chosen from 6 men and 4 women. In how many ways can it be done if the committee must include at least one woman?<\/p>","o":["210","195","15","225"],"a":1,"s":"<p>Total ways = C(10, 4) = 210. All-men committees = C(6, 4) = 15. At least one woman = 210 − 15 = 195.<br>Other options: A — this is the total with no restriction; C — this is the number of all-men committees, which must be excluded; D — this adds the all-men committees instead of subtracting them.<\/p>","tag":"2.6 Data interpretation, sets, counting, probability and statistics"}]},{"t":"Section 2 · Verbal Ability (25)","items":[{"id":"M1.2.1","q":"<p>Choose the word closest in meaning to ERUDITE.<\/p>","o":["learned","rude","arrogant","eloquent"],"a":0,"s":"<p>Erudite means having or showing great knowledge gained from study, i.e. learned.<br>Other options: B — a sound-alike trap; erudite has nothing to do with rudeness; C — a learned person may or may not be arrogant; D — eloquent means fluent in speech, not scholarly.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.2.2","q":"<p>Choose the word most nearly opposite in meaning to JUBILANT.<\/p>","o":["joyful","dejected","youthful","furious"],"a":1,"s":"<p>Jubilant means extremely happy and triumphant; its opposite is dejected (sad and low in spirits).<br>Other options: A — this is a synonym, not an antonym; C — unrelated in meaning; D — angry is not the opposite of joyful; sad is.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.2.3","q":"<p>Choose the word closest in meaning to LETHARGIC.<\/p>","o":["energetic","sluggish","irritable","cautious"],"a":1,"s":"<p>Lethargic means drowsy, slow and lacking energy, i.e. sluggish.<br>Other options: A — this is the opposite; C — means easily annoyed, not slow; D — means careful, not lacking energy.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.2.4","q":"<p>Choose the word most nearly opposite in meaning to CONCEDE.<\/p>","o":["admit","surrender","grant","contest"],"a":3,"s":"<p>To concede is to admit or yield (a point, a defeat). Its opposite is to contest, i.e. to dispute or fight against it.<br>Other options: A — this is a synonym of concede; B — close in meaning to concede (give way); C — to grant a point is to concede it.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.2.5","q":"<p>In which sentence is the word \"principle\" used correctly?<\/p>","o":["The principle of our school retired last year.","He repaid the principle amount of the loan.","Biratnagar is a principle city of eastern Nepal.","She refused to lie, as a matter of principle."],"a":3,"s":"<p>\"Principle\" is a noun meaning a fundamental rule or belief. \"Principal\" means chief, the head of a school, or the capital sum of a loan.<br>Other options: A — the head of a school is a \"principal\"; B — the main sum of a loan is the \"principal\"; C — \"chief\" or \"main\" is \"principal\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.2.6","q":"<p>Choose the word that best completes the sentence: \"The auditor's report was so ___ that it left no room for doubt.\"<\/p>","o":["ambiguous","tentative","unequivocal","cursory"],"a":2,"s":"<p>\"Left no room for doubt\" needs a word meaning clear and unambiguous: unequivocal.<br>Other options: A — an ambiguous report would leave doubt; B — tentative means uncertain, the opposite of what is needed; D — a hasty, superficial report would not remove doubt.<\/p>","tag":"1.2 Sentence completion"},{"id":"M1.2.7","q":"<p>Fill in the blank: \"She is very good ___ solving puzzles.\"<\/p>","o":["in","at","on","with"],"a":1,"s":"<p>The idiom for skill in an activity is \"good at\" (good at solving, good at maths).<br>Other options: A — \"good in\" is not the standard idiom for a skill; C — wrong preposition; D — \"good with\" is used for people or tools (good with children), not for activities like solving.<\/p>","tag":"1.2 Sentence completion"},{"id":"M1.2.8","q":"<p>Fill in the blank: \"If he had left home on time, he ___ the flight.\"<\/p>","o":["would have caught","would catch","will catch","had caught"],"a":0,"s":"<p>A past unreal condition (third conditional) takes \"if + had + past participle\" and \"would have + past participle\".<br>Other options: B — this is the second conditional, for present or future situations; C — this is the first conditional; D — the past perfect belongs in the if-clause, not the main clause.<\/p>","tag":"1.2 Sentence completion"},{"id":"M1.2.9","q":"<p>Choose the pair that best completes the sentence: \"The new manager was ___ by nature, yet in a crisis she could be surprisingly ___.\"<\/p>","o":["reckless, daring","timid, hesitant","cautious, bold","careless, slow"],"a":2,"s":"<p>\"Yet\" and \"surprisingly\" signal a contrast between her normal nature and her behaviour in a crisis: cautious by nature, but bold in a crisis.<br>Other options: A — \"yet … surprisingly\" needs a contrast; these words agree; B — again no contrast; D — no contrast, and \"careless by nature\" does not fit a surprise.<\/p>","tag":"1.2 Sentence completion"},{"id":"M1.2.10","q":"<p>Choose the word that best completes the sentence: \"After years of complaints, the government ___ the old rule, so it no longer applies.\"<\/p>","o":["revoked","revived","reinforced","reiterated"],"a":0,"s":"<p>\"No longer applies\" requires a word meaning cancelled or withdrawn: revoked.<br>Other options: B — reviving would bring the rule back into force; C — this would strengthen the rule; D — repeating a rule does not stop it applying.<\/p>","tag":"1.2 Sentence completion"},{"id":"M1.2.11","q":"<p>Which part of the sentence contains an error?<br>\"The number of applicants / have increased / sharply this year.\"<\/p>","o":["The number of applicants","have increased","sharply this year","No error"],"a":1,"s":"<p>\"The number of\" takes a singular verb because the subject is \"number\": \"The number of applicants has increased\". (Compare \"A number of applicants have applied\".)<br>Other options: A — this part is correct; C — this part is correct; D — there is an error in the verb.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.2.12","q":"<p>Which part of the sentence contains an error?<br>\"He as well as his brothers / are planning / to start a business.\"<\/p>","o":["He as well as his brothers","are planning","to start a business","No error"],"a":1,"s":"<p>With \"as well as\", the verb agrees with the first subject (\"He\"): \"He as well as his brothers is planning…\".<br>Other options: A — the subject phrase is correct; C — this part is correct; D — there is an agreement error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.2.13","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["She has fewer friends than her sister.","Although he was tired, but he continued working.","Between you and I, the plan will fail.","He made me to wait for an hour."],"a":0,"s":"<p>\"Fewer\" is used with countable nouns (friends), so the sentence is correct.<br>Other options: B — \"although\" and \"but\" should not be used together; C — after a preposition the object pronoun is needed: \"between you and me\"; D — \"make\" takes the bare infinitive: \"made me wait\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.2.14","q":"<p>Which part of the sentence contains an error?<br>\"I have seen him / at the bank / yesterday afternoon.\"<\/p>","o":["I have seen him","at the bank","yesterday afternoon","No error"],"a":0,"s":"<p>A finished past time (yesterday afternoon) needs the simple past, not the present perfect: \"I saw him at the bank yesterday afternoon.\"<br>Other options: B — this part is correct; C — the time phrase is fine; it is the tense that clashes with it; D — there is a tense error.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"p":"<p><b>Passage 1<\/b><br>Loyalty programmes have become a familiar part of shopping, from supermarket points cards to airline frequent-flyer schemes. Their stated purpose is to reward repeat customers, but their real value to firms often lies elsewhere. Every swipe of a card records what was bought, when and at what price, giving the retailer a detailed picture of each customer's habits. This information lets firms send tailored offers, decide which products to stock and even set prices store by store. Yet the evidence that such schemes create genuine loyalty is mixed. When every competitor offers a similar card, shoppers simply carry several and go wherever the deal is best, so the rewards become a cost of doing business rather than a source of advantage. Programmes also tend to reward customers who would have returned anyway, while doing little to attract new ones. The firms that gain most, studies suggest, are those that treat the programme less as a discount scheme and more as a way to understand customers and improve the service they receive.<\/p>"},{"id":"M1.2.15","q":"<p>(Passage 1) Which statement best expresses the main idea of the passage?<\/p>","o":["Loyalty programmes should be abolished because they only add to costs.","Loyalty programmes are often more valuable for the customer information they provide than for the loyalty they create.","Airline schemes are more successful than supermarket schemes.","Shoppers dislike carrying loyalty cards."],"a":1,"s":"<p>The passage says the \"real value\" of the schemes lies in the data they collect, while their effect on loyalty is \"mixed\".<br>Other options: A — too extreme; the passage says some firms gain from them; C — the passage makes no such comparison; D — the passage says shoppers carry several cards, not that they dislike them.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.2.16","q":"<p>(Passage 1) According to the passage, why can the rewards become \"a cost of doing business\"?<\/p>","o":["Competitors offer similar cards, so shoppers hold several and follow the best deal.","Collecting data about customers is very expensive.","Most customers never redeem their points.","The law prevents firms from setting prices store by store."],"a":0,"s":"<p>The passage states that when every competitor offers a similar card, shoppers \"carry several and go wherever the deal is best\", so the rewards give no advantage.<br>Other options: B — the passage does not discuss the cost of data; C — not mentioned in the passage; D — the passage says firms do set prices store by store.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.2.17","q":"<p>(Passage 1) The author would most likely advise a retailer to<\/p>","o":["raise the value of its rewards until they beat every rival's.","stop collecting data about purchases.","use the information from its programme to understand customers and improve its service.","offer its card only to new customers."],"a":2,"s":"<p>The last sentence says the firms that gain most treat the programme \"as a way to understand customers and improve the service they receive\".<br>Other options: A — this is the discount approach the passage says brings little advantage; B — the passage presents the data as the main benefit; D — nothing in the passage suggests this.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.2.18","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Within a few months, her sales had doubled.<br>Q. Rina began selling homemade pickles to her neighbours.<br>R. Encouraged, she opened a small shop near the bus park.<br>S. Word of their taste soon spread across the town.<\/p>","o":["QSPR","QPSR","SQPR","QSRP"],"a":0,"s":"<p>Q introduces Rina and the pickles; S tells how word spread; P gives the result (sales doubled); R follows (\"Encouraged, she opened a shop\").<br>Other options: B — sales cannot double before word of the pickles spreads; C — S refers to \"their taste\", so the pickles must be mentioned first (Q); D — \"Encouraged\" in R refers to the doubled sales in P, so P must come before R.<\/p>","tag":"1.5 Para jumbles"},{"id":"M1.2.19","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. However, they also lower the return that savers earn on their deposits.<br>Q. Central banks often cut interest rates to encourage borrowing.<br>R. Cheaper loans can lead firms to invest and households to spend more.<br>S. Policymakers must therefore weigh the gains for borrowers against the costs for savers.<\/p>","o":["QPRS","RQPS","QRPS","QRSP"],"a":2,"s":"<p>Q states the action, R its benefit, P the drawback (\"However\"), and S the conclusion (\"therefore\").<br>Other options: A — the benefit (R) should come before the \"However\" drawback (P); B — R's \"cheaper loans\" depends on the rate cut introduced in Q; D — S's \"therefore\" sums up both sides, so it must come last.<\/p>","tag":"1.5 Para jumbles"},{"id":"M1.2.20","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. The first step is to define the problem clearly.<br>Q. Finally, the chosen option is put into action and its results are reviewed.<br>R. Decision-making is often described as a series of steps.<br>S. Next, several possible solutions are listed and compared.<\/p>","o":["PRSQ","RSPQ","RPQS","RPSQ"],"a":3,"s":"<p>R introduces the topic; then the steps follow in order: first (P), next (S), finally (Q).<br>Other options: A — \"The first step\" needs the idea of steps introduced by R; B — \"Next\" (S) cannot come before \"The first step\" (P); C — \"Finally\" (Q) must be the last step.<\/p>","tag":"1.5 Para jumbles"},{"id":"M1.2.21","q":"<p>Choose the correct meaning of the idiom \"to hit the nail on the head\".<\/p>","o":["to hurt oneself by accident","to work very hard on a task","to lose one's temper","to describe exactly what is causing a situation or problem"],"a":3,"s":"<p>To hit the nail on the head is to say something exactly right, precisely identifying the point.<br>Other options: A — a literal reading of the idiom; B — this is closer to \"keep one's nose to the grindstone\"; C — unrelated.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M1.2.22","q":"<p>Choose the correct meaning of the idiom \"at the eleventh hour\".<\/p>","o":["late at night","after a delay of eleven hours","at the last possible moment","much too early"],"a":2,"s":"<p>\"At the eleventh hour\" means at the latest possible time, just before it is too late.<br>Other options: A — a literal reading of \"hour\"; B — a literal reading; D — the opposite of the meaning.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M1.2.23","q":"<p>Choose the one word for: \"One who knows everything.\"<\/p>","o":["omnipotent","omnipresent","omnivorous","omniscient"],"a":3,"s":"<p>Omniscient (omni = all, scient = knowing) means knowing everything.<br>Other options: A — means all-powerful; B — means present everywhere; C — means eating all kinds of food.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M1.2.24","q":"<p>Choose the one word for: \"A place where birds are kept.\"<\/p>","o":["apiary","aquarium","granary","aviary"],"a":3,"s":"<p>An aviary (Latin avis, bird) is a large enclosure for keeping birds.<br>Other options: A — a place where bees are kept; B — a tank for fish; C — a store for grain.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M1.2.25","q":"<p>Choose the word that completes the analogy. Painter : Brush :: Surgeon : ?<\/p>","o":["Hospital","Patient","Scalpel","Operation"],"a":2,"s":"<p>A brush is the main tool of a painter; a scalpel is the main tool of a surgeon.<br>Other options: A — this is a workplace, not a tool; B — this is the person treated, not a tool; D — this is the activity, not the tool.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"}]},{"t":"Section 3 · Logical Reasoning (25)","items":[{"id":"M1.3.1","q":"<p>Find the next term: 5, 11, 23, 47, 95, ?<\/p>","o":["190","189","191","143"],"a":2,"s":"<p>Each term = previous × 2 + 1: 95 × 2 + 1 = 191.<br>Other options: A — this doubles without adding 1; B — this subtracts 1 instead of adding; D — this adds 48, continuing the differences wrongly.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M1.3.2","q":"<p>Find the next term: 4, 9, 19, 34, 54, ?<\/p>","o":["74","84","79","69"],"a":2,"s":"<p>The differences are 5, 10, 15, 20, so the next difference is 25: 54 + 25 = 79.<br>Other options: A — this adds 20 again instead of 25; B — this adds 30, skipping a step; D — this adds 15.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M1.3.3","q":"<p>Find the next letter: B, E, H, K, N, ?<\/p>","o":["Q","P","R","O"],"a":0,"s":"<p>Each letter moves 3 places forward: B(2), E(5), H(8), K(11), N(14), Q(17).<br>Other options: B — this adds 2 instead of 3; C — this adds 4; D — this adds 1.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M1.3.4","q":"<p>7 : 50 :: 9 : ?<\/p>","o":["81","82","80","90"],"a":1,"s":"<p>7² + 1 = 50, so 9² + 1 = 82.<br>Other options: A — this is 9², forgetting to add 1; C — this subtracts 1 instead of adding; D — no consistent rule gives 90.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M1.3.5","q":"<p>Which number is the odd one out: 121, 169, 289, 243?<\/p>","o":["243","121","169","289"],"a":0,"s":"<p>121, 169 and 289 are squares of the primes 11, 13 and 17. 243 = 3⁵ is not a perfect square.<br>Other options: B — 121 = 11², a square of a prime like the others; C — 169 = 13², a square of a prime; D — 289 = 17², a square of a prime.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M1.3.6","q":"<p>If MANGO is coded as OCPIQ, how is APPLE coded?<\/p>","o":["BQQMF","CRRNG","CQQMF","CRRMG"],"a":1,"s":"<p>Each letter moves 2 places forward (M→O, A→C, N→P, G→I, O→Q). So A→C, P→R, P→R, L→N, E→G: CRRNG.<br>Other options: A — this shifts each letter by 1, not 2; C — this shifts only the first letter by 2; D — L shifted by 2 is N, not M.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.7","q":"<p>If TRAVEL is coded as ARTLEV, how is SECOND coded?<\/p>","o":["DNOCES","CESOND","CESDNO","ECSNDO"],"a":2,"s":"<p>The word is split into two halves and each half is reversed: TRA|VEL → ART|LEV. So SEC|OND → CES|DNO = CESDNO.<br>Other options: A — this reverses the whole word; B — this reverses only the first half; D — this swaps letters within pairs.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.8","q":"<p>If each letter is given its position in the alphabet (A = 1, B = 2, …) and a word's code is the sum of its letters, CAB = 6. What is the code for FACE?<\/p>","o":["14","16","12","15"],"a":3,"s":"<p>F(6) + A(1) + C(3) + E(5) = 15. (Check: C 3 + A 1 + B 2 = 6.)<br>Other options: A — one letter value is miscounted; B — F is taken as 7 by mistake; C — E is counted as 2 by mistake.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.9","q":"<p>In a code language, \"mi ko la\" means \"work is worship\", \"la ta pe\" means \"worship gives peace\" and \"ko ta su\" means \"work gives joy\". What is the code for \"is\"?<\/p>","o":["ko","mi","la","ta"],"a":1,"s":"<p>\"work\" is in sentences 1 and 3 → ko. \"worship\" is in sentences 1 and 2 → la. The remaining word in sentence 1 is \"is\" → mi.<br>Other options: A — \"ko\" is common to the 1st and 3rd sentences, so it means \"work\"; C — \"la\" is common to the 1st and 2nd sentences, so it means \"worship\"; D — \"ta\" means \"gives\", from the 2nd and 3rd sentences.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.10","q":"<p>A is the brother of B. B is the daughter of C. D is the father of C. How is A related to D?<\/p>","o":["Son","Nephew","Grandfather","Grandson"],"a":3,"s":"<p>A and B are children of C, and A is male (brother). D is C's father, so A is D's grandson.<br>Other options: A — A is the child of C, not of D; B — a nephew would be a sibling's child; C — the relation is the other way round.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.11","q":"<p>Pointing to a girl in a photograph, Mohan says, \"Her father is the only son of my father.\" How is the girl related to Mohan?<\/p>","o":["Daughter","Sister","Niece","Cousin"],"a":0,"s":"<p>The only son of Mohan's father is Mohan himself, so the girl's father is Mohan: she is his daughter.<br>Other options: B — her father would then be Mohan's father, not his son; C — Mohan has no brother, since he is his father's only son; D — her father would have to be Mohan's uncle.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.12","q":"<p>A man walks 8 km east, turns left and walks 6 km, then turns left again and walks 8 km. How far and in which direction is he from his starting point?<\/p>","o":["6 km south","6 km north","10 km north-east","14 km north"],"a":1,"s":"<p>East 8 km, left (north) 6 km, left (west) 8 km. The east and west legs cancel, leaving him 6 km north of the start.<br>Other options: A — after turning left from east he goes north, not south; C — this is his position before the last leg; D — this adds 8 and 6 wrongly.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.13","q":"<p>Ravi is facing south. He turns 90° anticlockwise and walks 5 km, then turns 135° clockwise. Which direction is he facing now?<\/p>","o":["North-west","South-east","North-east","South-west"],"a":3,"s":"<p>Anticlockwise 90° from south is east. Clockwise 135° from east passes south (90°) and reaches south-west (135°).<br>Other options: A — this turns 135° anticlockwise from east; B — this turns only 45° from east; C — this turns the wrong way from the start.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.14","q":"<p>In a row of 35 children, Bina is 13th from the left. Chandra is 5 places to the right of Bina. What is Chandra's position from the right end?<\/p>","o":["17th","23rd","18th","19th"],"a":2,"s":"<p>Chandra is 13 + 5 = 18th from the left. From the right: 35 − 18 + 1 = 18th.<br>Other options: A — forgets the \"+1\" in (total − position + 1); B — this is Bina's position from the right; D — adds 1 twice in (total − position + 1).<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M1.3.15","q":"<p>(Puzzle 1) Six friends P, Q, R, S, T and U sit in a straight row facing north. S and T sit at the two ends. U sits third to the left of R. P sits immediately to the left of R. T sits immediately to the right of R.<br>Who sits third from the left end?<\/p>","o":["Q","U","P","S"],"a":0,"s":"<p>T is immediately right of R and at an end, so T is 6th and R 5th; P is 4th; U (third to the left of R) is 2nd; S is 1st. Q fills the 3rd place. Order: S U Q P R T.<br>Other options: B — U is second from the left; C — P is fourth from the left; D — S is at the extreme left.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M1.3.16","q":"<p>(Puzzle 1) How many persons sit between S and R?<\/p>","o":["Three","Two","Four","One"],"a":0,"s":"<p>Order S U Q P R T: U, Q and P sit between S and R, i.e. three persons.<br>Other options: B — U, Q and P all sit between them; C — T is to the right of R, not between; D — miscounts the order S U Q P R T.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M1.3.17","q":"<p>(Puzzle 1) Who sits immediately to the left of Q?<\/p>","o":["P","U","S","T"],"a":1,"s":"<p>Order S U Q P R T: U is immediately to the left of Q.<br>Other options: A — P is to the right of Q; C — S is two places to the left of Q; D — T is at the right end.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M1.3.18","q":"<p>Statements: All pens are tools. Some tools are costly.<br>Conclusions: I. Some pens are costly. II. Some costly things are tools.<\/p>","o":["Only I follows","Both I and II follow","Neither I nor II follows","Only II follows"],"a":3,"s":"<p>\"Some tools are costly\" converts to \"Some costly things are tools\", so II follows. The costly tools may all be non-pens, so I does not follow.<br>Other options: A — the costly tools need not include any pens; B — I does not follow; C — II follows by converting \"Some tools are costly\".<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M1.3.19","q":"<p>Statements: No teacher is a lawyer. All lawyers are speakers.<br>Conclusions: I. Some speakers are not teachers. II. No speaker is a teacher.<\/p>","o":["Only II follows","Both I and II follow","Only I follows","Neither I nor II follows"],"a":2,"s":"<p>All lawyers are speakers and no lawyer is a teacher, so the speakers who are lawyers are not teachers: some speakers are not teachers (I). Other speakers may be teachers, so II does not follow.<br>Other options: A — speakers who are not lawyers may well be teachers; B — II does not follow; D — I follows.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M1.3.20","q":"<p>Statement: The bank has extended its opening hours to 7 p.m. on weekdays.<br>Assumptions: I. Some customers find it difficult to visit the bank during the old hours. II. Other banks in the area will close down.<\/p>","o":["Only I is implicit","Only II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":0,"s":"<p>Extending hours presumes there is demand from customers who cannot come during the old hours (I). The decision says nothing about other banks (II).<br>Other options: B — nothing suggests that rivals will close; C — II is not assumed; D — the decision makes sense only if longer hours meet a need, so I is assumed.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M1.3.21","q":"<p>Statement: Every employee who completes the safety course receives a certificate. Hari has received the certificate.<br>Conclusions: I. Hari completed the safety course. II. Hari is an employee.<\/p>","o":["Only I follows","Neither I nor II follows","Only II follows","Both I and II follow"],"a":1,"s":"<p>The statement says course completion → certificate. Getting the certificate does not prove completion or employment, since others may also receive it (affirming the consequent).<br>Other options: A — the statement does not say that only course finishers get the certificate; C — non-employees might also receive certificates; D — this reverses the \"if … then\" relation.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M1.3.22","q":"<p>What is the angle between the hour and minute hands of a clock at 2:30?<\/p>","o":["90°","120°","75°","105°"],"a":3,"s":"<p>Angle = |30H − 5.5M| = |60 − 165| = 105°.<br>Other options: A — this ignores the hour hand moving past 2; B — this measures from 2 to 6 only; C — this subtracts in the wrong direction.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.23","q":"<p>1 January 2000 was a Saturday. What day of the week was 1 January 2001?<\/p>","o":["Sunday","Tuesday","Saturday","Monday"],"a":3,"s":"<p>2000 was a leap year (divisible by 400), giving 366 days = 2 odd days. Saturday + 2 = Monday.<br>Other options: A — this adds only one odd day, but 2000 was a leap year; B — this adds three odd days; C — a year always shifts the day.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.24","q":"<p>Districts with more health posts have lower child mortality. So building more health posts will reduce child mortality. Which of the following, if true, most weakens this argument?<\/p>","o":["Each health post employs at least two nurses.","Districts with more health posts are also richer and have better roads, water supply and literacy.","Child mortality has fallen in Nepal over the past twenty years.","A health post costs less to build than a hospital."],"a":1,"s":"<p>If the districts with more health posts differ in wealth, water and literacy, those factors could explain the lower mortality, so the health posts may not be the cause.<br>Other options: A — this neither supports nor weakens the causal claim much; C — a general trend does not test the link; D — cost is irrelevant to whether health posts cause lower mortality.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.25","q":"<p>Data sufficiency. Question: What is the two-digit number?<br>I. The sum of its digits is 9.<br>II. The tens digit is twice the units digit.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["I alone is sufficient","II alone is sufficient","Both I and II together are needed","Neither I nor II, even together, is sufficient"],"a":2,"s":"<p>From II, t = 2u; with I, 3u = 9, so u = 3, t = 6: the number is 63. Neither statement alone fixes it.<br>Other options: A — 18, 27, 36, … all have digit sum 9; B — 21, 42, 63 and 84 all fit; D — together they give a single number.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"}]},{"t":"Section 4 · General Awareness (25)","items":[{"id":"M1.4.1","q":"<p>The Shah kingdom of Gorkha was founded in 1559 by<\/p>","o":["Ram Shah","Prithvi Narayan Shah","Drabya Shah","Nara Bhupal Shah"],"a":2,"s":"<p>Drabya Shah, a younger son of the ruler of Lamjung, captured Gorkha and founded the Shah kingdom there in 1559 (1616 BS).<br>Other options: A — a later king of Gorkha, known for his reforms; B — he began the unification of Nepal in the 18th century; D — the father of Prithvi Narayan Shah.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M1.4.2","q":"<p>The Treaty of Betrawati (1792) ended Nepal's war with<\/p>","o":["the British East India Company","Sikkim","Tibet and Qing China","the kingdom of Kumaon"],"a":2,"s":"<p>After Nepal's wars with Tibet, a Qing (Chinese) army advanced towards Nuwakot; the Treaty of Betrawati in 1792 ended the Sino-Nepalese war.<br>Other options: A — that war ended with the Treaty of Sugauli (1816); B — not the party to this treaty; D — Kumaon was conquered by Nepal in 1790 and was not a party to this treaty.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M1.4.3","q":"<p>Which of the following is NOT one of the four martyrs (Sahid) executed by the Rana regime in 1941 (1997 BS)?<\/p>","o":["Shukraraj Shastri","Gangalal Shrestha","Dashrath Chand","B.P. Koirala"],"a":3,"s":"<p>The four martyrs are Shukraraj Shastri, Dharmabhakta Mathema, Gangalal Shrestha and Dashrath Chand. B.P. Koirala later became Nepal's first elected Prime Minister (1959).<br>Other options: A — he is one of the four martyrs; B — he is one of the four martyrs; C — he is one of the four martyrs.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M1.4.4","q":"<p>According to tradition, which Malla king started the custom of Gai Jatra to console his queen after the death of their son?<\/p>","o":["Jayasthiti Malla","Yaksha Malla","Pratap Malla","Bhupatindra Malla"],"a":2,"s":"<p>Tradition holds that Pratap Malla of Kantipur began the procession to show the grieving queen that many families had lost loved ones.<br>Other options: A — known for social and caste organisation; B — after him the valley was divided into three kingdoms; D — the Bhaktapur king who built the Nyatapola.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M1.4.5","q":"<p>Tilicho Lake, one of the highest lakes of its size in the world, is in which district?<\/p>","o":["Mustang","Dolpa","Solukhumbu","Manang"],"a":3,"s":"<p>Tilicho Lake (about 4,919 m) lies in Manang district, in the Annapurna region.<br>Other options: A — Tilicho is close to the Mustang border but lies in Manang; B — Dolpa has Shey Phoksundo, not Tilicho; C — Solukhumbu has the Gokyo lakes.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M1.4.6","q":"<p>Annapurna I, the first peak above 8,000 m ever climbed, was first summited in 1950 by an expedition from<\/p>","o":["the United Kingdom","France","Switzerland","Japan"],"a":1,"s":"<p>A French expedition led by Maurice Herzog reached the summit of Annapurna I on 3 June 1950.<br>Other options: A — the British expedition climbed Everest in 1953; C — Swiss climbers made the first ascent of Dhaulagiri (1960); D — Japanese climbers made the first ascent of Manaslu (1956).<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M1.4.7","q":"<p>The Kulekhani reservoir hydropower project is located in which district?<\/p>","o":["Dhading","Makwanpur","Sindhuli","Nuwakot"],"a":1,"s":"<p>The Kulekhani dam and reservoir (Indra Sarobar) are in Makwanpur district; it is Nepal's best-known storage-type hydropower scheme.<br>Other options: A — not the site of Kulekhani; C — not the site of Kulekhani; D — Nuwakot has the Trishuli projects.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M1.4.8","q":"<p>Limpiyadhura, Lipulek and Kalapani, shown inside Nepal on the revised official map issued in 2020, lie in which district?<\/p>","o":["Baitadi","Bajhang","Humla","Darchula"],"a":3,"s":"<p>These areas, at the north-western tip of Nepal near the source of the Mahakali, belong to Darchula district of Sudurpashchim Province.<br>Other options: A — south of Darchula; B — east of Darchula; C — in Karnali Province.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M1.4.9","q":"<p>Article 4 of the Constitution of Nepal describes the State of Nepal. Which of the following is NOT among the characteristics it lists?<\/p>","o":["Secular","Socialism-oriented","Inclusive","Hindu kingdom"],"a":3,"s":"<p>Article 4 describes Nepal as an independent, indivisible, sovereign, secular, inclusive, democratic, socialism-oriented, federal democratic republican state. It is no longer a kingdom.<br>Other options: A — Article 4 describes Nepal as secular; B — Article 4 includes this; C — Article 4 includes this.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M1.4.10","q":"<p>The right to information is guaranteed by which Article of the Constitution of Nepal?<\/p>","o":["Article 27","Article 17","Article 30","Article 46"],"a":0,"s":"<p>Article 27 gives every citizen the right to demand and receive information on matters of their own or public interest.<br>Other options: B — Article 17 is the right to freedom; C — Article 30 is the right to a clean environment; D — Article 46 is the right to constitutional remedy.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M1.4.11","q":"<p>Under Article 76, the federal Council of Ministers may have at most how many ministers, including the Prime Minister?<\/p>","o":["25","21","30","35"],"a":0,"s":"<p>Article 76(9) limits the Council of Ministers to 25 ministers including the Prime Minister.<br>Other options: B — not the constitutional limit; C — not the constitutional limit; D — not the constitutional limit.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M1.4.12","q":"<p>What is the minimum age to become a member of the National Assembly (Rastriya Sabha)?<\/p>","o":["25 years","30 years","45 years","35 years"],"a":3,"s":"<p>Article 87 requires a member of the National Assembly to have completed 35 years of age.<br>Other options: A — the minimum age for the House of Representatives; B — not a requirement in the Constitution; C — the minimum age for the President.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M1.4.13","q":"<p>Rastriya Banijya Bank, Nepal's largest fully government-owned commercial bank, was established in<\/p>","o":["1937","1956","1966","1984"],"a":2,"s":"<p>Rastriya Banijya Bank was established on 23 January 1966 (Magh 10, 2022 BS) under the RBB Act.<br>Other options: A — the year Nepal Bank Limited was set up; B — the year Nepal Rastra Bank was set up; D — the year Nepal Arab Bank (now Nabil) was set up.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M1.4.14","q":"<p>Which enterprise, established in Biratnagar in 1936, is generally regarded as Nepal's first large-scale industry?<\/p>","o":["Janakpur Cigarette Factory","Biratnagar Jute Mills","Hetauda Cement Industries","Bansbari Leather and Shoe Factory"],"a":1,"s":"<p>Biratnagar Jute Mills (1936, 1993 BS) is regarded as the start of large-scale modern industry in Nepal.<br>Other options: A — a later state enterprise; C — set up much later; D — set up much later, with Chinese help.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M1.4.15","q":"<p>Who was the first Governor of Nepal Rastra Bank (1956–1961)?<\/p>","o":["Himalaya Shumsher J.B. Rana","Yadav Prasad Pant","Kul Shekhar Sharma","Lakshmi Nath Gautam"],"a":0,"s":"<p>Himalaya Shumsher J.B. Rana served as the first Governor from NRB's founding on 26 April 1956 to February 1961.<br>Other options: B — a later governor; C — a later governor; D — a later governor.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M1.4.16","q":"<p>Which state-owned enterprise imports and distributes petroleum products in Nepal?<\/p>","o":["Nepal Oil Corporation","Salt Trading Corporation","Nepal Electricity Authority","National Trading Limited"],"a":0,"s":"<p>Nepal Oil Corporation is the state enterprise responsible for importing, storing and distributing petroleum products.<br>Other options: B — trades salt and other essentials; C — handles electricity; D — a general state trading company.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M1.4.17","q":"<p>The Charter of the United Nations was signed on 26 June 1945 in<\/p>","o":["New York","London","Yalta","San Francisco"],"a":3,"s":"<p>The Charter was signed at the San Francisco Conference on 26 June 1945 and came into force on 24 October 1945.<br>Other options: A — the UN headquarters, but the Charter was signed elsewhere; B — the first General Assembly met in London in 1946; C — the Yalta Conference (February 1945) planned the UN but did not sign the Charter.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M1.4.18","q":"<p>Nepal has served as a non-permanent member of the UN Security Council in<\/p>","o":["1969–70 and 1988–89","1955–56 and 1975–76","1999–2000 only","It has never served on the Council"],"a":0,"s":"<p>Nepal was elected to the Security Council twice, for 1969–70 and 1988–89 (Ministry of Foreign Affairs of Nepal).<br>Other options: B — Nepal joined the UN only in December 1955 and did not serve in these years; C — not one of Nepal's terms; D — Nepal has served two terms.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M1.4.19","q":"<p>Lake Baikal, the deepest lake in the world, is in<\/p>","o":["Canada","Tanzania","Russia","the United States"],"a":2,"s":"<p>Lake Baikal in Siberia, Russia, is about 1,640 m deep and holds the largest volume of fresh water of any lake.<br>Other options: A — Canada has the Great Lakes (shared with the USA); B — Lake Tanganyika, the second deepest, is shared by Tanzania and others; D — Crater Lake is the deepest in the USA, far shallower.<\/p>","tag":"4.5 World: international organisations, geography and firsts"
