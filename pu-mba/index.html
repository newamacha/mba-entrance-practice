; D — a compiler of dictionaries.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"},{"id":"M3.2.25","q":"<p>Choose the word that completes the analogy. Optimist : Hopeful :: Pessimist : ?<\/p>","o":["Cheerful","Careful","Gloomy","Lucky"],"a":2,"s":"<p>An optimist is typically hopeful; a pessimist is typically gloomy.<br>Other options: A — describes an optimist, not a pessimist; B — unrelated to the outlook; D — unrelated to the outlook.<\/p>","tag":"1.6 Idioms, one-word substitution and analogies"}]},{"t":"Section 3 · Logical Reasoning (25)","items":[{"id":"M3.3.1","q":"<p>Find the next term: 2, 12, 36, 80, 150, ?<\/p>","o":["222","216","252","245"],"a":2,"s":"<p>The terms are n³ + n²: 1 + 1, 8 + 4, 27 + 9, 64 + 16, 125 + 25. The next is 216 + 36 = 252.<br>Other options: A — this adds 72 (the last difference + 2); B — this is 6³ only, forgetting to add 6²; D — this continues the differences wrongly.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M3.3.2","q":"<p>Find the next term: 100, 96, 88, 76, 60, ?<\/p>","o":["44","40","36","42"],"a":1,"s":"<p>The differences are −4, −8, −12, −16, so the next is −20: 60 − 20 = 40.<br>Other options: A — this subtracts 16 again; C — this subtracts 24; D — this subtracts 18.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M3.3.3","q":"<p>Find the next letter: Z, W, T, Q, ?<\/p>","o":["N","O","M","P"],"a":0,"s":"<p>Each letter moves 3 places back: Z, W, T, Q, N.<br>Other options: B — this moves back 2 instead of 3; C — this moves back 4; D — this moves back 1.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M3.3.4","q":"<p>25 : 125 :: 36 : ?<\/p>","o":["1296","180","144","216"],"a":3,"s":"<p>25 = 5² and 125 = 5³. Likewise 36 = 6², so the answer is 6³ = 216.<br>Other options: A — this squares 36 instead of cubing 6; B — this multiplies by 5 as in the first pair; C — this multiplies by 4.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M3.3.5","q":"<p>Which one is the odd one out: Rhombus, Square, Rectangle, Triangle?<\/p>","o":["Triangle","Rhombus","Square","Rectangle"],"a":0,"s":"<p>A rhombus, a square and a rectangle all have four sides; a triangle has three.<br>Other options: B — a quadrilateral like the others; C — a quadrilateral like the others; D — a quadrilateral like the others.<\/p>","tag":"3.1 Series, analogy and odd one out"},{"id":"M3.3.6","q":"<p>If FISH is written as EHRG, how is DOGS written in the same code?<\/p>","o":["EPHT","CNGR","CNFR","BMEQ"],"a":2,"s":"<p>Each letter moves one place back (F→E, I→H, S→R, H→G). So D→C, O→N, G→F, S→R: CNFR.<br>Other options: A — this moves each letter forward instead of back; B — G should become F; D — this moves each letter back by 2.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.7","q":"<p>In a code, each letter of a word is replaced by the next letter of the alphabet and then the order of the letters is reversed. How is PLAN written?<\/p>","o":["QMBO","OBMQ","NALP","MZKO"],"a":1,"s":"<p>PLAN → QMBO (each letter +1) → reversed: OBMQ.<br>Other options: A — this forgets to reverse the order; C — this only reverses the word; D — this moves each letter back instead of forward.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.8","q":"<p>If × means −, − means +, + means ÷ and ÷ means ×, what is the value of 20 + 4 × 3 − 6 ÷ 2?<\/p>","o":["14","16","−10","29"],"a":0,"s":"<p>Replacing the symbols: 20 ÷ 4 − 3 + 6 × 2 = 5 − 3 + 12 = 14.<br>Other options: B — this works from left to right, ignoring BODMAS; C — this keeps − as subtraction instead of replacing it with +; D — this works the expression out with the original signs.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.9","q":"<p>In a code language, \"tom ka pe\" means \"eat fresh fruits\", \"ka da ri\" means \"fresh green leaves\" and \"ri su pe\" means \"buy green fruits\". What is the code for \"leaves\"?<\/p>","o":["ka","ri","su","da"],"a":3,"s":"<p>\"fresh\" (sentences 1 and 2) = ka; \"green\" (sentences 2 and 3) = ri. The remaining word in sentence 2, \"leaves\", is da.<br>Other options: A — \"ka\" is in the 1st and 2nd sentences, so it means \"fresh\"; B — \"ri\" is in the 2nd and 3rd sentences, so it means \"green\"; C — \"su\" means \"buy\" in the 3rd sentence.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.10","q":"<p>M is the son of N. N is the sister of O. O is the father of P. How is M related to P?<\/p>","o":["Brother","Nephew","Uncle","Cousin"],"a":3,"s":"<p>N and O are siblings. M is N's son and P is O's child, so M and P are cousins.<br>Other options: A — M's parent is N, not O; B — P's parent O is M's uncle, so M and P are of the same generation; C — M is not a sibling of P's parent.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.11","q":"<p>Introducing a man, Sunita says, \"His wife is the only daughter of my father.\" How is the man related to Sunita?<\/p>","o":["Brother","Husband","Brother-in-law","Father"],"a":1,"s":"<p>The only daughter of Sunita's father is Sunita herself, so the man's wife is Sunita: he is her husband.<br>Other options: A — then his wife would not be the daughter of Sunita's father; C — Sunita is the only daughter, so the wife must be Sunita herself; D — the man is married to the daughter, not her father.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.12","q":"<p>Kiran walks 20 m north, turns left and walks 30 m, turns left again and walks 20 m, then turns right and walks 10 m. How far and in which direction is he from his starting point?<\/p>","o":["40 m west","30 m west","40 m north","20 m west"],"a":0,"s":"<p>North 20, west 30, south 20, then right (from south) is west 10. The north-south legs cancel; west 30 + 10 = 40 m west.<br>Other options: B — this leaves out the last 10 m; C — the north and south legs cancel; D — this subtracts the last 10 m.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.13","q":"<p>A girl is facing north-west. She turns 90° clockwise, then 180° anticlockwise, then 45° clockwise. Which direction is she facing now?<\/p>","o":["East","West","South-west","North"],"a":1,"s":"<p>North-west = 315°. +90° → 45° (north-east). −180° → 225° (south-west). +45° → 270° (west).<br>Other options: A — this turns the first 90° anticlockwise; C — this leaves out the last 45° turn; D — this is a slip in adding up the turns.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.14","q":"<p>Asha scored more than Bina but less than Chet. Dipa scored less than Bina. Esha scored more than Chet. Who scored the second highest?<\/p>","o":["Esha","Asha","Bina","Chet"],"a":3,"s":"<p>Order from highest: Esha > Chet > Asha > Bina > Dipa. Chet is second.<br>Other options: A — Esha scored the highest; B — Asha is third; C — Bina is fourth.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M3.3.15","q":"<p>(Puzzle 1) Hari, Ishan, Jyoti, Kamal and Leela live on the five floors of a building, one on each floor (floor 1 is the lowest, floor 5 the highest). Jyoti lives on an even-numbered floor. Kamal lives on the floor immediately above Jyoti. Hari lives on a higher floor than Ishan. Leela lives on a floor next to Jyoti's. Ishan does not live on floor 1.<br>Who lives on floor 1?<\/p>","o":["Ishan","Leela","Jyoti","Hari"],"a":1,"s":"<p>If Jyoti were on floor 4, Kamal would be on 5, Leela on 3, and Hari above Ishan would put Ishan on floor 1, which is ruled out. So Jyoti is on 2, Kamal on 3, Leela on 1 (next to Jyoti), Ishan on 4 and Hari on 5.<br>Other options: A — Ishan does not live on floor 1; C — Jyoti lives on floor 2; D — Hari lives above Ishan, on floor 5.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M3.3.16","q":"<p>(Puzzle 1) Who lives on the floor immediately below Hari?<\/p>","o":["Kamal","Ishan","Jyoti","Nobody; Hari lives on floor 1"],"a":1,"s":"<p>Floors 1–5: Leela, Jyoti, Kamal, Ishan, Hari. Ishan (floor 4) is immediately below Hari (floor 5).<br>Other options: A — Kamal lives on floor 3; C — Jyoti lives on floor 2; D — Hari lives on floor 5.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M3.3.17","q":"<p>(Puzzle 1) How many people live between Leela and Kamal?<\/p>","o":["None","Two","Three","One"],"a":3,"s":"<p>Leela is on floor 1 and Kamal on floor 3; only Jyoti (floor 2) lives between them.<br>Other options: A — Jyoti lives between them; B — only Jyoti lives between floors 1 and 3; C — this counts up to Hari.<\/p>","tag":"3.4 Seating arrangement, ranking and puzzles"},{"id":"M3.3.18","q":"<p>Statements: All mangoes are fruits. No fruit is a vegetable.<br>Conclusions: I. No mango is a vegetable. II. Some vegetables are mangoes.<\/p>","o":["Only II follows","Both I and II follow","Neither I nor II follows","Only I follows"],"a":3,"s":"<p>Mangoes lie inside fruits, and fruits do not overlap vegetables, so no mango is a vegetable (I). II is then false.<br>Other options: A — II contradicts I; B — II does not follow; C — I follows directly.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M3.3.19","q":"<p>Statements: Some books are novels. Some novels are films.<br>Conclusions: I. Some books are films. II. No book is a film.<\/p>","o":["Only I follows","Only II follows","Either I or II follows","Neither I nor II follows"],"a":2,"s":"<p>Neither conclusion is certain on its own, but \"some books are films\" and \"no book is a film\" cannot both be false, so either I or II follows.<br>Other options: A — I is possible but not certain; B — II is possible but not certain; D — I and II form a complementary pair, so one of them must be true.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M3.3.20","q":"<p>Statement: Several students fainted during the morning assembly because of the heat.<br>Courses of action: I. The school should hold the assembly in a shaded place or earlier in the morning. II. The school should be closed permanently.<\/p>","o":["Only I follows","Only II follows","Both I and II follow","Neither I nor II follows"],"a":0,"s":"<p>A suitable course of action removes the problem in a practical way (I). Permanent closure (II) is out of proportion.<br>Other options: B — closing the school is an extreme, impractical response; C — II does not follow; D — I is a practical way to solve the problem.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M3.3.21","q":"<p>Statement: An advertisement says, \"Enrol in our English course to improve your job prospects.\"<br>Assumptions: I. Good English can help people get jobs. II. Everybody who takes the course will certainly get a job.<\/p>","o":["Only II is implicit","Both I and II are implicit","Only I is implicit","Neither I nor II is implicit"],"a":2,"s":"<p>The advertisement assumes English skills help in getting jobs (I), but not that everyone will get one (II).<br>Other options: A — \"improve your prospects\" does not mean a guaranteed job; B — II is not assumed; D — the advertisement makes sense only if English helps in finding work.<\/p>","tag":"3.5 Syllogisms, statements and assumptions"},{"id":"M3.3.22","q":"<p>How many times do the hands of a clock form a right angle in 12 hours?<\/p>","o":["22","24","44","12"],"a":0,"s":"<p>The hands are at right angles twice every hour, except around 3 o'clock and 9 o'clock, where one occurrence is shared. So in 12 hours there are 24 − 2 = 22.<br>Other options: B — this assumes twice every hour; C — this is the number in a full day of 24 hours; D — this assumes once every hour.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.23","q":"<p>15 August 2025 was a Friday. What day of the week was 15 August 2024?<\/p>","o":["Wednesday","Saturday","Thursday","Friday"],"a":2,"s":"<p>From 15 August 2024 to 15 August 2025 there are 365 days (February 2025 has 28 days), i.e. 1 odd day. So 15 August 2024 was one day before Friday: Thursday.<br>Other options: A — this treats the year in between as a leap year (2 odd days); B — this moves forward instead of back; D — a year always shifts the day.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.24","q":"<p>A café owner says that offering free Wi-Fi increased her sales, because sales rose by 25 per cent in the six months after she introduced it. Which of the following, if true, most strengthens her claim?<\/p>","o":["Many of her customers own smartphones.","Free Wi-Fi costs her very little each month.","Nothing else changed at the café during those months, and sales at nearby cafés stayed flat.","A new college opened next door during the same period."],"a":2,"s":"<p>Ruling out other changes (and showing that rivals did not grow) makes it more likely that the Wi-Fi caused the increase.<br>Other options: A — this makes Wi-Fi useful but does not show it caused the sales rise; B — cost is irrelevant to the cause of the sales rise; D — this offers another cause and weakens the claim.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.25","q":"<p>Data sufficiency. Question: Is the number x positive?<br>I. x³ > 0<br>II. x² > 0<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["II alone is sufficient","I alone is sufficient","Both I and II together are needed","Neither I nor II, even together, is sufficient"],"a":1,"s":"<p>A cube keeps the sign of the number, so x³ > 0 means x > 0. II only tells us that x ≠ 0.<br>Other options: A — x² > 0 holds for both x = 2 and x = −2; C — I alone already settles it; D — I is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"}]},{"t":"Section 4 · General Awareness (25)","items":[{"id":"M3.4.1","q":"<p>Who wrote the first biography of Bhanubhakta Acharya and did much to popularise his Ramayana?<\/p>","o":["Lekhnath Paudyal","Balkrishna Sama","Motiram Bhatta","Laxmi Prasad Devkota"],"a":2,"s":"<p>Motiram Bhatta wrote Bhanubhakta's biography and published his Ramayana in the late 19th century, making Bhanubhakta widely known.<br>Other options: A — honoured as \"Kavi Shiromani\"; B — a leading playwright; D — the \"Mahakavi\", author of \"Muna Madan\".<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M3.4.2","q":"<p>The stone Krishna Mandir in Patan Durbar Square was built in 1637 by<\/p>","o":["Pratap Malla","Bhupatindra Malla","Siddhinarasimha Malla","Yaksha Malla"],"a":2,"s":"<p>King Siddhinarasimha Malla of Lalitpur (Patan) built the shikhara-style Krishna Mandir in 1637.<br>Other options: A — a king of Kantipur; B — a king of Bhaktapur; D — an earlier king of the united valley.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M3.4.3","q":"<p>Nepal's first Constituent Assembly was elected in<\/p>","o":["1959","2013","1990","2008"],"a":3,"s":"<p>The first Constituent Assembly election was held on 10 April 2008; the second followed in November 2013.<br>Other options: A — the year of Nepal's first general election to Parliament; B — the year the second Constituent Assembly was elected; C — the year of the People's Movement that restored multiparty democracy.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M3.4.4","q":"<p>Mani Rimdu, a festival held at monasteries such as Tengboche, is mainly associated with the<\/p>","o":["Sherpa community","Tharu community","Newar community","Magar community"],"a":0,"s":"<p>Mani Rimdu is a Buddhist festival of masked dances celebrated by the Sherpas of the Everest region.<br>Other options: B — Terai people with festivals such as Maghi; C — Kathmandu Valley festivals such as Indra Jatra; D — not the community linked to Mani Rimdu.<\/p>","tag":"4.1 History and culture of Nepal"},{"id":"M3.4.5","q":"<p>The Bagmati river rises at Bagdwar in which hills north of Kathmandu?<\/p>","o":["Phulchoki","Chandragiri","Shivapuri","Nagarkot"],"a":2,"s":"<p>The Bagmati originates at Bagdwar in the Shivapuri hills (Shivapuri Nagarjun National Park).<br>Other options: A — south-east of the valley; B — south-west of the valley; D — east of the valley.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M3.4.6","q":"<p>Which of the following is a natural (not cultural) World Heritage Site in Nepal?<\/p>","o":["Lumbini","Sagarmatha National Park","Pashupatinath","Changunarayan"],"a":1,"s":"<p>Nepal's two natural World Heritage Sites are Sagarmatha National Park and Chitwan National Park.<br>Other options: A — a cultural site; C — part of the Kathmandu Valley cultural site; D — part of the Kathmandu Valley cultural site.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M3.4.7","q":"<p>Phewa Lake is located in which district?<\/p>","o":["Tanahun","Syangja","Lamjung","Kaski"],"a":3,"s":"<p>Phewa Lake lies in Pokhara, Kaski district, in Gandaki Province.<br>Other options: A — east of Kaski; B — south of Kaski; C — north-east of Kaski.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M3.4.8","q":"<p>Mount Kanchenjunga lies in which district of Nepal?<\/p>","o":["Sankhuwasabha","Solukhumbu","Ilam","Taplejung"],"a":3,"s":"<p>Kanchenjunga is in Taplejung district in Koshi Province, protected by the Kanchenjunga Conservation Area.<br>Other options: A — home of Makalu; B — home of Everest; C — a hill district famous for tea.<\/p>","tag":"4.2 Geography and environment of Nepal"},{"id":"M3.4.9","q":"<p>Under Article 129, apart from the Chief Justice, the Supreme Court can have at most how many other judges?<\/p>","o":["20","14","25","10"],"a":0,"s":"<p>Article 129(1) provides for a Chief Justice and a maximum of twenty other judges.<br>Other options: B — not the constitutional limit; C — not the constitutional limit; D — not the constitutional limit.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M3.4.10","q":"<p>The Judicial Council, which recommends the appointment and transfer of judges, is chaired by the<\/p>","o":["Prime Minister","Chief Justice of Nepal","President","Minister for Law and Justice"],"a":1,"s":"<p>Under Article 153, the Judicial Council is chaired by the Chief Justice.<br>Other options: A — chairs the Constitutional Council; C — not a member of the Judicial Council; D — a member, not the chair.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M3.4.11","q":"<p>Under Article 114, the President may issue an ordinance<\/p>","o":["only during a state of emergency","when both Houses of the Federal Parliament are not in session","at any time, even when Parliament is in session","only with the approval of the Supreme Court"],"a":1,"s":"<p>Article 114 allows the President, on the recommendation of the Council of Ministers, to issue an ordinance when both Houses are not in session.<br>Other options: A — emergencies are covered by Article 273, a separate power; C — ordinances are allowed only when Parliament is not in session; D — no such approval is required.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M3.4.12","q":"<p>Which Schedule of the Constitution of Nepal lists the exclusive powers of the federation?<\/p>","o":["Schedule 5","Schedule 6","Schedule 7","Schedule 8"],"a":0,"s":"<p>Schedule 5 sets out the exclusive federal powers (defence, foreign affairs, central bank and so on).<br>Other options: B — lists provincial powers; C — lists concurrent federal and provincial powers; D — lists local-level powers.<\/p>","tag":"4.3 Constitution of Nepal 2072, polity and governance"},{"id":"M3.4.13","q":"<p>Tribhuvan University, Nepal's first university, was established in<\/p>","o":["1959","1918","1985","1991"],"a":0,"s":"<p>Tribhuvan University was established in 1959 (2016 BS).<br>Other options: B — the year Tri-Chandra College was founded; C — Nepal Television's founding year; not TU's; D — the year Kathmandu University was founded.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M3.4.14","q":"<p>Nepal became a member of the International Monetary Fund in<\/p>","o":["1955","1961","2004","1966"],"a":1,"s":"<p>Nepal joined the IMF on 6 September 1961 (IMF membership list).<br>Other options: A — the year Nepal joined the United Nations; C — the year Nepal joined the WTO; D — the year Nepal became a founding member of the ADB.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M3.4.15","q":"<p>Nepal's largest inland container depot (dry port), linked by rail to the Indian ports, is at<\/p>","o":["Biratnagar","Birgunj","Bhairahawa","Kakarbhitta"],"a":1,"s":"<p>The Sirsiya inland container depot at Birgunj, linked by rail to Raxaul and on to Kolkata and Haldia, handles the bulk of Nepal's container trade.<br>Other options: A — has a smaller dry port; C — has a smaller dry port; D — a border crossing in the far east.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M3.4.16","q":"<p>Nepal's first national tourism promotion campaign, \"Visit Nepal\", was held in<\/p>","o":["1998","2011","2020","1985"],"a":0,"s":"<p>Visit Nepal Year 1998 was the first such campaign; the Nepal Tourism Board was set up the same year.<br>Other options: B — the year of \"Nepal Tourism Year 2011\"; C — \"Visit Nepal 2020\" was a later campaign; D — no national campaign was held that year.<\/p>","tag":"4.4 Economy of Nepal and national organisations"},{"id":"M3.4.17","q":"<p>The headquarters of the United Nations Environment Programme (UNEP) is in<\/p>","o":["Geneva","Nairobi","Rome","Vienna"],"a":1,"s":"<p>UNEP, founded in 1972, is headquartered in Nairobi, Kenya.<br>Other options: A — home of the WHO and other agencies; C — home of the FAO; D — home of the IAEA.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M3.4.18","q":"<p>The Maastricht Treaty (1992) is associated with the creation of the<\/p>","o":["North Atlantic Treaty Organization","Association of Southeast Asian Nations","European Union","Organization of the Petroleum Exporting Countries"],"a":2,"s":"<p>The Maastricht Treaty, signed in 1992 and in force from 1993, established the European Union.<br>Other options: A — founded in 1949; B — founded in 1967 by the Bangkok Declaration; D — founded in 1960 in Baghdad.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M3.4.19","q":"<p>Which is the largest island in the world?<\/p>","o":["Australia","Borneo","Madagascar","Greenland"],"a":3,"s":"<p>Greenland, about 2.17 million km², is the world's largest island.<br>Other options: A — usually classed as a continent, not an island; B — the third largest island; C — the fourth largest island.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M3.4.20","q":"<p>The headquarters of Interpol is in<\/p>","o":["Geneva","The Hague","Lyon","Brussels"],"a":2,"s":"<p>Interpol's General Secretariat is in Lyon, France.<br>Other options: A — not Interpol's headquarters; B — home of the International Court of Justice and Europol; D — home of NATO and the EU institutions.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M3.4.21","q":"<p>Who was the first woman to travel into space, in 1963?<\/p>","o":["Sally Ride","Kalpana Chawla","Junko Tabei","Valentina Tereshkova"],"a":3,"s":"<p>The Soviet cosmonaut Valentina Tereshkova flew on Vostok 6 in June 1963.<br>Other options: A — the first American woman in space (1983); B — an Indian-born astronaut who first flew in 1997; C — the first woman to climb Everest.<\/p>","tag":"4.5 World: international organisations, geography and firsts"},{"id":"M3.4.22","q":"<p>What is the pH of pure water at 25 °C?<\/p>","o":["0","14","7","1"],"a":2,"s":"<p>Pure water is neutral, with a pH of 7 at 25 °C.<br>Other options: A — a strongly acidic value; B — a strongly basic value; D — a strongly acidic value.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M3.4.23","q":"<p>Which is the largest planet in the solar system?<\/p>","o":["Jupiter","Saturn","Neptune","Earth"],"a":0,"s":"<p>Jupiter is the largest planet, more than 300 times the mass of the Earth.<br>Other options: B — the second largest; C — much smaller than Jupiter; D — the largest rocky planet, but far smaller than Jupiter.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M3.4.24","q":"<p>How many players of one team are on the court at a time in a standard game of volleyball?<\/p>","o":["5","7","6","11"],"a":2,"s":"<p>Each volleyball team has six players on the court.<br>Other options: A — the number in basketball; B — the number in netball and handball; D — the number in football and cricket.<\/p>","tag":"4.6 Science and technology, sports, awards and books"},{"id":"M3.4.25","q":"<p>The Madan Puraskar-winning novel \"Seto Dharti\" was written by<\/p>","o":["Buddhisagar","Narayan Wagle","Parijat","Amar Neupane"],"a":3,"s":"<p>\"Seto Dharti\" (2012), about a child widow's life, is by Amar Neupane and won the Madan Puraskar.<br>Other options: A — wrote \"Karnali Blues\"; B — wrote \"Palpasa Café\"; C — wrote \"Shirishko Phool\".<\/p>","tag":"4.6 Science and technology, sports, awards and books"}]}]}]};
const B = DATA.bank, L = 'ABCDE';
const store = {
  get(k){ try{ const v = localStorage.getItem(B.key+':'+k); return v===null?null:+v }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(B.key+':'+k, v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(B.key+':'+k) }catch(e){} }
};
const mem = {};
const pick = id => (id in mem) ? mem[id] : store.get(id);
const $ = s => document.querySelector(s);
const qsOf = items => items.filter(x => x.id);

const sel = $('#set');
const og1 = document.createElement('optgroup'); og1.label = 'Chapters';
DATA.ch.forEach(c => og1.append(new Option(`Chapter ${c.n} · ${c.t} (${c.subs.reduce((a,b)=>a+qsOf(b.items).length,0)})`, 'ch'+c.n)));
const og2 = document.createElement('optgroup'); og2.label = `Mock exams (${B.mockInfo})`;
DATA.mock.forEach(m => og2.append(new Option(`Mock exam ${m.m}`, 'mock'+m.m)));
sel.append(og1, og2);

let cur = null;
function route(){
  const h = location.hash.slice(1);
  let m = h.match(/^ch(\d+)-(\d)$/), k = h.match(/^mock(\d)$/);
  if (k && DATA.mock[k[1]-1]) return show('mock', +k[1]);
  if (!m || !DATA.ch[m[1]-1] || !DATA.ch[m[1]-1].subs[m[2]-1]) m = [0, 1, 1];
  show('ch', +m[1], +m[2]);
}
function go(h){ if (location.hash !== '#'+h) location.hash = h; else route(); }
sel.onchange = () => go(sel.value.startsWith('ch') ? sel.value+'-1' : sel.value);
window.addEventListener('hashchange', route);

function render(list, items, num){
  const out = [];
  items.forEach(x => {
    if ('p' in x) { const d = document.createElement('div'); d.className = 'passage'; d.innerHTML = x.p; list.append(d); return; }
    out.push(x); list.append(card(x, num ? 'Q'+num() : 'Q'+x.id));
  });
  return out;
}
function show(kind, n, s){
  const list = $('#list'), subs = $('#subs'); list.innerHTML = ''; subs.innerHTML = '';
  if (kind === 'ch'){
    const c = DATA.ch[n-1]; sel.value = 'ch'+n; subs.hidden = false;
    c.subs.forEach((b, i) => {
      const bt = document.createElement('button'); bt.textContent = `${b.k} ${b.t}`; bt.setAttribute('role','tab');
      bt.setAttribute('aria-current', String(i+1 === s)); bt.onclick = () => go(`ch${n}-${i+1}`); subs.append(bt);
    });
    const b = c.subs[s-1];
    list.insertAdjacentHTML('beforeend', `<p class="intro">Chapter ${c.n} · <b>${b.k} ${esc(b.t)}</b> · ${qsOf(b.items).length} questions. Tick an option to check it.</p>`);
    cur = {kind, qs: render(list, b.items), label: `${b.k} block`};
    const ac = subs.children[s-1]; ac && ac.scrollIntoView({block:'nearest', inline:'nearest'});
  } else {
    const m = DATA.mock[n-1]; sel.value = 'mock'+n; subs.hidden = true;
    list.insertAdjacentHTML('beforeend', `<p class="intro">Mock exam ${m.m}: ${B.mockIntro}</p>`);
    let k = 0, all = [];
    m.secs.forEach(sec => {
      const cnt = qsOf(sec.items).length;
      list.insertAdjacentHTML('beforeend', `<h2>${esc(sec.t)} · Q${k+1}–${k+cnt}</h2>`);
      all.push(...render(list, sec.items, () => ++k));
    });
    list.insertAdjacentHTML('beforeend', '<div class="result" id="result"></div>');
    cur = {kind, qs: all, label: 'mock exam'};
  }
  score(); window.scrollTo(0, 0);
}
function esc(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function card(q, label){
  const el = document.createElement('article'); el.className = 'card'; el.id = 'q-'+q.id;
  el.innerHTML = `<div class="meta"><span class="id">${label}</span><span>1 mark</span>${q.tag?`<span class="chip">${esc(q.tag)}</span>`:''}</div>
    <div class="stem">${q.q}</div>
    <div class="opts" role="group" aria-label="Options for ${label}">${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="box" aria-hidden="true"></span><span class="t"><span class="l">${L[i]}.</span>${o}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => { mem[q.id] = +b.dataset.i; store.set(q.id, b.dataset.i); paint(el, q); score(); });
  paint(el, q); return el;
}
function paint(el, q){
  const p = pick(q.id), btns = el.querySelectorAll('.opt'), old = el.querySelector('.fb'); old && old.remove();
  btns.forEach(b => { b.className = 'opt'; b.disabled = p !== null; b.querySelector('.box').textContent = ''; b.removeAttribute('aria-label'); });
  el.classList.toggle('done', p !== null);
  if (p === null) return;
  const right = btns[q.a]; right.classList.add('right'); right.querySelector('.box').textContent = '✓';
  const ans = `${L[q.a]}. ${q.o[q.a]}`;
  const fb = document.createElement('div');
  if (p === q.a){
    right.setAttribute('aria-label', 'Your answer, correct');
    fb.className = 'fb ok';
    fb.innerHTML = `<div class="h">✓ Correct</div><details><summary>Show explanation</summary>${q.s}</details>`;
  } else {
    const w = btns[p]; w.classList.add('wrong'); w.querySelector('.box').textContent = '✗'; w.setAttribute('aria-label', 'Your answer, wrong');
    fb.className = 'fb bad';
    fb.innerHTML = `<div class="h">✗ Wrong. Correct answer: ${ans}</div>${q.s}`;
  }
  el.append(fb);
}
function score(){
  const qs = cur.qs, n = qs.length; let a = 0, c = 0;
  qs.forEach(q => { const p = pick(q.id); if (p !== null){ a++; if (p === q.a) c++; } });
  const w = a - c, net = c - B.neg * w, pct = a ? Math.round(c*100/a) : 0;
  $('#score').innerHTML = `<span>Answered <b>${a}/${n}</b></span><span>Correct <b>${c}</b> · Wrong <b>${w}</b></span>${B.neg ? `<span>Net <b>${net.toFixed(2)}</b> (−${B.neg} per wrong)</span>` : ''}<span>Accuracy <b>${a?pct+'%':'–'}</b></span>
    <span class="bar" aria-hidden="true"><i class="c" style="width:${c*100/n}%"></i><i class="w" style="width:${w*100/n}%"></i></span>
    <button class="reset" id="reset" type="button">Reset this ${cur.label}</button>`;
  const r = $('#reset'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.classList.add('arm'); r.textContent = 'Tap again to clear your answers'; setTimeout(()=>{ if (armed){ armed=false; r.classList.remove('arm'); r.textContent=`Reset this ${cur.label}`; } }, 3500); return; }
    qs.forEach(q => { delete mem[q.id]; store.del(q.id); });
    document.querySelectorAll('.card').forEach(el => { const q = qs.find(x => 'q-'+x.id === el.id); q && paint(el, q); });
    score();
  };
  const res = $('#result');
  if (res){
    const good = net >= 0.6 * n;
    res.innerHTML = `Result${a < n ? ' so far' : ''}: <b class="${good?'pass':'fail'}">${B.neg ? net.toFixed(2) : c}/${n}</b> (${c} correct, ${w} wrong, ${n-a} blank). `
      + (B.neg ? `A blank costs nothing and a wrong answer costs ${B.neg}, so skip pure guesses. ` : 'No negative marking is assumed, so answer every question. ')
      + (a < n ? '' : good ? 'A strong score. ' : 'Aim for 60%+: revise the topics named in the wrong answers. ')
      + 'No official cut-off is published; admission is by merit rank.';
  }
}
route();
</script>
