<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head><body><title>TU SOMAT Practice</title>

<style>
/* Layout: one reading column of question cards under a sticky set picker + score bar */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#d9dee5;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --ok:#1b7f45; --ok-bg:#e4f4ea; --bad:#c2352b; --bad-bg:#fbe7e5; --code-bg:#eef1f4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3743;
  --accent:#6fb3e0; --accent-soft:#1d3346;
  --ok:#4cc27e; --ok-bg:#163525; --bad:#f07067; --bad-bg:#3d1d1b; --code-bg:#0f1419; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3743;
  --accent:#6fb3e0; --accent-soft:#1d3346;
  --ok:#4cc27e; --ok-bg:#163525; --bad:#f07067; --bad-bg:#3d1d1b; --code-bg:#0f1419; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
header .wrap>*{min-width:0}
.top select{flex:1 1 260px;width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
select{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:100%;min-width:0}
.subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.subs button{flex:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.subs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg)}
.bar{flex:1 1 140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;min-width:100px}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.reset{font:inherit;font-size:.8rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
.reset.arm{border-color:var(--bad);color:var(--bad)}
main .wrap{padding-block:18px 60px;display:grid;gap:14px}
.intro{color:var(--muted);font-size:.92rem;margin:0}
h2{font-size:1rem;margin:14px 0 0;color:var(--accent);text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;min-width:0}
.meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:6px;font-variant-numeric:tabular-nums}
.meta .id{font-weight:700;color:var(--fg);font-size:.85rem}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px;font-weight:500}
.stem p{margin:0 0 8px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13.5px/1.5 var(--mono);margin:6px 0 10px}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);border-radius:4px;padding:0 4px}
pre code{background:none;padding:0;font-size:inherit}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:left}
th{background:var(--code-bg)}
.opts{display:grid;gap:7px;margin-top:6px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;margin-top:1px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .l{font-weight:600;margin-right:4px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.done .opt:not(.right):not(.wrong){opacity:.6}
.fb{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:.93rem}
.fb p{margin:0 0 6px} .fb p:last-child{margin:0}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.bad .h{color:var(--bad)} .fb.ok .h{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem;margin-top:2px}
details[open] summary{margin-bottom:6px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-variant-numeric:tabular-nums}
.result b.pass{color:var(--ok)} .result b.fail{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
@media (max-width:480px){body{font-size:15px}.card{padding:13px 12px 12px}}
.passage{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.95rem}
.passage p{margin:0}
.back{font-size:.8rem;color:var(--muted);text-decoration:none}.back:hover{color:var(--accent)}
</style>

    <select id="set" aria-label="Choose a chapter or mock exam"></select>

<script>
const DATA = {"bank":{"key":"tusomat","neg":0.25,"mockInfo":"100 questions, 2 hours","mockIntro":"100 questions: Verbal 40, Quantitative 30, Logical 30. +1 for a correct answer, −0.25 for a wrong one, 0 for a blank. Set a 2-hour timer."},"ch":[{"n":1,"t":"Verbal Ability","subs":[{"k":"1.1","t":"Vocabulary: Synonyms, Antonyms and Word Usage","items":[{"id":"1.1.1","q":"<p>Choose the word closest in meaning to ABUNDANT.<\/p>","o":["scarce","plentiful","abandoned","modest"],"a":1,"s":"<p>Abundant means existing in large quantities, i.e. plentiful.<br>Other options: A — scarce is the opposite; C — abandoned means deserted, a sound-alike trap; D — modest means moderate or humble, not plentiful.<\/p>","tag":""},{"id":"1.1.2","q":"<p>Choose the word closest in meaning to CANDID.<\/p>","o":["secretive","cunning","careful","frank"],"a":3,"s":"<p>Candid means open and honest in speech, i.e. frank.<br>Other options: A — secretive is nearly the opposite; B — cunning means sly; C — careful means cautious, which says nothing about honesty.<\/p>","tag":""},{"id":"1.1.3","q":"<p>Choose the word most nearly opposite in meaning to OBSCURE.<\/p>","o":["clear","hidden","vague","dim"],"a":0,"s":"<p>Obscure means unclear or hard to see/understand; its opposite is clear.<br>Other options: B, C and D (hidden, vague, dim) are all close in meaning to obscure, not opposite.<\/p>","tag":""},{"id":"1.1.4","q":"<p>Choose the word closest in meaning to METICULOUS.<\/p>","o":["careless","hasty","painstaking","generous"],"a":2,"s":"<p>Meticulous means showing great attention to detail, i.e. painstaking.<br>Other options: A — careless is the opposite; B — hasty means done in a hurry; D — generous is unrelated.<\/p>","tag":""},{"id":"1.1.5","q":"<p>Choose the word most nearly opposite in meaning to FRUGAL.<\/p>","o":["extravagant","thrifty","sparing","economical"],"a":0,"s":"<p>Frugal means careful and sparing with money; its opposite is extravagant (spending wastefully).<br>Other options: B, C and D (thrifty, sparing, economical) are synonyms of frugal.<\/p>","tag":""},{"id":"1.1.6","q":"<p>Choose the word closest in meaning to AMELIORATE.<\/p>","o":["worsen","improve","postpone","measure"],"a":1,"s":"<p>To ameliorate is to make a bad situation better, i.e. improve.<br>Other options: A — worsen is the opposite; C — postpone means delay; D — measure is unrelated.<\/p>","tag":""},{"id":"1.1.7","q":"<p>Choose the word most nearly opposite in meaning to BENEVOLENT.<\/p>","o":["kind","charitable","generous","malevolent"],"a":3,"s":"<p>Benevolent means well-meaning and kind; malevolent means wishing harm to others, its exact opposite.<br>Other options: A, B and C (kind, charitable, generous) are near-synonyms of benevolent.<\/p>","tag":""},{"id":"1.1.8","q":"<p>Choose the word closest in meaning to EPHEMERAL.<\/p>","o":["eternal","ethereal","short-lived","essential"],"a":2,"s":"<p>Ephemeral means lasting for a very short time, i.e. short-lived.<br>Other options: A — eternal is the opposite; B — ethereal means delicate or heavenly, a look-alike trap; D — essential means necessary.<\/p>","tag":""},{"id":"1.1.9","q":"<p>Choose the word most nearly opposite in meaning to ADVERSITY.<\/p>","o":["misfortune","prosperity","hardship","calamity"],"a":1,"s":"<p>Adversity means difficulty or misfortune; prosperity (a state of success and good fortune) is its opposite.<br>Other options: A, C and D (misfortune, hardship, calamity) are synonyms of adversity.<\/p>","tag":""},{"id":"1.1.10","q":"<p>Choose the word closest in meaning to TACITURN.<\/p>","o":["uncommunicative","talkative","angry","tactful"],"a":0,"s":"<p>A taciturn person says very little, i.e. is uncommunicative or reserved.<br>Other options: B — talkative is the opposite; C — angry is unrelated; D — tactful (sensitive in dealing with others) only sounds similar.<\/p>","tag":""},{"id":"1.1.11","q":"<p>Choose the word most nearly opposite in meaning to VERBOSE.<\/p>","o":["wordy","long-winded","rambling","concise"],"a":3,"s":"<p>Verbose means using more words than needed; concise (brief but complete) is the opposite.<br>Other options: A, B and C (wordy, long-winded, rambling) all mean the same as verbose.<\/p>","tag":""},{"id":"1.1.12","q":"<p>Choose the word closest in meaning to PRUDENT.<\/p>","o":["reckless","proud","judicious","rude"],"a":2,"s":"<p>Prudent means acting with care and good judgement, i.e. judicious.<br>Other options: A — reckless is the opposite; B — proud and D — rude are sound-alike traps with different meanings.<\/p>","tag":""},{"id":"1.1.13","q":"<p>Choose the word most nearly opposite in meaning to DIFFIDENT.<\/p>","o":["confident","shy","timid","modest"],"a":0,"s":"<p>Diffident means lacking self-confidence, so its opposite is confident.<br>Other options: B, C and D (shy, timid, modest) are close to diffident in meaning.<\/p>","tag":""},{"id":"1.1.14","q":"<p>Choose the word closest in meaning to CORROBORATE.<\/p>","o":["contradict","corrode","collaborate","confirm"],"a":3,"s":"<p>To corroborate is to confirm or support a statement with evidence.<br>Other options: A — contradict is the opposite; B — corrode means wear away; C — collaborate means work together; B and C are look-alike traps.<\/p>","tag":""},{"id":"1.1.15","q":"<p>Choose the word most nearly opposite in meaning to LUCID.<\/p>","o":["clear","confusing","bright","transparent"],"a":1,"s":"<p>Lucid means clear and easy to understand; its opposite is confusing.<br>Other options: A, C and D (clear, bright, transparent) are near-synonyms of lucid.<\/p>","tag":""},{"id":"1.1.16","q":"<p>Choose the word closest in meaning to ENIGMATIC.<\/p>","o":["obvious","energetic","mysterious","enormous"],"a":2,"s":"<p>Enigmatic means difficult to interpret or understand, i.e. mysterious.<br>Other options: A — obvious is the opposite; B — energetic and D — enormous merely begin with similar letters.<\/p>","tag":""},{"id":"1.1.17","q":"<p>Choose the correct word to fill the blank: \"The new tax policy will ___ every salaried citizen.\"<\/p>","o":["affect","effect","effects","affection"],"a":0,"s":"<p>Affect (verb) means to influence or have an impact on, which fits \"will ___ every citizen\".<br>Other options: B — effect as a verb means \"to bring about\" (e.g. effect a change), which does not fit; C — effects cannot follow \"will\"; D — affection is a noun meaning fondness.<\/p>","tag":""},{"id":"1.1.18","q":"<p>Choose the word most nearly opposite in meaning to OBSOLETE.<\/p>","o":["outdated","antiquated","modern","archaic"],"a":2,"s":"<p>Obsolete means no longer in use or out of date; modern is its opposite.<br>Other options: A, B and D (outdated, antiquated, archaic) are all synonyms of obsolete.<\/p>","tag":""},{"id":"1.1.19","q":"<p>Choose the word most nearly opposite in meaning to AUGMENT.<\/p>","o":["increase","enlarge","amplify","diminish"],"a":3,"s":"<p>Augment means to make larger; diminish means to make smaller, its opposite.<br>Other options: A, B and C (increase, enlarge, amplify) mean the same as augment.<\/p>","tag":""},{"id":"1.1.20","q":"<p>Choose the correct word to fill the blank: \"The ___ of the college addressed the new students on the first day.\"<\/p>","o":["principle","principal","principled","principality"],"a":1,"s":"<p>Principal (noun) means the head of a school or college.<br>Other options: A — principle means a fundamental rule or belief; C — principled is an adjective meaning having moral principles; D — principality is a state ruled by a prince.<\/p>","tag":""},{"id":"1.1.21","q":"<p>Choose the word closest in meaning to GREGARIOUS.<\/p>","o":["sociable","greedy","solitary","grievous"],"a":0,"s":"<p>A gregarious person enjoys company, i.e. is sociable.<br>Other options: B — greedy and D — grievous (very severe) are look-alike traps; C — solitary is the opposite.<\/p>","tag":""},{"id":"1.1.22","q":"<p>Choose the correct word to fill the blank: \"Please buy some ___ for the office: envelopes, paper and pens.\"<\/p>","o":["stationary","stationery","stationed","station"],"a":1,"s":"<p>Stationery (with -ery) means writing materials such as paper, envelopes and pens.<br>Other options: A — stationary (with -ary) means not moving; C — stationed means posted somewhere; D — station is a place or building.<\/p>","tag":""},{"id":"1.1.23","q":"<p>Choose the word most nearly opposite in meaning to INDIGENOUS.<\/p>","o":["native","local","aboriginal","foreign"],"a":3,"s":"<p>Indigenous means originating naturally in a place, i.e. native; foreign (from another place) is its opposite.<br>Other options: A, B and C (native, local, aboriginal) are close in meaning to indigenous.<\/p>","tag":""},{"id":"1.1.24","q":"<p>Choose the word closest in meaning to PRAGMATIC.<\/p>","o":["idealistic","dogmatic","practical","theoretical"],"a":2,"s":"<p>Pragmatic means dealing with things sensibly and realistically, i.e. practical.<br>Other options: A — idealistic and D — theoretical are roughly opposite in sense; B — dogmatic means rigidly insisting on one's opinions.<\/p>","tag":""},{"id":"1.1.25","q":"<p>Choose the word most nearly opposite in meaning to TRANSPARENT.<\/p>","o":["opaque","clear","lucid","obvious"],"a":0,"s":"<p>Transparent means letting light pass through, or easy to see through; opaque (not letting light through, hard to understand) is its opposite.<br>Other options: B, C and D (clear, lucid, obvious) are near-synonyms of transparent.<\/p>","tag":""},{"id":"1.1.26","q":"<p>Choose the correct word to fill the blank: \"The red scarf nicely ___ her black coat.\"<\/p>","o":["compliments","complaints","complements","comments"],"a":2,"s":"<p>To complement is to go well with something or complete it; a scarf complements a coat.<br>Other options: A — compliments means praises, which a scarf cannot do; B — complaints means grievances; D — comments means remarks.<\/p>","tag":""},{"id":"1.1.27","q":"<p>Choose the word closest in meaning to UBIQUITOUS.<\/p>","o":["rare","omnipresent","unique","ambiguous"],"a":1,"s":"<p>Ubiquitous means found everywhere, i.e. omnipresent.<br>Other options: A — rare is the opposite; C — unique means one of a kind; D — ambiguous means having more than one meaning.<\/p>","tag":""},{"id":"1.1.28","q":"<p>Choose the word most nearly opposite in meaning to MAGNANIMOUS.<\/p>","o":["generous","noble","forgiving","petty"],"a":3,"s":"<p>Magnanimous means generous and forgiving, especially towards a rival; petty (small-minded, spiteful over trivial things) is its opposite.<br>Other options: A, B and C (generous, noble, forgiving) are qualities of a magnanimous person.<\/p>","tag":""},{"id":"1.1.29","q":"<p>Choose the word closest in meaning to PLACATE.<\/p>","o":["appease","provoke","place","replace"],"a":0,"s":"<p>To placate is to make someone less angry, i.e. appease or pacify.<br>Other options: B — provoke (to anger someone) is the opposite; C — place and D — replace are sound-alike traps.<\/p>","tag":""},{"id":"1.1.30","q":"<p>Choose the word closest in meaning to SYCOPHANT.<\/p>","o":["critic","psychologist","flatterer","rebel"],"a":2,"s":"<p>A sycophant is a person who flatters powerful people to gain advantage, i.e. a flatterer or yes-man.<br>Other options: A — a critic finds fault, nearly the opposite; B — psychologist is a sound-alike trap; D — a rebel resists authority rather than flattering it.<\/p>","tag":""}]},{"k":"1.2","t":"Sentence Completion and Fill in the Blanks","items":[{"id":"1.2.1","q":"<p>Choose the word that best completes the sentence: \"Despite his ___ efforts, he failed to clear the exam.\"<\/p>","o":["lazy","half-hearted","strenuous","occasional"],"a":2,"s":"<p>\"Despite\" signals contrast with failure, so the efforts must have been great: strenuous.<br>Other options: A, B and D (lazy, half-hearted, occasional) would explain the failure, so there would be no contrast for \"despite\" to mark.<\/p>","tag":""},{"id":"1.2.2","q":"<p>Choose the word that best completes the sentence: \"The manager was so ___ that he never admitted any mistake.\"<\/p>","o":["arrogant","humble","modest","cautious"],"a":0,"s":"<p>Never admitting a mistake points to excessive pride: arrogant.<br>Other options: B and C — humble and modest people readily admit mistakes; D — cautious describes care, not refusal to admit faults.<\/p>","tag":""},{"id":"1.2.3","q":"<p>Fill in the blank: \"Water ___ at 100 °C at sea level.\"<\/p>","o":["boil","boiled","is boiling","boils"],"a":3,"s":"<p>A general or scientific truth takes the simple present tense, with -s for a singular subject: boils.<br>Other options: A — boil does not agree with the singular subject; B — boiled is past tense; C — is boiling describes an action happening now, not a general fact.<\/p>","tag":""},{"id":"1.2.4","q":"<p>Fill in the blank: \"She has been working here ___ 2015.\"<\/p>","o":["for","since","from","by"],"a":1,"s":"<p>With the perfect tenses, \"since\" is used before a point of time (2015).<br>Other options: A — for is used with a period of time (for ten years); C — from needs a \"to/till\" or a non-perfect tense; D — by gives a deadline, which makes no sense here.<\/p>","tag":""},{"id":"1.2.5","q":"<p>Fill in the blank: \"If I ___ you, I would accept the offer.\"<\/p>","o":["am","was","be","were"],"a":3,"s":"<p>An imaginary (unreal) present condition uses the subjunctive \"were\" for all persons: \"If I were you\".<br>Other options: A — am is used for real conditions; B — \"was\" is heard in casual speech but is not accepted in formal/exam English; C — be is not a finite form here.<\/p>","tag":""},{"id":"1.2.6","q":"<p>Choose the word that best completes the sentence: \"The committee could not reach a decision because its members were ___ on the issue.\"<\/p>","o":["divided","united","unanimous","agreed"],"a":0,"s":"<p>Failure to decide is explained by disagreement: the members were divided.<br>Other options: B, C and D (united, unanimous, agreed) would lead to a decision, contradicting \"could not reach a decision\".<\/p>","tag":""},{"id":"1.2.7","q":"<p>Choose the word that best completes the sentence: \"Although the evidence was ___, the jury was unwilling to convict.\"<\/p>","o":["weak","flimsy","compelling","scanty"],"a":2,"s":"<p>\"Although\" sets up a contrast with the jury's refusal to convict, so the evidence must have been strong: compelling.<br>Other options: A, B and D (weak, flimsy, scanty) would justify the refusal, leaving no contrast.<\/p>","tag":""},{"id":"1.2.8","q":"<p>Fill in the blank: \"He is senior ___ me by two years.\"<\/p>","o":["than","to","from","over"],"a":1,"s":"<p>Latin comparatives such as senior, junior, superior, inferior and prior take \"to\", not \"than\".<br>Other options: A — than is the common mistake; C and D — from and over are not used with \"senior\".<\/p>","tag":""},{"id":"1.2.9","q":"<p>Fill in the blank: \"Neither the teacher nor the students ___ present at the function.\"<\/p>","o":["were","was","is","has been"],"a":0,"s":"<p>With \"neither ... nor\", the verb agrees with the nearer subject; \"students\" is plural, so \"were\".<br>Other options: B, C and D are singular forms, which would agree only with \"teacher\", the farther subject.<\/p>","tag":""},{"id":"1.2.10","q":"<p>Choose the word that best completes the sentence: \"The new drug is effective, but its side effects are so ___ that doctors prescribe it only as a last resort.\"<\/p>","o":["mild","negligible","beneficial","severe"],"a":3,"s":"<p>Prescribing it \"only as a last resort\" means the side effects must be serious: severe.<br>Other options: A, B and C (mild, negligible, beneficial) would not make doctors reluctant to use it.<\/p>","tag":""},{"id":"1.2.11","q":"<p>Choose the word that best completes the sentence: \"The speaker was so ___ that the audience hung on every word.\"<\/p>","o":["boring","monotonous","eloquent","inaudible"],"a":2,"s":"<p>An audience that \"hangs on every word\" is captivated, so the speaker was eloquent (fluent and persuasive).<br>Other options: A and B — boring and monotonous speakers lose an audience; D — an inaudible speaker cannot be heard at all.<\/p>","tag":""},{"id":"1.2.12","q":"<p>Fill in the blank: \"By the time we reached the station, the train ___.\"<\/p>","o":["left","had left","has left","leaves"],"a":1,"s":"<p>Of two past actions, the earlier one (the train leaving) takes the past perfect: had left.<br>Other options: A — simple past does not show which happened first; C — present perfect cannot go with a past time clause; D — present tense is wrong in a past narrative.<\/p>","tag":""},{"id":"1.2.13","q":"<p>Choose the word that best completes the sentence: \"The company's profits have ___ sharply this year, forcing it to cut jobs.\"<\/p>","o":["soared","risen","doubled","plummeted"],"a":3,"s":"<p>Cutting jobs is a response to falling profits; plummeted means fell steeply.<br>Other options: A, B and C (soared, risen, doubled) describe growth, which would not force job cuts.<\/p>","tag":""},{"id":"1.2.14","q":"<p>Fill in the blank: \"I look forward to ___ from you soon.\"<\/p>","o":["hearing","hear","heard","have heard"],"a":0,"s":"<p>In \"look forward to\", \"to\" is a preposition, so it is followed by a gerund (-ing form): hearing.<br>Other options: B — the bare infinitive is the common mistake; C and D — past forms do not fit after a preposition.<\/p>","tag":""},{"id":"1.2.15","q":"<p>Fill in the blank: \"One of my friends ___ in Pokhara.\"<\/p>","o":["live","lives","are living","have lived"],"a":1,"s":"<p>The subject is \"one\" (singular), not \"friends\", so the verb is singular: lives.<br>Other options: A, C and D are plural forms that wrongly agree with \"friends\".<\/p>","tag":""},{"id":"1.2.16","q":"<p>Choose the word that best completes the sentence: \"The scientist's theory, once ___ by her peers, is now widely accepted.\"<\/p>","o":["praised","accepted","ridiculed","adopted"],"a":2,"s":"<p>\"Once ... now widely accepted\" signals a change, so the theory must first have been rejected: ridiculed.<br>Other options: A, B and D (praised, accepted, adopted) show no contrast with \"now widely accepted\".<\/p>","tag":""},{"id":"1.2.17","q":"<p>Fill in the blank: \"He insisted ___ paying the bill himself.\"<\/p>","o":["to","for","at","on"],"a":3,"s":"<p>The verb \"insist\" takes the preposition \"on\" (insist on doing something).<br>Other options: A, B and C are not used with \"insist\".<\/p>","tag":""},{"id":"1.2.18","q":"<p>Fill in the blank: \"Hardly had he left the house ___ it started to rain.\"<\/p>","o":["when","than","then","after"],"a":0,"s":"<p>\"Hardly/Scarcely ... when\" is the fixed pair.<br>Other options: B — \"than\" pairs with \"no sooner\"; C — then and D — after are not used in this construction.<\/p>","tag":""},{"id":"1.2.19","q":"<p>Choose the pair that best completes the sentence: \"The journey was ___, but the beautiful scenery made it ___.\"<\/p>","o":["short; boring","easy; tiring","tiring; worthwhile","pleasant; unbearable"],"a":2,"s":"<p>\"But\" needs a contrast in which the scenery improves the experience: the journey was tiring, but the scenery made it worthwhile.<br>Other options: A, B and D all make the scenery worsen the journey, which contradicts \"beautiful scenery\".<\/p>","tag":""},{"id":"1.2.20","q":"<p>Choose the word that best completes the sentence: \"The patient's condition, which had been deteriorating for weeks, finally ___ after the new treatment.\"<\/p>","o":["worsened","stabilised","collapsed","declined"],"a":1,"s":"<p>\"Finally ... after the new treatment\" signals a turn for the better after weeks of decline: stabilised.<br>Other options: A, C and D (worsened, collapsed, declined) continue the decline, so \"finally\" and the new treatment make no sense.<\/p>","tag":""},{"id":"1.2.21","q":"<p>Fill in the blank: \"No sooner had the bell rung ___ the students rushed out.\"<\/p>","o":["than","when","then","that"],"a":0,"s":"<p>\"No sooner ... than\" is the fixed pair.<br>Other options: B — \"when\" pairs with \"hardly/scarcely\"; C and D are not used in this construction.<\/p>","tag":""},{"id":"1.2.22","q":"<p>Fill in the blank: \"She is not only intelligent ___ hard-working.\"<\/p>","o":["and also","but","as well","but also"],"a":3,"s":"<p>The correlative pair is \"not only ... but also\".<br>Other options: A, B and C break the correlative pair.<\/p>","tag":""},{"id":"1.2.23","q":"<p>Fill in the blank: \"The more you practise, ___ you become.\"<\/p>","o":["better","the better","best","the best"],"a":1,"s":"<p>The double comparative takes \"the\" + comparative in both halves: \"The more ..., the better ...\".<br>Other options: A drops the required \"the\"; C and D use the superlative.<\/p>","tag":""},{"id":"1.2.24","q":"<p>Choose the word that best completes the sentence: \"His explanation was so ___ that even a child could follow it.\"<\/p>","o":["convoluted","obscure","straightforward","ambiguous"],"a":2,"s":"<p>If even a child could follow it, the explanation was simple: straightforward.<br>Other options: A, B and D (convoluted, obscure, ambiguous) all mean hard to understand.<\/p>","tag":""},{"id":"1.2.25","q":"<p>Choose the pair that best completes the sentence: \"Far from being ___, the new rules have actually ___ the problem.\"<\/p>","o":["helpful; worsened","harmful; worsened","useless; worsened","effective; eased"],"a":0,"s":"<p>\"Far from being X, they actually did Y\" needs Y to be the opposite of what X suggests: far from helpful, they worsened the problem.<br>Other options: B — far from harmful but worsened is self-contradictory; C — far from useless but worsened is self-contradictory; D — far from effective but eased is self-contradictory.<\/p>","tag":""},{"id":"1.2.26","q":"<p>Choose the word that best completes the sentence: \"Faced with clear video evidence, the thief had no choice but to ___ his crime.\"<\/p>","o":["deny","confess","conceal","repeat"],"a":1,"s":"<p>\"Clear evidence\" and \"no choice but\" point to admitting the crime: confess.<br>Other options: A and C — deny and conceal are what the evidence makes impossible; D — repeat makes no sense.<\/p>","tag":""},{"id":"1.2.27","q":"<p>Choose the word that best completes the sentence: \"The government has ___ a new scheme to support small farmers.\"<\/p>","o":["withdrawn","abandoned","suspended","introduced"],"a":3,"s":"<p>A scheme \"to support\" farmers is being started: introduced.<br>Other options: A, B and C (withdrawn, abandoned, suspended) describe ending a scheme, which clashes with \"new\".<\/p>","tag":""},{"id":"1.2.28","q":"<p>Fill in the blank: \"It is high time we ___ action on climate change.\"<\/p>","o":["take","will take","took","have taken"],"a":2,"s":"<p>\"It is high time\" is followed by the past (subjunctive) form to show that something is overdue: took.<br>Other options: A, B and D (present, future, present perfect) are not used after \"it is high time\".<\/p>","tag":""},{"id":"1.2.29","q":"<p>Fill in the blank: \"The ___ of the mountain was covered in snow even in summer.\"<\/p>","o":["peek","pique","peck","peak"],"a":3,"s":"<p>Peak means the pointed top of a mountain.<br>Other options: A — peek means a quick look; B — pique means irritation; C — peck is a bird's strike with its beak.<\/p>","tag":""},{"id":"1.2.30","q":"<p>Choose the word that best completes the sentence: \"His ___ remarks offended many guests at the dinner.\"<\/p>","o":["tactless","tactful","diplomatic","courteous"],"a":0,"s":"<p>Remarks that offend people are tactless (insensitive).<br>Other options: B, C and D (tactful, diplomatic, courteous) describe remarks that avoid offence.<\/p>","tag":""}]},{"k":"1.3","t":"Grammar: Error Spotting and Sentence Correction","items":[{"id":"1.3.1","q":"<p>Which part of the sentence contains an error?<br>\"Each of the boys have submitted his assignment before the deadline.\"<\/p>","o":["Each of the boys","have submitted","his assignment","before the deadline"],"a":1,"s":"<p>The subject is \"each\" (singular), so the verb must be singular: \"has submitted\".<br>Other options: A — \"each of the boys\" is correct; C — \"his\" correctly agrees with \"each\"; D — \"before the deadline\" is correct.<\/p>","tag":""},{"id":"1.3.2","q":"<p>Which part of the sentence contains an error?<br>\"The furniture in the new office were bought last month.\"<\/p>","o":["The furniture","in the new office","were bought","last month"],"a":2,"s":"<p>\"Furniture\" is an uncountable noun and takes a singular verb: \"was bought\".<br>Other options: A, B and D are correct; the only fault is the plural verb.<\/p>","tag":""},{"id":"1.3.3","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["I have been living in Kathmandu for five years.","I am living in Kathmandu for five years.","I live in Kathmandu since five years.","I have been living in Kathmandu since five years."],"a":0,"s":"<p>An action that began in the past and continues now takes the present perfect continuous, and a period of time takes \"for\".<br>Other options: B and C — the present tenses cannot express duration up to now; C and D — \"since\" needs a point of time, not a period (five years).<\/p>","tag":""},{"id":"1.3.4","q":"<p>Which part of the sentence contains an error?<br>\"The news of his success spread quickly and were welcomed by all.\"<\/p>","o":["The news","of his success","spread quickly","and were welcomed by all"],"a":3,"s":"<p>\"News\" is singular in meaning despite the -s, so the verb is \"was welcomed\".<br>Other options: A, B and C are correct; \"spread\" is the correct past tense.<\/p>","tag":""},{"id":"1.3.5","q":"<p>Which part of the sentence contains an error?<br>\"Last week, the police has arrested three suspects.\"<\/p>","o":["Last week,","the police","has arrested","three suspects"],"a":2,"s":"<p>Two faults sit in this part: \"police\" is plural (have, not has), and a definite past time (\"last week\") needs the simple past. Correct: \"the police arrested\".<br>Other options: A, B and D are correct as written.<\/p>","tag":""},{"id":"1.3.6","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["Neither of the two answers is correct.","Neither of the two answers are correct.","Neither of the two answer is correct.","None of the two answers is correct."],"a":0,"s":"<p>\"Neither\" (for two) is singular and takes \"is\"; \"of the two\" is followed by a plural noun.<br>Other options: B — plural verb with \"neither\"; C — \"of the two\" needs the plural \"answers\"; D — \"none\" is used for more than two, \"neither\" for two.<\/p>","tag":""},{"id":"1.3.7","q":"<p>Which part of the sentence contains an error?<br>\"If he will come tomorrow, I will give him the book.\"<\/p>","o":["If he","will come tomorrow,","I will","give him the book"],"a":1,"s":"<p>In a first conditional, the if-clause takes the simple present, not \"will\": \"If he comes tomorrow\".<br>Other options: A, C and D are correct; \"will give\" belongs in the main clause.<\/p>","tag":""},{"id":"1.3.8","q":"<p>Which part of the sentence contains an error?<br>\"She is one of the best singers that has ever lived.\"<\/p>","o":["She is","one of the best","singers that","has ever lived"],"a":3,"s":"<p>The relative pronoun \"that\" refers to \"singers\" (plural), so the verb must be plural: \"have ever lived\".<br>Other options: A, B and C are correct; the common trap is to make the verb agree with \"one\".<\/p>","tag":""},{"id":"1.3.9","q":"<p>Which part of the sentence contains an error?<br>\"Mathematics are my favourite subject because I enjoy solving problems.\"<\/p>","o":["Mathematics are","my favourite subject","because I","enjoy solving problems"],"a":0,"s":"<p>Names of subjects ending in -ics (mathematics, physics, economics) take a singular verb: \"Mathematics is\".<br>Other options: B, C and D are correct.<\/p>","tag":""},{"id":"1.3.10","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["He prevented me to go there.","He prevented me for going there.","He prevented me from going there.","He prevented me going to there."],"a":2,"s":"<p>The pattern is \"prevent someone from doing something\".<br>Other options: A — \"prevent ... to go\" is wrong; B — \"for\" is the wrong preposition; D — drops \"from\" and adds a wrong \"to\" before \"there\".<\/p>","tag":""},{"id":"1.3.11","q":"<p>Which part of the sentence contains an error?<br>\"She asked me where I was going and why did I go.\"<\/p>","o":["She asked me","where","I was going","and why did I go"],"a":3,"s":"<p>Reported (indirect) questions use statement word order, without \"did\": \"and why I was going\" (or \"why I went\").<br>Other options: A, B and C are correct; \"where I was going\" already shows the right order.<\/p>","tag":""},{"id":"1.3.12","q":"<p>Which part of the sentence contains an error?<br>\"He is more cleverer than his brother.\"<\/p>","o":["He is","more cleverer","than","his brother"],"a":1,"s":"<p>\"Cleverer\" is already comparative; adding \"more\" makes a double comparative. Correct: \"cleverer\" (or \"more clever\").<br>Other options: A, C and D are correct.<\/p>","tag":""},{"id":"1.3.13","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["The number of tourists visiting Nepal has increased.","The number of tourists visiting Nepal have increased.","A number of tourists visiting Nepal has increased.","The number of tourist visiting Nepal have increased."],"a":0,"s":"<p>\"The number of\" refers to a single figure and takes a singular verb: \"has increased\".<br>Other options: B — plural verb with \"the number\"; C — \"a number of\" means \"many\" and takes a plural verb, and it changes the meaning; D — \"tourist\" must be plural and the verb singular.<\/p>","tag":""},{"id":"1.3.14","q":"<p>Which part of the sentence contains an error?<br>\"I prefer tea than coffee.\"<\/p>","o":["I prefer","tea","than","coffee"],"a":2,"s":"<p>\"Prefer\" takes \"to\", not \"than\": \"I prefer tea to coffee\".<br>Other options: A, B and D are correct.<\/p>","tag":""},{"id":"1.3.15","q":"<p>Which part of the sentence contains an error?<br>\"We discussed about the problem for two hours yesterday.\"<\/p>","o":["We discussed","about the problem","for two hours","yesterday"],"a":1,"s":"<p>\"Discuss\" is a transitive verb and takes a direct object without \"about\": \"We discussed the problem\".<br>Other options: A, C and D are correct.<\/p>","tag":""},{"id":"1.3.16","q":"<p>Which part of the sentence contains an error?<br>\"The teacher gave the students some useful informations.\"<\/p>","o":["The teacher gave","the students","some useful","informations"],"a":3,"s":"<p>\"Information\" is uncountable and has no plural: \"some useful information\".<br>Other options: A, B and C are correct.<\/p>","tag":""},{"id":"1.3.17","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["Had I known about the strike, I would have stayed at home.","If I would have known about the strike, I would have stayed at home.","Had I knew about the strike, I would have stayed at home.","If I knew about the strike, I would have stayed at home."],"a":0,"s":"<p>A third conditional (unreal past) uses \"If I had known\" or the inverted \"Had I known\" with \"would have + past participle\".<br>Other options: B — \"would have\" cannot go in the if-clause; C — \"had\" needs the past participle \"known\"; D — \"knew\" is second-conditional and does not fit \"would have stayed\".<\/p>","tag":""},{"id":"1.3.18","q":"<p>Which part of the sentence contains an error?<br>\"One should do his duty honestly and sincerely.\"<\/p>","o":["One should","do his duty","honestly","and sincerely"],"a":1,"s":"<p>In formal grammar, the pronoun \"one\" is followed by \"one's\": \"One should do one's duty\".<br>Other options: A, C and D are correct.<\/p>","tag":""},{"id":"1.3.19","q":"<p>Which part of the sentence contains an error?<br>\"The cattle in the field is grazing peacefully.\"<\/p>","o":["The cattle","in the field","is grazing","peacefully"],"a":2,"s":"<p>\"Cattle\" is always plural and takes a plural verb: \"are grazing\".<br>Other options: A, B and D are correct.<\/p>","tag":""},{"id":"1.3.20","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["Walk carefully lest you should fall.","Walk carefully lest you should not fall.","Walk carefully lest you will not fall.","Walk carefully lest you fall not."],"a":0,"s":"<p>\"Lest\" already means \"so that ... not\", so it is followed by \"should\" + verb without \"not\".<br>Other options: B and C — adding \"not\" creates a double negative; C also wrongly uses \"will\"; D — \"fall not\" is an archaic, incorrect order.<\/p>","tag":""},{"id":"1.3.21","q":"<p>Which part of the sentence contains an error?<br>\"He has been working in this company since ten years.\"<\/p>","o":["He has","been working","in this company","since ten years"],"a":3,"s":"<p>A period of time takes \"for\": \"for ten years\". \"Since\" is used with a point of time (since 2015).<br>Other options: A, B and C are correct.<\/p>","tag":""},{"id":"1.3.22","q":"<p>Which part of the sentence contains an error?<br>\"The bread and butter are my usual breakfast.\"<\/p>","o":["The bread","and butter","are","my usual breakfast"],"a":2,"s":"<p>\"Bread and butter\" names one dish (a single idea), so it takes a singular verb: \"is\".<br>Other options: A, B and D are correct.<\/p>","tag":""},{"id":"1.3.23","q":"<p>Which part of the sentence contains an error?<br>\"He returned back home late at night.\"<\/p>","o":["He returned","back","home","late at night"],"a":1,"s":"<p>\"Return\" already means \"go/come back\", so \"back\" is redundant: \"He returned home\".<br>Other options: A, C and D are correct.<\/p>","tag":""},{"id":"1.3.24","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["Ten kilometres are a long distance to walk.","Ten kilometre is a long distance to walk.","Ten kilometres were a long distances to walk.","Ten kilometres is a long distance to walk."],"a":3,"s":"<p>A plural amount of distance, money or time seen as one total takes a singular verb: \"Ten kilometres is\".<br>Other options: A — plural verb for a single amount; B — \"ten\" needs the plural \"kilometres\"; C — plural verb and \"a long distances\" are both wrong.<\/p>","tag":""},{"id":"1.3.25","q":"<p>Which part of the sentence contains an error?<br>\"Despite of the heavy rain, the match continued.\"<\/p>","o":["Despite of","the heavy rain,","the match","continued"],"a":0,"s":"<p>\"Despite\" is never followed by \"of\"; use \"Despite the heavy rain\" or \"In spite of the heavy rain\".<br>Other options: B, C and D are correct.<\/p>","tag":""},{"id":"1.3.26","q":"<p>Which part of the sentence contains an error?<br>\"Of the two brothers, Ram is the tallest one.\"<\/p>","o":["Of the two brothers,","Ram is","the tallest","one"],"a":2,"s":"<p>When only two are compared, the comparative is used: \"the taller\".<br>Other options: A, B and D are correct.<\/p>","tag":""},{"id":"1.3.27","q":"<p>Which part of the sentence contains an error?<br>\"The child was so tired that he cannot walk any further.\"<\/p>","o":["The child","was so tired","that he","cannot walk any further"],"a":3,"s":"<p>The main clause is in the past (\"was\"), so the result clause must also be past: \"could not walk\".<br>Other options: A, B and C are correct.<\/p>","tag":""},{"id":"1.3.28","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["He is an university student.","He is a university student.","He is a universities student.","He is university student."],"a":1,"s":"<p>\"University\" begins with a \"yu\" (consonant) sound, so it takes \"a\", and a singular countable noun needs an article.<br>Other options: A — \"an\" goes before a vowel sound; C — \"universities\" makes no sense here; D — the article is missing.<\/p>","tag":""},{"id":"1.3.29","q":"<p>Which part of the sentence contains an error?<br>\"Unless you do not hurry up, you will miss the bus.\"<\/p>","o":["Unless you do not","hurry up,","you will","miss the bus"],"a":0,"s":"<p>\"Unless\" already means \"if not\", so adding \"not\" gives a double negative. Correct: \"Unless you hurry up\".<br>Other options: B, C and D are correct.<\/p>","tag":""},{"id":"1.3.30","q":"<p>Choose the grammatically correct sentence.<\/p>","o":["The quality of the mangoes were not good.","The quality of the mango were not good.","The qualities of the mangoes was not good.","The quality of the mangoes was not good."],"a":3,"s":"<p>The subject is \"quality\" (singular), so the verb is \"was\"; \"of the mangoes\" does not change the subject.<br>Other options: A — verb wrongly agrees with \"mangoes\"; B — plural verb with a singular subject; C — \"qualities\" is plural but the verb is singular.<\/p>","tag":""}]},{"k":"1.4","t":"Reading Comprehension","items":[{"p":"<p><b>Passage 1<\/b><br>Microfinance began with a simple idea: people who are too poor to offer collateral can still be trustworthy borrowers. Instead of demanding land or gold, many microfinance institutions lend to small groups of women, each of whom guarantees the others' loans. Because members know one another well, they choose partners carefully and press each other to repay on time, and repayment rates have often been impressively high. Yet the early enthusiasm has cooled. Studies in several countries have found that small loans help households smooth their spending and cope with emergencies, but they rarely lift families permanently out of poverty. Many borrowers use the money for consumption rather than for starting businesses, and some take new loans from one lender to repay another, sliding deeper into debt. None of this means that microfinance has failed. It means that credit alone is not enough. Borrowers who also receive training in bookkeeping, access to markets and a safe place to save tend to do far better than those who receive only a loan.<\/p>"},{"id":"1.4.1","q":"<p>(Passage 1) Which statement best expresses the main idea of the passage?<\/p>","o":["Microfinance has completely failed to help the poor.","Group lending is the only way to ensure repayment.","Microfinance is useful but works best when combined with other kinds of support.","Poor people should never be given loans without land, gold or some other form of collateral."],"a":2,"s":"<p>The passage says microfinance has not failed but \"credit alone is not enough\"; borrowers with training, market access and savings do better.<br>Other options: A — the passage explicitly says \"None of this means that microfinance has failed\"; B — group lending is described, not called the only way; D — the whole idea of microfinance is lending without collateral, which the author does not reject.<\/p>","tag":""},{"id":"1.4.2","q":"<p>(Passage 1) According to the passage, why does group lending lead to high repayment?<\/p>","o":["Members know one another and put pressure on each other to repay.","Lenders inspect each borrower's land and gold before agreeing to release the loan.","The government guarantees every loan.","The loans carry no interest."],"a":0,"s":"<p>The passage states that because members know one another, they choose partners carefully and \"press each other to repay on time\".<br>Other options: B — no land is demanded; C and D — government guarantees and interest-free loans are not mentioned.<\/p>","tag":""},{"id":"1.4.3","q":"<p>(Passage 1) As used in the passage, \"smooth their spending\" most nearly means<\/p>","o":["polish their spending","hide their spending","reduce their spending sharply","even out their spending"],"a":3,"s":"<p>Households use loans to keep spending steady through good and bad times, i.e. to even it out and \"cope with emergencies\".<br>Other options: A — polish is the literal meaning of smooth, not the sense here; B — nothing is hidden; C — loans allow spending, not a cut in it.<\/p>","tag":""},{"p":"<p><b>Passage 2<\/b><br>Most people think of procrastination as a problem of time management: if only we planned our days better, we would finish our work. Psychologists increasingly disagree. They argue that procrastination is mainly a problem of managing emotions. When a task makes us feel anxious, bored or insecure, putting it off gives instant relief. The relief is real but short-lived, and it is paid for later with stress, guilt and rushed, poorer work. Because the brain rewards the immediate escape, the habit grows stronger each time we give in to it. This explains why handing a chronic procrastinator a better calendar rarely helps. More effective strategies tackle the feeling directly. Breaking a large task into a small first step makes it less threatening. Forgiving oneself for past delays, rather than criticising oneself harshly, has been found to reduce future procrastination, apparently because it lowers the negative emotions attached to the task. In short, the cure lies less in the diary than in the mind.<\/p>"},{"id":"1.4.4","q":"<p>(Passage 2) According to psychologists cited in the passage, procrastination is mainly<\/p>","o":["a lack of intelligence","a problem of managing emotions","the result of having too much work","caused by poorly designed calendars"],"a":1,"s":"<p>The passage says psychologists \"argue that procrastination is mainly a problem of managing emotions\".<br>Other options: A and C — intelligence and workload are not discussed; D — the passage says a better calendar \"rarely helps\", so calendars are not the cause.<\/p>","tag":""},{"id":"1.4.5","q":"<p>(Passage 2) Why does forgiving oneself for past delays reduce procrastination?<\/p>","o":["It makes people care less about deadlines.","It gives people extra time to finish tasks they have already put off.","It lowers the negative emotions attached to the task.","It removes the need for any planning."],"a":2,"s":"<p>The passage says self-forgiveness works \"apparently because it lowers the negative emotions attached to the task\".<br>Other options: A, B and D are not stated or implied anywhere in the passage.<\/p>","tag":""},{"id":"1.4.6","q":"<p>(Passage 2) The final sentence, \"the cure lies less in the diary than in the mind\", suggests that<\/p>","o":["dealing with feelings matters more than scheduling tools","diaries are completely useless","people should stop planning their days and rely on mood instead","the mind cannot be changed"],"a":0,"s":"<p>\"Less in the diary than in the mind\" contrasts planning tools with emotional strategies and gives more weight to the latter.<br>Other options: B and C — \"less ... than\" ranks the two; it does not dismiss planning entirely; D — the passage suggests the opposite, that feelings can be managed.<\/p>","tag":""},{"p":"<p><b>Passage 3<\/b><br>For many Nepali households, money sent home by family members working abroad has become the main source of cash income. Remittances have helped reduce poverty, pay for children's schooling and build better houses. At the national level, they bring in foreign currency that pays for imports. But economists warn that an economy leaning so heavily on remittances is vulnerable. If jobs in the destination countries dry up, because of a fall in oil prices, a war or a pandemic, the flow of money can shrink quickly. Moreover, much of the money is spent on consumer goods, many of them imported, rather than invested in productive enterprises at home. The absence of young people of working age also leaves villages short of labour, and some farmland is left fallow. The challenge for policymakers, therefore, is not to stop migration, which offers real benefits, but to channel remittance income into investment and to create enough jobs at home that working abroad becomes a choice rather than a necessity.<\/p>"},{"id":"1.4.7","q":"<p>(Passage 3) The author's attitude towards labour migration is best described as<\/p>","o":["wholly hostile","wholly enthusiastic, seeing migration as the answer to poverty","balanced, recognising both benefits and risks","indifferent"],"a":2,"s":"<p>The author lists benefits (less poverty, schooling, foreign currency) and risks (vulnerability, consumption, labour shortage) and says migration \"offers real benefits\" but should become a choice.<br>Other options: A — the author does not want to stop migration; B — several dangers are stressed; D — the author clearly cares and proposes policy.<\/p>","tag":""},{"id":"1.4.8","q":"<p>(Passage 3) Which of the following is NOT mentioned as a problem of heavy dependence on remittances?<\/p>","o":["Dependence on economic conditions in destination countries","Spending on imported consumer goods instead of investment","Shortage of labour in villages","Rising crime in cities"],"a":3,"s":"<p>Crime is never mentioned in the passage.<br>Other options: A — the passage mentions oil prices, war or pandemic in destination countries; B — spending on imported consumer goods is mentioned; C — villages \"short of labour\" is mentioned.<\/p>","tag":""},{"id":"1.4.9","q":"<p>(Passage 3) As used in the passage, farmland \"left fallow\" means farmland that is<\/p>","o":["sold to new buyers","left uncultivated","flooded by rivers","farmed too intensively"],"a":1,"s":"<p>Fallow land is land not being planted; with young people gone, fields are left uncultivated.<br>Other options: A, C and D do not match the meaning of \"fallow\" or the context of a labour shortage.<\/p>","tag":""},{"p":"<p><b>Passage 4<\/b><br>Most of Nepal's hydropower plants are run-of-river projects: they divert part of a river's flow through turbines without building a large reservoir. Such plants are cheaper and displace fewer people, but their output depends on how much water the river carries. In the monsoon, rivers are full and the plants can produce more electricity than the country uses; in the dry winter months, flows drop sharply and output falls, just when demand for lighting and heating rises. Storage projects, which hold water behind a dam and release it when needed, can solve this seasonal mismatch, but they are expensive, take many years to build and may submerge villages and farmland. Some planners therefore argue for a mix: run-of-river plants for cheap monsoon power, a few carefully chosen storage projects for the dry season, and cross-border power trade, so that surplus monsoon electricity can be sold and winter shortfalls covered by imports.<\/p>"},{"id":"1.4.10","q":"<p>(Passage 4) According to the passage, the main drawback of run-of-river plants is that<\/p>","o":["their output falls in the dry season","they flood large areas of farmland","they cost more than storage projects","they cannot operate during the monsoon"],"a":0,"s":"<p>Their output depends on river flow, which \"drops sharply\" in the dry winter months.<br>Other options: B — flooding is a drawback of storage projects; C — run-of-river plants are described as cheaper; D — the monsoon is when they produce the most.<\/p>","tag":""},{"id":"1.4.11","q":"<p>(Passage 4) The phrase \"seasonal mismatch\" refers to<\/p>","o":["the difference in cost between the two types of plant","the gap between when electricity is produced and when it is most needed","the difference between summer and winter electricity tariffs charged to households","the disagreement between planners and villagers"],"a":1,"s":"<p>Output is high in the monsoon but low in winter, when demand rises; the mismatch is between supply and demand across seasons.<br>Other options: A, C and D — costs, tariffs and disputes are not what the phrase refers to.<\/p>","tag":""},{"id":"1.4.12","q":"<p>(Passage 4) The approach favoured by some planners can best be described as<\/p>","o":["building only storage projects","halting all new hydropower projects","relying entirely on electricity imported from across the border","combining several complementary approaches"],"a":3,"s":"<p>The planners argue for \"a mix\" of run-of-river plants, some storage projects and cross-border trade.<br>Other options: A, B and C each pick a single extreme, which is the opposite of a mix.<\/p>","tag":""},{"p":"<p><b>Passage 5<\/b><br>Not long ago, paying a shopkeeper in Kathmandu meant counting out notes and waiting for change. Today many customers simply scan a QR code with their phone. Digital payments offer clear advantages: they are fast, they reduce the risk of carrying cash, and they leave a record that helps small businesses keep accounts and, in time, obtain credit. For the government, an economy less dependent on cash makes it harder to hide income from the tax authorities. Yet the shift is not without costs. People without smartphones, reliable internet or digital skills, often the elderly and the rural poor, risk being left behind. Fraud, too, has changed its form: instead of pickpockets, users now face fake messages that trick them into revealing their PINs. A sensible policy, critics argue, would continue to promote digital payments while making sure that cash is still accepted and that users are taught how to recognise online fraud.<\/p>"},{"id":"1.4.13","q":"<p>(Passage 5) Which advantage of digital payments is mentioned in the passage?<\/p>","o":["They eliminate all kinds of fraud, including pickpocketing and fake messages.","They lower the prices of goods.","They leave a record that can help small businesses obtain credit.","They remove the need for banks."],"a":2,"s":"<p>The passage says digital payments \"leave a record that helps small businesses keep accounts and, in time, obtain credit\".<br>Other options: A — fraud has only changed form; B and D — prices and banks are not mentioned.<\/p>","tag":""},{"id":"1.4.14","q":"<p>(Passage 5) According to the passage, who risk being left behind by the shift to digital payments?<\/p>","o":["People without smartphones, reliable internet or digital skills","Large businesses in cities that handle thousands of payments a day","Tax authorities","Young urban shoppers"],"a":0,"s":"<p>The passage names \"people without smartphones, reliable internet or digital skills, often the elderly and the rural poor\".<br>Other options: B, C and D are not described as being left behind; the tax authorities in fact gain.<\/p>","tag":""},{"id":"1.4.15","q":"<p>(Passage 5) What does the passage say about fraud?<\/p>","o":["It has disappeared with digital payments.","It is now impossible to prevent.","It has changed its form.","It affects only shopkeepers."],"a":2,"s":"<p>\"Fraud, too, has changed its form\": fake messages have replaced pickpockets.<br>Other options: A — fraud still exists; B — the passage suggests teaching users to recognise it, so it is not impossible to prevent; D — the passage refers to users in general.<\/p>","tag":""},{"p":"<p><b>Passage 6<\/b><br>For much of the twentieth century, leadership was imagined as a set of inborn traits: height, a commanding voice, confidence. Research has steadily weakened this view. Studies of effective teams show that what matters is less the leader's personality than how the leader behaves: whether goals are made clear, whether members feel safe to raise problems, and whether credit and blame are shared fairly. One influential idea is \"psychological safety\", the shared belief that a team member will not be punished or humiliated for speaking up with ideas, questions or mistakes. Teams with high psychological safety report more errors, not because they make more, but because they admit them, which allows the errors to be fixed early. A leader who reacts to bad news with anger teaches the team to hide problems until they become crises. The lesson is encouraging: if leadership is largely a matter of behaviour, it can be learned.<\/p>"},{"id":"1.4.16","q":"<p>(Passage 6) According to the passage, teams with high psychological safety report more errors because<\/p>","o":["they are less skilled than other teams","they are more willing to admit their errors","their leaders react angrily to mistakes","their goals are unclear"],"a":1,"s":"<p>The passage says they report more errors \"not because they make more, but because they admit them\".<br>Other options: A — the passage rules out making more errors; C — angry leaders cause problems to be hidden; D — clear goals are part of good leadership, not a cause of reporting.<\/p>","tag":""},{"id":"1.4.17","q":"<p>(Passage 6) The older view of leadership described in the passage held that<\/p>","o":["leadership can be learned through practice","a leader's behaviour matters most","psychological safety is the key to success","leaders are born with certain traits"],"a":3,"s":"<p>Leadership \"was imagined as a set of inborn traits: height, a commanding voice, confidence\".<br>Other options: A, B and C belong to the newer, research-based view.<\/p>","tag":""},{"id":"1.4.18","q":"<p>(Passage 6) Which conclusion does the author draw?<\/p>","o":["Leadership can be developed through learning.","Only people with natural traits can become leaders.","Teams should avoid reporting errors.","Angry leaders produce better results."],"a":0,"s":"<p>The final sentence: \"if leadership is largely a matter of behaviour, it can be learned.\"<br>Other options: B — this is the older view the author rejects; C — the passage praises reporting errors; D — anger leads to hidden problems and crises.<\/p>","tag":""},{"p":"<p><b>Passage 7<\/b><br>In the 1970s, many hillsides in Nepal were rapidly losing their forests. Government ownership had not stopped the cutting; villagers who depended on the forests for firewood and fodder had little reason to protect land that was not theirs to manage. Over the following decades, the state handed responsibility for many forests to local community forest user groups. These groups decide how much timber, firewood and fodder may be taken, set fees and hire forest watchers. Because the people who depend on a forest now also manage it, they have a stake in keeping it healthy. Satellite images and field studies suggest that forest cover has recovered in many areas managed this way. Problems remain: wealthier households sometimes dominate group decisions, and poorer members, who rely most on forest products, may find that the new rules restrict them the most. Still, the experience is widely cited as evidence that local communities, given clear rights and responsibilities, can manage shared resources well.<\/p>"},{"id":"1.4.19","q":"<p>(Passage 7) What is the central claim of the passage?<\/p>","o":["Government ownership is the best way to protect forests from villagers who cut them for firewood.","Forests that have been cut can never recover.","Local communities with clear rights and responsibilities can manage shared resources well.","Satellite images of forests are unreliable."],"a":2,"s":"<p>The final sentence states this conclusion, supported by the recovery of forest cover under user groups.<br>Other options: A — government ownership \"had not stopped the cutting\"; B — the passage says forest cover has recovered; D — satellite images are used as evidence, not doubted.<\/p>","tag":""},{"id":"1.4.20","q":"<p>(Passage 7) Which problem with community forestry does the passage mention?<\/p>","o":["Forest cover declined even further.","User groups set no rules at all.","The state took the forests back from the user groups after the trees recovered.","Wealthier households sometimes dominate group decisions."],"a":3,"s":"<p>\"Wealthier households sometimes dominate group decisions\" is stated directly.<br>Other options: A — forest cover recovered; B — the groups set rules on harvesting, fees and watchers; C — nothing is said about the state taking forests back.<\/p>","tag":""},{"id":"1.4.21","q":"<p>(Passage 7) As used in the passage, \"have a stake in\" most nearly means<\/p>","o":["have a personal interest in","drive a post into","have a legal dispute over","hold the legal title to"],"a":0,"s":"<p>People who manage and depend on a forest gain from its health, i.e. they have a personal interest in it.<br>Other options: B — the literal sense of a wooden stake; C — no dispute is implied; D — the passage speaks of management responsibility, not ownership.<\/p>","tag":""},{"p":"<p><b>Passage 8<\/b><br>Ask one group of people whether the population of a certain city is more or less than five million, and then ask them to estimate it. Ask a second group the same, but begin with \"more or less than half a million\". The first group's estimates will be far higher. This effect is called anchoring: an initial number, even one known to be irrelevant, pulls later judgements towards it. Anchoring appears in negotiations, where the first offer shapes the final price; in shops, where a high \"original price\" makes a discount look generous; and in salary discussions. Experience does not protect us. In experiments, estate agents' valuations of the same house were swayed by the asking price they were shown, though most denied that it had influenced them. The best defence is awareness combined with preparation: decide on your own estimate, based on independent information, before you see anyone else's number.<\/p>"},{"id":"1.4.22","q":"<p>(Passage 8) As described in the passage, anchoring is<\/p>","o":["a refusal to negotiate on price","the tendency of an initial number to pull later judgements towards it","a preference for round numbers","a habit of underestimating the populations of large cities when asked to guess"],"a":1,"s":"<p>The passage defines anchoring as \"an initial number, even one known to be irrelevant, pulls later judgements towards it\".<br>Other options: A, C and D are not what the passage describes.<\/p>","tag":""},{"id":"1.4.23","q":"<p>(Passage 8) The example of the estate agents is used to show that<\/p>","o":["estate agents are dishonest","houses are usually overpriced by agents who want a larger commission","even experienced professionals are affected by anchoring","asking prices are always accurate"],"a":2,"s":"<p>It follows \"Experience does not protect us\": agents' valuations were swayed by the asking price.<br>Other options: A — the agents are not accused of dishonesty; B and D — the passage makes no claim about whether prices are high or accurate.<\/p>","tag":""},{"id":"1.4.24","q":"<p>(Passage 8) Which strategy does the author recommend against anchoring?<\/p>","o":["Always make the first offer yourself, so that the other side is anchored to your number.","Avoid all negotiations.","Trust the asking price.","Form your own estimate from independent information before seeing others' figures."],"a":3,"s":"<p>\"Decide on your own estimate, based on independent information, before you see anyone else's number.\"<br>Other options: A — not recommended in the passage; B — avoiding negotiation is not suggested; C — trusting the asking price is exactly how anchoring works.<\/p>","tag":""},{"p":"<p><b>Passage 9<\/b><br>Kathmandu Valley has grown rapidly over the past few decades as people arrive in search of jobs, education and services. Much of the fertile farmland that once surrounded the old towns has been covered by houses. Because a large part of this growth has been unplanned, many new neighbourhoods have lanes too narrow for fire engines, little open space and poor drainage. Air pollution, traffic jams and shortages of drinking water have become everyday concerns. Every monsoon, blocked drains turn some streets into streams. The earthquake of 2015 taught another lesson: open spaces serve as emergency shelters, and buildings constructed without following building codes can be deadly. Urban experts argue that the answer is not to stop people moving to the city, which is neither possible nor desirable, but to plan for growth: enforce building codes, protect open spaces, invest in public transport and develop other cities, so that opportunities are not concentrated in a single valley.<\/p>"},{"id":"1.4.25","q":"<p>(Passage 9) According to the passage, the problems of the new neighbourhoods arise mainly from<\/p>","o":["largely unplanned growth","the 2015 earthquake alone","too few people moving to the city","too much public transport"],"a":0,"s":"<p>The passage links narrow lanes, little open space and poor drainage directly to growth that has been \"unplanned\".<br>Other options: B — the earthquake taught a lesson but did not create these problems; C — the opposite is true; D — the passage calls for more public transport.<\/p>","tag":""},{"id":"1.4.26","q":"<p>(Passage 9) What lesson did the 2015 earthquake teach, according to the passage?<\/p>","o":["Tall buildings are always safer.","Open spaces serve as shelters, and buildings that ignore codes can be deadly.","Everyone should leave the valley and settle in other cities where the ground is safer.","Poor drainage causes earthquakes."],"a":1,"s":"<p>This is stated directly in the passage.<br>Other options: A, C and D are not stated and D is absurd.<\/p>","tag":""},{"id":"1.4.27","q":"<p>(Passage 9) How do the urban experts view migration to the city?<\/p>","o":["It should be planned for rather than stopped.","It should be banned.","It should be encouraged without any limits.","It is the only cause of air pollution."],"a":0,"s":"<p>Experts say stopping migration is \"neither possible nor desirable\" and call for planning for growth.<br>Other options: B — they reject stopping it; C — they call for planning, not unlimited growth; D — the passage lists several problems without naming a single cause.<\/p>","tag":""},{"p":"<p><b>Passage 10<\/b><br>Sleep was long regarded as a passive state, a pause in the brain's activity. Modern research shows that the sleeping brain is busy. During deep sleep, memories of the day are replayed and moved from short-term storage into more lasting networks. Students who sleep after studying recall more than those who stay awake for the same period, even when total study time is the same. Sleep also clears waste products that build up in the brain during waking hours. Chronic lack of sleep, by contrast, is linked to poorer attention, weaker decision-making and a greater risk of illness. Even a single night of poor sleep can leave a person slower and more forgetful the next day. Ironically, students preparing for exams often give up sleep to study longer, undermining the very memory they are trying to build. The research suggests a simple rule: a night of good sleep is not time lost from study but part of it.<\/p>"},{"id":"1.4.28","q":"<p>(Passage 10) The \"irony\" mentioned in the passage is that<\/p>","o":["sleep clears waste products that build up in the brain during waking hours","deep sleep replays memories of the day","students who cut sleep to study harm the memory they are trying to build","lack of sleep is linked to illness"],"a":2,"s":"<p>Students give up sleep to remember more, yet losing sleep weakens memory; the result is the opposite of what they intend.<br>Other options: A, B and D are facts stated in the passage, but none is described as ironic.<\/p>","tag":""},{"id":"1.4.29","q":"<p>(Passage 10) Which statement is supported by the passage?<\/p>","o":["Sleep is a passive state.","Studying longer always improves results.","Memories are moved into lasting networks mainly while we are awake and studying.","Students who sleep after studying recall more than those who stay awake."],"a":3,"s":"<p>Stated directly: those who sleep after studying \"recall more than those who stay awake for the same period\".<br>Other options: A — this is the old view the passage rejects; B — the passage argues the opposite when study replaces sleep; C — the transfer happens during deep sleep.<\/p>","tag":""},{"id":"1.4.30","q":"<p>(Passage 10) Which is the most suitable title for the passage?<\/p>","o":["The Dangers of Studying","Sleep: An Active Partner in Learning","How to Pass Exams Without Studying","Waste Products in the Brain"],"a":1,"s":"<p>The passage presents sleep as active and essential to memory and learning.<br>Other options: A and C — the passage does not attack or dismiss studying; D — waste removal is only one detail.<\/p>","tag":""}]},{"k":"1.5","t":"Para Jumbles and Sentence Arrangement","items":[{"id":"1.5.1","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Word soon spread about his ginger tea, and the crowds grew.<br>Q. Ramesh opened a small tea shop near the bus park five years ago.<br>R. Today he employs four people and plans to open a second shop.<br>S. At first, he had only a few customers, mostly drivers waiting for their buses.<\/p>","o":["QSPR","QPSR","SQPR","QSRP"],"a":0,"s":"<p>Q introduces Ramesh and the shop; S (\"At first\") describes the slow start; P (\"soon ... the crowds grew\") shows growth; R (\"Today\") gives the present situation. Order: QSPR.<br>Other options: B — the crowds cannot grow before the slow start; C — S refers to \"he\" before Ramesh is introduced; D — \"Today\" must come last, after the growth.<\/p>","tag":""},{"id":"1.5.2","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Making a budget, however, is only the first step.<br>Q. Without one, households often find that their money runs out before the month does.<br>R. The harder part is sticking to it when temptations arise.<br>S. A budget is a plan for how money will be earned and spent over a period.<\/p>","o":["SPQR","QSPR","SQRP","SQPR"],"a":3,"s":"<p>S defines a budget; Q (\"Without one\") follows the definition; P (\"however, only the first step\") turns the argument; R (\"The harder part\") completes the contrast with \"first step\". Order: SQPR.<br>Other options: A — P's \"however\" has nothing to contrast with directly after the definition; B — \"Without one\" needs the noun \"budget\" first; C — \"The harder part\" cannot come before \"only the first step\".<\/p>","tag":""},{"id":"1.5.3","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. As a result, literacy spread and new ideas travelled faster than ever.<br>Q. Before it, books were copied by hand and were rare and costly.<br>R. The invention of the printing press in the fifteenth century transformed Europe.<br>S. Afterwards, they could be produced quickly and in large numbers.<\/p>","o":["RSQP","QRSP","RQSP","RQPS"],"a":2,"s":"<p>R introduces the printing press; Q (\"Before it\") and S (\"Afterwards\") form a before/after pair; P (\"As a result\") states the consequence. Order: RQSP.<br>Other options: A — \"Afterwards\" before \"Before it\" breaks the time order; B — \"it\" in Q needs R first; D — the result cannot come before the change it results from.<\/p>","tag":""},{"id":"1.5.4","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. These very qualities, however, make them a serious environmental problem.<br>Q. Several cities have therefore banned or taxed them.<br>R. Plastic bags are cheap, light and convenient.<br>S. Because they are cheap, they are used once and thrown away; because they are light, they are carried by wind into rivers and fields.<\/p>","o":["RSPQ","PRSQ","RPQS","RPSQ"],"a":3,"s":"<p>R lists the qualities; P (\"These very qualities, however\") turns them into a problem; S explains how each quality causes harm; Q (\"therefore\") gives the response. Order: RPSQ.<br>Other options: A — S explains the problem before P names it; B — P's \"These qualities\" needs R first; C — the response (Q) should follow the explanation (S).<\/p>","tag":""},{"id":"1.5.5","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Mina had always wanted to learn to swim.<br>Q. At the age of thirty, she finally enrolled in a beginners' class.<br>R. As a child, however, she had nearly drowned in a river, and the fear stayed with her.<br>S. By the end of the course, she could swim the length of the pool without stopping.<\/p>","o":["PQRS","PRQS","RPQS","PRSQ"],"a":1,"s":"<p>P states the wish; R (\"however\") gives the obstacle; Q (\"finally\") shows her overcoming it; S (\"By the end of the course\") gives the outcome. Order: PRQS.<br>Other options: A — \"finally\" needs the obstacle first; C — R uses \"she\" before Mina is named; D — the course must begin before it ends.<\/p>","tag":""},{"id":"1.5.6","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Compound interest, by contrast, is calculated on the principal plus the interest already earned.<br>Q. Interest is the price paid for the use of borrowed money.<br>R. This is why a deposit grows much faster under compounding over long periods.<br>S. Simple interest is calculated only on the original amount, the principal.<\/p>","o":["QSPR","QPRS","SQRP","QRSP"],"a":0,"s":"<p>Q defines interest; S gives simple interest; P (\"by contrast\") gives compound interest; R (\"This is why\") draws the conclusion. Order: QSPR.<br>Other options: B — \"by contrast\" needs simple interest first; C — the general definition should come first and R cannot precede P; D — R's conclusion needs both types explained first.<\/p>","tag":""},{"id":"1.5.7","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. By half past ten, however, only three of the twelve members had arrived.<br>Q. A new date was announced the following day.<br>R. The chairperson waited another fifteen minutes and then postponed it.<br>S. The meeting had been scheduled for ten o'clock.<\/p>","o":["SRPQ","PSRQ","SPRQ","SPQR"],"a":2,"s":"<p>The time sequence runs: scheduled for ten (S), few present by half past ten (P), waited and postponed (R), new date the next day (Q). Order: SPRQ.<br>Other options: A — the postponement needs the reason (P) first; B — \"however\" in P needs S first; D — a new date cannot be announced before the meeting is postponed.<\/p>","tag":""},{"id":"1.5.8","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. A brisk thirty-minute walk each day, then, may be as good for the mood as it is for the heart.<br>Q. Exercise is good for the body, but its benefits for the mind are less widely known.<br>R. It also appears to improve concentration and sleep.<br>S. Regular physical activity has been linked to lower levels of anxiety and depression.<\/p>","o":["QRSP","QSRP","SQRP","QSPR"],"a":1,"s":"<p>Q introduces the topic; S gives the first mental benefit; R (\"also\") adds another; P (\"then\") concludes. Order: QSRP.<br>Other options: A — \"also\" in R needs a benefit before it; C — the topic sentence should come first; D — the conclusion \"then\" must come last.<\/p>","tag":""},{"id":"1.5.9","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Sita applied for a loan to expand her tailoring business.<br>Q. She had kept careful records, so she was able to provide them within a day.<br>R. Her loan was approved the following week.<br>S. The bank asked for a business plan and two years of accounts.<\/p>","o":["PQSR","SPQR","PSRQ","PSQR"],"a":3,"s":"<p>Application (P), bank's request (S), she provides the documents (Q, \"them\" = the plan and accounts), approval (R). Order: PSQR.<br>Other options: A — \"them\" in Q needs S first; B — the bank cannot ask before she applies; C — approval cannot come before the documents are supplied.<\/p>","tag":""},{"id":"1.5.10","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. A good presentation begins long before the speaker stands up.<br>P. Next, the material should be arranged so that each point leads naturally to the next.<br>Q. Finally, the whole talk should be rehearsed aloud, preferably in front of a friend.<br>R. First, the speaker must be clear about what the audience needs to know.<\/p>","o":["RPQ","PRQ","RQP","QRP"],"a":0,"s":"<p>The sequence words decide the order: First (R), Next (P), Finally (Q).<br>Other options: B, C and D each break the First-Next-Finally sequence.<\/p>","tag":""},{"id":"1.5.11","q":"<p>The first sentence (S1) is given. Arrange P, Q and R to complete the paragraph.<br>S1. Mobile phones have changed the way farmers in remote areas do business.<br>P. Now they can check prices in several markets by phone before deciding where to sell.<br>Q. Earlier, they had to rely on middlemen to tell them what their crops were worth.<br>R. A
