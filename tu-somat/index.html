eras in all classrooms.<br>Assumptions: I. Students of this school are dishonest. II. Teachers of this school do not teach well.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":3,"s":"<p>Cameras may be for safety or general monitoring; the decision does not assume either sweeping judgement. Neither is implicit.<br>Other options: A — I is not implicit; B — II is not implicit; C — I is not implicit and II is not implicit.<\/p>","tag":""},{"id":"3.5.25","q":"<p>Statement: \"If you want to reach Pokhara quickly, take a flight,\" said the travel agent.<br>Assumptions: I. Flying to Pokhara is faster than the other ways of getting there. II. Flights to Pokhara are cheap.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":0,"s":"<p>The advice rests on flying being quicker (I). Cost is not part of the advice (II).<br>Other options: B — II is not implicit and I is also implicit; C — II is not implicit; D — I is implicit.<\/p>","tag":""},{"id":"3.5.26","q":"<p>Statement: The government has raised the passport fee to cover the cost of new e-passports.<br>Assumptions: I. Demand for passports will fall sharply. II. The old fee did not fully cover the cost of e-passports.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":1,"s":"<p>Raising a fee \"to cover the cost\" assumes the old fee fell short (II). A sharp fall in demand is not assumed and would defeat the aim (I).<br>Other options: A — I is not implicit and II is also implicit; C — I is not implicit; D — II is implicit.<\/p>","tag":""},{"id":"3.5.27","q":"<p>Statement: A shop announced, \"Buy two shirts and get one free.\"<br>Assumptions: I. The shop is closing down. II. Customers do not like shirts.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":3,"s":"<p>Such offers are used to raise sales; neither closure nor dislike of shirts is assumed.<br>Other options: A — I is not implicit; B — II is not implicit; C — I is not implicit and II is not implicit.<\/p>","tag":""},{"id":"3.5.28","q":"<p>Statement: The municipality has asked residents to separate wet and dry waste before handing it over.<br>Assumptions: I. Residents can tell wet waste from dry waste. II. Separated waste is easier to handle or recycle.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":2,"s":"<p>The request assumes residents are able to sort waste (I) and that sorting serves a purpose such as easier handling (II). Both are implicit.<br>Other options: A — II is also implicit; B — I is also implicit; D — I is implicit and II is implicit.<\/p>","tag":""},{"id":"3.5.29","q":"<p>Statement: \"Bring your own water bottle on the trek, as no water will be available on the route,\" said the guide.<br>Assumptions: I. Trekkers will need water during the trek. II. The trek will be cancelled if it rains.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":0,"s":"<p>The advice only makes sense if trekkers will need water (I). Rain and cancellation are not mentioned (II).<br>Other options: B — II is not implicit and I is also implicit; C — II is not implicit; D — I is implicit.<\/p>","tag":""},{"id":"3.5.30","q":"<p>Statement: A firm plans to advertise its new product on television only.<br>Assumptions: I. Nobody reads newspapers. II. Television advertising is free.<br>Which assumption(s) are implicit in the statement?<\/p>","o":["Only assumption I is implicit","Only assumption II is implicit","Both I and II are implicit","Neither I nor II is implicit"],"a":3,"s":"<p>The firm needs only to believe TV reaches enough buyers; it need not assume nobody reads newspapers or that TV ads cost nothing.<br>Other options: A — I is not implicit; B — II is not implicit; C — I is not implicit and II is not implicit.<\/p>","tag":""}]},{"k":"3.6","t":"Critical Reasoning, Data Sufficiency, Clocks and Calendars","items":[{"id":"3.6.1","q":"<p>A city built new bicycle lanes last year, and the number of cycling accidents fell by 30 per cent. The council concludes that the lanes made cycling safer. Which of the following, if true, most weakens the conclusion?<\/p>","o":["The number of people cycling in the city fell by about half during the same year.","Cyclists say they feel safer riding in the new lanes.","Several other cities have also built bicycle lanes.","The lanes cost more to build than was planned."],"a":0,"s":"<p>If far fewer people cycled, accidents would fall even if cycling were no safer. The fall in accidents may reflect less cycling, not safer lanes.<br>Other options: B — this supports the conclusion; C — other cities are irrelevant to this city's accident figures; D — cost has nothing to do with safety.<\/p>","tag":""},{"id":"3.6.2","q":"<p>A company says its new training programme raised sales productivity, because staff who completed it sold 15 per cent more in the following quarter. Which of the following, if true, most strengthens the claim?<\/p>","o":["The programme was expensive to run.","Sales usually rise in that quarter for all staff, whether or not they took the programme.","Staff who did not take the programme showed no change in sales in the same quarter.","Some staff found the programme boring."],"a":2,"s":"<p>If untrained staff showed no rise, the 15 per cent gain is more likely due to the programme rather than to seasonal or market factors.<br>Other options: A — cost does not bear on effectiveness; B — this weakens the claim by offering a seasonal explanation; D — how staff felt does not show whether sales rose because of it.<\/p>","tag":""},{"id":"3.6.3","q":"<p>\"Our hotel's occupancy will rise next season because the new airport will bring more tourists to the city.\" Which assumption does this argument depend on?<\/p>","o":["The new airport will be the largest in the country.","All tourists prefer hotels to homestays.","The hotel will reduce its room rates.","Some of the additional tourists will choose to stay at our hotel."],"a":3,"s":"<p>More tourists in the city raise the hotel's occupancy only if at least some of them stay there. Without this, the conclusion fails.<br>Other options: A — the airport's size is irrelevant; B — too strong; the argument needs only some tourists to stay; C — the argument does not rely on price cuts.<\/p>","tag":""},{"id":"3.6.4","q":"<p>Every member of the debate club is a member of the library. Some library members are first-year students. Which of the following must be true?<\/p>","o":["Some debate club members are first-year students.","Anyone who is not a library member is not in the debate club.","All library members are in the debate club.","No first-year student is in the debate club."],"a":1,"s":"<p>If all debate club members are library members, then a non-member of the library cannot be in the debate club (the contrapositive).<br>Other options: A — possible but not certain; the first-year students may be outside the club; C — reverses the first statement; D — possible but not certain.<\/p>","tag":""},{"id":"3.6.5","q":"<p>Shops that play soft music record higher sales than shops that do not. A consultant concludes that soft music makes customers buy more. Which of the following, if true, most weakens the conclusion?<\/p>","o":["Most shops that play soft music are in malls visited by high-income shoppers.","Many customers say they enjoy hearing soft music while they browse and shop in stores.","Loud music annoys some customers.","Playing soft music costs very little."],"a":0,"s":"<p>This offers another cause for higher sales (richer shoppers in malls), so the music may not be responsible.<br>Other options: B — this slightly supports the conclusion; C — about loud music, not soft music and sales; D — cost does not bear on the cause of higher sales.<\/p>","tag":""},{"id":"3.6.6","q":"<p>A bank cut the interest rate on its loans, yet the total amount it lent fell. Which of the following, if true, best explains this?<\/p>","o":["The bank's deposit rates were unchanged.","Other banks cut their loan rates by even more during the same period.","Lower loan rates usually attract borrowers.","The bank opened two new branches."],"a":1,"s":"<p>If competitors became cheaper still, borrowers would move to them, so this bank's lending could fall despite its own cut.<br>Other options: A — does not explain why lending fell; C — deepens the puzzle instead of explaining it; D — new branches would, if anything, raise lending.<\/p>","tag":""},{"id":"3.6.7","q":"<p>Nepal's tea exports rose after a national quality mark was introduced, so the mark helped exports. Which of the following, if true, most strengthens this argument?<\/p>","o":["World tea prices rose sharply during the same period, raising the value of all tea exports.","The quality mark was designed by a private firm.","Exports of tea without the quality mark did not rise over the same period.","Nepal also exports coffee."],"a":2,"s":"<p>If only marked tea gained, the mark is the likely cause; a general market boom is ruled out.<br>Other options: A — this weakens the argument by offering another cause; B — who designed the mark is irrelevant; D — coffee exports are irrelevant.<\/p>","tag":""},{"id":"3.6.8","q":"<p>\"To reduce traffic jams in the city centre, the city should raise parking fees there.\" Which assumption does this argument depend on?<\/p>","o":["Public buses are always crowded.","Parking fees are the city's main source of income, so higher fees will fund more roads.","Everyone in the city owns a car.","Higher parking fees will lead some people to drive into the centre less often."],"a":3,"s":"<p>The plan cuts traffic only if higher fees change some drivers' behaviour.<br>Other options: A — not needed; if anything it works against the plan; B — income is not the argument's point; C — far too strong and not needed.<\/p>","tag":""},{"id":"3.6.9","q":"<p>In a survey of employees, 60 per cent said they prefer working from home and 70 per cent said they want flexible hours. Which of the following must be true?<\/p>","o":["At least 30 per cent of the employees want both.","Exactly 30 per cent of the employees want both.","At most 30 per cent of the employees want both.","No employee wants both."],"a":0,"s":"<p>The overlap is at least 60 + 70 − 100 = 30 per cent and could be as high as 60 per cent. So \"at least 30 per cent\" is the only certain statement.<br>Other options: B — the overlap can be anywhere from 30 to 60 per cent; C — 30 per cent is the minimum, not the maximum; D — the groups must overlap by at least 30 per cent.<\/p>","tag":""},{"id":"3.6.10","q":"<p>A school's pass rate rose from 70 to 85 per cent after it hired more teachers, so the principal concludes that hiring teachers improves results. Which of the following, if true, most weakens the conclusion?<\/p>","o":["The new teachers had more experience than the old ones.","That year the examination board made the papers easier, and pass rates rose in all schools.","Class sizes fell after the new teachers joined.","Parents approved of the decision to hire more teachers."],"a":1,"s":"<p>An easier examination offers another cause for the rise, so the hiring may not explain it.<br>Other options: A — supports the conclusion; C — supports the conclusion by showing how hiring could help; D — approval says nothing about results.<\/p>","tag":""},{"id":"3.6.11","q":"<p>Data sufficiency. Question: What is the value of x?<br>I. 3x + 5 = 20<br>II. x² = 25<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>I gives x = 5. II gives x = 5 or −5, so II alone is not enough.<br>Other options: B — II alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.12","q":"<p>Data sufficiency. Question: Is the integer n even?<br>I. n is a multiple of 3.<br>II. n + 1 is odd.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>II: if n + 1 is odd, n is even. I: multiples of 3 can be even (6) or odd (9).<br>Other options: A — I alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.13","q":"<p>Data sufficiency. Question: What is the price of one pen?<br>I. Two pens and three pencils cost Rs 70.<br>II. One pen and one pencil cost Rs 30.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":2,"s":"<p>Together: 2p + 3q = 70 and p + q = 30 give q = 10 and p = 20. Each statement alone has two unknowns.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; D — the statements are sufficient when used together.<\/p>","tag":""},{"id":"3.6.14","q":"<p>Data sufficiency. Question: How old is Ravi?<br>I. Ravi is 4 years older than Sita.<br>II. Sita is 2 years younger than Mohan.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":3,"s":"<p>Both statements give only differences between ages; no actual age is known, so Ravi's age cannot be found.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; C — even together they are not sufficient.<\/p>","tag":""},{"id":"3.6.15","q":"<p>Data sufficiency. Question: In which direction is Q from P?<br>I. P is to the south of Q.<br>II. R is to the east of P.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>I: if P is south of Q, then Q is north of P. II says nothing about Q.<br>Other options: B — II alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.16","q":"<p>Data sufficiency. Question: How many students are in the class?<br>I. Ram ranks 10th from the top.<br>II. Ram ranks 10th from the top and 21st from the bottom.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>II: total = 10 + 21 − 1 = 30. I gives no information about the bottom.<br>Other options: A — I alone is not sufficient; C — one statement alone is already sufficient; D — the statements are sufficient.<\/p>","tag":""},{"id":"3.6.17","q":"<p>Data sufficiency. Question: On which day of the week was 1 March of a certain year?<br>I. 1 February of that year was a Sunday.<br>II. That year was not a leap year.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":2,"s":"<p>Together: February has 28 days, so 1 March is 28 days after a Sunday, i.e. a Sunday. Alone, I leaves the leap-year question open (Sunday or Monday), and II gives no day.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; D — the statements are sufficient when used together.<\/p>","tag":""},{"id":"3.6.18","q":"<p>Data sufficiency. Question: Is A the grandfather of D?<br>I. A is the father of B.<br>II. C is the mother of D.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":3,"s":"<p>Together we know A's child (B) and D's mother (C), but nothing links B to C or to D, so the question cannot be answered.<br>Other options: A — I alone is not sufficient; B — II alone is not sufficient; C — even together they are not sufficient.<\/p>","tag":""},{"id":"3.6.19","q":"<p>What is the angle between the hour and minute hands of a clock at 3:40?<\/p>","o":["150°","170°","130°","110°"],"a":2,"s":"<p>Angle = |30H − 5.5M| = |90 − 220| = 130°. (The hour hand is at 90° + 20° = 110°, the minute hand at 240°.)<br>Other options: A — ignores the hour hand's 20° movement past 3; B — moves the hour hand back 20° instead of forward; D — uses 5 instead of 5.5 for the minute term.<\/p>","tag":""},{"id":"3.6.20","q":"<p>At what time between 4 and 5 o'clock are the hands of a clock together?<\/p>","o":["20 minutes past 4","24 minutes past 4","22 minutes past 4","21 9/11 minutes past 4"],"a":3,"s":"<p>The minute hand gains 5.5° per minute and must make up 120°: 120 ÷ 5.5 = 240/11 = 21 9/11 minutes.<br>Other options: A — ignores the hour hand's movement; B — uses a relative speed of 5° per minute instead of 5.5°; C — rounds 21 9/11 up; the exact time is needed.<\/p>","tag":""},{"id":"3.6.21","q":"<p>The mirror image of a clock shows the time 4:20. What is the actual time?<\/p>","o":["8:40","7:20","8:20","7:40"],"a":3,"s":"<p>For a mirror image, actual time = 11:60 − 4:20 = 7:40.<br>Other options: A — subtracts from 12:60; B — keeps the minutes unchanged; C — subtracts the hour from 12 and keeps the minutes.<\/p>","tag":""},{"id":"3.6.22","q":"<p>How many times do the hour and minute hands of a clock coincide in a day (24 hours)?<\/p>","o":["22","24","44","11"],"a":0,"s":"<p>The hands coincide 11 times in every 12 hours (the meeting near 11 and 12 is the same one at 12:00), so 22 times in 24 hours.<br>Other options: B — assumes once every hour; C — that is the number of times they are at right angles; D — that is for 12 hours only.<\/p>","tag":""},{"id":"3.6.23","q":"<p>A clock gains 5 minutes every hour. It is set right at 6 a.m. What time will it show at 6 p.m. on the same day?<\/p>","o":["6:55 p.m.","6:30 p.m.","7:00 p.m.","7:05 p.m."],"a":2,"s":"<p>In 12 hours it gains 12 × 5 = 60 minutes, so it shows 7:00 p.m.<br>Other options: A — counts only 11 hours; B — halves the gain; D — counts 13 hours.<\/p>","tag":""},{"id":"3.6.24","q":"<p>What is the angle between the hands of a clock at 7:20?<\/p>","o":["90°","100°","110°","80°"],"a":1,"s":"<p>Angle = |30 × 7 − 5.5 × 20| = |210 − 110| = 100°. (The hour hand is at 210° + 10° = 220°, the minute hand at 120°.)<br>Other options: A — ignores the hour hand's 10° movement past 7; C — uses 5 instead of 5.5 for the minute term; D — moves the hour hand back 10° instead of forward.<\/p>","tag":""},{"id":"3.6.25","q":"<p>If 1 January 2023 was a Sunday, what day of the week was 1 January 2024?<\/p>","o":["Sunday","Tuesday","Saturday","Monday"],"a":3,"s":"<p>2023 is not a leap year: 365 days = 52 weeks + 1 odd day, so the day moves on by one, to Monday.<br>Other options: A — ignores the odd day; B — treats 2023 as a leap year; C — moves the day backwards.<\/p>","tag":""},{"id":"3.6.26","q":"<p>What day of the week was 15 August 1947?<\/p>","o":["Thursday","Saturday","Friday","Sunday"],"a":2,"s":"<p>Counting odd days: 1600 years → 0; 300 years → 1; 46 years (11 leap) → 46 + 11 = 57 → 1; 1 Jan to 15 Aug 1947 = 31+28+31+30+31+30+31+15 = 227 days → 3. Total 0 + 1 + 1 + 3 = 5 → Friday.<br>Other options: A — one odd day too few; B — one odd day too many (treats 1947 as a leap year); D — two odd days too many.<\/p>","tag":""},{"id":"3.6.27","q":"<p>If today is Wednesday, what day of the week will it be after 100 days?<\/p>","o":["Friday","Thursday","Saturday","Wednesday"],"a":0,"s":"<p>100 = 14 × 7 + 2, so the day moves on by 2: Wednesday → Friday.<br>Other options: B — moves on by only 1; C — moves on by 3; D — assumes 100 is a multiple of 7.<\/p>","tag":""},{"id":"3.6.28","q":"<p>How many odd days are there in a leap year?<\/p>","o":["1","2","0","3"],"a":1,"s":"<p>A leap year has 366 days = 52 weeks + 2 days, so 2 odd days.<br>Other options: A — that is for an ordinary year; C — ignores the extra days beyond 52 weeks; D — one too many.<\/p>","tag":""},{"id":"3.6.29","q":"<p>Which year will have exactly the same calendar as 2021?<\/p>","o":["2027","2026","2032","2025"],"a":0,"s":"<p>2021 starts on a Friday and is not a leap year. Adding odd days (2021: 1, 2022: 1, 2023: 1, 2024: 2, 2025: 1, 2026: 1) gives 7 by the end of 2026, so 2027 also starts on a Friday and is not a leap year.<br>Other options: B — 2026 starts on a Thursday; C — 2032 is a leap year; D — 2025 starts on a Wednesday.<\/p>","tag":""},{"id":"3.6.30","q":"<p>In a certain year, 1 March is a Tuesday. What day of the week is 1 November of the same year?<\/p>","o":["Wednesday","Monday","Thursday","Tuesday"],"a":3,"s":"<p>From 1 March to 1 November: 31 + 30 + 31 + 30 + 31 + 31 + 30 + 31 = 245 days = 35 weeks exactly, so 1 November is also a Tuesday. (February is not involved, so leap years do not matter.)<br>Other options: A — adds a false odd day; B — subtracts a false odd day; C — adds two false odd days.<\/p>","tag":""}]}]}],"mock":[{"m":1,"secs":[{"t":"Section 1 · Verbal Ability (40)","items":[{"id":"M1.1.1","q":"<p>Choose the word closest in meaning to OBSTREPEROUS.<\/p>","o":["stubbornly determined","extremely careful","shy and withdrawn","noisy and unruly"],"a":3,"s":"<p>Obstreperous describes someone who is noisy, difficult to control and resists instructions.<br>Other options: A — a confusion with \"obstinate\"; obstreperous stresses noise and unruliness; B — unrelated; this is the meaning of \"meticulous\"; C — nearly the opposite: an obstreperous person is loud, not withdrawn.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.1.2","q":"<p>Choose the word most nearly opposite in meaning to PROFLIGATE.<\/p>","o":["immoral","thrifty","wasteful","profitable"],"a":1,"s":"<p>Profligate means recklessly wasteful, especially with money; the opposite is thrifty (careful with money).<br>Other options: A — profligate can also mean dissolute, so this is close to a synonym, not an opposite; C — this is a synonym of profligate, not its opposite; D — a look-alike word; profligate has nothing to do with profit.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.1.3","q":"<p>Choose the word closest in meaning to EQUIVOCAL.<\/p>","o":["ambiguous","equivalent","balanced","certain"],"a":0,"s":"<p>Equivocal means open to more than one interpretation, often deliberately unclear: ambiguous.<br>Other options: B — a look-alike trap from the prefix \"equi-\"; C — \"equi-\" again suggests balance, but equivocal is about unclear meaning; D — this is nearly the opposite of equivocal.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.1.4","q":"<p>In which sentence is the word \"discreet\" used correctly?<\/p>","o":["The accountant discreeted the old files before the audit.","The survey divided the market into three discreet segments.","The manager made a discreet inquiry about the candidate's previous employer.","The two chemicals remained discreet after they were poured into the same beaker and stirred."],"a":2,"s":"<p>Discreet means careful not to attract attention or cause embarrassment; a quiet, tactful inquiry is discreet.<br>Other options: A — \"discreet\" is an adjective and cannot be used as a verb; B — separate, distinct segments are \"discrete\", not \"discreet\"; D — again \"discrete\" (separate) is the word needed.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.1.5","q":"<p>Choose the word most nearly opposite in meaning to EXACERBATE.<\/p>","o":["exaggerate","aggravate","alleviate","examine"],"a":2,"s":"<p>Exacerbate means to make a problem worse; alleviate means to make it less severe.<br>Other options: A — a look-alike word meaning to overstate, not an opposite; B — this is a synonym of exacerbate; D — unrelated look-alike word.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.1.6","q":"<p>Choose the word closest in meaning to PERFUNCTORY.<\/p>","o":["thorough and painstaking","performed in front of an audience at a formal ceremony","urgently required","done as a routine, with little care or interest"],"a":3,"s":"<p>A perfunctory action is carried out only because it must be, with minimum effort.<br>Other options: A — nearly the opposite of perfunctory; B — a confusion with \"performance\"; C — unrelated; perfunctory says nothing about urgency.<\/p>","tag":"1.1 Vocabulary"},{"id":"M1.1.7","q":"<p>Choose the pair that best completes the sentence: \"Although the chairman's speech was ___, promising sweeping change, the board's actual decisions were ___, leaving most practices untouched.\"<\/p>","o":["grandiose, modest","modest, sweeping","vague, radical","brief, hasty"],"a":0,"s":"<p>\"Although\" sets up a contrast between big promises and small action: grandiose (ambitious, showy) vs modest.<br>Other options: B — reverses the contrast; \"promising sweeping change\" cannot describe a modest speech; C — radical decisions would not leave most practices untouched; D — neither word fits \"promising sweeping change\" or \"leaving practices untouched\".<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M1.1.8","q":"<p>Choose the word that best completes the sentence: \"The auditor's report was deliberately ___: it hinted at irregularities without naming anyone.\"<\/p>","o":["celebratory","oblique","exhaustive","explicit"],"a":1,"s":"<p>Oblique means indirect; hinting without naming is an indirect way of saying something.<br>Other options: A — the tone of a report about irregularities would not be celebratory; C — exhaustive means complete in detail, which does not fit \"hinted\"; D — explicit means stated clearly, the opposite of hinting.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M1.1.9","q":"<p>Choose the pair that best completes the sentence: \"Far from being a ___ fad, the shift to online shopping has proved ___, outlasting the pandemic that triggered it.\"<\/p>","o":["costly, cheap","lasting, temporary","passing, fragile","passing, durable"],"a":3,"s":"<p>\"Far from being\" rejects the first idea (a passing fad) and \"outlasting\" requires the second word to mean lasting: durable.<br>Other options: A — the sentence is about duration, not cost; B — reverses both meanings; a trend that outlasts its cause is not temporary; C — fragile contradicts \"outlasting the pandemic\".<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M1.1.10","q":"<p>Choose the word that best completes the sentence: \"The new tax rules are so ___ that even experienced lawyers struggle to interpret them.\"<\/p>","o":["concise","lenient","convoluted","lucid"],"a":2,"s":"<p>Convoluted means extremely complicated; that is why even lawyers struggle.<br>Other options: A — concise means brief; brevity does not by itself cause confusion; B — lenient (not strict) does not explain difficulty of interpretation; D — lucid means clear, which would make interpretation easy.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M1.1.11","q":"<p>Fill in the blank: \"Not until the results were published ___ how badly the campaign had failed.\"<\/p>","o":["the party did realise","did the party realise","had realised the party","the party realised"],"a":1,"s":"<p>A sentence that opens with \"Not until ...\" needs inverted word order in the main clause: auxiliary + subject + verb.<br>Other options: A — \"did\" must come before the subject, not after it; C — the verb cannot be placed before the subject in this way; D — normal word order is wrong after a fronted negative such as \"Not until\".<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M1.1.12","q":"<p>Choose the word that best completes the sentence: \"The firm's growth was ___ rather than sudden: revenue rose a little every quarter for a decade.\"<\/p>","o":["incremental","stagnant","meteoric","erratic"],"a":0,"s":"<p>Incremental means increasing by small steps, matching \"a little every quarter\".<br>Other options: B — stagnant means not growing, but revenue rose; C — meteoric means very rapid, which contradicts \"rather than sudden\"; D — erratic means irregular, but the growth was steady.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M1.1.13","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"<u>Having missed the last bus, a taxi was the only way for Rina<\/u> to reach the airport on time.\"<\/p>","o":["Having missed the last bus, a taxi was the only way for Rina","Having missed the last bus, the only way for Rina was a taxi","Because of missing the last bus, a taxi was the only way for Rina","Having missed the last bus, Rina had no option but a taxi"],"a":3,"s":"<p>The phrase \"Having missed the last bus\" must be followed by the person who missed it; only this option makes Rina the subject.<br>Other options: A — the opening phrase dangles: it says the taxi missed the bus; B — still dangling: \"the only way\" did not miss the bus; C — the subject is still \"a taxi\", and \"because of missing\" is awkward.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.14","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The training programme aims <u>to improve communication, building trust and the reduction of<\/u> conflict within teams.\"<\/p>","o":["to improve communication, building trust and the reduction of","to improve communication, build trust and reduce","to improve communication, to building trust and reducing","at improving communication, build trust and to reduce"],"a":1,"s":"<p>Items in a list must be parallel: \"to improve ..., (to) build ... and (to) reduce ...\".<br>Other options: A — three different forms (infinitive, -ing form, noun) break the parallel list; C — \"to building\" is ungrammatical here and the forms are still mixed; D — mixes \"-ing\", base form and infinitive, so the list is not parallel.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.15","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The salaries of bank officers in Kathmandu are higher <u>than teachers<\/u> in the same city.\"<\/p>","o":["than teachers","than that of teachers","than those of teachers","compared to teachers"],"a":2,"s":"<p>Salaries must be compared with salaries; \"those\" stands for the plural \"salaries\".<br>Other options: A — compares salaries with teachers, an illogical comparison; B — \"that\" is singular and cannot stand for \"salaries\"; D — still compares salaries with people, and \"higher compared to\" is unidiomatic.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.16","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The list of items that the auditors flagged <u>was sent<\/u> to the finance director last week.\"<\/p>","o":["was sent","have been sent","were being sent","were sent"],"a":0,"s":"<p>The subject is \"The list\" (singular), so \"was sent\" is correct; \"last week\" calls for the simple past. No change is needed.<br>Other options: B — plural, and the present perfect clashes with \"last week\"; C — plural, and the continuous form does not fit a completed action; D — the verb agrees with \"list\", not with \"items\" or \"auditors\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.17","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"If the company <u>would have invested<\/u> in solar panels in 2015, it would have saved millions in electricity bills.\"<\/p>","o":["would have invested","invested","had invested","has invested"],"a":2,"s":"<p>An unreal past condition (third conditional) uses \"had + past participle\" in the if-clause and \"would have + past participle\" in the main clause.<br>Other options: A — \"would have\" belongs in the result clause, not in the if-clause; B — the simple past forms a second conditional, which does not match \"would have saved\"; D — the present perfect cannot describe an unreal situation in 2015.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.18","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The new rules prohibit employees <u>to accept<\/u> gifts from suppliers.\"<\/p>","o":["to accept","in accepting","for accepting","from accepting"],"a":3,"s":"<p>The correct idiom is \"prohibit someone from doing something\".<br>Other options: A — \"prohibit\" is not followed by an infinitive; B — \"prohibit in\" is not idiomatic; C — \"prohibit for\" is not idiomatic.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.19","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"When Sunil met Ramesh at the conference, <u>he told him that his proposal had been approved<\/u>.\"<\/p>","o":["he told him that his proposal had been approved","Sunil told Ramesh that Ramesh's proposal had been approved","he told Ramesh that his proposal had approved","he told him that the proposal of his had been approved"],"a":1,"s":"<p>Naming the men removes the ambiguity of the pronouns.<br>Other options: A — \"he\", \"him\" and \"his\" could each refer to either man, so the meaning is unclear; C — \"his\" is still ambiguous, and \"had approved\" wrongly makes the proposal the one approving; D — still ambiguous, and \"the proposal of his\" is wordy.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M1.1.20","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The two companies <u>agreed to cooperate together jointly<\/u> on the new project.\"<\/p>","o":["agreed to cooperate together jointly","agreed for cooperating together","agreed to cooperate","agreed to jointly cooperate together"],"a":2,"s":"<p>\"Cooperate\" already contains the idea of acting together; the shortest version is correct and complete.<br>Other options: A — \"cooperate\" already means work together, so \"together jointly\" is doubly redundant; B — \"agree for\" is unidiomatic and \"together\" is redundant; D — still redundant twice over.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"p":"<p><b>Passage 1<\/b><br>When a firm asks new employees whether they wish to join its retirement savings plan, typically fewer than half sign up, even when the employer offers to match their contributions. Economists long treated this as a puzzle, since the match is, in effect, free money. One explanation, drawn from behavioural economics, is that people put off decisions whose costs are immediate but whose benefits lie decades away. Another is that the sheer number of fund choices paralyses them; faced with twenty options, many choose none.<br>In the early 2000s several American firms tried a simple change: instead of asking employees to opt in, they enrolled everyone automatically and allowed anyone who wished to leave to opt out. Participation among new hires jumped from below 50 per cent to above 85 per cent. Remarkably, few employees left the plan even years later, although leaving required only a single form.<br>The result has been hailed as proof that small changes in how choices are presented, often called \"nudges\", can achieve what costly incentives cannot. Yet critics point to a less flattering finding. Most automatically enrolled employees stayed not only in the plan but also at the default contribution rate, which firms had set low, often at 3 per cent of salary, to avoid deterring participation. Some workers who, under the old system, would have chosen to save 6 per cent or more ended up saving less. The default, in other words, shaped behaviour in both directions. Designers of such schemes have since experimented with \"auto-escalation\", in which the contribution rate rises a little each year unless the employee objects.<br>Questions 1.1.21 to 1.1.25 are based on this passage.<\/p>"},{"id":"M1.1.21","q":"<p>(Passage 1) The primary purpose of the passage is to<\/p>","o":["describe a change in how a choice was presented that raised participation, and note an unintended drawback of it","prove that behavioural economics has replaced traditional economics","explain why employees dislike having many fund choices","argue that employers should stop matching employees' contributions"],"a":0,"s":"<p>The passage explains automatic enrolment and its success (paragraph 2) and then the critics' point about low default rates (paragraph 3).<br>Other options: B — far too sweeping; the passage makes no such claim; C — fund choice is only one of two explanations in paragraph 1; D — the passage never argues against matching.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.22","q":"<p>(Passage 1) According to the passage, economists found low enrolment puzzling because<\/p>","o":["the enrolment forms were long and complicated","the default contribution rate was set too high","most employees were already saving enough through other pension and provident fund schemes","the employer match meant that employees were turning down what amounted to free money"],"a":3,"s":"<p>Paragraph 1 says the puzzle arose \"since the match is, in effect, free money\".<br>Other options: A — the passage says leaving needed only a single form; nothing is said about long forms; B — the default rate is discussed only for automatic enrolment, and it was low; C — not mentioned.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.23","q":"<p>(Passage 1) The passage states that firms set the default contribution rate low mainly in order to<\/p>","o":["reduce the cost of their own matching contributions to the employees' accounts","avoid discouraging employees from staying in the plan","comply with a legal limit on contributions","encourage employees to choose their own funds"],"a":1,"s":"<p>The passage says the rate was set low \"to avoid deterring participation\".<br>Other options: A — plausible, but the passage gives a different reason; C — no law is mentioned; D — not stated; the default rate is unrelated to fund choice.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.24","q":"<p>(Passage 1) The critics' concern would be most seriously weakened if it were found that<\/p>","o":["most automatically enrolled workers raised their contribution within a year to the rate they would have chosen under the old system","many firms offered more than twenty fund choices","the few employees who opted out did so in their first month","participation under automatic enrolment stayed above 85 per cent for a decade"],"a":0,"s":"<p>The critics' point is that some workers ended up saving less than they otherwise would; if they soon moved to their preferred rate, that harm disappears.<br>Other options: B — this relates to the puzzle in paragraph 1, not to the critics' point; C — timing of opt-outs is irrelevant to the low contribution rate; D — this concerns participation, not the contribution rate the critics worry about.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.25","q":"<p>(Passage 1) \"Auto-escalation\", as described in the passage, is designed to address which problem?<\/p>","o":["employers' reluctance to match contributions","employees' tendency to stay at a low default contribution rate","employees leaving the plan soon after joining","the large number of fund choices that left many employees unable to pick any"],"a":1,"s":"<p>Raising the rate a little each year unless the employee objects counters inertia at the low default rate.<br>Other options: A — not mentioned as a problem; C — the passage says few employees left; D — auto-escalation changes the contribution rate, not the number of funds.<\/p>","tag":"1.4 Reading comprehension"},{"p":"<p><b>Passage 2<\/b><br>Before the 1950s, loading a cargo ship was slow, labour-intensive work. Goods arrived at the port in sacks, barrels and crates of every size, and gangs of dockworkers carried them aboard piece by piece. A ship could spend as long in port as at sea, and theft and damage were routine. Handling at both ends of the voyage often accounted for more than half the total cost of moving goods between continents.<br>The standard steel container changed this. Because every box had the same dimensions and corner fittings, cranes could lift it directly from a lorry or a railway wagon onto a ship without anyone touching the goods inside. Loading times fell from days to hours, and insurance costs dropped because sealed boxes were harder to pilfer. Yet the container's effect on trade was slower than its engineering simplicity might suggest. Ports had to be rebuilt with large cranes and storage yards; shipping lines, railways and trade unions argued over standards and jobs; and for nearly two decades many exporters saw little benefit, because the ports at the other end had not yet adapted.<br>Economists who once credited the growth of trade after the Second World War chiefly to tariff cuts have recently revised that view. Studies comparing countries before and after their ports adopted containers suggest that containerisation raised trade among adopting countries by more than tariff reductions did over the same period. The lesson, some argue, is that the mundane plumbing of commerce can matter as much as the headline agreements negotiated by governments.<br>Questions 1.1.26 to 1.1.30 are based on this passage.<\/p>"},{"id":"M1.1.26","q":"<p>(Passage 2) Which of the following best states the main idea of the passage?<\/p>","o":["A simple technical change transformed world trade, although its full effect took time and was long underrated","Dockworkers' unions prevented the adoption of containers","Container ships were much faster at sea than older cargo ships","Tariff cuts had no effect on trade after the Second World War"],"a":0,"s":"<p>The passage describes the container's benefits, the slow adoption, and economists' recent recognition that it mattered more than tariff cuts.<br>Other options: B — unions argued over jobs, but containers were adopted; C — the passage is about time in port, not speed at sea; D — too extreme; the studies say containers raised trade by more than tariff cuts, not that tariff cuts had no effect.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.27","q":"<p>(Passage 2) According to the passage, before containers were introduced, handling costs at the ports<\/p>","o":["were paid mainly by governments","were lower than the cost of insurance","often made up more than half the total cost of moving goods between continents","fell steadily throughout the first half of the century as dockworkers became more efficient"],"a":2,"s":"<p>Stated directly at the end of paragraph 1.<br>Other options: A — not mentioned; B — no comparison with insurance is made; D — not stated; the passage describes handling as slow and costly.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.28","q":"<p>(Passage 2) It can be inferred from the passage that many exporters saw little early benefit from containers because<\/p>","o":["tariffs rose sharply during the same period","containers made theft of goods easier","ships carrying containers had to sail more slowly to keep the heavy stacked boxes from shifting at sea","the ports receiving their goods did not yet have the equipment to handle containers"],"a":3,"s":"<p>The passage says the ports \"at the other end had not yet adapted\", and adapting meant rebuilding with cranes and yards.<br>Other options: A — the passage mentions tariff cuts, not rises; B — the passage says sealed boxes were harder to pilfer; C — not mentioned.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.29","q":"<p>(Passage 2) The author mentions that \"theft and damage were routine\" most probably in order to<\/p>","o":["point out one of the costs that sealed containers later reduced","explain why ships were slow at sea","argue that insurance companies should be reformed so that cargo owners pay lower premiums","criticise the honesty of dockworkers"],"a":0,"s":"<p>Paragraph 2 says insurance costs fell because sealed boxes were harder to pilfer, so the earlier remark sets up this benefit.<br>Other options: B — theft and damage occurred in handling, not at sea; C — no such argument is made; D — the remark describes the old system, not the character of workers.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.30","q":"<p>(Passage 2) The author's attitude towards the economists' revised view in the final paragraph is best described as<\/p>","o":["sceptical, suggesting that the studies are flawed","dismissive, treating it as a passing academic fashion","regretful that governments cut tariffs","sympathetic, presenting it as supported by evidence"],"a":3,"s":"<p>The author cites comparative studies in support and closes with the lesson \"some argue\" without disputing it.<br>Other options: A — no flaw in the studies is suggested; B — the author does not reject the view; C — the author expresses no regret about tariff cuts.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M1.1.31","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Because every order carried the same delivery charge, its delivery costs soon outgrew the extra profit.<br>Q. A small online retailer decided to offer free delivery on all orders to attract customers.<br>R. It therefore introduced a minimum order value for free delivery.<br>S. Orders did rise, but many of them were for single low-priced items.<\/p>","o":["QSRP","QSPR","QPSR","SQPR"],"a":1,"s":"<p>Q introduces the retailer and the decision; S gives the result; P explains the problem that followed; R (\"therefore\") gives the solution.<br>Other options: A — R's \"therefore\" must follow the problem stated in P; C — P's \"the extra profit\" needs S (more orders) before it; D — S (\"Orders did rise\") cannot open the paragraph before the retailer is introduced.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M1.1.32","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. This is why central banks pay close attention to what people expect prices to do.<br>Q. If workers expect prices to rise by 10 per cent next year, they will demand higher wages now.<br>R. Inflation is partly driven by expectations.<br>S. Firms facing higher wage bills then raise their prices, so the expectation fulfils itself.<\/p>","o":["RPQS","RSQP","RQSP","QRSP"],"a":2,"s":"<p>R states the general idea; Q gives an example; S continues the chain (\"then\"); P draws the conclusion (\"This is why\").<br>Other options: A — \"This is why\" in P needs the explanation in Q and S before it; B — S's \"then\" and \"higher wage bills\" depend on Q; D — the example in Q should follow the general statement R.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M1.1.33","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. The answer lay in a rule of thumb that the team had never written down.<br>Q. A new manager wondered why her team always finished projects on time while other teams ran late.<br>R. Whenever a task fell two days behind, the whole team stopped to help with it.<br>S. She spent a week observing their meetings.<\/p>","o":["QSPR","SQPR","QSRP","QPRS"],"a":0,"s":"<p>Q raises the question; S shows how she investigated; P gives \"the answer\"; R explains the rule.<br>Other options: B — \"She\" in S needs the manager introduced in Q first; C — R describes the rule that P announces, so P must come first; D — observing meetings (S) should come before she finds the answer (P).<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M1.1.34","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Once the bank had approved the loan, the couple signed the contract.<br>Q. Before buying the house, they had it checked by an engineer.<br>R. The engineer found only minor cracks, which the seller agreed to repair.<br>S. Sushila and Kiran had been looking for a house for two years.<\/p>","o":["SRQP","SQPR","QSRP","SQRP"],"a":3,"s":"<p>S introduces the couple; Q the inspection; R the engineer's finding; P the final step.<br>Other options: A — \"The engineer\" in R needs Q to introduce the engineer; B — the contract is signed after the inspection result, so R comes before P; C — \"they\" in Q needs S first.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M1.1.35","q":"<p>Choose the correct meaning of the idiom \"to throw in the towel\".<\/p>","o":["to start a quarrel","to admit defeat and give up","to tidy up and put things away after finishing a task","to waste money carelessly"],"a":1,"s":"<p>The idiom comes from boxing, where a towel thrown into the ring signals surrender.<br>Other options: A — unrelated meaning; C — a literal misreading; D — unrelated meaning.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M1.1.36","q":"<p>Choose the correct meaning of the idiom \"to cut corners\".<\/p>","o":["to save time by working extra hours","to take a shorter route by walking across corners instead of along the road","to do something cheaply or carelessly, ignoring proper standards","to reduce the number of staff"],"a":2,"s":"<p>To cut corners is to save time or money by skipping steps that should be done.<br>Other options: A — working harder is not cutting corners; B — the literal sense, not the idiomatic meaning; D — that is \"to cut jobs\" or \"downsize\".<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M1.1.37","q":"<p>Choose the one word for: \"A person who endures pain or hardship without showing feelings or complaining.\"<\/p>","o":["ascetic","hedonist","cynic","stoic"],"a":3,"s":"<p>A stoic accepts pain and hardship calmly and without complaint.<br>Other options: A — an ascetic practises severe self-denial, often for religious reasons; the stress is on self-discipline, not calm endurance; B — a hedonist pursues pleasure; C — a cynic distrusts other people's motives.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M1.1.38","q":"<p>Choose the one word for: \"Government by a small group of powerful people.\"<\/p>","o":["monarchy","theocracy","oligarchy","autocracy"],"a":2,"s":"<p>Oligarchy (from Greek \"oligos\", few) is rule by a small group.<br>Other options: A — rule by a single king or queen; B — rule by religious leaders or in the name of God; D — rule by one person with absolute power.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M1.1.39","q":"<p>Choose the word that completes the analogy. Prologue : Play :: Preamble : ?<\/p>","o":["Epilogue","Constitution","Judge","Amendment"],"a":1,"s":"<p>A prologue is the introductory part of a play; a preamble is the introductory part of a constitution.<br>Other options: A — an epilogue is the closing part of a play, so it does not match the relationship; C — a judge interprets the law; there is no part-whole relationship; D — an amendment changes a constitution; it is not its introduction.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M1.1.40","q":"<p>Choose the word that completes the analogy. Parsimonious : Generosity :: Lethargic : ?<\/p>","o":["Energy","Sleep","Tiredness","Slowness"],"a":0,"s":"<p>A parsimonious person lacks generosity; a lethargic person lacks energy.<br>Other options: B — a lethargic person may sleep a lot, so this does not show a lack; C — tiredness is a feature of lethargy, not something it lacks; D — slowness is a feature of lethargy, not something it lacks.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"}]},{"t":"Section 2 · Quantitative Aptitude (30)","items":[{"id":"M1.2.1","q":"<p>What is the remainder when 3⁴⁷ is divided by 7?<\/p>","o":["5","6","3","2"],"a":0,"s":"<p>Powers of 3 mod 7 repeat in a cycle of 6: 3, 2, 6, 4, 5, 1. Since 47 = 6 × 7 + 5, 3⁴⁷ leaves the same remainder as 3⁵, which is 5.<br>Other options: B — this is 3³ mod 7, from a slip in the cycle position; C — this is the remainder of 3¹, as if the cycle position were 1; D — this is 3² mod 7.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M1.2.2","q":"<p>How many integers from 1 to 300 (inclusive) are divisible by 4 or by 6?<\/p>","o":["75","100","125","113"],"a":1,"s":"<p>Divisible by 4: 75; by 6: 50; by both (that is, by 12): 25. By inclusion–exclusion, 75 + 50 − 25 = 100.<br>Other options: A — counts only the multiples of 4; C — adds 75 and 50 without subtracting the 25 numbers counted twice; D — subtracts the multiples of 24 (12) instead of the multiples of 12 (25).<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M1.2.3","q":"<p>n is a positive integer and n² is divisible by 72. What is the largest positive integer that must divide n?<\/p>","o":["24","12","6","36"],"a":1,"s":"<p>72 = 2³ × 3². For n² to contain 2³, n must contain at least 2²; for 3², n must contain 3. So n is a multiple of 2² × 3 = 12, and n = 12 itself works (144 = 2 × 72).<br>Other options: A — n = 12 works, and 24 does not divide 12; C — 6 must divide n, but 12 also must, so 6 is not the largest; D — n = 12 works, and 36 does not divide 12.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M1.2.4","q":"<p>Simplify: (√12 + √27) ÷ √3<\/p>","o":["√13","13","5","3√3"],"a":2,"s":"<p>√12 = 2√3 and √27 = 3√3, so the numerator is 5√3; dividing by √3 gives 5.<br>Other options: A — wrongly adds under one root: √(12 + 27) ÷ √3 = √13; B — divides 39 by 3 after wrongly adding 12 + 27 without roots; D — divides only √27 by √3 and ignores √12.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M1.2.5","q":"<p>A shopkeeper raises the price of an article by 25% and later, in a sale, gives a discount of 20% on the raised price. The final selling price is Rs 1,500. What was the original price?<\/p>","o":["Rs 1,450","Rs 1,600","Rs 1,550","Rs 1,500"],"a":3,"s":"<p>Final = original × 1.25 × 0.80 = original × 1.00, so the original price equals the final price, Rs 1,500.<br>Other options: A — treats the net effect as a 5% rise (25 − 20) and works backwards approximately; B — assumes a net loss and adds back about 100; C — another guess from a \"net +5%\" error.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M1.2.6","q":"<p>A company's sales rise by 20%, while its profit as a percentage of sales falls from 15% to 12%. What happens to its total profit?<\/p>","o":["It falls by 4%","It does not change","It falls by 3%","It rises by 17%"],"a":0,"s":"<p>Profit = sales × margin. New/old = 1.20 × 12/15 = 0.96, a fall of 4%.<br>Other options: B — assumes the two effects cancel exactly; C — subtracts the margin points (15 − 12) as if they were a percentage change in profit; D — subtracts the 3-point fall in margin from the 20% rise in sales; the effects multiply, they do not add.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M1.2.7","q":"<p>What is the interest earned on Rs 50,000 in one year at 12% per annum, compounded half-yearly?<\/p>","o":["Rs 6,180","Rs 6,000","Rs 3,000","Rs 12,720"],"a":0,"s":"<p>Half-yearly rate 6% for 2 periods: 50,000 × (1.06² − 1) = 50,000 × 0.1236 = Rs 6,180.<br>Other options: B — simple interest at 12% for one year; C — interest for one half-year only; D — applies the full annual rate of 12% for two periods.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M1.2.8","q":"<p>An article is sold at a loss of 10%. If it had been sold for Rs 180 more, there would have been a gain of 5%. What is the cost price?<\/p>","o":["Rs 1,800","Rs 1,080","Rs 3,600","Rs 1,200"],"a":3,"s":"<p>The difference between −10% and +5% is 15% of cost = Rs 180, so cost = 180 ÷ 0.15 = Rs 1,200.<br>Other options: A — divides 180 by 10% instead of 15%; B — this is the selling price at a 10% loss, not the cost price; C — divides 180 by 5% only.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M1.2.9","q":"<p>The difference between the compound interest and the simple interest on a sum for 3 years at 10% per annum (compounded annually) is Rs 310. What is the sum?<\/p>","o":["Rs 3,100","Rs 10,000","Rs 10,333","Rs 31,000"],"a":1,"s":"<p>For 3 years, CI − SI = P[(1.1)³ − 1 − 0.3] = P(0.331 − 0.3) = 0.031P = 310, so P = 10,000.<br>Other options: A — divides 310 by the rate (0.10); C — uses 3 × (0.1)² = 0.03 and leaves out the (0.1)³ term; D — uses the 2-year formula P(r/100)² = 0.01P.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M1.2.10","q":"<p>A 40-litre solution is 25% acid. How many litres of pure acid must be added to make it 50% acid?<\/p>","o":["15 litres","10 litres","20 litres","25 litres"],"a":2,"s":"<p>Acid now = 10 L. (10 + x)/(40 + x) = 1/2 gives 20 + 2x = 40 + x, so x = 20.<br>Other options: A — gives (25/55) ≈ 45%, not 50%; B — adds enough acid to double the acid amount but forgets that the total volume also rises; D — gives 35/65 ≈ 54%, more than 50%.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M1.2.11","q":"<p>The average monthly salary of the 50 employees of a firm is Rs 30,000. The 10 managers earn an average of Rs 54,000. What is the average salary of the other employees?<\/p>","o":["Rs 19,200","Rs 42,000","Rs 24,000","Rs 25,200"],"a":2,"s":"<p>Total = 50 × 30,000 = 15,00,000; managers = 10 × 54,000 = 5,40,000; rest = 9,60,000 ÷ 40 = Rs 24,000.<br>Other options: A — divides the remaining 9,60,000 by all 50 employees instead of the other 40; B — simply averages the two averages, 30,000 and 54,000; D — spreads the managers' extra pay (10 × 24,000) over all 50 employees instead of the 40 others.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M1.2.12","q":"<p>Five years ago the ages of P and Q were in the ratio 3 : 4. Five years from now the ratio will be 5 : 6. What is P's present age?<\/p>","o":["20 years","25 years","18 years","15 years"],"a":0,"s":"<p>Let the ages five years ago be 3k and 4k. In 10 more years: (3k + 10)/(4k + 10) = 5/6, so 18k + 60 = 20k + 50 and k = 5. P was 15, so P is now 20.<br>Other options: B — this is Q's present age; C — does not satisfy either ratio; D — this is P's age five years ago.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M1.2.13","q":"<p>A and B start a business with capitals in the ratio 3 : 5. After 4 months, A doubles his capital. Out of a year-end profit of Rs 33,000, what is A's share?<\/p>","o":["Rs 20,625","Rs 18,000","Rs 12,375","Rs 16,500"],"a":3,"s":"<p>Capital-months: A = 3 × 4 + 6 × 8 = 60; B = 5 × 12 = 60. The ratio is 1 : 1, so A gets Rs 16,500.<br>Other options: A — gives A B's fraction (5/8) of the original ratio; B — uses A's doubled capital for the whole year (6 : 5); C — uses the original ratio 3 : 5 and ignores the doubling.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M1.2.14","q":"<p>A is 50% more efficient than B. B alone can finish a job in 30 days. How long will A and B together take?<\/p>","o":["18 days","12 days","10 days","15 days"],"a":1,"s":"<p>A takes 30 ÷ 1.5 = 20 days. Together: 1/20 + 1/30 = 5/60 = 1/12, so 12 days.<br>Other options: A — uses A = 45 days (50% slower, not faster); C — takes A as twice as fast (15 days); D — assumes A takes 30 days as well.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M1.2.15","q":"<p>A and B can do a job in 20 days and 30 days respectively. They start together, but A leaves 5 days before the job is finished. How many days does the job take in all?<\/p>","o":["12 days","10 days","17 days","15 days"],"a":3,"s":"<p>If the job takes t days, A works t − 5 days: (t − 5)/20 + t/30 = 1, so 3t − 15 + 2t = 60 and t = 15.<br>Other options: A — the time if both worked throughout; B — this is the number of days A works, not the total; C — adds the 5 days to 12.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M1.2.16","q":"<p>A car travels the first 120 km of a journey at 60 km/h and the next 180 km at 90 km/h. What is its average speed for the whole journey?<\/p>","o":["78 km/h","60 km/h","75 km/h","72 km/h"],"a":2,"s":"<p>Time = 120/60 + 180/90 = 2 + 2 = 4 h; average speed = 300 ÷ 4 = 75 km/h.<br>Other options: A — weights the speeds by distance instead of by time; B — divides by 5 hours, a slip in the total time; D — the harmonic mean of 60 and 90, which applies only to equal distances.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M1.2.17","q":"<p>Two trains 150 m and 100 m long run on parallel tracks. Running in opposite directions they cross each other in 10 seconds; running in the same direction, the faster one passes the slower one in 50 seconds. What is the speed of the faster train?<\/p>","o":["45 km/h","54 km/h","36 km/h","90 km/h"],"a":1,"s":"<p>Total length 250 m. Sum of speeds = 250/10 = 25 m/s; difference = 250/50 = 5 m/s. Faster = (25 + 5)/2 = 15 m/s = 54 km/h.<br>Other options: A — half the sum of speeds, 12.5 m/s, converted; C — this is the slower train: 10 m/s = 36 km/h; D — the sum of speeds, 25 m/s, converted.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M1.2.18","q":"<p>A boat takes 3 hours to travel 24 km upstream and 2 hours to return the same distance downstream. What is the speed of the stream?<\/p>","o":["2 km/h","4 km/h","20 km/h","10 km/h"],"a":0,"s":"<p>Upstream speed = 8 km/h, downstream = 12 km/h. Stream speed = (12 − 8)/2 = 2 km/h.<br>Other options: B — the difference of the two speeds, not half of it; C — adds the downstream and upstream speeds; D — this is the speed of the boat in still water.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M1.2.19","q":"<p>x and y are positive numbers with x² − y² = 48 and x − y = 4. What is x?<\/p>","o":["4","8","16","12"],"a":1,"s":"<p>x² − y² = (x + y)(x − y), so x + y = 48/4 = 12. With x − y = 4, x = 8 (and y = 4).<br>Other options: A — this is y; C — this is y², not x; D — this is x + y.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M1.2.20","q":"<p>For which values of k does the equation x² + kx + 16 = 0 have equal roots?<\/p>","o":["k = 8 only","k = 16 or k = −16","k = 8 or k = −8","k = 4 or k = −4"],"a":2,"s":"<p>Equal roots need discriminant k² − 4 × 16 = 0, so k² = 64 and k = ±8.<br>Other options: A — ignores the negative root; k = −8 also gives equal roots (x = 4); B — takes k = ±4 × 4 instead of k² = 4 × 16; D — uses k² = 16, forgetting the factor 4.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M1.2.21","q":"<p>What is the distance between the points (−2, 3) and (4, −5)?<\/p>","o":["14","√52","8","10"],"a":3,"s":"<p>Distance = √[(4 − (−2))² + (−5 − 3)²] = √(36 + 64) = √100 = 10.<br>Other options: A — adds the differences 6 + 8 instead of using Pythagoras; B — sign errors give differences of 4 and 6: √(16 + 36) = √52; C — uses only the vertical difference.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M1.2.22","q":"<p>Solve: log₁₀ x + log₁₀ (x − 3) = 1<\/p>","o":["x = 5","x = 5 or x = −2","x = 10","x = −2"],"a":0,"s":"<p>log [x(x − 3)] = 1 gives x² − 3x = 10, so x = 5 or x = −2. A logarithm needs a positive argument, so x = −2 is rejected.<br>Other options: B — includes the invalid root; C — sets x = 10 from log x = 1 and ignores the second term; D — log of a negative number is not defined.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M1.2.23","q":"<p>A cylindrical tank of radius 1.4 m must hold 30.8 cubic metres of water. What is its minimum height? (Take π = 22/7.)<\/p>","o":["7 m","5 m","1.25 m","3.5 m"],"a":1,"s":"<p>Base area = (22/7) × 1.4² = 6.16 m². Height = 30.8 ÷ 6.16 = 5 m.<br>Other options: A — divides by πr = 4.4 instead of πr² = 6.16; C — uses the diameter (2.8 m) in place of the radius; D — divides 30.8 by 8.8 (the circumference).<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"p":"<p><b>Table for questions 1.2.24 to 1.2.27<\/b><br>Revenue and expenses of a company's four branches in one year (Rs lakh). Profit = Revenue − Expenses.<\/p><div class=\"tw\"><table><thead><tr><th>Branch<\/th><th>Revenue<\/th><th>Expenses<\/th><\/tr><\/thead><tbody><tr><td>Kathmandu<\/td><td>480<\/td><td>360<\/td><\/tr><tr><td>Pokhara<\/td><td>300<\/td><td>240<\/td><\/tr><tr><td>Biratnagar<\/td><td>250<\/td><td>175<\/td><\/tr><tr><td>Butwal<\/td><td>220<\/td><td>187<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"M1.2.24","q":"<p>(Table) Which branch earned the highest profit as a percentage of its revenue?<\/p>","o":["Biratnagar","Butwal","Kathmandu","Pokhara"],"a":0,"s":"<p>Profit/revenue: Kathmandu 120/480 = 25%; Pokhara 60/300 = 20%; Biratnagar 75/250 = 30%; Butwal 33/220 = 15%. Biratnagar is highest.<br>Other options: B — 15% of revenue, the lowest; C — highest absolute profit (120), but only 25% of revenue; D — 20% of revenue.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M1.2.25","q":"<p>(Table) Total profit of the four branches is what percentage of their total revenue?<\/p>","o":["22.5%","25%","23.04%","29.94%"],"a":2,"s":"<p>Total profit = 120 + 60 + 75 + 33 = 288; total revenue = 1,250. 288/1,250 = 23.04%.<br>Other options: A — the simple average of the four percentages (25, 20, 30, 15); B — Kathmandu's margin only; D — divides total profit by total expenses (962) instead of total revenue.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M1.2.26","q":"<p>(Table) If Pokhara's expenses fell by 10% while its revenue stayed the same, by what percentage would its profit rise?<\/p>","o":["10%","28.6%","24%","40%"],"a":3,"s":"<p>New expenses = 240 × 0.9 = 216; new profit = 300 − 216 = 84. Rise = (84 − 60)/60 = 40%.<br>Other options: A — assumes profit changes by the same percentage as expenses; B — divides the rise (24) by the new profit (84) instead of the old profit (60); C — the rise in rupees (24 lakh) taken as a percentage.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M1.2.27","q":"<p>(Table) Kathmandu's revenue is approximately what percentage more than Butwal's revenue?<\/p>","o":["54%","118%","260%","218%"],"a":1,"s":"<p>(480 − 220)/220 = 260/220 ≈ 1.182, i.e. about 118% more.<br>Other options: A — divides the difference by Kathmandu's revenue (260/480) instead of Butwal's; C — uses the difference in lakh as a percentage; D — Kathmandu's revenue as a percentage of Butwal's, not \"more than\".<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M1.2.28","q":"<p>A committee of 4 is to be chosen from 6 men and 4 women. In how many ways can this be done if the committee must include at least one woman?<\/p>","o":["210","15","195","336"],"a":2,"s":"<p>All committees: C(10, 4) = 210. Committees with no woman: C(6, 4) = 15. At least one woman: 210 − 15 = 195.<br>Other options: A — counts all committees, including those with no woman; B — this is the number of committees with no woman; D — chooses one woman (4 ways) and then any 3 of the other 9 (84 ways), which counts many committees more than once.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M1.2.29","q":"<p>Two cards are drawn at random, without replacement, from a well-shuffled pack of 52 cards. What is the probability that both are aces?<\/p>","o":["1/169","1/13","2/221","1/221"],"a":3,"s":"<p>(4/52) × (3/51) = 12/2,652 = 1/221.<br>Other options: A — uses (4/52)², as if the first card were replaced; B — the probability of one ace only; C — doubles the correct value as if order mattered twice.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M1.2.30","q":"<p>The numbers 2, 8, 8, 15 and x have a mean equal to their median. If x is an integer less than 8, what is x?<\/p>","o":["7","3","6","5"],"a":0,"s":"<p>With x < 8, the ordered list has 8 in the middle, so the median is 8. Mean = (33 + x)/5 = 8 gives x = 7.<br>Other options: B — gives a mean of 7.2; C — gives a mean of 7.8; D — gives a mean of 7.6.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"}]},{"t":"Section 3 · Logical Reasoning (30)","items":[{"id":"M1.3.1","q":"<p>Find the next term: 5, 11, 23, 47, 95, ?<\/p>","o":["189","193","191","190"],"a":2,"s":"<p>Each term is twice the previous term plus 1: 95 × 2 + 1 = 191.<br>Other options: A — uses × 2 − 1; B — uses × 2 + 3; D — doubles without adding 1.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M1.3.2","q":"<p>Find the next term: 4, 9, 25, 49, 121, ?<\/p>","o":["169","144","196","143"],"a":0,"s":"<p>The terms are squares of consecutive primes 2, 3, 5, 7, 11; the next prime is 13 and 13² = 169.<br>Other options: B — 12² — 12 is not prime; C — 14² — skips 13; D — 11 × 13, not a square.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M1.3.3","q":"<p>Find the next letter: B, E, J, Q, ?<\/p>","o":["Z","X","Y","W"],"a":0,"s":"<p>Positions 2, 5, 10, 17 increase by 3, 5, 7; the next step is 9, so 17 + 9 = 26 = Z.<br>Other options: B — adds 7 again; C — adds 8 instead of 9; D — adds 6.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M1.3.4","q":"<p>Which pair is the odd one out?<\/p>","o":["9 : 90","13 : 170","7 : 56","11 : 132"],"a":1,"s":"<p>In the others the second number is n(n + 1): 7 × 8 = 56, 9 × 10 = 90, 11 × 12 = 132. But 13 × 14 = 182, not 170.<br>Other options: A — 9 × 10 = 90 fits the rule; C — 7 × 8 = 56 fits the rule; D — 11 × 12 = 132 fits the rule.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M1.3.5","q":"<p>In a code, PROFIT is written as UJGPSQ. How is LOSS written in that code?<\/p>","o":["SSPM","MPTT","TTOM","TTPM"],"a":3,"s":"<p>The word is reversed and each letter is moved one place forward: PROFIT → TIFORP → UJGPSQ. LOSS → SSOL → TTPM.<br>Other options: A — shifts only the last two letters; B — shifts the letters forward but does not reverse them; C — forgets to shift the O.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.6","q":"<p>In a code language, \"mi pa lo\" means \"market price rises\", \"lo ka zi\" means \"rises sharply today\" and \"pa zi ru\" means \"price falls today\". What is the code for \"sharply\"?<\/p>","o":["lo","ru","ka","zi"],"a":2,"s":"<p>\"lo\" is common to the first two (rises); \"zi\" is common to the second and third (today). In \"lo ka zi\", the remaining word \"sharply\" must be \"ka\".<br>Other options: A — \"lo\" means \"rises\"; B — \"ru\" means \"falls\"; D — \"zi\" means \"today\".<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.7","q":"<p>If each letter is given the value of its position in the alphabet (A = 1, B = 2, …) and a word is coded as the sum of its letter values, BANK is coded as 28. What is the code for LOAN?<\/p>","o":["42","44","38","41"],"a":0,"s":"<p>L = 12, O = 15, A = 1, N = 14; 12 + 15 + 1 + 14 = 42.<br>Other options: B — takes A as 3; C — takes O as 11; D — takes O as 14.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M1.3.8","q":"<p>M is the brother of N. N is the daughter of O. O is the wife of P. Q is the father of P. How is M related to Q?<\/p>","o":["Son-in-law","Son","Nephew","Grandson"],"a":3,"s":"<p>N is the daughter of O and P, so her brother M is their son. Q is P's father, so M is Q's grandson.<br>Other options: A — no marriage links M to Q's family; B — M is Q's son's son, not his son; C — M is P's son, not P's brother's son.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.9","q":"<p>A $ B means \"A is the father of B\", A # B means \"A is the sister of B\" and A @ B means \"A is the wife of B\". Which expression means that X is the paternal aunt (father's sister) of Z?<\/p>","o":["Y # X $ Z","X $ Y # Z","X # Y $ Z","X @ Y $ Z"],"a":2,"s":"<p>X is the sister of Y, and Y is the father of Z, so X is the sister of Z's father.<br>Other options: A — X is the father of Z, and Y is X's sister; here Y, not X, is the aunt; B — X is the father of Y, and Y is Z's sister, so X is Z's father; D — X is the wife of Z's father, i.e. Z's mother (or stepmother).<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.10","q":"<p>A drone flies 8 km east, then 6 km north, then 16 km west, then 12 km south. How far and in which direction is it from its starting point?<\/p>","o":["6 km south","10 km south-west","10 km north-west","14 km south-west"],"a":1,"s":"<p>Net east–west: 8 − 16 = 8 km west. Net north–south: 6 − 12 = 6 km south. Distance = √(8² + 6²) = 10 km, towards the south-west.<br>Other options: A — ignores the westward displacement; C — the net movement is south, not north; D — adds 8 + 6 instead of using Pythagoras.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M1.3.11","q":"<p>Village Q is 6 km north of village P. R is 8 km east of Q. S is 6 km south of R. T is 3 km west of S. Where is T with respect to P?<\/p>","o":["11 km east","5 km west","5 km east","3 km east"],"a":2,"s":"<p>Take P as (0, 0): Q (0, 6), R (8, 6), S (8, 0), T (5, 0). T is 5 km east of P.<br>Other options: A — adds 3 instead of subtracting it; B — T lies on the east side of P; D — uses the last step alone.<\/p>","tag":"3.3 Blood relations and direction sense"},{"p":"<p><b>Puzzle 1<\/b><br>Six employees, J, K, L, M, N and O, give one presentation each on six consecutive days from Monday to Saturday, one presentation per day.<br>(i) L presents on Wednesday.<br>(ii) K presents on the day immediately after L.<br>(iii) Exactly one person presents between M and K.<br>(iv) M presents earlier in the week than J.<br>(v) O presents earlier in the week than M.<br>(vi) N presents later in the week than J.<br>Questions 1.3.12 to 1.3.16 are based on this.<\/p>"},{"id":"M1.3.12","q":"<p>(Puzzle 1) Who presents on Monday?<\/p>","o":["O","J","N","M"],"a":0,"s":"<p>L is Wednesday and K Thursday. One person between M and K puts M on Tuesday or Saturday; M before J rules out Saturday, so M is Tuesday. O before M puts O on Monday; J and N take Friday and Saturday with J first. Order: O, M, L, K, J, N.<br>Other options: B — J presents on Friday; C — N presents on Saturday; D — M presents on Tuesday.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M1.3.13","q":"<p>(Puzzle 1) On which day does J present?<\/p>","o":["Tuesday","Friday","Thursday","Saturday"],"a":1,"s":"<p>From the arrangement O (Mon), M (Tue), L (Wed), K (Thu), J (Fri), N (Sat).<br>Other options: A — M presents on Tuesday; C — K presents on Thursday; D — N must present after J, so J cannot be on Saturday.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M1.3.14","q":"<p>(Puzzle 1) How many presentations take place between O's and K's?<\/p>","o":["1","3","4","2"],"a":3,"s":"<p>O is on Monday and K on Thursday; M (Tuesday) and L (Wednesday) come between them.<br>Other options: A — counts only L; B — counts the days from Monday to Thursday, not the presentations between; C — counts all days up to Friday.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M1.3.15","q":"<p>(Puzzle 1) Who presents on the day immediately before L?<\/p>","o":["O","J","K","M"],"a":3,"s":"<p>L is on Wednesday and M on Tuesday.<br>Other options: A — O presents on Monday, two days before L; B — J presents on Friday; C — K presents immediately after L.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M1.3.16","q":"<p>(Puzzle 1) Which of the following is true?<\/p>","o":["N presents on Saturday","Three people present after K","J presents immediately after L","M presents on Monday"],"a":0,"s":"<p>Order: O, M, L, K, J, N — N is last.<br>Other options: B — only J and N present after K; C — K presents immediately after L; D — M presents on Tuesday.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M1.3.17","q":"<p>Statements: All analysts are graduates. Some graduates are managers. No manager is an intern.<br>Conclusions: I. Some graduates are not interns. II. No analyst is an intern.<br>Which conclusion(s) follow?<\/p>","o":["Either I or II follows","Only II follows","Only I follows","Both I and II follow"],"a":2,"s":"<p>The graduates who are managers cannot be interns, so some graduates are not interns (I). Nothing links analysts to managers, so an analyst could be an intern; II does not follow.<br>Other options: A — I definitely follows; \"either–or\" applies only to a complementary pair; B — II is possible but not certain; D — II does not follow.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M1.3.18","q":"<p>Statements: Some reports are audited. All audited items are filed.<br>Conclusions: I. All reports are filed. II. Some reports are not filed.<br>Which conclusion(s) follow?<\/p>","o":["Only II follows","Either I or II follows","Both I and II follow","Only I follows"],"a":1,"s":"<p>Neither conclusion is certain, but they are complementary: either every report is filed or at least one is not, so exactly one of them must be true.<br>Other options: A — all reports could be filed; II is not certain
