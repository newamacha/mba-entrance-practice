; C — they contradict each other, so both cannot be true; D — only the audited reports are known to be filed.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M1.3.19","q":"<p>Statement: A bank has announced that customers can now open accounts through its mobile app without visiting a branch.<br>Assumptions: I. A good number of the bank's customers have access to smartphones. II. The bank will close its branches.<br>Which assumption(s) are implicit?<\/p>","o":["Only I is implicit","Only II is implicit","Neither I nor II is implicit","Both I and II are implicit"],"a":0,"s":"<p>Offering app-based account opening only makes sense if enough customers can use the app (I). The bank need not close branches to offer this option (II).<br>Other options: B — nothing in the statement implies closing branches; C — I is implicit; D — II is not implicit.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M1.3.20","q":"<p>Statement: \"Book early to get the lowest fares on the Kathmandu–Bhadrapur flight,\" says an airline advertisement.<br>Assumptions: I. Fares on this route depend on when the ticket is booked. II. People prefer to pay lower fares.<br>Which assumption(s) are implicit?<\/p>","o":["Neither I nor II is implicit","Both I and II are implicit","Only II is implicit","Only I is implicit"],"a":1,"s":"<p>The advice assumes that early booking changes the fare (I), and the appeal of \"lowest fares\" assumes that travellers want to pay less (II).<br>Other options: A — both are implicit; C — I is also implicit; D — II is also implicit.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M1.3.21","q":"<p>After the city's restaurants began printing calorie counts on their menus, the average number of calories per order fell by 8% over the next year. City officials conclude that the labels led diners to choose healthier food. Which of the following, if true, most weakens this conclusion?<\/p>","o":["Printing calorie counts adds to restaurants' costs","Diners say they like seeing calorie counts on menus","Restaurants without calorie labels saw calories per order rise by 2%","During the same year, most of these restaurants reduced the portion sizes of their main dishes"],"a":3,"s":"<p>Smaller portions would cut calories per order even if diners chose exactly the same dishes, giving another cause for the fall.<br>Other options: A — cost is irrelevant to whether the labels changed choices; B — liking labels does not show they caused or did not cause the fall; C — this strengthens the conclusion by providing a comparison group.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.22","q":"<p>\"Our firm should move its customer-support centre to a smaller city, because salaries there are 30 per cent lower, so our support costs will fall.\" The argument assumes that<\/p>","o":["salaries in the present city will rise further","all current employees will agree to move","the saving on salaries will not be outweighed by other costs of the move, such as relocation or lower productivity","customers prefer support staff from large cities"],"a":2,"s":"<p>If other costs rose by more than the salary saving, support costs would not fall; the argument depends on ruling this out.<br>Other options: A — not needed; the argument works with today's difference; B — the firm could hire new staff; this is not required; D — this would weaken, not support, the argument, and it is not needed.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.23","q":"<p>A study found that students who eat breakfast score higher in morning tests than those who do not. The author concludes that schools should provide free breakfast to raise test scores. Which of the following, if true, most strengthens the argument?<\/p>","o":["Many students prefer to eat breakfast at home","When one school began serving free breakfast, scores rose among students who had previously skipped breakfast, while other students' scores did not change","Students who eat breakfast tend to come from wealthier families","In afternoon tests, the two groups score about the same"],"a":1,"s":"<p>This shows that eating breakfast itself causes higher scores, supporting the causal link the argument relies on.<br>Other options: A — this does not show whether breakfast raises scores; C — this suggests another cause (family background) and weakens the argument; D — this is irrelevant to morning tests or weakens slightly.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.24","q":"<p>The number of visitors to a national park rose by 20% last year, yet the park's total income from entry fees fell. Which of the following, if true, best explains this?<\/p>","o":["The entry fee for foreign visitors was raised","The park was closed for a week during the monsoon","Foreign visitors spent more on hotels near the park","The park sharply cut the entry fee for domestic visitors, who made up most of last year's visitors"],"a":3,"s":"<p>More visitors paying a much lower fee can produce less total fee income.<br>Other options: A — this would increase fee income, deepening the puzzle; B — the closure is already reflected in the 20% rise and does not explain lower income per visitor; C — hotel spending is not entry-fee income.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.25","q":"<p>Every candidate who passed the interview had at least five years' work experience. No candidate with a foreign MBA had five years' work experience. Sita passed the written test but did not pass the interview. Which of the following must be true?<\/p>","o":["No candidate with a foreign MBA passed the interview","Sita has a foreign MBA","Sita has less than five years' work experience","Every candidate with five years' experience passed the interview"],"a":0,"s":"<p>Passing the interview required five years' experience, which no foreign-MBA candidate had.<br>Other options: B — nothing links Sita to a foreign MBA; C — five years' experience was necessary, not sufficient; she may have had it and still failed; D — the statement gives a necessary condition only.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.26","q":"<p>Data sufficiency. Question: N is a two-digit number. What is N?<br>I. The sum of the digits of N is 9.<br>II. The number formed by reversing the digits of N is 27 more than N.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":2,"s":"<p>Let N = 10a + b. I: a + b = 9. II: 9(b − a) = 27, so b − a = 3. Together a = 3, b = 6, N = 36.<br>Other options: A — I allows 18, 27, 36, 45 and others; B — II only gives (units digit − tens digit) = 3: 14, 25, 36, 47, 58 or 69; D — together they fix N = 36.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.27","q":"<p>Data sufficiency. Question: What profit did a shop make on an item?<br>I. The item was sold for Rs 1,200 at a profit of 20% on cost.<br>II. The item cost the shop Rs 1,000.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>I: cost = 1,200 ÷ 1.2 = 1,000, so profit = Rs 200. II gives only the cost, not the selling price.<br>Other options: B — II gives no selling price; C — I alone is already sufficient; D — I is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.28","q":"<p>Data sufficiency. Question: Is the integer k divisible by 6?<br>I. k is divisible by 2.<br>II. k is divisible by 12.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>Every multiple of 12 is a multiple of 6, so II gives a definite \"yes\"; I does not.<br>Other options: A — k = 4 is divisible by 2 but not by 6, while k = 6 is; I is not enough; C — II alone is already sufficient; D — II is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.29","q":"<p>Data sufficiency. Question: What is the average (arithmetic mean) of x, y and z?<br>I. x + y = 14<br>II. y + z = 18<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":3,"s":"<p>The mean needs x + y + z. From I and II we know only x + 2y + z = 32, and the sum changes with y, so even together they are not enough.<br>Other options: A — z is unknown; B — x is unknown; C — together they give x + 2y + z = 32, which does not fix x + y + z (for example y = 4 gives 28, y = 6 gives 26).<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M1.3.30","q":"<p>What is the angle between the hour hand and the minute hand of a clock at 2:30?<\/p>","o":["135°","120°","105°","112.5°"],"a":2,"s":"<p>Angle = |30H − 5.5M| = |60 − 165| = 105°.<br>Other options: A — moves the hour hand back by 15° instead of forward; B — ignores the movement of the hour hand past the 2 (180° − 60°); D — a slip in the hour-hand movement (uses 0.25° per minute).<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"}]}]},{"m":2,"secs":[{"t":"Section 1 · Verbal Ability (40)","items":[{"id":"M2.1.1","q":"<p>Choose the word closest in meaning to LACONIC.<\/p>","o":["using very few words","lazy and slow-moving","lacking in confidence","very talkative"],"a":0,"s":"<p>A laconic person or reply says a great deal in very few words.<br>Other options: B — a confusion with \"lackadaisical\"; C — unrelated meaning; D — nearly the opposite of laconic.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.1.2","q":"<p>Choose the word most nearly opposite in meaning to NASCENT.<\/p>","o":["natural","unpleasant","fully developed","newly emerging"],"a":2,"s":"<p>Nascent means just beginning to exist or develop; the opposite is fully developed or mature.<br>Other options: A — a look-alike confusion with \"native\" or \"nature\"; B — a look-alike confusion with \"nasty\"; D — this is a synonym of nascent.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.1.3","q":"<p>Choose the word closest in meaning to INTRANSIGENT.<\/p>","o":["easily persuaded","unwilling to compromise","not transparent","lasting only a short time"],"a":1,"s":"<p>An intransigent person refuses to change their views or reach agreement.<br>Other options: A — nearly the opposite of intransigent; C — a look-alike confusion from \"trans-\"; D — a confusion with \"transient\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.1.4","q":"<p>In which sentence is the word \"principal\" used correctly?<\/p>","o":["The scientist explained the principal of buoyancy to the class.","He is known as a man of high principals.","She refused on principal to sign the false report.","The principal reason for the delay was a shortage of cement."],"a":3,"s":"<p>\"Principal\" as an adjective means main or most important, which fits \"the main reason\".<br>Other options: A — a scientific law or rule is a \"principle\"; B — moral standards are \"principles\"; C — a moral rule is a \"principle\": \"on principle\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.1.5","q":"<p>Choose the word most nearly opposite in meaning to SANGUINE.<\/p>","o":["bloodthirsty","pessimistic","optimistic","calm"],"a":1,"s":"<p>Sanguine means cheerfully optimistic, especially about a difficult situation; the opposite is pessimistic.<br>Other options: A — a confusion with \"sanguinary\"; it is not an opposite; C — this is a synonym of sanguine; D — calmness is not the opposite of optimism.<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.1.6","q":"<p>Choose the word closest in meaning to MUNIFICENT.<\/p>","o":["very mean with money","relating to a town council","splendid in appearance","very generous"],"a":3,"s":"<p>Munificent describes someone who gives or spends with great generosity.<br>Other options: A — nearly the opposite of munificent; B — a confusion with \"municipal\"; C — a confusion with the look-alike \"magnificent\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M2.1.7","q":"<p>Choose the word that best completes the sentence: \"The professor's lectures were notoriously ___; students needed several readings of their notes to grasp a single point.\"<\/p>","o":["abstruse","brief","elementary","entertaining"],"a":0,"s":"<p>Abstruse means difficult to understand, which explains why several readings were needed.<br>Other options: B — brevity alone does not make lectures hard to understand; C — elementary material would be easy to grasp; D — being entertaining does not explain the difficulty.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M2.1.8","q":"<p>Choose the phrase that best completes the sentence: \"Although the merger was expected to produce ___, the combined company's costs actually rose.\"<\/p>","o":["diseconomies of scale","greater losses","economies of scale","higher inflation"],"a":2,"s":"<p>\"Although\" signals a contrast: the merger was expected to lower costs (economies of scale), but costs rose.<br>Other options: A — rising costs would then be expected, so there would be no contrast; B — expecting losses does not contrast with rising costs; D — inflation is not something a merger is expected to produce.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M2.1.9","q":"<p>Choose the pair that best completes the sentence: \"The minister's statement was ___ enough to satisfy both sides, but critics dismissed it as ___.\"<\/p>","o":["clear, honest","ambiguous, evasive","brief, lengthy","harsh, kind"],"a":1,"s":"<p>A statement that satisfies opposing sides must be open to different readings (ambiguous); critics would call such a statement evasive.<br>Other options: A — a clear statement could hardly satisfy both opposing sides, and \"dismissed it as honest\" is illogical; C — the two words contradict each other; D — a harsh statement would not satisfy both sides.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M2.1.10","q":"<p>Fill in the blank: \"The report recommends that every branch ___ its accounts audited once a year.\"<\/p>","o":["has","had","will have","have"],"a":3,"s":"<p>After verbs such as \"recommend\", \"suggest\" and \"insist\", the subjunctive uses the base form of the verb for every subject: \"that every branch have\".<br>Other options: A — the indicative \"has\" is not used after \"recommends that\" in formal English; B — the past tense does not fit a present recommendation; C — a future form is not used in the subjunctive clause.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M2.1.11","q":"<p>Choose the word that best completes the sentence: \"Her argument, though ___, rested on a premise that turned out to be false.\"<\/p>","o":["ingenious","careless","illogical","flawed"],"a":0,"s":"<p>\"Though\" signals a contrast between a positive quality (ingenious, clever) and the false premise.<br>Other options: B — again no contrast; both are negative; C — no contrast; an illogical argument resting on a false premise is not surprising; D — there is no contrast between \"flawed\" and a false premise.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M2.1.12","q":"<p>Choose the word that best completes the sentence: \"The company's ___ hiring practices, which favoured relatives of senior staff, drew sharp criticism.\"<\/p>","o":["meritocratic","diverse","nepotistic","transparent"],"a":2,"s":"<p>Nepotism is favouring relatives, especially in giving jobs.<br>Other options: A — meritocratic hiring is based on ability, the opposite of favouring relatives; B — diversity has nothing to do with favouring relatives; D — open hiring practices would not favour relatives.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M2.1.13","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The chief executive, along with her two deputies, <u>were present<\/u> at the hearing.\"<\/p>","o":["were present","was present","are being present","have been present"],"a":1,"s":"<p>The subject is \"The chief executive\" (singular); a phrase introduced by \"along with\" does not change the number of the subject.<br>Other options: A — \"along with her two deputies\" does not make the subject plural; C — plural, and the continuous form is wrong with \"present\"; D — plural verb, and the present perfect does not fit a past event.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.14","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"<u>Built in the seventeenth century, tourists flock to the temple every spring.<\/u>\"<\/p>","o":["Built in the seventeenth century, tourists flock to the temple every spring.","Built in the seventeenth century, every spring tourists flock to the temple.","Tourists, built in the seventeenth century, flock to the temple every spring.","Built in the seventeenth century, the temple draws tourists every spring."],"a":3,"s":"<p>The phrase \"Built in the seventeenth century\" must be followed by the thing that was built, the temple.<br>Other options: A — the opening phrase dangles: it says the tourists were built in the seventeenth century; B — the phrase now modifies \"every spring\" or \"tourists\", not the temple; C — still says the tourists were built.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.15","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"There were <u>less complaints<\/u> this year than last year.\"<\/p>","o":["less complaints","lesser complaints","fewer complaints","little complaints"],"a":2,"s":"<p>\"Complaints\" can be counted, so \"fewer\" is required.<br>Other options: A — \"less\" is used with uncountable nouns (less money), not plural countable nouns; B — \"lesser\" means less important, which changes the meaning; D — \"little\" is for uncountable nouns and changes the meaning to \"small complaints\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.16","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The new policy will <u>not only reduce costs but also it will improve<\/u> service.\"<\/p>","o":["not only reduce costs but also it will improve","not only reduce costs but it will also improve","reduce not only costs but also improve","not only reduce costs but also improve"],"a":3,"s":"<p>\"Not only\" and \"but also\" must be followed by the same form: \"reduce costs\" and \"improve service\".<br>Other options: A — after \"but also\" the structure changes to a full clause, breaking parallelism; B — still not parallel: a verb phrase against a full clause; C — \"not only costs\" (a noun) is not parallel with \"improve\" (a verb).<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.17","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"By the time the auditors arrived, the accountant <u>already destroyed<\/u> the files.\"<\/p>","o":["already destroyed","had already destroyed","was already destroying","has already destroyed"],"a":1,"s":"<p>An action completed before another past action (\"By the time the auditors arrived\") needs the past perfect.<br>Other options: A — the simple past does not show that this action happened before the auditors arrived; C — the continuous form suggests an unfinished action and does not fit \"By the time\"; D — the present perfect cannot be used with a past time reference like \"By the time ... arrived\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.18","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"Many economists regard the policy <u>to be<\/u> a failure.\"<\/p>","o":["to be","being","as","like"],"a":2,"s":"<p>The correct idiom is \"regard something as something\".<br>Other options: A — \"regard\" is not followed by \"to be\"; B — \"regard ... being\" is not idiomatic; D — \"regard ... like\" is not idiomatic.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.19","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The reason the project failed <u>is because the funds were<\/u> released late.\"<\/p>","o":["is because the funds were","is that the funds were","was due to the funds being","is due to the funds were"],"a":1,"s":"<p>After \"The reason ... is\", standard English uses a \"that\" clause.<br>Other options: A — \"the reason ... is because\" is redundant: \"reason\" already expresses cause; C — still redundant (\"reason ... due to\"), and the tense shift is awkward; D — ungrammatical: \"due to\" must be followed by a noun phrase, not a clause.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M2.1.20","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"Neither the manager nor the clerks <u>were<\/u> aware of the change.\"<\/p>","o":["were","is","has been","was"],"a":0,"s":"<p>With \"neither ... nor\", the verb agrees with the nearer subject, \"the clerks\" (plural), so \"were\" is correct. No change is needed.<br>Other options: B — singular and in the wrong tense; C — singular, and \"aware of\" with \"has been\" changes the tense without reason; D — the verb must agree with \"the clerks\", which is plural.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"p":"<p><b>Passage 1<\/b><br>Open-plan offices were sold to managers on a simple promise: remove the walls, and people will talk more. Fewer private rooms would mean more chance encounters, a quicker exchange of ideas and, as a bonus, lower rent per employee. For decades the promise went largely untested, because measuring how often colleagues actually speak to one another is difficult.<br>A study published in 2018 changed that. Researchers asked employees at two large firms that were moving from cubicles to open-plan floors to wear small sensors that recorded when they were talking face to face with someone nearby. They also collected the employees' e-mail and instant-message records. After the move, face-to-face interaction fell by roughly 70 per cent, while electronic messaging rose sharply. Far from bringing people together, the open floors seemed to drive them behind their screens.<br>The researchers offered a plausible explanation. In a room where everyone can see and hear everyone else, people seek privacy in other ways: they put on headphones, avoid eye contact and move sensitive conversations into writing. A wall, it turns out, may be what makes a conversation feel safe enough to start.<br>None of this means that open-plan offices have no merits. They are cheaper, and some teams that need constant coordination may genuinely benefit. But the study suggests that firms should judge office layouts by how people actually behave in them rather than by how designers expect them to behave.<br>Questions 2.1.21 to 2.1.25 are based on this passage.<\/p>"},{"id":"M2.1.21","q":"<p>(Passage 1) Which of the following best expresses the main point of the passage?<\/p>","o":["An office design meant to increase conversation appears to have reduced it, so layouts should be judged by actual behaviour","Sensors are the best way to measure employee productivity","Electronic messaging is more productive than face-to-face conversation","Open-plan offices should be abolished in all firms"],"a":0,"s":"<p>The passage reports the study's finding (paragraph 2), explains it (paragraph 3) and draws the lesson (paragraph 4).<br>Other options: B — sensors measured conversation, not productivity, and are not the main point; C — the passage does not compare productivity; D — too extreme; the last paragraph grants that open-plan offices have merits.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.22","q":"<p>(Passage 1) According to the passage, why had the promise of open-plan offices gone largely untested?<\/p>","o":["Managers were interested only in lower rent","Open-plan offices had been introduced only recently","It is difficult to measure how often colleagues actually talk to one another","Firms refused to let researchers into their offices"],"a":2,"s":"<p>Stated at the end of paragraph 1.<br>Other options: A — not given as the reason for the lack of testing; B — the passage says the promise went untested \"for decades\"; D — not stated.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.23","q":"<p>(Passage 1) The author mentions headphones as an example of<\/p>","o":["a way in which employees create privacy when walls are removed","a cost that open-plan offices help firms to save","a cause of the fall in productivity","equipment used by the researchers to record conversations"],"a":0,"s":"<p>Paragraph 3 lists headphones among the ways people \"seek privacy in other ways\".<br>Other options: B — headphones are not presented as a cost saving; C — productivity is not discussed; D — the researchers used sensors, not headphones.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.24","q":"<p>(Passage 1) Which of the following, if true, would most weaken the study's conclusion that the open-plan layout reduced face-to-face interaction?<\/p>","o":["Employees in the study said they found the open floors noisy","Open-plan floors cost the firms less per employee than cubicles","The sensors recorded conversations accurately","During the same period, both firms also introduced new messaging software and urged staff to use it"],"a":3,"s":"<p>This gives another cause for the shift from talking to messaging, so the fall may not be due to the layout.<br>Other options: A — this fits the researchers' explanation, so it does not weaken it; B — cost is irrelevant to the cause of the fall in conversation; C — this supports the reliability of the data.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.25","q":"<p>(Passage 1) The author's attitude towards open-plan offices is best described as<\/p>","o":["indifferent","balanced: acknowledging some merits while urging judgement based on actual behaviour","wholly hostile","enthusiastic"],"a":1,"s":"<p>The last paragraph grants that they are cheaper and suit some teams, yet stresses the study's lesson.<br>Other options: A — the author draws a clear lesson, so is not indifferent; C — the author explicitly mentions their merits; D — the passage reports evidence against their main promise.<\/p>","tag":"1.4 Reading comprehension"},{"p":"<p><b>Passage 2<\/b><br>Until the second half of the nineteenth century, almost every town kept its own time. Noon was the moment the sun stood highest over that particular place, so a town a few dozen kilometres to the east would be a minute or two ahead of its neighbour. For people who travelled on foot or by horse, the differences hardly mattered.<br>The railways changed that. A timetable listing departures from dozens of towns, each keeping its own local time, was a recipe for confusion and, on single-track lines, for collisions. British railway companies began adopting a single standard, London time, in the 1840s, and most of the country followed within about a decade, although legal recognition did not come until 1880. In North America, where the distances were far greater, the railways in 1883 divided the continent into a small number of zones, each one hour apart.<br>The change was not universally welcomed. Some newspapers complained that the railways had no right to alter the time, which they regarded as set by nature, and a few towns stubbornly kept their own clocks for years. Yet the practical advantages proved decisive. In 1884 an international conference chose the meridian through Greenwich as the starting point for a worldwide system of time zones.<br>The story is a reminder that standards often arise not from government planning but from the needs of a particular industry, and that governments may simply ratify what has already become common practice.<br>Questions 2.1.26 to 2.1.30 are based on this passage.<\/p>"},{"id":"M2.1.26","q":"<p>(Passage 2) The primary purpose of the passage is to<\/p>","o":["argue that local solar time is more natural than standard time","compare the safety records of British and American railways","explain how the needs of the railways led to standard time, and what this suggests about how standards arise","criticise newspapers that opposed standard time"],"a":2,"s":"<p>The passage traces the railways' role in standard time and ends with a general lesson about standards.<br>Other options: A — the passage reports this view but does not argue for it; B — no such comparison is made; D — the newspapers are mentioned only briefly.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.27","q":"<p>(Passage 2) According to the passage, differences in local time mattered little before the railways because<\/p>","o":["people travelled slowly, on foot or by horse","clocks were too inaccurate to show the difference","towns were very far apart","governments had already fixed a single national time"],"a":0,"s":"<p>Paragraph 1 says the differences \"hardly mattered\" for people who travelled on foot or by horse.<br>Other options: B — not stated; C — the passage mentions towns \"a few dozen kilometres\" apart; D — the passage says governments recognised standard time only later.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.28","q":"<p>(Passage 2) It can be inferred from the passage that legal recognition of standard time in Britain<\/p>","o":["was strongly opposed by the railway companies","came before the railways adopted London time","came in the same year as the international conference","came after most of the country had already adopted it"],"a":3,"s":"<p>Most of the country followed London time within about a decade of the 1840s, but the law came only in 1880.<br>Other options: A — nothing suggests that the railways opposed it; B — the railways began in the 1840s, long before 1880; C — the law came in 1880 and the conference in 1884.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.29","q":"<p>(Passage 2) The newspapers' objection to railway time was based on the belief that<\/p>","o":["the time zones were too wide","Greenwich was a poor choice of meridian","time was set by nature and was not something the railways could change","standard time would cause more collisions"],"a":2,"s":"<p>The passage says they regarded time \"as set by nature\".<br>Other options: A — the newspapers' complaint was about the right to alter time, not the width of zones; B — the Greenwich decision came later and is not linked to the newspapers; D — the passage says local times, not standard time, risked collisions.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.30","q":"<p>(Passage 2) Which of the following, if true, would most strengthen the claim made in the final paragraph?<\/p>","o":["Several technical standards for the internet were worked out by engineers and companies and only later written into government rules","Some governments plan technical standards before any industry uses them","The Greenwich meridian is still used as the reference for time zones","A few towns kept their own clocks for years after the railways changed"],"a":0,"s":"<p>This is another case of an industry creating a standard that government later ratified, supporting the general claim.<br>Other options: B — this is a counter-example and weakens the claim; C — this is about the lasting choice, not about who created standards; D — this concerns resistance, not how standards arise.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M2.1.31","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Customers, however, did not see it that way.<br>Q. A soft-drink company once changed the recipe of its best-selling drink after taste tests showed that people preferred a sweeter version.<br>R. Within three months the old recipe was back on the shelves.<br>S. To many of them, the original drink was part of their identity, and changing it felt like a betrayal.<\/p>","o":["QPRS","PQSR","QSPR","QPSR"],"a":3,"s":"<p>Q describes the change; P (\"however\") gives the customers' reaction; S explains it (\"many of them\" = customers); R gives the outcome.<br>Other options: A — S explains the customers' reaction, so it must come right after P and before the outcome; B — P's \"however\" and \"it\" need Q before them; C — \"many of them\" in S needs \"Customers\" from P first.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M2.1.32","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. They also lower borrowing costs for the government, since lenders demand less compensation for inflation.<br>Q. Many central banks today set an explicit target for inflation, usually around 2 per cent.<br>R. Such targets are meant to anchor what households and firms expect.<br>S. When expectations are stable, wage and price decisions become easier to plan.<\/p>","o":["QSRP","QRSP","QRPS","RQSP"],"a":1,"s":"<p>Q introduces inflation targets; R (\"Such targets\") gives their aim; S the first benefit; P (\"also\") a further benefit.<br>Other options: A — S's \"expectations\" needs R to introduce the idea first; C — P's \"also\" signals an additional benefit, so it must follow the first benefit in S; D — \"Such targets\" in R needs Q first.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M2.1.33","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. The first was cost: each car took about twelve hours to assemble by hand.<br>Q. Henry Ford's moving assembly line, introduced in 1913, solved two problems at once.<br>R. The second was supply: demand far exceeded what the factory could produce.<br>S. With the line in place, assembly time fell to about an hour and a half, and the price of the car dropped sharply.<\/p>","o":["QPSR","QPRS","QRPS","PRQS"],"a":1,"s":"<p>Q announces \"two problems\"; P gives the first and R the second; S describes the result.<br>Other options: A — S describes the outcome and should come after both problems are named; C — \"The second\" (R) cannot come before \"The first\" (P); D — P and R need Q's \"two problems\" before them.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M2.1.34","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Instead, she started by listening to the complaints of the night-shift workers.<br>Q. When Anita became head of the hospital, everyone expected her to cut costs at once.<br>R. Their main grievance turned out to be the broken lift, which made every task slower.<br>S. Repairing it cost little but improved morale more than any new policy could have done.<\/p>","o":["QPRS","PQRS","QPSR","QRPS"],"a":0,"s":"<p>Q sets up the expectation; P (\"Instead\") gives what she did; R (\"Their grievance\") reports what the workers said; S (\"Repairing it\") gives the result.<br>Other options: B — \"Instead\" in P needs Q's expectation first; C — \"Repairing it\" in S needs the lift mentioned in R; D — \"Their main grievance\" in R needs the night-shift workers from P.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M2.1.35","q":"<p>Choose the correct meaning of the idiom \"to pass the buck\".<\/p>","o":["to go hunting for deer","to win by a very small margin","to pay a debt in cash","to shift responsibility or blame onto someone else"],"a":3,"s":"<p>To pass the buck is to avoid responsibility by handing it to another person.<br>Other options: A — a literal reading of \"buck\"; B — unrelated meaning; C — a literal reading of \"buck\" as money.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M2.1.36","q":"<p>Choose the correct meaning of the phrase \"a red herring\".<\/p>","o":["a clear warning sign","a rare and expensive delicacy","something that misleads or distracts attention from the real issue","a person who is in debt"],"a":2,"s":"<p>A red herring is a false clue that draws attention away from the real question.<br>Other options: A — a confusion with \"red flag\"; B — a literal misreading; D — a confusion with \"in the red\".<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M2.1.37","q":"<p>Choose the one word for: \"A remedy for all diseases or problems.\"<\/p>","o":["palliative","antidote","placebo","panacea"],"a":3,"s":"<p>A panacea is a supposed cure for every disease or difficulty.<br>Other options: A — a palliative relieves symptoms without curing the cause; B — an antidote counteracts a particular poison; C — a placebo is a harmless substance given for its psychological effect.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M2.1.38","q":"<p>Choose the one word for: \"Something that can be touched; real rather than imaginary.\"<\/p>","o":["tangible","visible","audible","edible"],"a":0,"s":"<p>Tangible means perceptible by touch, and hence real or concrete.<br>Other options: B — visible means able to be seen; C — audible means able to be heard; D — edible means fit to be eaten.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M2.1.39","q":"<p>Choose the word that completes the analogy. Cartographer : Maps :: Lexicographer : ?<\/p>","o":["Letters","Lectures","Dictionaries","Languages"],"a":2,"s":"<p>A cartographer makes maps; a lexicographer compiles dictionaries.<br>Other options: A — a lexicographer works with words, but does not produce letters; B — unrelated; D — lexicographers record languages but do not create them.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M2.1.40","q":"<p>Choose the word that completes the analogy. Myopia : Eye :: Arthritis : ?<\/p>","o":["Skin","Joint","Muscle","Heart"],"a":1,"s":"<p>Myopia is a disorder of the eye; arthritis is inflammation of the joints.<br>Other options: A — skin disorders include eczema, not arthritis; C — muscle disorders are not arthritis; D — heart disease is not arthritis.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"}]},{"t":"Section 2 · Quantitative Aptitude (30)","items":[{"id":"M2.2.1","q":"<p>What is the unit digit of 13⁴³ + 7²²?<\/p>","o":["0","2","6","4"],"a":2,"s":"<p>Unit digits of powers of 3 cycle 3, 9, 7, 1; 43 = 4 × 10 + 3, so 13⁴³ ends in 7. Powers of 7 cycle 7, 9, 3, 1; 22 = 4 × 5 + 2, so 7²² ends in 9. 7 + 9 = 16, so the unit digit is 6.<br>Other options: A — takes 13⁴³ as ending in 1 and 7²² as ending in 9; B — takes 13⁴³ as ending in 3 and 7²² as ending in 9; D — takes 13⁴³ as ending in 7 and 7²² as ending in 7 (a slip in the cycle).<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M2.2.2","q":"<p>What is the smallest positive number that leaves a remainder of 3 when divided by 5, 6 or 8, and is exactly divisible by 9?<\/p>","o":["243","483","363","123"],"a":0,"s":"<p>Numbers leaving remainder 3 with 5, 6 and 8 are 120k + 3 (LCM = 120). 120k + 3 is divisible by 9 when 3k + 3 is, i.e. k = 2: 243 = 9 × 27.<br>Other options: B — 120 × 4 + 3, but 483 is not divisible by 9; C — 120 × 3 + 3, but 363 is not divisible by 9; D — 120 + 3, but 123 is not divisible by 9.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M2.2.3","q":"<p>The HCF of two numbers is 18 and their LCM is 1,260. If one number is 126, what is the other?<\/p>","o":["210","90","140","180"],"a":3,"s":"<p>Product of the numbers = HCF × LCM = 18 × 1,260 = 22,680. Other number = 22,680 ÷ 126 = 180.<br>Other options: A — divides 1,260 by 6; B — halves the correct value by mistake; C — divides 1,260 by 9 instead of using the product rule.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M2.2.4","q":"<p>If 2ˣ = 3ʸ = 6ᶻ (with x, y, z non-zero), which of the following is true?<\/p>","o":["z = x + y","z = xy/(x + y)","z = xy","z = (x + y)/2"],"a":1,"s":"<p>Let each equal k. Then 2 = k^(1/x), 3 = k^(1/y), 6 = k^(1/z). Since 6 = 2 × 3, 1/z = 1/x + 1/y, so z = xy/(x + y).<br>Other options: A — adds the exponents instead of their reciprocals; C — multiplies the exponents; D — averages the exponents.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M2.2.5","q":"<p>A trader marks his goods 50% above cost and then allows two successive discounts of 10% and 20%. What is his profit percentage?<\/p>","o":["8%","15%","20%","5%"],"a":0,"s":"<p>Selling price = 1.5 × 0.9 × 0.8 = 1.08 times cost, a profit of 8%.<br>Other options: B — an arithmetic slip; C — subtracts the discounts from the mark-up: 50 − 10 − 20; D — adds the two discounts into one 30% discount: 1.5 × 0.7 = 1.05.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M2.2.6","q":"<p>The price of a share rises by 25% in January, falls by 20% in February and rises by 10% in March. What is the net change over the three months?<\/p>","o":["No change","A fall of 5%","A rise of 10%","A rise of 15%"],"a":2,"s":"<p>1.25 × 0.80 × 1.10 = 1.10, a net rise of 10%.<br>Other options: A — assumes the rises and the fall cancel out; B — an arithmetic slip; D — adds the percentages: 25 − 20 + 10.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M2.2.7","q":"<p>In how many years will Rs 8,000 amount to Rs 10,648 at 10% per annum, compounded annually?<\/p>","o":["4 years","2 years","3.3 years","3 years"],"a":3,"s":"<p>10,648/8,000 = 1.331 = 1.1³, so 3 years.<br>Other options: A — 1.1⁴ = 1.4641 gives Rs 11,712.80; B — 1.1² = 1.21 gives only Rs 9,680; C — uses simple interest: 2,648 ÷ 800.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M2.2.8","q":"<p>A shop offers \"Buy 3, get 1 free\" on items of the same price. What is the effective percentage discount?<\/p>","o":["33⅓%","25%","30%","75%"],"a":1,"s":"<p>The customer gets 4 items for the price of 3, saving 1 in 4 = 25%.<br>Other options: A — divides the free item by the 3 paid items instead of the 4 received; C — an arithmetic slip; D — this is the fraction of the price paid, not the discount.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M2.2.9","q":"<p>A dealer buys 120 kg of rice for Rs 9,600. 10% of it is spoilt and cannot be sold. At what price per kg must he sell the rest to make an overall profit of 20%?<\/p>","o":["Rs 106⅔","Rs 88.89","Rs 96","Rs 105.60"],"a":0,"s":"<p>Required revenue = 9,600 × 1.2 = Rs 11,520. Saleable rice = 108 kg. Price = 11,520 ÷ 108 = Rs 106⅔ per kg.<br>Other options: B — covers only the cost (9,600 ÷ 108) with no profit; C — 20% above the cost per kg (80), ignoring the spoilt rice; D — adds 10% to Rs 96 instead of dividing by 0.9.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M2.2.10","q":"<p>A merchant mixes tea costing Rs 300 per kg with tea costing Rs 420 per kg. He sells the mixture at Rs 432 per kg and makes a profit of 20%. In what ratio did he mix them (cheaper : dearer)?<\/p>","o":["5 : 7","1 : 2","1 : 1","7 : 5"],"a":2,"s":"<p>Cost of the mixture = 432 ÷ 1.2 = Rs 360. By alligation, (420 − 360) : (360 − 300) = 60 : 60 = 1 : 1.<br>Other options: A — uses the ratio of the two prices, 300 : 420; B — an arithmetic slip; D — the inverse ratio of the two prices.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M2.2.11","q":"<p>The average of 8 numbers is 24. Each number is multiplied by 3 and then 5 is subtracted from each. What is the new average?<\/p>","o":["67","57","77","72"],"a":0,"s":"<p>Every operation applied to each number applies to the average: 24 × 3 − 5 = 67.<br>Other options: B — subtracts 5 before multiplying: (24 − 5) × 3; C — adds 5 instead of subtracting; D — multiplies by 3 but forgets to subtract 5.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M2.2.12","q":"<p>Rs 8,500 is divided among A, B and C so that A gets 2/3 of what B gets and B gets 1/4 of what C gets. What is C's share?<\/p>","o":["Rs 1,000","Rs 6,000","Rs 1,500","Rs 4,500"],"a":1,"s":"<p>Let B = 3x; then A = 2x and C = 12x. Total 17x = 8,500, so x = 500 and C = 12 × 500 = Rs 6,000.<br>Other options: A — this is A's share; C — this is B's share; D — uses the ratio 2 : 3 : 4 for A : B : C.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M2.2.13","q":"<p>The present ages of a father and his son add up to 60 years. Six years ago the father was 5 times as old as the son. How old will the son be six years from now?<\/p>","o":["14 years","26 years","8 years","20 years"],"a":3,"s":"<p>Let the son be S; the father is 60 − S. Then 54 − S = 5(S − 6), so 6S = 84 and S = 14. In six years he will be 20.<br>Other options: A — this is the son's present age; B — adds 12 years to the present age; C — this is the son's age six years ago.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M2.2.14","q":"<p>A leak can empty a full tank in 8 hours. When an inlet pipe filling 6 litres per minute is also opened, the full tank empties in 12 hours. What is the capacity of the tank?<\/p>","o":["7,200 litres","4,320 litres","8,640 litres","5,760 litres"],"a":2,"s":"<p>Inlet = 360 litres per hour. If capacity is C, C/8 − 360 = C/12, so C/24 = 360 and C = 8,640 litres.<br>Other options: A — uses 6 × 60 × 20 (adds the hours); B — uses 360 × 12, ignoring the leak; D — uses 360 × 16.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M2.2.15","q":"<p>A can do a job in 12 days and B in 18 days. A works alone for 4 days and B then finishes the job alone. How many days does B work?<\/p>","o":["12 days","8 days","6 days","14 days"],"a":0,"s":"<p>In 4 days A does 4/12 = 1/3. The remaining 2/3 takes B (2/3) × 18 = 12 days.<br>Other options: B — the time A alone would need for the remaining work; C — the time B would need for only one-third of the job; D — uses 18 − 4.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M2.2.16","q":"<p>Two cyclists start at the same time from towns 90 km apart and ride towards each other at 12 km/h and 18 km/h. A bird starts with the first cyclist and flies back and forth between them at 40 km/h until they meet. How far does the bird fly?<\/p>","o":["54 km","36 km","120 km","90 km"],"a":2,"s":"<p>The cyclists meet after 90 ÷ (12 + 18) = 3 hours; the bird flies for 3 hours at 40 km/h = 120 km.<br>Other options: A — the distance ridden by the second cyclist (18 × 3); B — the distance ridden by the first cyclist (12 × 3); D — the distance between the towns.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M2.2.17","q":"<p>A man walking at 5 km/h crosses a bridge in 15 minutes. How long is the bridge?<\/p>","o":["1,000 m","750 m","1,500 m","1,250 m"],"a":3,"s":"<p>Distance = 5 km/h × 1/4 h = 1.25 km = 1,250 m.<br>Other options: A — uses 12 minutes; B — uses 15 minutes as 0.15 hour; C — uses 18 minutes.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M2.2.18","q":"<p>A and B start from the same point on a 400 m circular track and run in opposite directions at 6 m/s and 4 m/s. After how many seconds do they meet for the first time?<\/p>","o":["80 seconds","40 seconds","200 seconds","100 seconds"],"a":1,"s":"<p>In opposite directions their speeds add: 400 ÷ (6 + 4) = 40 s.<br>Other options: A — divides by the average speed, 5 m/s; C — uses the difference of speeds, which applies when they run in the same direction; D — divides by the slower speed only.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M2.2.19","q":"<p>How many integers x satisfy |2x − 5| < 7?<\/p>","o":["6","7","5","13"],"a":0,"s":"<p>−7 < 2x − 5 < 7 gives −1 < x < 6, so x = 0, 1, 2, 3, 4, 5: six integers.<br>Other options: B — includes x = −1 or x = 6, where |2x − 5| = 7, not less than 7; C — leaves out x = 0; D — counts −1 < 2x < 12 as 13 values of 2x.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M2.2.20","q":"<p>The 5th term of an arithmetic progression is 17 and its 12th term is 45. What is the sum of its first 20 terms?<\/p>","o":["840","780","760","800"],"a":1,"s":"<p>7d = 45 − 17 = 28, so d = 4 and a = 17 − 16 = 1. S₂₀ = 20/2 × (2 + 19 × 4) = 10 × 78 = 780.<br>Other options: A — uses a = 4; C — uses a = 0; D — uses 20 × d × 10.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M2.2.21","q":"<p>The sum of an infinite geometric progression is 24 and its first term is 8. What is the common ratio?<\/p>","o":["1/3","1/2","2/3","3/4"],"a":2,"s":"<p>a/(1 − r) = 24 gives 1 − r = 1/3, so r = 2/3.<br>Other options: A — this is 1 − r, not r; B — gives a sum of 16; D — an arithmetic slip.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M2.2.22","q":"<p>In a right-angled triangle, the hypotenuse is 26 cm and one of the other sides is 10 cm. What is the area of the triangle?<\/p>","o":["240 cm²","130 cm²","260 cm²","120 cm²"],"a":3,"s":"<p>The third side is √(26² − 10²) = √576 = 24 cm. Area = ½ × 10 × 24 = 120 cm².<br>Other options: A — forgets the ½; B — uses ½ × 10 × 26, taking the hypotenuse as a perpendicular side; C — multiplies 10 by 26.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M2.2.23","q":"<p>A metal sphere of radius 6 cm is melted and recast into a solid cylinder of base radius 4 cm. What is the height of the cylinder?<\/p>","o":["9 cm","36 cm","18 cm","13.5 cm"],"a":2,"s":"<p>Volume of sphere = (4/3)π × 216 = 288π. Cylinder: π × 16 × h = 288π, so h = 18 cm.<br>Other options: A — uses (2/3)πr³, the volume of a hemisphere; B — divides 288 by 8 (the diameter) instead of 16 (the radius squared); D — uses πr²h with r = 4 and volume 216π (forgets the 4/3).<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"p":"<p><b>Table for questions 2.2.24 to 2.2.27<\/b><br>A firm surveyed its 500 employees about their preferred way of working.<\/p><div class=\"tw\"><table><thead><tr><th>Department<\/th><th>Office<\/th><th>Hybrid<\/th><th>Remote<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Sales<\/td><td>70<\/td><td>40<\/td><td>10<\/td><td>120<\/td><\/tr><tr><td>Finance<\/td><td>30<\/td><td>60<\/td><td>30<\/td><td>120<\/td><\/tr><tr><td>IT<\/td><td>20<\/td><td>70<\/td><td>60<\/td><td>150<\/td><\/tr><tr><td>HR<\/td><td>40<\/td><td>50<\/td><td>20<\/td><td>110<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"M2.2.24","q":"<p>(Table) What percentage of all employees prefer hybrid working?<\/p>","o":["50%","44%","40%","22%"],"a":1,"s":"<p>Hybrid total = 40 + 60 + 70 + 50 = 220; 220/500 = 44%.<br>Other options: A — the hybrid share in Finance only; C — an arithmetic slip in the hybrid total (200); D — divides 220 by 1,000.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M2.2.25","q":"<p>(Table) In which department is the proportion of employees preferring remote work the highest?<\/p>","o":["IT","HR","Finance","Sales"],"a":0,"s":"<p>Remote share: Sales 10/120 ≈ 8%; Finance 30/120 = 25%; IT 60/150 = 40%; HR 20/110 ≈ 18%.<br>Other options: B — about 18%; C — 25%, lower than IT's 40%; D — about 8%, the lowest.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M2.2.26","q":"<p>(Table) What is the ratio of Sales employees who prefer the office to IT employees who prefer remote work?<\/p>","o":["1 : 1","7 : 12","6 : 7","7 : 6"],"a":3,"s":"<p>70 : 60 = 7 : 6.<br>Other options: A — an arithmetic slip; B — uses 70 : 120 (Sales total); C — the ratio is reversed.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M2.2.27","q":"<p>(Table) If 25% of the hybrid-preferring employees in every department switched to remote work, how many employees would then prefer remote work?<\/p>","o":["150","55","340","175"],"a":3,"s":"<p>25% of 220 = 55 switch. Remote total = 120 + 55 = 175.<br>Other options: A — adds 25% of the remote total (30) instead of 25% of the hybrid total; B — only the number who switch; C — adds all 220 hybrid-preferring employees.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M2.2.28","q":"<p>How many three-digit numbers can be formed in which all the digits are odd and no digit is repeated?<\/p>","o":["10","120","60","125"],"a":2,"s":"<p>The odd digits are 1, 3, 5, 7, 9. Without repetition: 5 × 4 × 3 = 60.<br>Other options: A — counts selections C(5, 3), not arrangements; B — uses 5 × 4 × 3 × 2; D — allows repetition: 5³.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M2.2.29","q":"<p>A box contains 4 defective and 8 good bulbs. Three bulbs are chosen at random. What is the probability that exactly one of them is defective?<\/p>","o":["14/55","28/55","4/11","1/3"],"a":1,"s":"<p>C(4, 1) × C(8, 2) / C(12, 3) = 4 × 28 / 220 = 112/220 = 28/55.<br>Other options: A — uses C(8, 2) × 2 instead of × 4 in the numerator; C — an arithmetic slip; D — the probability that a single bulb is defective (4/12).<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M2.2.30","q":"<p>The mean of 10 numbers is 15 and their standard deviation is 3. If 5 is added to each number, what are the new mean and standard deviation?<\/p>","o":["Mean 20, standard deviation 3","Mean 15, standard deviation 3","Mean 20, standard deviation 4.5","Mean 20, standard deviation 8"],"a":0,"s":"<p>Adding a constant shifts every value and the mean by 5 but does not change the spread, so the standard deviation stays 3.<br>Other options: B — the mean does change, by 5; C — the spread is unchanged; only multiplication would scale it; D — adding a constant does not change the standard deviation.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"}]},{"t":"Section 3 · Logical Reasoning (30)","items":[{"id":"M2.3.1","q":"<p>Find the next term: 1, 4, 13, 40, 121, ?<\/p>","o":["363","365","241","364"],"a":3,"s":"<p>Each term is three times the previous term plus 1: 121 × 3 + 1 = 364.<br>Other options: A — multiplies by 3 but forgets to add 1; B — adds 2 instead of 1; C — doubles and subtracts 1.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M2.3.2","q":"<p>Find the wrong number in the series: 3, 8, 15, 24, 34, 48, 63<\/p>","o":["24","34","48","15"],"a":1,"s":"<p>The terms are n² − 1 for n = 2 to 8: 3, 8, 15, 24, 35, 48, 63. So 34 should be 35.<br>Other options: A — 5² − 1 = 24 fits; C — 7² − 1 = 48 fits; D — 4² − 1 = 15 fits.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M2.3.3","q":"<p>Find the next term: AZ, CX, FU, JQ, ?<\/p>","o":["NL","OK","OL","PL"],"a":2,"s":"<p>First letters A, C, F, J move +2, +3, +4, so next +5: O. Second letters Z, X, U, Q move −2, −3, −4, so next −5: L.<br>Other options: A — moves the first letter forward by 4 again; B — moves the second letter back by 6; D — moves the first letter forward by 6.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M2.3.4","q":"<p>4 : 65 :: 6 : ?<\/p>","o":["216","37","215","217"],"a":3,"s":"<p>4³ + 1 = 65, so 6³ + 1 = 217.<br>Other options: A — 6³ without adding 1; B — uses 6² + 1; C — uses 6³ − 1.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M2.3.5","q":"<p>In a code, each letter is replaced by its position counted from Z (Z = 1, Y = 2, …, A = 26), so CAT is written as 24-26-7. How is DOG written?<\/p>","o":["23-11-20","23-12-20","22-12-20","4-15-7"],"a":1,"s":"<p>Reverse position = 27 − ordinary position: D (4) → 23, O (15) → 12, G (7) → 20.<br>Other options: A — O taken as 16; C — D taken as 5; D — uses ordinary positions.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.6","q":"<p>In a code, LEMON is written as MDNNO. How is PEACH written in that code?<\/p>","o":["QDBBI","QDBDI","OFZDG","QFBDI"],"a":0,"s":"<p>Letters are shifted alternately +1 and −1: L+1 = M, E−1 = D, M+1 = N, O−1 = N, N+1 = O. So P → Q, E → D, A → B, C → B, H → I.<br>Other options: B — shifts the fourth letter +1 instead of −1; C — starts the pattern with −1 instead of +1; D — shifts every letter +1.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.7","q":"<p>If BAD is coded as 8 (2 × 1 × 4) and CAB as 6 (3 × 1 × 2), what is the code for ACE?<\/p>","o":["9","135","13","15"],"a":3,"s":"<p>Multiply the letter positions: A = 1, C = 3, E = 5; 1 × 3 × 5 = 15.<br>Other options: A — adds the positions; B — uses 3 × 5 × 9; C — an arithmetic slip.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M2.3.8","q":"<p>A is the son of B. C is B's sister. D is C's son. E is D's daughter. How is E related to A?<\/p>","o":["A's daughter","A's cousin's daughter","A's niece","A's granddaughter"],"a":1,"s":"<p>C is A's aunt, so D is A's cousin, and E, D's daughter, is A's cousin's daughter.<br>Other options: A — E's father is D, not A; C — a niece is a sibling's daughter; D is A's cousin, not A's sibling; D — E is not a child of A's child.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.9","q":"<p>In a family of six members, P, Q, R, S, T and U, P is the husband of Q. R is the only son of P and Q. S is R's sister. T is R's wife. U is the son of T. How many female members are there in the family?<\/p>","o":["3","4","1","2"],"a":0,"s":"<p>Q (wife of P), S (R's sister) and T (R's wife) are female; P, R and U are male.<br>Other options: B — counts U, who is male; C — counts only Q; D — misses one of Q, S or T.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.10","q":"<p>Ritu is facing south. She turns 45° clockwise, then 180° anticlockwise, then 90° clockwise. Which direction is she facing now?<\/p>","o":["North-east","South-west","South-east","North-west"],"a":2,"s":"<p>South + 45° clockwise = south-west; 180° anticlockwise = north-east; 90° clockwise = south-east.<br>Other options: A — stops after the second turn; B — stops after the first turn; D — the opposite of the correct direction (a slip in the 180° turn).<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M2.3.11","q":"<p>From her home, Gita drives 15 km north, 20 km east, 30 km south and 20 km west, and then 10 km north. Where is she now with respect to her home?<\/p>","o":["5 km north","At home","5 km south","25 km south"],"a":2,"s":"<p>East–west: 20 − 20 = 0. North–south: 15 − 30 + 10 = −5, i.e. 5 km south.<br>Other options: A — sign error in the north–south total; B — an arithmetic slip; D — forgets the final 10 km north.<\/p>","tag":"3.3 Blood relations and direction sense"},{"p":"<p><b>Puzzle 1<\/b><br>Six people, P, Q, R, S, T and U, live on the six floors of a building (floor 1 is the lowest, floor 6 the highest), one person per floor. Each has a different profession: doctor, lawyer, teacher, engineer, banker and artist.<br>(i) Q lives on floor 1.<br>(ii) Exactly one person lives between Q and S.<br>(iii) The doctor lives immediately above the artist.<br>(iv) P lives on an odd-numbered floor above S.<br>(v) The banker lives on the top floor.<br>(vi) T is the engineer and lives below S.<br>(vii) The lawyer lives below the engineer.<br>(viii) U is neither the banker nor the artist.<br>Questions 2.3.12 to 2.3.16 are based on this.<\/p>"},{"id":"M2.3.12","q":"<p>(Puzzle 1) Who lives on the top floor?<\/p>","o":["R","P","S","U"],"a":0,"s":"<p>Q is on 1 and S on 3. P is on an odd floor above S: floor 5. T is below S: floor 2. R and U take floors 4 and 6; the top floor is the banker's and U is not the banker, so R is on 6 and U on 4. Floor by floor: Q, T, S, U, P, R.<br>Other options: B — P lives on floor 5; C — S lives on floor 3; D — U is not the banker, and the top floor belongs to the banker.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M2.3.13","q":"<p>(Puzzle 1) What is S's profession?<\/p>","o":["Lawyer","Artist","Doctor","Teacher"],"a":1,"s":"<p>The lawyer is below the engineer T (floor 2), so Q (floor 1) is the lawyer. The doctor is immediately above the artist: the pair is S–U (3–4) or U–P (4–5). U cannot be the artist, so U is the doctor and S (floor 3) the artist; P is the teacher.<br>Other options: A — Q is the lawyer; C — U is the doctor; D — P, not S, is the teacher.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M2.3.14","q":"<p>(Puzzle 1) Who lives on floor 4?<\/p>","o":["T","P","R","U"],"a":3,"s":"<p>Order from floor 1: Q, T, S, U, P, R.<br>Other options: A — T lives on floor 2; B — P lives on floor 5; C — R lives on floor 6.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M2.3.15","q":"<p>(Puzzle 1) How many people live between T and the banker?<\/p>","o":["3","4","2","1"],"a":0,"s":"<p>T is on floor 2 and the banker R on floor 6; S, U and P live between them.<br>Other options: B — counts the banker as well; C — leaves out one of S, U and P; D — counts only S.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M2.3.16","q":"<p>(Puzzle 1) Who is the teacher?<\/p>","o":["U","R","S","P"],"a":3,"s":"<p>Q lawyer, T engineer, S artist, U doctor, R banker; the remaining profession, teacher, belongs to P.<br>Other options: A — U is the doctor; B — R is the banker; C — S is the artist.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M2.3.17","q":"<p>Statements: Some phones are cameras. No camera is a radio. All radios are speakers.<br>Conclusions: I. Some phones are not radios. II. Some speakers are not cameras.<br>Which conclusion(s) follow?<\/p>","o":["Only II follows","Neither I nor II follows","Both I and II follow","Only I follows"],"a":2,"s":"<p>The phones that are cameras cannot be radios, so I follows. All radios are speakers, so some speakers are radios, and those speakers are not cameras, so II follows.<br>Other options: A — I also follows; B — both follow; D — II also follows.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M2.3.18","q":"<p>Statements: All bankers are graduates. No graduate is illiterate.<br>Conclusions: I. No banker is illiterate. II. All graduates are bankers.<br>Which conclusion(s) follow?<\/p>","o":["Only II follows","Only I follows","Both I and II follow","Neither I nor II follows"],"a":1,"s":"<p>Bankers are inside the set of graduates, and no graduate is illiterate, so no banker is illiterate. \"All bankers are graduates\" cannot be reversed to \"All graduates are bankers\".<br>Other options: A — II reverses a universal statement, which is not valid; C — II does not follow; D — I follows.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M2.3.19","q":"<p>Statement: Several cases of dengue have been reported from one ward of the city.<br>Courses of action: I. The municipality should run a drive to destroy mosquito breeding sites in the ward. II. All residents of the ward should be moved elsewhere.<br>Which course(s) of action follow?<\/p>","o":["Only II follows","Only I follows","Neither I nor II follows","Both I and II follow"],"a":1,"s":"<p>Destroying breeding sites is a practical, proportionate response to dengue. Moving every resident is impractical and excessive.<br>Other options: A — II is impractical and out of proportion; C — I is a sensible step; D — II does not follow.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M2.3.20","q":"<p>Statements: I. The central bank raised its policy interest rate by one percentage point. II. Commercial banks raised the interest rates on home loans.<br>Which of the following best describes the relationship between the two statements?<\/p>","o":["Statement II is the cause and statement I is its effect","Both statements are effects of a common cause","Statement I is the cause and statement II is its effect","Both statements are independent causes"],"a":2,"s":"<p>A higher policy rate raises banks' cost of funds, and they pass this on through higher lending rates.<br>Other options: A — banks' loan rates do not set the central bank's policy rate; B — I is a policy decision that directly causes II; D — II follows from I, so they are not independent.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M2.3.21","q":"<p>Sales of electric scooters in a city doubled last year. Therefore, the city's air pollution from vehicles will fall significantly this year. The argument depends on which assumption?<\/p>","o":["Most of the new electric scooters are replacing trips that would otherwise have been made by petrol vehicles","Electricity prices will fall this year","All residents of the city will buy electric scooters","Electric scooters are cheaper than petrol scooters"],"a":0,"s":"<p>If the scooters only added new trips, petrol vehicle use would not fall and pollution would not drop.<br>Other options: B — not needed for pollution to fall; C — far too strong; the argument does not need this; D — price explains sales but is not needed for the conclusion.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.22","q":"<p>A company found that employees who attended its optional wellness programme took 30% fewer sick days than those who did not. It concludes that the programme reduces sickness. Which of the following, if true, most weakens the conclusion?<\/p>","o":["Most attendees rated the programme highly","Sick days fell across the whole industry last year","The programme costs the company Rs 5,000 per employee","The employees who chose to attend were, on average, younger and healthier before the programme began"],"a":3,"s":"<p>The difference may come from who chose to attend, not from the programme itself.<br>Other options: A — satisfaction does not show an effect on sickness, and if anything fits the conclusion; B — an industry-wide fall would affect both groups and does not explain the gap between them; C — cost does not affect whether the programme works.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.23","q":"<p>After a town banned plastic bags in 2022, the amount of litter collected from its drains fell by 40% in 2023. Officials say the ban caused the fall. Which of the following, if true, most strengthens this claim?<\/p>","o":["Plastic bags were cheap before the ban","The town hired more street cleaners in 2023","In neighbouring towns with similar rainfall but no ban, drain litter did not fall","Most shoppers in the town support the ban"],"a":2,"s":"<p>This comparison rules out weather and other common causes and points to the ban.<br>Other options: A — this does not link the ban to less litter; B — this offers another cause and weakens the claim; D — support does not show that the ban caused the fall.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.24","q":"<p>In Country Z, every company listed on the stock exchange must publish audited accounts. Some family businesses publish audited accounts voluntarily. No company that publishes audited accounts has been fined for tax evasion this year. Which of the following must be true?<\/p>","o":["No listed company in Country Z has been fined for tax evasion this year","Every company that does not publish audited accounts was fined","Some listed companies are family businesses","No family business is listed on the stock exchange"],"a":0,"s":"<p>Every listed company publishes audited accounts, and no such company has been fined.<br>Other options: B — nothing is said about companies without audited accounts; C — possible, but not established; D — the statements do not say this.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.25","q":"<p>\"Most successful entrepreneurs dropped out of college. Therefore, dropping out of college increases one's chances of business success.\" Which of the following best describes the flaw in this reasoning?<\/p>","o":["It assumes that all entrepreneurs are college graduates","It looks only at people who succeeded and ignores the many people who dropped out and did not succeed","It uses the word \"success\" in two different senses","It relies on the opinion of an unnamed authority"],"a":1,"s":"<p>To show that dropping out raises the chance of success, one must compare success rates among dropouts and graduates, not count dropouts among the successful.<br>Other options: A — the argument assumes nothing of the kind; C — the word is used consistently; D — no authority is cited.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.26","q":"<p>Data sufficiency. Question: Is x > 0?<br>I. x³ > 0<br>II. x² > 0<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>A cube is positive only when the number is positive, so I gives \"yes\". II only says x ≠ 0; x could be 2 or −2.<br>Other options: B — II allows negative x; C — I alone is already sufficient; D — I is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.27","q":"<p>Data sufficiency. Question: What is the remainder when the positive integer n is divided by 4?<br>I. n is odd.<br>II. n − 3 is divisible by 8.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>II: n = 8k + 3, and 8k is divisible by 4, so the remainder is always 3.<br>Other options: A — an odd n can leave remainder 1 (e.g. 5) or 3 (e.g. 7); C — II alone is already sufficient; D — II is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.28","q":"<p>Data sufficiency. Question: What is the price of 1 kg of apples?<br>I. 3 kg of apples and 2 kg of oranges cost Rs 700.<br>II. 6 kg of apples and 4 kg of oranges cost Rs 1,400.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":3,"s":"<p>Statement II is exactly twice statement I, so together they still give only one equation in two unknowns.<br>Other options: A — one equation in two unknowns; B — one equation in two unknowns; C — II is just I multiplied by 2, so it adds no new information.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.29","q":"<p>If 26 January 2025 was a Sunday, what day of the week will 26 January 2027 be?<\/p>","o":["Monday","Wednesday","Tuesday","Sunday"],"a":2,"s":"<p>Neither period (26 January 2025 to 2026, or 2026 to 2027) contains a 29 February, since 2026 and 2027 are not leap years. Each year of 365 days moves the weekday on by 1: Sunday → Monday (2026) → Tuesday (2027).<br>Other options: A — moves on by only one year; B — adds an extra day as if a leap year were included; D — forgets that 365 days is 52 weeks and 1 day.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M2.3.30","q":"<p>At what time between 2 and 3 o'clock are the hands of a clock at right angles for the first time?<\/p>","o":["30 minutes past 2","25 minutes past 2","16 4/11 minutes past 2","27 3/11 minutes past 2"],"a":3,"s":"<p>At 2:00 the minute hand is 60° behind the hour hand. It gains 5.5° per minute and must get 90° ahead: (60 + 90)/5.5 = 27 3/11 minutes.<br>Other options: A — at 2:30 the angle is 105°, not 90°; B — treats the hour hand as fixed at the 2; C — uses 90/5.5, ignoring the starting 60° gap.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"}]}]},{"m":3,"secs":[{"t":"Section 1 · Verbal Ability (40)","items":[{"id":"M3.1.1","q":"<p>Choose the word closest in meaning to OBSEQUIOUS.<\/p>","o":["easy to see or understand without explanation","excessively eager to please or obey","unaware of one's surroundings","openly rebellious"],"a":1,"s":"<p>An obsequious person is too willing to please and flatter those in authority.<br>Other options: A — a confusion with \"obvious\"; C — a confusion with \"oblivious\"; D — nearly the opposite of obsequious.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.1.2","q":"<p>Choose the word most nearly opposite in meaning to PRODIGAL.<\/p>","o":["economical","far from home","exceptionally gifted","extravagant"],"a":0,"s":"<p>Prodigal means wastefully extravagant with money or resources; the opposite is economical (careful with resources).<br>Other options: B — a confusion arising from the parable of the prodigal son, who left home; C — a confusion with \"prodigy\" or \"prodigious\"; D — this is a synonym of prodigal.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.1.3","q":"<p>Choose the word closest in meaning to PERNICIOUS.<\/p>","o":["beneficial, especially to health over a long period","persistent","precise","harmful, especially in a gradual or hidden way"],"a":3,"s":"<p>Pernicious describes something that causes great harm, often slowly or subtly.<br>Other options: A — nearly the opposite of pernicious; B — a look-alike confusion with \"pertinacious\"; C — unrelated meaning.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.1.4","q":"<p>In which sentence is the word \"complement\" used correctly?<\/p>","o":["She thanked him for the kind complement on her work.","He complemented her on her excellent presentation.","The new software will complement the existing accounting system.","The hotel offers a complementary breakfast to every guest who stays more than one night."],"a":2,"s":"<p>To complement is to complete or go well with something, which fits software that works alongside an existing system.<br>Other options: A — praise is a \"compliment\"; B — to praise someone is to \"compliment\" them; D — free of charge is \"complimentary\".<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.1.5","q":"<p>Choose the word most nearly opposite in meaning to AMBIVALENT.<\/p>","o":["able to use both hands equally well","ambitious","uncertain","decided"],"a":3,"s":"<p>Ambivalent means having mixed or uncertain feelings about something; the opposite is decided (clear and firm in one's view).<br>Other options: A — a confusion with \"ambidextrous\"; B — a look-alike word with an unrelated meaning; C — this is close to a synonym of ambivalent.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.1.6","q":"<p>Choose the word closest in meaning to CIRCUMSPECT.<\/p>","o":["cautious and careful","suspicious of others","roundabout in speech","reckless"],"a":0,"s":"<p>A circumspect person considers all circumstances and risks before acting.<br>Other options: B — a confusion from the \"-spect\" ending (as in \"suspect\"); C — a confusion with \"circumlocutory\"; D — nearly the opposite of circumspect.<\/p>","tag":"1.1 Vocabulary"},{"id":"M3.1.7","q":"<p>Choose the word that best completes the sentence: \"Despite the company's ___ public statements, internal e-mails revealed deep anxiety about its finances.\"<\/p>","o":["anxious","gloomy","confident","hesitant"],"a":2,"s":"<p>\"Despite\" sets up a contrast with \"deep anxiety\", so the public statements must have sounded confident.<br>Other options: A — no contrast with \"deep anxiety\"; B — no contrast; gloomy statements would match the anxiety; D — hesitant statements would not contrast with anxiety.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M3.1.8","q":"<p>Choose the word that best completes the sentence: \"The scientist was careful to describe her results as ___ rather than conclusive, since only a small sample had been tested.\"<\/p>","o":["definitive","preliminary","final","fraudulent"],"a":1,"s":"<p>\"Rather than conclusive\" and \"only a small sample\" call for a word meaning early and not yet final: preliminary.<br>Other options: A — definitive means final and conclusive, the opposite of what is needed; C — final is close to conclusive, so there is no contrast; D — nothing suggests dishonesty.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M3.1.9","q":"<p>Choose the pair that best completes the sentence: \"The board hoped that the new chief executive would ___ the company's decline, but within a year its losses had ___.\"<\/p>","o":["ignore, fallen","arrest, deepened","arrest, vanished","hasten, deepened"],"a":1,"s":"<p>\"But\" signals that the hope (to arrest, i.e. stop, the decline) was disappointed: losses deepened.<br>Other options: A — \"ignore the decline\" is not a sensible hope, and falling losses do not contrast with it; C — if losses vanished, the hope was met, so \"but\" makes no sense; D — no board would hope to hasten its company's decline.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M3.1.10","q":"<p>Fill in the blank: \"She would rather you ___ the report tomorrow than today.\"<\/p>","o":["submit","will submit","had submitted","submitted"],"a":3,"s":"<p>\"Would rather\" followed by a new subject takes the past form (past subjunctive) to refer to the present or future.<br>Other options: A — the base form is used only when there is no new subject (\"She would rather submit\"); B — a future form is not used after \"would rather you\"; C — the past perfect refers to the past, not to \"tomorrow\".<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M3.1.11","q":"<p>Choose the word that best completes the sentence: \"The minister's speech was full of ___; it used a great many words to say very little.\"<\/p>","o":["brevity","insight","verbiage","candour"],"a":2,"s":"<p>Verbiage means excessive and empty wording, which matches \"many w
