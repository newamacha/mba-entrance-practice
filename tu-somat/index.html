ords to say very little\".<br>Other options: A — brevity means using few words, the opposite; B — insight would mean the speech said a lot; D — candour means frankness, which does not match saying very little.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M3.1.12","q":"<p>Choose the word that best completes the sentence: \"The new tax was designed to be ___, raising the same total amount as the old one while spreading the burden more fairly.\"<\/p>","o":["revenue-neutral","regressive","optional","punitive"],"a":0,"s":"<p>A revenue-neutral change leaves the total tax collected the same, which matches \"raising the same total amount\".<br>Other options: B — a regressive tax falls more heavily on the poor, which contradicts \"more fairly\"; C — a tax is not optional, and this does not match \"the same total amount\"; D — punitive means intended as a punishment.<\/p>","tag":"1.2 Sentence completion and fill in the blanks"},{"id":"M3.1.13","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"Every one of the new branches <u>are making<\/u> a profit.\"<\/p>","o":["are making","have been making","is making","were made"],"a":2,"s":"<p>The subject is \"Every one\" (singular); \"of the new branches\" does not change its number.<br>Other options: A — the verb must agree with \"Every one\", which is singular; B — plural verb; D — plural, passive and in the wrong tense.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.14","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"<u>Walking along the riverbank, the mountains looked<\/u> magnificent to the tourists.\"<\/p>","o":["Walking along the riverbank, the mountains looked","The mountains, walking along the riverbank, looked","Walking along the riverbank, the tourists' view of the mountains looked","As the tourists walked along the riverbank, the mountains looked"],"a":3,"s":"<p>Turning the phrase into a clause with its own subject (the tourists) removes the dangling modifier.<br>Other options: A — the opening phrase dangles: it says the mountains were walking; B — still says the mountains were walking; C — still dangling: a \"view\" cannot walk.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.15","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"Nepal's hydropower potential is greater than <u>any country<\/u> in South Asia.\"<\/p>","o":["any country","that of any other country","any other country","those of any country"],"a":1,"s":"<p>\"That\" stands for \"hydropower potential\", so like is compared with like, and \"other\" excludes Nepal itself.<br>Other options: A — compares \"potential\" with a country, and also seems to compare Nepal with itself; C — still compares \"potential\" with a country; D — \"those\" is plural and cannot stand for \"potential\"; \"other\" is also missing.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.16","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The manager asked us <u>to arrive early, dressing formally and that we bring<\/u> our identity cards.\"<\/p>","o":["to arrive early, dressing formally and that we bring","to arrive early, to dress formally and to bring","arriving early, dressing formally and bringing","to arrive early, dress formally and that we bring"],"a":1,"s":"<p>All three requests use the same infinitive form, so the list is parallel.<br>Other options: A — three different forms (infinitive, -ing form, clause) break the parallel list; C — \"asked us arriving\" is ungrammatical; D — the last item is still a clause, not parallel with the others.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.17","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"She <u>has worked<\/u> at the bank for eight years until she resigned last year.\"<\/p>","o":["has worked","has been working","is working","had worked"],"a":3,"s":"<p>A period that began in the past and ended before another past event (her resignation) calls for the past perfect.<br>Other options: A — the present perfect cannot describe a period that ended in the past (\"until she resigned last year\"); B — still the present perfect, which implies she works there now; C — the present tense contradicts \"resigned last year\".<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.18","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"She is capable <u>to handle<\/u> the account on her own.\"<\/p>","o":["to handle","in handling","of handling","for handling"],"a":2,"s":"<p>The correct idiom is \"capable of doing something\".<br>Other options: A — \"capable\" is not followed by an infinitive; B — \"capable in\" is not idiomatic; D — \"capable for\" is not idiomatic.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.19","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"If a student wants to succeed, <u>you must<\/u> work hard.\"<\/p>","o":["you must","he or she must","one must","we must"],"a":1,"s":"<p>\"A student\" is third-person singular, so the pronoun must be third person: \"he or she\".<br>Other options: A — the pronoun shifts from \"a student\" (third person) to \"you\" (second person); C — \"one\" is a different, impersonal pronoun and does not refer back to \"a student\"; D — another shift of person, to first person plural.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"id":"M3.1.20","q":"<p>Choose the option that best replaces the underlined part. Option A repeats the original.<br>\"The number of cars on Kathmandu's roads <u>has doubled<\/u> in a decade.\"<\/p>","o":["has doubled","have doubled","were doubling","are doubled"],"a":0,"s":"<p>\"The number\" is singular, and the present perfect fits a change over the last decade. No change is needed.<br>Other options: B — \"the number of ...\" takes a singular verb (\"a number of ...\" would take a plural one); C — plural, and the past continuous does not fit \"in a decade\"; D — plural, and the passive is wrong here.<\/p>","tag":"1.3 Grammar: error spotting and sentence correction"},{"p":"<p><b>Passage 1<\/b><br>About three-quarters of the world's leading food crops benefit to some degree from animal pollination, and honeybees are the best-known pollinators. When beekeepers in North America and Europe began reporting unusually heavy winter losses of colonies in the mid-2000s, newspapers warned of a coming food crisis.<br>The reality has proved more complicated. The number of managed honeybee colonies worldwide has in fact risen over recent decades, because beekeepers replace lost colonies by splitting healthy ones, at a cost. The deeper worry concerns wild pollinators: thousands of species of solitary bees, bumblebees, hoverflies and moths, which no one manages and no one replaces. Studies in several regions suggest that many of these species have declined, driven by habitat loss, pesticides and disease.<br>Wild pollinators matter more than their low profile suggests. For some crops they are more efficient than honeybees, and farms surrounded by patches of natural habitat often get higher and more stable yields than farms that rely on rented hives alone. A field visited by many species is also less vulnerable if any single species has a bad year.<br>None of this makes the honeybee unimportant, but it does suggest that policies focused only on managed hives may miss the larger problem. Protecting hedgerows and wildflower margins may do more for food security than any number of new beehives.<br>Questions 3.1.21 to 3.1.25 are based on this passage.<\/p>"},{"id":"M3.1.21","q":"<p>(Passage 1) The primary purpose of the passage is to<\/p>","o":["argue that concern about pollination should focus more on wild pollinators, not only on managed honeybees","show that worries about honeybee losses were baseless and pose no problem at all","call for a complete ban on pesticides","describe the methods beekeepers use to split colonies"],"a":0,"s":"<p>The passage shifts attention from honeybee losses to the decline of wild pollinators and ends with a policy suggestion.<br>Other options: B — too strong; the author says the honeybee is not unimportant and that replacing colonies has a cost; C — pesticides are listed as one cause; no ban is proposed; D — splitting is mentioned only in passing.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.22","q":"<p>(Passage 1) According to the passage, the number of managed honeybee colonies has risen despite heavy losses because<\/p>","o":["wild bees moved into the empty hives left behind after the winter losses","winter losses stopped after the mid-2000s","beekeepers replace lost colonies by splitting healthy ones","pesticides harmful to bees were banned"],"a":2,"s":"<p>Stated in paragraph 2.<br>Other options: A — not stated; B — the passage does not say the losses stopped; D — not stated.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.23","q":"<p>(Passage 1) The author mentions farms surrounded by patches of natural habitat in order to<\/p>","o":["show that wild pollinators can make crop yields higher and more stable","argue that farmers should stop renting hives altogether and rely on wild insects","explain how hedgerows are planted","suggest that honeybees harm crop yields"],"a":0,"s":"<p>These farms are presented as evidence that wild pollinators \"matter more than their low profile suggests\".<br>Other options: B — the author does not say rented hives are useless; C — planting methods are not described; D — nothing suggests that honeybees are harmful.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.24","q":"<p>(Passage 1) The sentence \"A field visited by many species is also less vulnerable if any single species has a bad year\" shows that the author values<\/p>","o":["the use of pesticides to protect fields","large farms that grow a single crop","the high productivity of honeybees in particular, compared with any other single species","variety among pollinators as insurance against the failure of any one species"],"a":3,"s":"<p>The point is that diversity spreads risk: if one species fails, others still pollinate.<br>Other options: A — pesticides are listed as a threat, not a protection; B — the sentence does not concern farm size or crop variety; C — the sentence is about many species, not honeybees.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.25","q":"<p>(Passage 1) Which of the following, if true, would most weaken the suggestion in the final paragraph?<\/p>","o":["Some staple crops, such as wheat, need no animal pollination","Replacing lost honeybee colonies is costly for beekeepers","In regions where wildflower margins were planted around fields, neither wild pollinator numbers nor crop yields changed","Newspapers exaggerated the honeybee crisis in the mid-2000s"],"a":2,"s":"<p>This undercuts the claim that protecting such habitat helps food security.<br>Other options: A — this does not affect crops that do depend on pollinators; B — this is consistent with the passage and does not touch the suggestion; D — this fits the author's view and, if anything, supports it.<\/p>","tag":"1.4 Reading comprehension"},{"p":"<p><b>Passage 2<\/b><br>In recent years, hundreds of companies in several countries have experimented with a four-day working week in which employees work about 32 hours for the same pay. The results reported by the organisers have been striking: in most trials, firms said that revenue held steady or rose, staff reported less stress and burnout, and a large majority of participating companies chose to continue with the shorter week after the trial ended.<br>Sceptics urge caution. The firms that volunteered for these trials were mostly small, office-based businesses whose managers were already enthusiastic about the idea; a hospital, a factory or a bus company might find it far harder to deliver the same output in fewer hours. Moreover, much of the evidence on productivity came from the firms' own reports rather than from independent measurement, and employees who know that the future of a popular scheme depends on the results have every reason to work especially hard while the trial lasts.<br>Supporters reply that the trials were never meant to prove that the four-day week suits every organisation. Their aim was to show that, for a substantial group of firms, the long-held assumption that output depends on hours worked was false. In many offices, they argue, a large share of the working week is lost to unnecessary meetings and distractions, which a shorter week forces managers to cut.<br>The debate is likely to continue until larger trials, including firms that did not choose to take part, produce independent evidence.<br>Questions 3.1.26 to 3.1.30 are based on this passage.<\/p>"},{"id":"M3.1.26","q":"<p>(Passage 2) According to the sceptics, one weakness of the trials is that<\/p>","o":["the participating firms chose to take part and were mostly small, office-based businesses with keen managers","employees disliked working shorter weeks","the trials were paid for by the government","revenue fell in most of the participating firms"],"a":0,"s":"<p>Paragraph 2 says the firms \"volunteered\" and were \"already enthusiastic\", so they may not represent other employers.<br>Other options: B — employees reported less stress; C — funding is not mentioned; D — the passage says revenue held steady or rose.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.27","q":"<p>(Passage 2) The remark that employees \"have every reason to work especially hard while the trial lasts\" suggests that<\/p>","o":["employees were paid extra during the trials as a reward for agreeing to take part in them","the productivity measured during the trials may not last once the trials are over","the trials lasted too long to be reliable","managers forced employees to work harder"],"a":1,"s":"<p>Extra effort driven by the desire to keep the scheme might fade later, so the results could overstate the long-run effect.<br>Other options: A — pay stayed the same; C — the length of the trials is not criticised; D — the motive described comes from the employees themselves.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.28","q":"<p>(Passage 2) The supporters' reply implies that they<\/p>","o":["deny that staff reported less stress","believe that all firms should adopt the four-day week at once","agree that output depends mainly on hours worked","accept that the four-day week may not suit every organisation"],"a":3,"s":"<p>They say the trials \"were never meant to prove that the four-day week suits every organisation\".<br>Other options: A — they do not dispute the reported results; B — they explicitly limit their claim to \"a substantial group of firms\"; C — they argue that this assumption is false for many firms.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.29","q":"<p>(Passage 2) Which of the following would best answer the sceptics' concerns, as the final paragraph suggests?<\/p>","o":["Publishing the trial firms' own revenue reports in full","A survey asking employees at the trial firms how happy they feel","More trials among small office firms that are keen on the idea","A large trial in which firms of many kinds, including some that did not volunteer, are assigned to the shorter week and their output is measured independently"],"a":3,"s":"<p>This addresses both self-selection and self-reporting, the two concerns raised in paragraph 2.<br>Other options: A — still relies on the firms' own reports; B — still self-reported and limited to volunteer firms; C — repeats the self-selection problem.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.30","q":"<p>(Passage 2) The author's tone in the passage is best described as<\/p>","o":["strongly supportive of the four-day week, presenting the trial results as conclusive proof","dismissive of the four-day week","even-handed, setting out both sides and calling for better evidence","sarcastic"],"a":2,"s":"<p>The author presents the results, the sceptics' doubts and the supporters' reply without taking sides, and ends by calling for larger independent trials.<br>Other options: A — the author gives the sceptics' objections full weight; B — the author reports its striking results without rejecting them; D — nothing in the language is mocking.<\/p>","tag":"1.4 Reading comprehension"},{"id":"M3.1.31","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. As a result, the store's sales of umbrellas rose by 40 per cent in the rainy season.<br>Q. A department store noticed that shoppers rarely bought umbrellas, even though many of them came in wet.<br>R. It moved the umbrellas from the back of the store to a stand just inside the entrance.<br>S. The manager guessed that customers simply did not see them.<\/p>","o":["QRSP","QSRP","QSPR","SQRP"],"a":1,"s":"<p>Q states the problem; S gives the manager's explanation; R the action taken; P (\"As a result\") the outcome.<br>Other options: A — the guess in S explains why the umbrellas were moved, so it should come before R; C — P's result must follow the action in R; D — \"them\" in S needs the umbrellas mentioned in Q.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M3.1.32","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. Over time, however, the habit of checking the phone became harder to break.<br>Q. At first, Bina used her phone only to keep in touch with her family abroad.<br>R. She now leaves it in another room while she studies.<br>S. She realised there was a problem when her grades began to slip.<\/p>","o":["QPSR","PQSR","QPRS","QSPR"],"a":0,"s":"<p>Q describes the start; P (\"however\") the change; S the moment she noticed; R (\"now\") her solution.<br>Other options: B — \"however\" in P needs the earlier situation in Q; C — she adopts the solution (R) only after realising the problem (S); D — the problem (P) must arise before she realises it (S).<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M3.1.33","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. These are called externalities.<br>Q. A factory that pollutes a river imposes costs on people living downstream.<br>R. Because the factory does not pay these costs, it produces more than is good for society.<br>S. Yet these costs do not appear in the factory's accounts.<\/p>","o":["QPSR","QSPR","QSRP","SQPR"],"a":1,"s":"<p>Q gives the example; S notes the costs are not in the accounts; P names them; R explains the consequence.<br>Other options: A — \"Yet\" in S must follow directly the statement it contrasts with, and the term is best introduced after both facts; C — \"These\" in P would then refer to the overproduction in R rather than to the costs; D — \"these costs\" in S needs the costs introduced in Q.<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M3.1.34","q":"<p>Arrange the sentences P, Q, R and S to form a coherent paragraph.<br>P. When it was finally released, the film became the most watched of the year.<br>Q. The director spent four years raising money for her first film.<br>R. Several investors pulled out halfway through the shooting.<br>S. She sold her flat to pay the crew and finish the work.<\/p>","o":["RQSP","QRPS","QRSP","QSRP"],"a":2,"s":"<p>Q introduces the director and her effort; R the setback; S her response; P the result (\"finally released\").<br>Other options: A — the film and its investors must be introduced (Q) first; B — the film could be released only after the work was finished (S); D — selling the flat (S) is a response to the investors pulling out (R).<\/p>","tag":"1.5 Para jumbles and sentence arrangement"},{"id":"M3.1.35","q":"<p>Choose the correct meaning of the idiom \"to burn one's boats\".<\/p>","o":["to work late into the night","to destroy the evidence of a crime so that no one can trace it","to spend money wastefully","to take an action that makes it impossible to go back"],"a":3,"s":"<p>The phrase comes from armies that burnt their boats after landing so that retreat was impossible.<br>Other options: A — a confusion with \"to burn the midnight oil\"; B — unrelated meaning; C — unrelated meaning.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M3.1.36","q":"<p>Choose the correct meaning of the phrase \"to take something with a pinch of salt\".<\/p>","o":["to regard something as not completely true or reliable","to do something unwillingly","to make something more pleasant or easier to accept by adding a little extra","to accept something completely"],"a":0,"s":"<p>To take something with a pinch of salt is to be sceptical about it.<br>Other options: B — unrelated meaning; C — a literal reading (adding flavour); D — the opposite meaning.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M3.1.37","q":"<p>Choose the one word for: \"A person or firm unable to pay its debts.\"<\/p>","o":["incorrigible","insolent","impostor","insolvent"],"a":3,"s":"<p>Insolvent describes a person or company that cannot pay what it owes.<br>Other options: A — incorrigible means impossible to reform; B — insolent means rude and disrespectful; C — an impostor pretends to be someone else.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M3.1.38","q":"<p>Choose the one word for: \"Government by the wealthy.\"<\/p>","o":["theocracy","oligarchy","plutocracy","autocracy"],"a":2,"s":"<p>Plutocracy (from Greek \"ploutos\", wealth) is rule by the rich.<br>Other options: A — rule by religious leaders; B — rule by a small group, not necessarily the wealthy; D — rule by one person with absolute power.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M3.1.39","q":"<p>Choose the word that completes the analogy. Embezzlement : Funds :: Plagiarism : ?<\/p>","o":["Laws","Ideas","Money","Prison"],"a":1,"s":"<p>Embezzlement is the wrongful taking of funds; plagiarism is the wrongful taking of another person's ideas or words.<br>Other options: A — laws are not what plagiarism takes; C — money is what is embezzled, not plagiarised; D — the punishment, not the thing taken.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"},{"id":"M3.1.40","q":"<p>Choose the word that completes the analogy. Glacier : Ice :: Delta : ?<\/p>","o":["Sediment","Rain","Mountain","Water"],"a":0,"s":"<p>A glacier is a large mass of ice; a delta is a landform built up of river-borne sediment.<br>Other options: B — unrelated; C — mountains are where rivers start, not what a delta consists of; D — a delta is formed where a river meets the sea, but it is made of sediment, not water.<\/p>","tag":"1.6 Idioms, phrases, one-word substitution and verbal analogies"}]},{"t":"Section 2 · Quantitative Aptitude (30)","items":[{"id":"M3.2.1","q":"<p>The five-digit number 6x25y is divisible by both 9 and 10. What is the digit x?<\/p>","o":["5","3","0","4"],"a":0,"s":"<p>Divisible by 10 means y = 0. Divisible by 9 means the digit sum 6 + x + 2 + 5 + 0 = 13 + x is a multiple of 9, so x = 5.<br>Other options: B — gives a digit sum of 16; C — confuses x with y; D — gives a digit sum of 17.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M3.2.2","q":"<p>What is √(7 + 4√3)?<\/p>","o":["4 + √3","2 + √3","2 + 2√3","1 + √3"],"a":1,"s":"<p>(2 + √3)² = 4 + 4√3 + 3 = 7 + 4√3.<br>Other options: A — (4 + √3)² = 19 + 8√3; C — (2 + 2√3)² = 16 + 8√3; D — (1 + √3)² = 4 + 2√3.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M3.2.3","q":"<p>If 9ˣ = 27^(x − 1), what is x?<\/p>","o":["2","3","−3","1"],"a":1,"s":"<p>Write both sides as powers of 3: 3^(2x) = 3^(3x − 3), so 2x = 3x − 3 and x = 3.<br>Other options: A — an arithmetic slip; C — a sign error in solving 2x = 3x − 3; D — sets 2x = 3x − 1.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M3.2.4","q":"<p>The product of two consecutive positive integers is 1,056. What is their sum?<\/p>","o":["67","63","65","64"],"a":2,"s":"<p>√1,056 ≈ 32.5, and 32 × 33 = 1,056, so the sum is 65.<br>Other options: A — uses 33 and 34; B — uses 31 and 32; D — doubles 32.<\/p>","tag":"2.1 Number system, HCF/LCM, simplification, surds and indices"},{"id":"M3.2.5","q":"<p>The cost price of an article is 80% of its selling price. What is the profit percentage?<\/p>","o":["80%","125%","20%","25%"],"a":3,"s":"<p>If SP = 100, CP = 80 and profit = 20. Profit % = 20/80 = 25%.<br>Other options: A — takes the given ratio as the profit; B — this is SP as a percentage of CP; C — calculates profit as a percentage of the selling price.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M3.2.6","q":"<p>The population of a town rose by 10% in one year and fell by 10% the next. It is now 99,000. What was it two years ago?<\/p>","o":["1,00,000","99,000","99,990","98,010"],"a":0,"s":"<p>P × 1.1 × 0.9 = 0.99P = 99,000, so P = 1,00,000.<br>Other options: B — assumes a 10% rise and a 10% fall cancel out; C — adds 1% to the present figure instead of dividing by 0.99; D — applies the changes to 99,000 instead of working backwards.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M3.2.7","q":"<p>After two successive discounts of 15% and 20%, an article sells for Rs 680. What is its marked price?<\/p>","o":["Rs 1,050","Rs 1,088","Rs 1,000","Rs 918"],"a":2,"s":"<p>Marked price × 0.85 × 0.80 = 680, so marked price = 680 ÷ 0.68 = Rs 1,000.<br>Other options: A — an arithmetic slip; B — multiplies Rs 680 by 1.6 instead of dividing by 0.68; D — adds 35% of Rs 680 to Rs 680, applying the discounts to the wrong base.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M3.2.8","q":"<p>Rs 10,000 is invested at 8% per annum simple interest for 2 years. The whole amount is then reinvested for 1 more year at 10% per annum. What is the final amount?<\/p>","o":["Rs 12,600","Rs 12,760","Rs 11,600","Rs 12,800"],"a":1,"s":"<p>After 2 years: 10,000 + 2 × 800 = Rs 11,600. After one more year at 10%: 11,600 × 1.1 = Rs 12,760.<br>Other options: A — adds 10% of the original Rs 10,000 instead of 10% of Rs 11,600; C — stops after the first two years; D — adds interest of 8%, 8% and 12% on Rs 10,000.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M3.2.9","q":"<p>A man buys pens at 12 for Rs 100 and sells them at 10 for Rs 100. What is his gain percentage?<\/p>","o":["20%","16⅔%","25%","2%"],"a":0,"s":"<p>Cost per pen = 100/12; selling price per pen = 100/10 = 10. Gain = (10 − 100/12)/(100/12) = (120 − 100)/100 = 20%.<br>Other options: B — divides the gain by the selling price instead of the cost price; C — an arithmetic slip; D — subtracts the number of pens: 12 − 10.<\/p>","tag":"2.2 Percentage, profit and loss, discount, simple and compound interest"},{"id":"M3.2.10","q":"<p>In what ratio (water : milk) must water be mixed with milk costing Rs 60 per litre so that selling the mixture at Rs 60 per litre gives a profit of 20%?<\/p>","o":["5 : 1","1 : 4","1 : 6","1 : 5"],"a":3,"s":"<p>Cost of mixture = 60 ÷ 1.2 = Rs 50 per litre. Alligation (water costs 0): water : milk = (60 − 50) : (50 − 0) = 10 : 50 = 1 : 5.<br>Other options: A — reverses the ratio; B — uses a cost of Rs 48 (60 × 0.8) instead of 60 ÷ 1.2; C — compares the water with the whole mixture (10 : 60) instead of with the milk.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M3.2.11","q":"<p>The average age of a group of 10 people is 25 years. Two members aged 30 and 34 leave, two new members join, and the average falls to 24 years. What is the combined age of the two new members?<\/p>","o":["50 years","64 years","54 years","44 years"],"a":2,"s":"<p>Old total = 250. After the two leave: 250 − 64 = 186. New total = 10 × 24 = 240, so the newcomers total 240 − 186 = 54.<br>Other options: A — an arithmetic slip; B — the combined age of those who left; D — an arithmetic slip.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M3.2.12","q":"<p>The ratio of boys to girls in a class is 5 : 3. If 4 boys leave and 4 girls join, the ratio becomes 1 : 1. How many students are in the class?<\/p>","o":["32","24","36","40"],"a":0,"s":"<p>Let the numbers be 5k and 3k. 5k − 4 = 3k + 4 gives k = 4, so there are 20 boys and 12 girls: 32 students (the total does not change).<br>Other options: B — takes k = 3; C — an arithmetic slip; D — takes k = 5.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M3.2.13","q":"<p>A starts a business with Rs 40,000. After 4 months B joins with Rs 60,000, and C joins at the same time with Rs 90,000. Out of a year-end profit of Rs 1,68,000, what is B's share?<\/p>","o":["Rs 56,000","Rs 48,000","Rs 72,000","Rs 60,000"],"a":1,"s":"<p>Capital-months: A = 40,000 × 12 = 4,80,000; B = 60,000 × 8 = 4,80,000; C = 90,000 × 8 = 7,20,000. Ratio 2 : 2 : 3, so B gets 2/7 × 1,68,000 = Rs 48,000.<br>Other options: A — divides the profit equally among three partners; C — this is C's share; D — B's capital, not B's share.<\/p>","tag":"2.3 Ratio and proportion, averages, mixtures and alligation, partnership, ages"},{"id":"M3.2.14","q":"<p>A can do a job in 10 days and B in 15 days. They work on alternate days, starting with A. In how many days is the job finished?<\/p>","o":["11 days","6 days","10 days","12 days"],"a":3,"s":"<p>Every two days they do 1/10 + 1/15 = 1/6. After 10 days, 5/6 is done. Day 11 (A) adds 1/10, leaving 1/15, which B finishes on day 12.<br>Other options: A — forgets that 1/15 is still left after day 11; B — the time if both worked every day; C — assumes five two-day cycles finish the job, but they complete only 5/6.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M3.2.15","q":"<p>Two pipes can fill a tank in 20 minutes and 30 minutes, and an outlet can empty it in 15 minutes. All three are opened when the tank is half full. How long will it take to fill the tank?<\/p>","o":["30 minutes","The tank never fills","60 minutes","15 minutes"],"a":0,"s":"<p>Net rate = 1/20 + 1/30 − 1/15 = (3 + 2 − 4)/60 = 1/60 per minute. The remaining half takes 30 minutes.<br>Other options: B — the net rate is positive, so it does fill; C — the time to fill an empty tank, not a half-full one; D — uses the outlet's time.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M3.2.16","q":"<p>A train leaves a station at 9 a.m. at 60 km/h. Another train leaves the same station at 11 a.m. in the same direction at 90 km/h. At what time does the second train catch up with the first?<\/p>","o":["2 p.m.","5 p.m.","3 p.m.","1 p.m."],"a":2,"s":"<p>At 11 a.m. the first train is 120 km ahead. The gap closes at 30 km/h, taking 4 hours: 3 p.m.<br>Other options: A — uses a lead of 90 km; B — adds the 2-hour delay again; D — divides the 120 km lead by the first train's speed instead of the relative speed.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M3.2.17","q":"<p>A 180 m long train passes a man walking at 6 km/h in the same direction in 12 seconds. What is the speed of the train?<\/p>","o":["54 km/h","60 km/h","48 km/h","66 km/h"],"a":1,"s":"<p>Relative speed = 180/12 = 15 m/s = 54 km/h. Since they move in the same direction, train speed = 54 + 6 = 60 km/h.<br>Other options: A — this is the relative speed only; C — subtracts the man's speed instead of adding it; D — adds 12 instead of 6.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M3.2.18","q":"<p>Excluding stoppages, a bus travels at 60 km/h; including stoppages, its average speed is 48 km/h. For how many minutes per hour does the bus stop?<\/p>","o":["15 minutes","10 minutes","20 minutes","12 minutes"],"a":3,"s":"<p>The bus loses 12 km of travel per hour. At 60 km/h, 12 km takes 12 minutes.<br>Other options: A — divides 12 by 48 instead of 60; B — an arithmetic slip; C — divides 12 by 36.<\/p>","tag":"2.4 Time and work, pipes and cisterns, time-speed-distance, boats and trains"},{"id":"M3.2.19","q":"<p>If x + y = 7 and xy = 10, what is x³ + y³?<\/p>","o":["103","343","133","213"],"a":2,"s":"<p>x³ + y³ = (x + y)³ − 3xy(x + y) = 343 − 210 = 133 (check: x, y = 5, 2 and 125 + 8 = 133).<br>Other options: A — an arithmetic slip; B — this is (x + y)³ only; D — subtracts 3xy only: 343 − 130.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M3.2.20","q":"<p>For what value of k is one root of x² − 9x + k = 0 twice the other?<\/p>","o":["27","18","9","20"],"a":1,"s":"<p>Let the roots be r and 2r. Their sum 3r = 9, so r = 3, and k = product = 3 × 6 = 18.<br>Other options: A — takes the roots as 3 and 9; C — takes k as the sum of the roots; D — an arithmetic slip.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M3.2.21","q":"<p>What is the value of log₂ 8 + log₃ 81 − log₅ 125?<\/p>","o":["3","10","6","4"],"a":3,"s":"<p>log₂ 8 = 3, log₃ 81 = 4, log₅ 125 = 3; 3 + 4 − 3 = 4.<br>Other options: A — takes log₃ 81 as 3; B — adds all three terms; C — takes log₅ 125 as 1.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M3.2.22","q":"<p>Each exterior angle of a regular polygon is 24°. How many sides does it have?<\/p>","o":["15","24","18","12"],"a":0,"s":"<p>The exterior angles of any polygon add up to 360°, so n = 360/24 = 15.<br>Other options: B — takes the angle as the number of sides; C — uses an exterior angle of 20°; D — uses an exterior angle of 30°.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"id":"M3.2.23","q":"<p>A rectangular field 60 m long and 40 m wide has a path 2.5 m wide running round it on the inside. What is the area of the path?<\/p>","o":["450 m²","500 m²","475 m²","525 m²"],"a":2,"s":"<p>Inner rectangle = 55 × 35 = 1,925 m². Path = 2,400 − 1,925 = 475 m².<br>Other options: A — uses the inner dimensions: 2 × 2.5 × (55 + 35); B — 2 × 2.5 × (60 + 40), which counts the four corner squares twice; D — the area of a path of the same width on the outside: 65 × 45 − 2,400.<\/p>","tag":"2.5 Algebra (equations, inequalities, progressions, logarithms), geometry and mensuration"},{"p":"<p><b>Table for questions 3.2.24 to 3.2.27<\/b><br>Annual production of two factories (thousand units).<\/p><div class=\"tw\"><table><thead><tr><th>Year<\/th><th>Factory X<\/th><th>Factory Y<\/th><\/tr><\/thead><tbody><tr><td>2020<\/td><td>40<\/td><td>30<\/td><\/tr><tr><td>2021<\/td><td>45<\/td><td>36<\/td><\/tr><tr><td>2022<\/td><td>50<\/td><td>45<\/td><\/tr><tr><td>2023<\/td><td>48<\/td><td>54<\/td><\/tr><tr><td>2024<\/td><td>60<\/td><td>60<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"M3.2.24","q":"<p>(Table) In which year did Factory Y's production first exceed Factory X's?<\/p>","o":["2021","2023","2022","2024"],"a":1,"s":"<p>Y exceeded X only in 2023 (54 against 48); in 2024 they were equal.<br>Other options: A — Y (36) was below X (45); C — Y (45) was still below X (50); D — the two were equal in 2024, so Y did not exceed X.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M3.2.25","q":"<p>(Table) By what percentage did Factory Y's production increase from 2020 to 2024?<\/p>","o":["100%","200%","30%","50%"],"a":0,"s":"<p>(60 − 30)/30 = 100%.<br>Other options: B — 2024 as a percentage of 2020; C — takes the increase in thousand units as a percentage; D — divides the increase by the 2024 figure.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M3.2.26","q":"<p>(Table) What was Factory X's average annual production over the five years?<\/p>","o":["49,500 units","48,000 units","50,000 units","48,600 units"],"a":3,"s":"<p>(40 + 45 + 50 + 48 + 60)/5 = 243/5 = 48.6 thousand units.<br>Other options: A — an arithmetic slip; B — the median of the five values; C — the middle (2022) value, not the mean.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M3.2.27","q":"<p>(Table) In which year was the percentage growth in the two factories' combined production over the previous year the highest?<\/p>","o":["2024","2022","2021","2023"],"a":0,"s":"<p>Combined: 70, 81, 95, 102, 120. Growth: 2021 15.7%, 2022 17.3%, 2023 7.4%, 2024 17.6%. 2024 is highest, narrowly ahead of 2022.<br>Other options: B — 17.3%, just below 2024's 17.6%; C — 15.7%; D — 7.4%, the lowest.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M3.2.28","q":"<p>In a survey of 200 people, 120 read newspaper A, 90 read newspaper B and 30 read neither. How many read both?<\/p>","o":["10","40","70","60"],"a":1,"s":"<p>People reading at least one = 200 − 30 = 170. Both = 120 + 90 − 170 = 40.<br>Other options: A — uses 200 instead of 170: 120 + 90 − 200; C — adds the 30 who read neither; D — an arithmetic slip.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M3.2.29","q":"<p>Two fair dice are thrown. What is the probability that the product of the two numbers is even?<\/p>","o":["1/4","2/3","1/2","3/4"],"a":3,"s":"<p>The product is odd only when both numbers are odd: (1/2)(1/2) = 1/4. So P(even) = 1 − 1/4 = 3/4.<br>Other options: A — this is the probability of an odd product; B — an arithmetic slip; C — assumes even and odd products are equally likely.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"},{"id":"M3.2.30","q":"<p>In how many ways can 4 boys and 3 girls sit in a row if the 3 girls must sit together?<\/p>","o":["120","144","720","5,040"],"a":2,"s":"<p>Treat the girls as one block: 5 units arranged in 5! = 120 ways; the girls arrange among themselves in 3! = 6 ways. 120 × 6 = 720.<br>Other options: A — forgets to arrange the girls within the block; B — uses 4! × 3!, forgetting that the block is a fifth unit; D — 7!, with no restriction.<\/p>","tag":"2.6 Data interpretation, sets, permutations and combinations, probability, basic statistics"}]},{"t":"Section 3 · Logical Reasoning (30)","items":[{"id":"M3.3.1","q":"<p>Find the next term: 1, 2, 6, 15, 31, 56, ?<\/p>","o":["92","91","87","96"],"a":0,"s":"<p>The differences are 1, 4, 9, 16, 25 (squares), so the next difference is 36: 56 + 36 = 92.<br>Other options: B — adds 35; C — adds 31, continuing a wrong pattern; D — adds 40.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M3.3.2","q":"<p>Find the next term: 0, 7, 26, 63, 124, ?<\/p>","o":["210","216","215","217"],"a":2,"s":"<p>The terms are n³ − 1 for n = 1 to 5; the next is 6³ − 1 = 215.<br>Other options: A — an arithmetic slip; B — uses 6³ without subtracting 1; D — uses 6³ + 1.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M3.3.3","q":"<p>Find the next letter: Z, W, S, N, H, ?<\/p>","o":["Z","A","C","B"],"a":1,"s":"<p>Positions 26, 23, 19, 14, 8 fall by 3, 4, 5, 6; the next fall is 7, giving 1 = A.<br>Other options: A — wraps round the alphabet without reason; C — subtracts 5; D — subtracts 6 again.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M3.3.4","q":"<p>Which is the odd one out?<\/p>","o":["Equity share","Bond","Treasury bill","Debenture"],"a":0,"s":"<p>An equity share represents ownership in a company; the other three are debt instruments that represent money lent.<br>Other options: B — a bond is a debt instrument; C — a treasury bill is short-term government debt; D — a debenture is a debt instrument, like the others.<\/p>","tag":"3.1 Number and letter series, analogy, odd one out"},{"id":"M3.3.5","q":"<p>In a code, TRADE is written as VWZIG. How is INDIA written in that code?<\/p>","o":["YRWMR","ZRWNR","ZRWMR","RMWRZ"],"a":2,"s":"<p>Each letter is replaced by its opposite (A↔Z, B↔Y, …) and the result is reversed: TRADE → GIZWV → VWZIG. INDIA → RMWRZ → ZRWMR.<br>Other options: A — takes the opposite of A as Y; B — uses N instead of M for the opposite of N; D — replaces the letters but forgets to reverse.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.6","q":"<p>In a code language, \"tom ka lu\" means \"eat sweet fruit\", \"ka pi so\" means \"fruit is ripe\" and \"so lu ne\" means \"ripe sweet mango\". What is the code for \"mango\"?<\/p>","o":["lu","so","pi","ne"],"a":3,"s":"<p>\"ka\" = fruit (first two), \"so\" = ripe (last two), \"lu\" = sweet (first and third). In \"so lu ne\", the remaining word \"mango\" is \"ne\".<br>Other options: A — \"lu\" means \"sweet\"; B — \"so\" means \"ripe\"; C — \"pi\" means \"is\".<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.7","q":"<p>In a code, FORMAT is written as ROFTAM. How is BRANCH written in that code?<\/p>","o":["HCNARB","ARBNCH","BRAHCN","ARBHCN"],"a":3,"s":"<p>The first three letters are reversed and the last three are reversed: FOR → ROF, MAT → TAM. So BRA → ARB and NCH → HCN.<br>Other options: A — reverses the whole word; B — reverses only the first half; C — reverses only the second half.<\/p>","tag":"3.2 Coding-decoding"},{"id":"M3.3.8","q":"<p>X is the brother of Y's mother. Z is X's wife. How is Z related to Y?<\/p>","o":["Aunt","Grandmother","Sister-in-law","Mother"],"a":0,"s":"<p>X is Y's maternal uncle, so X's wife Z is Y's aunt by marriage.<br>Other options: B — Z belongs to Y's parents' generation; C — Z is X's wife, which makes her the sister-in-law of Y's mother, not of Y; D — Y's mother is X's sister, not X's wife.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.9","q":"<p>P × Q means \"P is the mother of Q\", P + Q means \"P is the husband of Q\" and P − Q means \"P is the brother of Q\". If A + B × C − D, how is A related to D?<\/p>","o":["Uncle","Grandfather","Father","Brother"],"a":2,"s":"<p>A is the husband of B; B is the mother of C; C is the brother of D, so B is also D's mother. A, B's husband, is D's father.<br>Other options: A — A is married to D's mother, so he is D's father, not uncle; B — A is one generation above D, not two; D — C, not A, is D's brother.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.10","q":"<p>Q is 8 km west of P. R is 6 km south of Q. S is 4 km east of R. How far is S from P, and in which direction?<\/p>","o":["About 7.2 km, north-east","About 7.2 km, south-west","10 km, south-west","4 km, west"],"a":1,"s":"<p>Taking P as (0, 0): Q (−8, 0), R (−8, −6), S (−4, −6). Distance = √(4² + 6²) = √52 ≈ 7.2 km, and S lies to the south-west of P.<br>Other options: A — gives the direction of P from S; C — uses R instead of S: √(8² + 6²); D — uses only the east–west distance.<\/p>","tag":"3.3 Blood relations and direction sense"},{"id":"M3.3.11","q":"<p>A man is facing north-east. He turns 135° clockwise and then 270° anticlockwise. Which direction is he facing now?<\/p>","o":["East","West","South-west","South"],"a":1,"s":"<p>North-east is 45°. 45 + 135 = 180° (south); 180 − 270 = −90°, i.e. 270° (west).<br>Other options: A — turns 270° clockwise instead of anticlockwise; C — an arithmetic slip; D — stops after the first turn.<\/p>","tag":"3.3 Blood relations and direction sense"},{"p":"<p><b>Puzzle 1<\/b><br>Six friends, K, L, M, N, O and P, sit at equal distances round a circular table, facing the centre. (For a person facing the centre, the neighbour on the left is the next seat in the clockwise direction.)<br>(i) K sits opposite P.<br>(ii) N sits immediately to the left of K.<br>(iii) L sits opposite N.<br>(iv) M does not sit next to K.<br>Questions 3.3.12 to 3.3.16 are based on this.<\/p>"},{"id":"M3.3.12","q":"<p>(Puzzle 1) Who sits opposite M?<\/p>","o":["K","N","O","L"],"a":2,"s":"<p>Number the seats 0 to 5 clockwise with K at 0. Then P is at 3, N at 1 (left of K) and L at 4 (opposite N). Seats 2 and 5 remain; seat 5 is next to K, so M is at 2 and O at 5. Seat 2 is opposite seat 5: O.<br>Other options: A — K sits opposite P; B — N sits opposite L; D — L sits opposite N.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M3.3.13","q":"<p>(Puzzle 1) Who sits between M and L?<\/p>","o":["K","O","N","P"],"a":3,"s":"<p>Clockwise: K (0), N (1), M (2), P (3), L (4), O (5). P is between M and L.<br>Other options: A — K sits between O and N; B — O sits between L and K; C — N sits between K and M.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M3.3.14","q":"<p>(Puzzle 1) Who sits immediately to the left of P?<\/p>","o":["L","M","K","O"],"a":0,"s":"<p>P is at seat 3; the left neighbour is the next seat clockwise, seat 4: L.<br>Other options: B — M is P's right-hand neighbour; C — K sits opposite P; D — O is two seats away from P.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M3.3.15","q":"<p>(Puzzle 1) Which pair sits opposite each other?<\/p>","o":["K and M","O and P","N and P","N and L"],"a":3,"s":"<p>Opposite pairs are K–P, N–L and M–O.<br>Other options: A — K sits opposite P; B — O sits opposite M; C — N sits opposite L.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M3.3.16","q":"<p>(Puzzle 1) If K and O exchange seats, who will then sit immediately to the left of K?<\/p>","o":["M","O","L","N"],"a":1,"s":"<p>After the exchange K is at seat 5 and O at seat 0. The left neighbour of seat 5 is seat 0: O.<br>Other options: A — M is not next to seat 5; C — L, at seat 4, becomes K's right-hand neighbour; D — N, at seat 1, is now O's left neighbour, not K's.<\/p>","tag":"3.4 Seating arrangement, ordering/ranking and puzzles"},{"id":"M3.3.17","q":"<p>Statements: Some managers are leaders. Some leaders are speakers.<br>Conclusions: I. Some managers are speakers. II. No manager is a speaker.<br>Which conclusion(s) follow?<\/p>","o":["Either I or II follows","Neither I nor II follows","Only II follows","Only I follows"],"a":0,"s":"<p>Two \"some\" statements give no definite link between managers and speakers, so neither conclusion is certain. But they form a complementary pair: either some managers are speakers or none is, so one of them must be true.<br>Other options: B — they form a complementary pair, so \"either I or II\" applies; C — II is possible but not certain; D — I is possible but not certain.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M3.3.18","q":"<p>Statements: All coins are metals. Some metals are precious.<br>Conclusions: I. Some coins are precious. II. All precious things are metals.<br>Which conclusion(s) follow?<\/p>","o":["Only I follows","Only II follows","Neither I nor II follows","Either I or II follows"],"a":2,"s":"<p>The precious metals may or may not include coins, so I is not certain. \"Some metals are precious\" does not mean every precious thing is a metal, so II does not follow. They are not a complementary pair.<br>Other options: A — the precious metals need not include any coins; B — \"some metals are precious\" cannot be reversed into \"all precious things are metals\"; D — I and II are not complementary; both can be false.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M3.3.19","q":"<p>Statement: The municipality has decided to give a 5 per cent discount on property tax to residents who pay before the due date.<br>Assumptions: I. A discount will encourage some residents to pay early. II. The municipality does not need the tax revenue.<br>Which assumption(s) are implicit?<\/p>","o":["Neither I nor II is implicit","Both I and II are implicit","Only I is implicit","Only II is implicit"],"a":2,"s":"<p>The discount is offered to encourage early payment (I). Offering a small discount does not imply that the revenue is not needed (II); early payment may even help its cash flow.<br>Other options: A — I is implicit; B — II is not implicit; D — II is not implicit.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M3.3.20","q":"<p>Should voting in national elections be made compulsory in Nepal?<br>Arguments: I. Yes. Higher turnout would make elected governments more representative of all citizens. II. No. People in many countries do not vote.<br>Which argument(s) are strong?<\/p>","o":["Only argument I is strong","Both arguments are strong","Neither argument is strong","Only argument II is strong"],"a":0,"s":"<p>I gives a relevant reason linked to the purpose of elections. II merely states a fact about other countries and gives no reason why voting should not be compulsory.<br>Other options: B — II is weak; C — I is a relevant, substantial reason; D — II is weak: it does not address the question.<\/p>","tag":"3.5 Syllogisms, statement-conclusion, statement-assumption"},{"id":"M3.3.21","q":"<p>Since a city introduced a charge for driving into its centre, average travel times in the centre have fallen by 15%. Officials conclude that the charge reduced traffic. Which of the following, if true, most weakens their conclusion?<\/p>","o":["Travel times outside the centre did not change","A major road-widening project in the centre was completed in the same month the charge began","The money raised by the charge is spent on more buses","Many drivers complain about the charge"],"a":1,"s":"<p>Wider roads could cut travel times even if traffic did not fall, giving another explanation.<br>Other options: A — this is consistent with the charge being the cause; C — this would, if anything, support lower traffic; D — complaints do not show whether traffic fell.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.22","q":"<p>\"Our competitor cut its prices by 10% and its market share rose. So if we cut our prices by 10%, our market share will also rise.\" The argument assumes that<\/p>","o":["our firm cannot afford a price cut","the competitor's products are of better quality","market share is the firm's only goal","our customers will respond to a price cut in the same way as the competitor's customers did"],"a":3,"s":"<p>The argument transfers the competitor's result to our firm; it works only if our customers react similarly.<br>Other options: A — this works against the argument; B — this would weaken the comparison and is not needed; C — the argument predicts market share; it does not need this.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.23","q":"<p>A study found that people who drink green tea every day have lower rates of heart disease. The author concludes that green tea protects against heart disease. Which of the following, if true, most strengthens the conclusion?<\/p>","o":["Green-tea drinkers in the study also exercised more than others","Green tea is especially popular in East Asia","Some people dislike the taste of green tea","Among people with similar diets, exercise habits and incomes, daily green-tea drinkers still had lower rates of heart disease"],"a":3,"s":"<p>This rules out other likely causes and supports the claim that green tea itself makes the difference.<br>Other options: A — this suggests another cause and weakens the conclusion; B — irrelevant to whether green tea protects the heart; C — irrelevant.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.24","q":"<p>Although Company Q's sales volume rose by 25% last year, its profit fell. Which of the following, if true, best explains this?<\/p>","o":["Q's competitors earned higher profits last year","Q's sales rose fastest in its most profitable products","Q achieved the higher sales by cutting the prices of some products below their cost of production","Q appointed a new marketing director"],"a":2,"s":"<p>Selling more units at a loss on each can reduce total profit even as volume rises.<br>Other options: A — this does not explain Q's own fall in profit; B — this would raise profit, deepening the puzzle; D — this explains nothing about profit.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.25","q":"<p>All the employees who received a bonus this year met their sales targets. Some employees who met their sales targets were promoted. Raju received a bonus this year. Which of the following must be true?<\/p>","o":["Everyone who was promoted received a bonus","Raju met his sales target","Raju was promoted","Some employees who received a bonus were promoted"],"a":1,"s":"<p>Everyone who received a bonus met their target, and Raju received a bonus.<br>Other options: A — not stated; C — only some who met their targets were promoted; D — possible, but the promoted employees may not include any bonus receivers.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.26","q":"<p>Data sufficiency. Question: Is triangle PQR right-angled?<br>I. PQ = 5 cm and QR = 12 cm.<br>II. PR = 13 cm.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":2,"s":"<p>Together the sides are 5, 12 and 13, and 5² + 12² = 169 = 13², so the triangle is right-angled at Q.<br>Other options: A — without the third side the angles are not fixed; B — one side tells us nothing about the angles; D — the three sides fix the triangle.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.27","q":"<p>Data sufficiency. Question: What is the value of x + y?<br>I. 2x + 2y = 18<br>II. x − y = 3<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":0,"s":"<p>I gives x + y = 9 directly. II gives only the difference, which does not fix the sum.<br>Other options: B — II gives the difference, not the sum; C — I alone is already sufficient; D — I is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.28","q":"<p>Data sufficiency. Question: What was the average speed of a car over a 200 km trip?<br>I. It covered the first 100 km at 50 km/h.<br>II. The whole trip took 4 hours.<br>Which statement(s) are sufficient to answer the question?<\/p>","o":["Statement I alone is sufficient, but statement II alone is not","Statement II alone is sufficient, but statement I alone is not","Both statements together are sufficient, but neither alone is","Both statements together are not sufficient"],"a":1,"s":"<p>Average speed = total distance ÷ total time = 200 ÷ 4 = 50 km/h. I alone leaves the time for the second half unknown.<br>Other options: A — the speed for the second 100 km is unknown; C — II alone is already sufficient; D — II is sufficient.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.29","q":"<p>What day of the week was 1 January 2001?<\/p>","o":["Monday","Tuesday","Saturday","Sunday"],"a":0,"s":"<p>1 January 2000 was a Saturday, and 2000 was a leap year (366 days = 52 weeks + 2 days). Saturday + 2 = Monday.<br>Other options: B — adds 3 days; C — this was the day for 1 January 2000; D — treats 2000 as an ordinary year (+1 day); 2000 is divisible by 400, so it was a leap year.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"},{"id":"M3.3.30","q":"<p>How many times in a day (24 hours) are the hour and minute hands of a clock at right angles?<\/p>","o":["48","24","22","44"],"a":3,"s":"<p>In every 12 hours the hands are at right angles 22 times (twice an hour, except that the right angles near 3 o'clock and 9 o'clock are shared between consecutive hours), so 44 times in 24 hours.<br>Other options: A — assumes exactly twice every hour; B — assumes once an hour; C — this is the count for 12 hours only.<\/p>","tag":"3.6 Critical reasoning, data sufficiency, clocks and calendars"}]}]}]};
const B = DATA.bank, L = 'ABCDE';
const store = {
  get(k){ try{ const v = localStorage.getItem(B.key+':'+k); return v===null?null:+v }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(B.key+':'+k, v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(B.key+':'+k) }catch(e){} }
};
const mem = {};
const pick = id => (id in mem) ? mem[id] : store.get(id);
const $ = s => document.querySelector(s);
const qsOf = items => items.filter(x => x.id);

const sel = $('#set');
const og1 = document.createElement('optgroup'); og1.label = 'Chapters';
DATA.ch.forEach(c => og1.append(new Option(`Chapter ${c.n} · ${c.t} (${c.subs.reduce((a,b)=>a+qsOf(b.items).length,0)})`, 'ch'+c.n)));
const og2 = document.createElement('optgroup'); og2.label = `Mock exams (${B.mockInfo})`;
DATA.mock.forEach(m => og2.append(new Option(`Mock exam ${m.m}`, 'mock'+m.m)));
sel.append(og1, og2);

let cur = null;
function route(){
  const h = location.hash.slice(1);
  let m = h.match(/^ch(\d+)-(\d)$/), k = h.match(/^mock(\d)$/);
  if (k && DATA.mock[k[1]-1]) return show('mock', +k[1]);
  if (!m || !DATA.ch[m[1]-1] || !DATA.ch[m[1]-1].subs[m[2]-1]) m = [0, 1, 1];
  show('ch', +m[1], +m[2]);
}
function go(h){ if (location.hash !== '#'+h) location.hash = h; else route(); }
sel.onchange = () => go(sel.value.startsWith('ch') ? sel.value+'-1' : sel.value);
window.addEventListener('hashchange', route);

function render(list, items, num){
  const out = [];
  items.forEach(x => {
    if ('p' in x) { const d = document.createElement('div'); d.className = 'passage'; d.innerHTML = x.p; list.append(d); return; }
    out.push(x); list.append(card(x, num ? 'Q'+num() : 'Q'+x.id));
  });
  return out;
}
function show(kind, n, s){
  const list = $('#list'), subs = $('#subs'); list.innerHTML = ''; subs.innerHTML = '';
  if (kind === 'ch'){
    const c = DATA.ch[n-1]; sel.value = 'ch'+n; subs.hidden = false;
    c.subs.forEach((b, i) => {
      const bt = document.createElement('button'); bt.textContent = `${b.k} ${b.t}`; bt.setAttribute('role','tab');
      bt.setAttribute('aria-current', String(i+1 === s)); bt.onclick = () => go(`ch${n}-${i+1}`); subs.append(bt);
    });
    const b = c.subs[s-1];
    list.insertAdjacentHTML('beforeend', `<p class="intro">Chapter ${c.n} · <b>${b.k} ${esc(b.t)}</b> · ${qsOf(b.items).length} questions. Tick an option to check it.</p>`);
    cur = {kind, qs: render(list, b.items), label: `${b.k} block`};
    const ac = subs.children[s-1]; ac && ac.scrollIntoView({block:'nearest', inline:'nearest'});
  } else {
    const m = DATA.mock[n-1]; sel.value = 'mock'+n; subs.hidden = true;
    list.insertAdjacentHTML('beforeend', `<p class="intro">Mock exam ${m.m}: ${B.mockIntro}</p>`);
    let k = 0, all = [];
    m.secs.forEach(sec => {
      const cnt = qsOf(sec.items).length;
      list.insertAdjacentHTML('beforeend', `<h2>${esc(sec.t)} · Q${k+1}–${k+cnt}</h2>`);
      all.push(...render(list, sec.items, () => ++k));
    });
    list.insertAdjacentHTML('beforeend', '<div class="result" id="result"></div>');
    cur = {kind, qs: all, label: 'mock exam'};
  }
  score(); window.scrollTo(0, 0);
}
function esc(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function card(q, label){
  const el = document.createElement('article'); el.className = 'card'; el.id = 'q-'+q.id;
  el.innerHTML = `<div class="meta"><span class="id">${label}</span><span>1 mark</span>${q.tag?`<span class="chip">${esc(q.tag)}</span>`:''}</div>
    <div class="stem">${q.q}</div>
    <div class="opts" role="group" aria-label="Options for ${label}">${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="box" aria-hidden="true"></span><span class="t"><span class="l">${L[i]}.</span>${o}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => { mem[q.id] = +b.dataset.i; store.set(q.id, b.dataset.i); paint(el, q); score(); });
  paint(el, q); return el;
}
function paint(el, q){
  const p = pick(q.id), btns = el.querySelectorAll('.opt'), old = el.querySelector('.fb'); old && old.remove();
  btns.forEach(b => { b.className = 'opt'; b.disabled = p !== null; b.querySelector('.box').textContent = ''; b.removeAttribute('aria-label'); });
  el.classList.toggle('done', p !== null);
  if (p === null) return;
  const right = btns[q.a]; right.classList.add('right'); right.querySelector('.box').textContent = '✓';
  const ans = `${L[q.a]}. ${q.o[q.a]}`;
  const fb = document.createElement('div');
  if (p === q.a){
    right.setAttribute('aria-label', 'Your answer, correct');
    fb.className = 'fb ok';
    fb.innerHTML = `<div class="h">✓ Correct</div><details><summary>Show explanation</summary>${q.s}</details>`;
  } else {
    const w = btns[p]; w.classList.add('wrong'); w.querySelector('.box').textContent = '✗'; w.setAttribute('aria-label', 'Your answer, wrong');
    fb.className = 'fb bad';
    fb.innerHTML = `<div class="h">✗ Wrong. Correct answer: ${ans}</div>${q.s}`;
  }
  el.append(fb);
}
function score(){
  const qs = cur.qs, n = qs.length; let a = 0, c = 0;
  qs.forEach(q => { const p = pick(q.id); if (p !== null){ a++; if (p === q.a) c++; } });
  const w = a - c, net = c - B.neg * w, pct = a ? Math.round(c*100/a) : 0;
  $('#score').innerHTML = `<span>Answered <b>${a}/${n}</b></span><span>Correct <b>${c}</b> · Wrong <b>${w}</b></span>${B.neg ? `<span>Net <b>${net.toFixed(2)}</b> (−${B.neg} per wrong)</span>` : ''}<span>Accuracy <b>${a?pct+'%':'–'}</b></span>
    <span class="bar" aria-hidden="true"><i class="c" style="width:${c*100/n}%"></i><i class="w" style="width:${w*100/n}%"></i></span>
    <button class="reset" id="reset" type="button">Reset this ${cur.label}</button>`;
  const r = $('#reset'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.classList.add('arm'); r.textContent = 'Tap again to clear your answers'; setTimeout(()=>{ if (armed){ armed=false; r.classList.remove('arm'); r.textContent=`Reset this ${cur.label}`; } }, 3500); return; }
    qs.forEach(q => { delete mem[q.id]; store.del(q.id); });
    document.querySelectorAll('.card').forEach(el => { const q = qs.find(x => 'q-'+x.id === el.id); q && paint(el, q); });
    score();
  };
  const res = $('#result');
  if (res){
    const good = net >= 0.6 * n;
    res.innerHTML = `Result${a < n ? ' so far' : ''}: <b class="${good?'pass':'fail'}">${B.neg ? net.toFixed(2) : c}/${n}</b> (${c} correct, ${w} wrong, ${n-a} blank). `
      + (B.neg ? `A blank costs nothing and a wrong answer costs ${B.neg}, so skip pure guesses. ` : 'No negative marking is assumed, so answer every question. ')
      + (a < n ? '' : good ? 'A strong score. ' : 'Aim for 60%+: revise the topics named in the wrong answers. ')
      + 'No official cut-off is published; admission is by merit rank.';
  }
}
route();
</script>
</body></html>
